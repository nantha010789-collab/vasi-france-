<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>VASI Driver</title><style>body{margin:0;background:#050505;color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:560px;margin:auto;padding:24px 18px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:30px;font-weight:900}.card{margin-top:22px;background:#111;border:1px solid #292929;border-radius:24px;padding:20px}.status{display:flex;align-items:center;justify-content:space-between;padding:16px;background:#181818;border-radius:16px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px;background:#777}.online .dot{background:#20d66b}.btn{width:100%;margin-top:14px;padding:16px;border:0;border-radius:16px;background:#fff;color:#000;font-weight:800;font-size:16px}.btn:disabled{opacity:.45}.muted{color:#999;font-size:13px}.ride{border-top:1px solid #292929;margin-top:18px;padding-top:18px}.offer{background:#181818;border:1px solid #333;border-radius:18px;padding:16px;margin-top:14px}.actions{display:flex;gap:10px}.actions button{flex:1}.accept{background:#20d66b;color:#000}.decline{background:#333;color:#fff}.tripline{padding:10px 0;border-bottom:1px solid #292929}.tripline:last-child{border-bottom:0}.tripstatus{display:inline-block;padding:6px 10px;border-radius:999px;background:#222;font-size:12px;font-weight:800}</style></head><body><main class="wrap"><header class="top"><div class="logo">VASI</div><button onclick="logout()">Log out</button></header><section class="card"><h1>Driver</h1><div id="status" class="status"><span><span class="dot"></span><span id="label">Offline</span></span><span id="gps">GPS off</span></div><button id="toggle" class="btn" onclick="toggleOnline()">Go online</button><p class="muted">Verified VASI ride drivers can go online and receive nearby ride requests.</p><div id="ride" class="ride"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const client=supabase.createClient('https://vhfyvkrvysrooaqzcxsp.supabase.co','sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT');let online=false,watch=null,channel=null,offered=null,lastPos=null,activeRide=null;client.auth.getSession().then(async({data})=>{if(!data.session)return location.href='auth.html';await loadActiveRide()});
async function setPresence(value,pos){const args={p_online:value,p_lat:pos?pos.coords.latitude:null,p_lng:pos?pos.coords.longitude:null};const {error}=await client.rpc('vasi_driver_set_online',args);if(error)throw error}
async function toggleOnline(){if(activeRide){alert('Finish your active ride before going online again.');return}if(online){try{await setPresence(false,lastPos)}catch(e){}online=false;render();stopOffers();if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;return}if(!navigator.geolocation){alert('GPS is required to go online.');return}navigator.geolocation.getCurrentPosition(async p=>{try{lastPos=p;await setPresence(true,p);online=true;render();startOffers();watch=navigator.geolocation.watchPosition(async pos=>{lastPos=pos;document.getElementById('gps').textContent='GPS live';try{await setPresence(true,pos)}catch(e){}},()=>document.getElementById('gps').textContent='GPS denied',{enableHighAccuracy:true,maximumAge:5000})}catch(e){alert(e.message)}},()=>alert('Please allow location access to go online.'),{enableHighAccuracy:true})}
function render(){document.getElementById('status').classList.toggle('online',online);document.getElementById('label').textContent=activeRide?'On trip':online?'Online':'Offline';document.getElementById('toggle').textContent=online?'Go offline':'Go online';document.getElementById('toggle').disabled=!!activeRide;document.getElementById('gps').textContent=online?'GPS live':'GPS off'}
async function startOffers(){if(channel)await client.removeChannel(channel);channel=client.channel('vasi-driver-own-offers').on('postgres_changes',{event:'INSERT',schema:'public',table:'vasi_dispatch_offers'},payload=>{if(payload.new.service==='ride'&&payload.new.status==='pending')loadPending()}).subscribe();loadPending()}
async function loadPending(){if(activeRide)return;const {data,error}=await client.from('vasi_dispatch_offers').select('id,job_id,status,offered_at,expires_at').eq('service','ride').eq('status','pending').gt('expires_at',new Date().toISOString()).order('offered_at',{ascending:false}).limit(1);if(error)return;if(data&&data[0])showOffer(data[0])}
function stopOffers(){if(channel){client.removeChannel(channel);channel=null}offered=null;if(!activeRide)document.getElementById('ride').innerHTML=''}
function showOffer(o){offered=o;document.getElementById('ride').innerHTML='<div class="offer"><h2>🚕 New Ride Offer</h2><p><b>VASI ride request</b></p><p class="muted">Accept before the offer expires.</p><div class="actions"><button class="btn decline" onclick="respond(false)">Decline</button><button class="btn accept" onclick="respond(true)">Accept Ride</button></div></div>'}
async function respond(accept){if(!offered)return;const {data,error}=await client.rpc('vasi_driver_respond_offer',{p_offer_id:offered.id,p_accept:accept});if(error){alert(error.message);loadPending();return}if(accept){activeRide=Array.isArray(data)?data[0]:data;online=false;if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;stopOffers();render();showActiveRide()}else{document.getElementById('ride').innerHTML='<div class="offer"><p>Offer declined.</p></div>';offered=null;setTimeout(loadPending,500)}}
async function loadActiveRide(){const {data,error}=await client.from('rides').select('id,status,pickup_address,destination_address,service,estimated_fare,final_fare,payment_method,accepted_at,started_at').in('status',['accepted','started']).order('accepted_at',{ascending:false}).limit(1);if(!error&&data&&data[0]){activeRide=data[0];online=false;render();showActiveRide()}else render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showActiveRide(){if(!activeRide)return;const started=activeRide.status==='started';const fare=activeRide.final_fare??activeRide.estimated_fare;document.getElementById('ride').innerHTML=`<div class="offer"><span class="tripstatus">${started?'TRIP IN PROGRESS':'RIDE ACCEPTED'}</span><h2>${started?'🚗 Passenger on board':'📍 Go to pickup'}</h2><div class="tripline"><div class="muted">Pickup</div><b>${esc(activeRide.pickup_address||'Pickup location')}</b></div><div class="tripline"><div class="muted">Destination</div><b>${esc(activeRide.destination_address||'Destination')}</b></div><div class="tripline"><div class="muted">Service · Payment</div><b>${esc(activeRide.service||'VASI')} · ${esc(activeRide.payment_method||'card')}${fare!=null?' · €'+Number(fare).toFixed(2):''}</b></div>${started?'<button class="btn accept" onclick="tripAction(\'complete\')">Complete Ride</button>':'<button class="btn accept" onclick="tripAction(\'start\')">Start Ride</button>'}</div>`}
async function tripAction(action){if(!activeRide)return;const label=action==='start'?'Start this ride?':'Complete this ride?';if(!confirm(label))return;const {data,error}=await client.rpc('vasi_driver_trip_action',{p_ride_id:activeRide.id,p_action:action});if(error){alert(error.message);return}activeRide=Array.isArray(data)?data[0]:data;if(action==='complete'){document.getElementById('ride').innerHTML='<div class="offer"><h2>✅ Ride Completed</h2><p class="muted">Trip saved successfully. You can go online for the next ride.</p></div>';activeRide=null;online=false;render()}else{render();showActiveRide()}}
async function logout(){if(online){try{await setPresence(false,lastPos)}catch(e){}}stopOffers();await client.auth.signOut();location.href='auth.html'}window.addEventListener('beforeunload',()=>{if(watch!==null)navigator.geolocation.clearWatch(watch)});</script></body></html>
