<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>VASI Driver</title><style>body{margin:0;background:#050505;color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:560px;margin:auto;padding:24px 18px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:30px;font-weight:900}.card{margin-top:22px;background:#111;border:1px solid #292929;border-radius:24px;padding:20px}.status{display:flex;align-items:center;justify-content:space-between;padding:16px;background:#181818;border-radius:16px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px;background:#777}.online .dot{background:#20d66b}.btn{width:100%;margin-top:14px;padding:16px;border:0;border-radius:16px;background:#fff;color:#000;font-weight:800;font-size:16px}.muted{color:#999;font-size:13px}.ride{border-top:1px solid #292929;margin-top:18px;padding-top:18px}</style></head><body><main class="wrap"><header class="top"><div class="logo">VASI</div><button onclick="logout()">Log out</button></header><section class="card"><h1>Driver</h1><div id="status" class="status"><span><span class="dot"></span><span id="label">Offline</span></span><span id="gps">GPS off</span></div><button id="toggle" class="btn" onclick="toggleOnline()">Go online</button><p class="muted">When online, VASI can match you with nearby ride requests.</p><div id="ride" class="ride hidden"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const client=supabase.createClient('https://vhfyvkrvysrooaqzcxsp.supabase.co','sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT');let online=false,watch=null;client.auth.getSession().then(({data})=>{if(!data.session)location.href='auth.html'});async function toggleOnline(){online=!online;document.getElementById('status').classList.toggle('online',online);document.getElementById('label').textContent=online?'Online':'Offline';document.getElementById('toggle').textContent=online?'Go offline':'Go online';if(online&&navigator.geolocation){document.getElementById('gps').textContent='GPS on';watch=navigator.geolocation.watchPosition(p=>{document.getElementById('gps').textContent='GPS live'},()=>document.getElementById('gps').textContent='GPS denied',{enableHighAccuracy:true})}else{document.getElementById('gps').textContent='GPS off';if(watch!==null)navigator.geolocation.clearWatch(watch)}}async function logout(){await client.auth.signOut();location.href='auth.html'}</script></body></html>
