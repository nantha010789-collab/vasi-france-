<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>VASI Driver</title><style>body{margin:0;background:#050505;color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:560px;margin:auto;padding:24px 18px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:30px;font-weight:900}.card{margin-top:22px;background:#111;border:1px solid #292929;border-radius:24px;padding:20px}.status{display:flex;align-items:center;justify-content:space-between;padding:16px;background:#181818;border-radius:16px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px;background:#777}.online .dot{background:#20d66b}.btn{width:100%;margin-top:14px;padding:16px;border:0;border-radius:16px;background:#fff;color:#000;font-weight:800;font-size:16px}.muted{color:#999;font-size:13px}.ride{border-top:1px solid #292929;margin-top:18px;padding-top:18px}.offer{background:#181818;border:1px solid #333;border-radius:18px;padding:16px;margin-top:14px}.actions{display:flex;gap:10px}.actions button{flex:1}.accept{background:#20d66b;color:#000}.decline{background:#333;color:#fff}</style></head><body><main class="wrap"><header class="top"><div class="logo">VASI</div><button onclick="logout()">Log out</button></header><section class="card"><h1>Driver</h1><div id="status" class="status"><span><span class="dot"></span><span id="label">Offline</span></span><span id="gps">GPS off</span></div><button id="toggle" class="btn" onclick="toggleOnline()">Go online</button><p class="muted">Verified VASI ride drivers can go online and receive nearby ride requests.</p><div id="ride" class="ride"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const client=supabase.createClient('https://vhfyvkrvysrooaqzcxsp.supabase.co','sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT');let online=false,watch=null,channel=null,offered=null,lastPos=null;client.auth.getSession().then(({data})=>{if(!data.session)location.href='auth.html'});
async function setPresence(value,pos){const args={p_online:value,p_lat:pos?pos.coords.latitude:null,p_lng:pos?pos.coords.longitude:null};const {error}=await client.rpc('vasi_driver_set_online',args);if(error)throw error}
async function toggleOnline(){if(online){try{await setPresence(false,lastPos)}catch(e){}online=false;render();stopOffers();if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;return}if(!navigator.geolocation){alert('GPS is required to go online.');return}navigator.geolocation.getCurrentPosition(async p=>{try{lastPos=p;await setPresence(true,p);online=true;render();startOffers();watch=navigator.geolocation.watchPosition(async pos=>{lastPos=pos;document.getElementById('gps').textContent='GPS live';try{await setPresence(true,pos)}catch(e){}},()=>document.getElementById('gps').textContent='GPS denied',{enableHighAccuracy:true,maximumAge:5000})}catch(e){alert(e.message)}},()=>alert('Please allow location access to go online.'),{enableHighAccuracy:true})}
function render(){document.getElementById('status').classList.toggle('online',online);document.getElementById('label').textContent=online?'Online':'Offline';document.getElementById('toggle').textContent=online?'Go offline':'Go online';document.getElementById('gps').textContent=online?'GPS live':'GPS off'}
async function startOffers(){if(channel)await client.removeChannel(channel);channel=client.channel('vasi-driver-own-offers').on('postgres_changes',{event:'INSERT',schema:'public',table:'vasi_dispatch_offers'},payload=>{if(payload.new.service==='ride'&&payload.new.status==='pending')loadPending()}).subscribe();loadPending()}
async function loadPending(){const {data,error}=await client.from('vasi_dispatch_offers').select('id,job_id,status,offered_at,expires_at').eq('service','ride').eq('status','pending').gt('expires_at',new Date().toISOString()).order('offered_at',{ascending:false}).limit(1);if(error)return;if(data&&data[0])showOffer(data[0])}
function stopOffers(){if(channel){client.removeChannel(channel);channel=null}offered=null;document.getElementById('ride').innerHTML=''}
function showOffer(o){offered=o;document.getElementById('ride').innerHTML='<div class="offer"><h2>🚕 New Ride Offer</h2><p><b>VASI ride request</b></p><p class="muted">Accept before the offer expires.</p><div class="actions"><button class="btn decline" onclick="respond(false)">Decline</button><button class="btn accept" onclick="respond(true)">Accept Ride</button></div></div>'}
async function respond(accept){if(!offered)return;const {data,error}=await client.rpc('vasi_driver_respond_offer',{p_offer_id:offered.id,p_accept:accept});if(error){alert(error.message);loadPending();return}if(accept){online=false;render();stopOffers();document.getElementById('ride').innerHTML='<div class="offer"><h2>✅ Ride Accepted</h2><p>Driver assigned. Continue to pickup.</p></div>'}else{document.getElementById('ride').innerHTML='<div class="offer"><p>Offer declined.</p></div>';offered=null;setTimeout(loadPending,500)}}
async function logout(){if(online){try{await setPresence(false,lastPos)}catch(e){}}stopOffers();await client.auth.signOut();location.href='auth.html'}window.addEventListener('beforeunload',()=>{if(watch!==null)navigator.geolocation.clearWatch(watch)});</script></body></html>
