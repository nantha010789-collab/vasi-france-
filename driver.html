<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#050505" />
    <title>VASI Driver</title>
    <style>
      body {
        margin: 0;
        background: #050505;
        color: #fff;
        font-family: Inter, system-ui, sans-serif;
      }
      .wrap {
        max-width: 560px;
        margin: auto;
        padding: 24px 18px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .logo {
        font-size: 30px;
        font-weight: 900;
      }
      .card {
        margin-top: 22px;
        background: #111;
        border: 1px solid #292929;
        border-radius: 24px;
        padding: 20px;
      }
      .status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px;
        background: #181818;
        border-radius: 16px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
        margin-right: 8px;
        background: #777;
      }
      .online .dot {
        background: #20d66b;
      }
      .btn {
        width: 100%;
        margin-top: 14px;
        padding: 16px;
        border: 0;
        border-radius: 16px;
        background: #fff;
        color: #000;
        font-weight: 800;
        font-size: 16px;
      }
      .btn:disabled {
        opacity: 0.45;
      }
      .muted {
        color: #999;
        font-size: 13px;
      }
      .ride {
        border-top: 1px solid #292929;
        margin-top: 18px;
        padding-top: 18px;
      }
      .offer {
        background: #181818;
        border: 1px solid #333;
        border-radius: 18px;
        padding: 16px;
        margin-top: 14px;
      }
      .actions {
        display: flex;
        gap: 10px;
      }
      .actions button {
        flex: 1;
      }
      .accept {
        background: #20d66b;
        color: #000;
      }
      .decline {
        background: #333;
        color: #fff;
      }
      .tripline {
        padding: 10px 0;
        border-bottom: 1px solid #292929;
      }
      .tripline:last-child {
        border-bottom: 0;
      }
      .tripstatus {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        background: #222;
        font-size: 12px;
        font-weight: 800;
      }
      .routeList {
        margin: 12px 0;
        display: grid;
        gap: 8px;
      }
      .routeStep {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 11px;
        border: 1px solid #333;
        border-radius: 14px;
        background: #141414;
      }
      .routeStep.active {
        border-color: #fff;
        background: #202020;
      }
      .routeStep.done {
        opacity: 0.55;
      }
      .routeNum {
        min-width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #2a2a2a;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 900;
      }
      .routeStep.active .routeNum {
        background: #fff;
        color: #000;
      }
      .routeText {
        flex: 1;
      }
      .routeText b {
        display: block;
      }
      .routeText small {
        color: #999;
      }
      .navbtn {
        background: #2b2b2b;
        color: #fff;
      }
      .fee {
        margin-top: 10px;
        padding: 10px 12px;
        border-radius: 12px;
        background: #151515;
        color: #bbb;
        font-size: 12px;
      }
      .chatbtn {
        background: #fff;
        color: #000;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header class="top">
        <div class="logo">VASI</div>
        <div>
          <button onclick="location.href = 'support.html'">Support</button>
          <button onclick="logout()">Log out</button>
        </div>
      </header>
      <section class="card">
        <h1>Driver</h1>
        <div id="status" class="status">
          <span><span class="dot"></span><span id="label">Offline</span></span
          ><span id="gps">GPS off</span>
        </div>
        <button id="toggle" class="btn" onclick="toggleOnline()">
          Go online
        </button>
        <p class="muted">
          Verified VASI ride drivers can go online and receive nearby ride
          requests.
        </p>
        <div id="ride" class="ride"></div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const client = supabase.createClient(
        "https://vhfyvkrvysrooaqzcxsp.supabase.co",
        "sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT",
      );
      let online = false,
        watch = null,
        channel = null,
        offered = null,
        lastPos = null,
        activeRide = null,
        gpsMode = "offline",
        activeStops = [];
      client.auth.getSession().then(async ({ data }) => {
        if (!data.session) {
          localStorage.setItem("vasi_role", "ride");
          return (location.href = "auth.html?role=ride");
        }
        await loadActiveRide();
      });
      async function setPresence(value, pos) {
        const args = {
          p_online: value,
          p_lat: pos ? pos.coords.latitude : null,
          p_lng: pos ? pos.coords.longitude : null,
        };
        const { error } = await client.rpc("vasi_driver_set_online", args);
        if (error) throw error;
      }
      function stopGps() {
        if (watch !== null) navigator.geolocation.clearWatch(watch);
        watch = null;
        gpsMode = "offline";
        render();
      }
      function startGps(mode) {
        if (!navigator.geolocation) {
          alert("GPS is required.");
          return;
        }
        gpsMode = mode;
        if (watch !== null) navigator.geolocation.clearWatch(watch);
        navigator.geolocation.getCurrentPosition(
          async (p) => {
            lastPos = p;
            try {
              await setPresence(mode === "online", p);
              if (mode === "online") online = true;
              render();
            } catch (e) {
              alert(e.message);
            }
          },
          () => alert("Please allow location access."),
          { enableHighAccuracy: true },
        );
        watch = navigator.geolocation.watchPosition(
          async (pos) => {
            lastPos = pos;
            document.getElementById("gps").textContent = "GPS live";
            try {
              await setPresence(gpsMode === "online", pos);
            } catch (e) {}
          },
          () => (document.getElementById("gps").textContent = "GPS denied"),
          { enableHighAccuracy: true, maximumAge: 3000, timeout: 12000 },
        );
      }
      async function toggleOnline() {
        if (activeRide) {
          alert("Finish your active ride before going online again.");
          return;
        }
        if (online) {
          try {
            await setPresence(false, lastPos);
          } catch (e) {}
          online = false;
          stopOffers();
          stopGps();
          return;
        }
        startGps("online");
        startOffers();
      }
      function render() {
        document
          .getElementById("status")
          .classList.toggle("online", online || !!activeRide);
        document.getElementById("label").textContent = activeRide
          ? "On trip"
          : online
            ? "Online"
            : "Offline";
        document.getElementById("toggle").textContent = online
          ? "Go offline"
          : "Go online";
        document.getElementById("toggle").disabled = !!activeRide;
        document.getElementById("gps").textContent =
          watch !== null ? "GPS live" : "GPS off";
      }
      async function startOffers() {
        if (channel) await client.removeChannel(channel);
        channel = client
          .channel("vasi-driver-own-offers")
          .on(
            "postgres_changes",
            {
              event: "INSERT",
              schema: "public",
              table: "vasi_dispatch_offers",
            },
            (payload) => {
              if (
                payload.new.service === "ride" &&
                payload.new.status === "pending"
              )
                loadPending();
            },
          )
          .subscribe();
        loadPending();
      }
      async function loadPending() {
        if (activeRide) return;
        const { data, error } = await client
          .from("vasi_dispatch_offers")
          .select("id,job_id,status,offered_at,expires_at")
          .eq("service", "ride")
          .eq("status", "pending")
          .gt("expires_at", new Date().toISOString())
          .order("offered_at", { ascending: false })
          .limit(1);
        if (error) return;
        if (data && data[0]) showOffer(data[0]);
      }
      function stopOffers() {
        if (channel) {
          client.removeChannel(channel);
          channel = null;
        }
        offered = null;
        if (!activeRide) document.getElementById("ride").innerHTML = "";
      }
      function showOffer(o) {
        offered = o;
        document.getElementById("ride").innerHTML =
          '<div class="offer"><h2>🚕 New Ride Offer</h2><p><b>VASI ride request</b></p><p class="muted">Accept before the offer expires.</p><div class="actions"><button class="btn decline" onclick="respond(false)">Decline</button><button class="btn accept" onclick="respond(true)">Accept Ride</button></div></div>';
      }
      async function respond(accept) {
        if (!offered) return;
        const { data, error } = await client.rpc("vasi_driver_respond_offer", {
          p_offer_id: offered.id,
          p_accept: accept,
        });
        if (error) {
          alert(error.message);
          loadPending();
          return;
        }
        if (accept) {
          activeRide = Array.isArray(data) ? data[0] : data;
          online = false;
          gpsMode = "trip";
          stopOffers();
          await loadPinRequirement(activeRide.id);
          await loadStops(activeRide.id);
          if (watch === null) startGps("trip");
          else if (lastPos)
            try {
              await setPresence(false, lastPos);
            } catch (e) {}
          render();
          showActiveRide();
        } else {
          document.getElementById("ride").innerHTML =
            '<div class="offer"><p>Offer declined.</p></div>';
          offered = null;
          setTimeout(loadPending, 500);
        }
      }
      async function loadStops(rideId) {
        const { data, error } = await client
          .from("ride_stops")
          .select("id,stop_order,address,latitude,longitude,completed_at")
          .eq("ride_id", rideId)
          .order("stop_order", { ascending: true });
        activeStops = error ? [] : data || [];
      }
      async function loadPinRequirement(rideId) {
        const { data, error } = await client.rpc(
          "get_driver_ride_pin_requirement",
          { p_ride_id: rideId },
        );
        activeRide.pin_required = error ? true : Boolean(data?.pin_required);
      }
      async function loadActiveRide() {
        const { data, error } = await client
          .from("rides")
          .select(
            "id,status,pickup_address,pickup_lat,pickup_lng,destination_address,destination_lat,destination_lng,service,estimated_fare,final_fare,driver_amount,waiting_fee,payment_method,accepted_at,arrived_at,started_at",
          )
          .in("status", ["accepted", "driver_arriving", "in_progress"])
          .order("accepted_at", { ascending: false })
          .limit(1);
        if (!error && data && data[0]) {
          activeRide = data[0];
          await loadPinRequirement(activeRide.id);
          await loadStops(activeRide.id);
          online = false;
          startGps("trip");
          render();
          showActiveRide();
        } else render();
      }
      function esc(s) {
        return String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      function navTo(lat, lng, address) {
        let dest = "";
        if (Number.isFinite(Number(lat)) && Number.isFinite(Number(lng)))
          dest = Number(lat) + "," + Number(lng);
        else dest = address || "";
        window.open(
          "https://www.google.com/maps/dir/?api=1&destination=" +
            encodeURIComponent(dest),
          "_blank",
        );
      }
      function routeHtml() {
        if (!activeRide) return "";
        const pending = activeStops.find((s) => !s.completed_at);
        let html = '<div class="routeList">';
        html += `<div class="routeStep ${activeRide.status === "accepted" || activeRide.status === "driver_arriving" ? "active" : "done"}"><div class="routeNum">P</div><div class="routeText"><small>Pickup</small><b>${esc(activeRide.pickup_address || "Pickup")}</b></div></div>`;
        activeStops.forEach((s, i) => {
          const cls = s.completed_at
            ? "done"
            : pending &&
                pending.id === s.id &&
                activeRide.status === "in_progress"
              ? "active"
              : "";
          html += `<div class="routeStep ${cls}"><div class="routeNum">${i + 1}</div><div class="routeText"><small>Stop ${i + 1}${s.completed_at ? " · completed" : ""}</small><b>${esc(s.address)}</b></div></div>`;
        });
        const destActive = activeRide.status === "in_progress" && !pending;
        html += `<div class="routeStep ${destActive ? "active" : ""}"><div class="routeNum">D</div><div class="routeText"><small>Final destination</small><b>${esc(activeRide.destination_address || "Destination")}</b></div></div></div>`;
        return html;
      }
      function nextActionHtml() {
        const st = String(activeRide.status);
        if (st === "accepted")
          return `<button class="btn navbtn" onclick="navTo(activeRide.pickup_lat,activeRide.pickup_lng,activeRide.pickup_address)">Open navigation to pickup</button><button class="btn accept" onclick="tripAction('arrive')">Arrived at Pickup</button>`;
        if (st === "driver_arriving")
          return activeRide.pin_required
            ? `<div class="fee">First VASI ride: ask the customer for the 4-digit Safety PIN before starting.</div><button class="btn accept" onclick="tripAction('start')">Enter PIN · Start Ride</button>`
            : `<div class="fee">Returning customer: no ride PIN is needed.</div><button class="btn accept" onclick="tripAction('start')">Start Ride</button>`;
        if (st === "in_progress") {
          const next = activeStops.find((s) => !s.completed_at);
          if (next)
            return `<button class="btn navbtn" onclick="navTo(${JSON.stringify(next.latitude)},${JSON.stringify(next.longitude)},${JSON.stringify(next.address)})">Navigate to Stop ${next.stop_order}</button><button class="btn accept" onclick="confirmStop('${next.id}')">Arrived · Confirm Stop ${next.stop_order}</button>`;
          return `<button class="btn navbtn" onclick="navTo(activeRide.destination_lat,activeRide.destination_lng,activeRide.destination_address)">Navigate to final destination</button><button class="btn accept" onclick="tripAction('complete')">Complete Ride</button>`;
        }
        return "";
      }
      function openRideChat() {
        if (!activeRide?.id) return;
        location.href =
          "ride-chat.html?ride=" +
          encodeURIComponent(activeRide.id) +
          "&from=driver";
      }
      function showActiveRide() {
        if (!activeRide) return;
        const st = String(activeRide.status);
        const fare =
          Number(activeRide.driver_amount) > 0
            ? activeRide.driver_amount
            : (activeRide.final_fare ?? activeRide.estimated_fare);
        let badge = "RIDE ACCEPTED",
          title = "📍 Go to pickup";
        if (st === "driver_arriving") {
          badge = "AT PICKUP";
          title = "👋 Passenger pickup";
        }
        if (st === "in_progress") {
          const next = activeStops.find((s) => !s.completed_at);
          badge = "TRIP IN PROGRESS";
          title = next
            ? "📍 Next: Stop " + next.stop_order
            : "🏁 Go to final destination";
        }
        const wait = Number(activeRide.waiting_fee || 0);
        document.getElementById("ride").innerHTML =
          `<div class="offer"><span class="tripstatus">${badge}</span><h2>${title}</h2>${routeHtml()}<div class="tripline"><div class="muted">Service · Payment</div><b>${esc(activeRide.service || "VASI")} · ${esc(activeRide.payment_method || "cash")}${fare != null ? " · €" + Number(fare).toFixed(2) : ""}</b></div>${wait > 0 ? `<div class="fee">Pickup waiting fee: €${wait.toFixed(2)} · first 3 minutes free</div>` : ""}${nextActionHtml()}</div>`;
        document.getElementById("ride").insertAdjacentHTML(
          "beforeend",
          '<button class="btn chatbtn" onclick="openRideChat()">💬 Chat with customer</button>',
        );
      }
      async function confirmStop(stopId) {
        if (!activeRide) return;
        if (!confirm("Confirm this stop is complete?")) return;
        const { error } = await client.rpc("vasi_driver_confirm_stop", {
          p_ride_id: activeRide.id,
          p_stop_id: stopId,
        });
        if (error) {
          alert(error.message);
          return;
        }
        await loadStops(activeRide.id);
        showActiveRide();
      }
      async function captureCardPayment(r) {
        const method = String(r.payment_method || "cash").toLowerCase();
        if (method === "cash") return { ok: true, cash: true };
        const session = (await client.auth.getSession()).data.session;
        if (!session) return { ok: false, error: "Session missing" };
        const fare = Number(
          Number(r.driver_amount) > 0
            ? r.driver_amount
            : (r.final_fare ?? r.estimated_fare ?? 0),
        );
        try {
          const res = await fetch("/api/capture-payment", {
            method: "POST",
            headers: {
              Authorization: "Bearer " + session.access_token,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ ride_id: r.id, final_fare: fare }),
          });
          const d = await res.json();
          if (!res.ok)
            return { ok: false, error: d.error || "Payment capture pending" };
          return { ok: true, status: d.status };
        } catch (e) {
          return { ok: false, error: e.message };
        }
      }
      async function tripAction(action) {
        if (!activeRide) return;
        if (action === "start") {
          let pin = null;
          if (activeRide.pin_required) {
            pin = String(
              prompt("Enter the customer's 4-digit VASI ride PIN") || "",
            ).trim();
            if (!pin) return;
            if (!/^\d{4}$/.test(pin)) {
              alert("Enter the 4-digit ride PIN");
              return;
            }
          }
          const { data, error } = await client.rpc("vasi_driver_start_ride", {
            p_ride_id: activeRide.id,
            p_pin: pin,
          });
          if (error) {
            alert(error.message);
            return;
          }
          if (!data?.ok) {
            alert(data?.error || "Ride PIN could not be verified");
            return;
          }
          activeRide = data.ride;
          await loadStops(activeRide.id);
          gpsMode = "trip";
          render();
          showActiveRide();
          return;
        }
        const label =
          action === "arrive"
            ? "Mark that you arrived at pickup?"
            : "Complete this ride?";
        if (!confirm(label)) return;
        const { data, error } = await client.rpc("vasi_driver_trip_action", {
          p_ride_id: activeRide.id,
          p_action: action,
        });
        if (error) {
          alert(error.message);
          return;
        }
        activeRide = Array.isArray(data) ? data[0] : data;
        if (action === "complete") {
          const completedRide = activeRide;
          const payment = await captureCardPayment(completedRide);
          document.getElementById("ride").innerHTML =
            '<div class="offer"><h2>✅ Ride Completed</h2><p class="muted">Final fare: €' +
            Number(
              Number(completedRide.driver_amount) > 0
                ? completedRide.driver_amount
                : (completedRide.final_fare ??
                    completedRide.estimated_fare ??
                    0),
            ).toFixed(2) +
            '</p><p class="muted">' +
            (payment.cash
              ? "Cash payment due from passenger."
              : payment.ok
                ? "Card payment captured successfully."
                : "Trip saved. Payment needs review: " +
                  esc(payment.error || "capture pending")) +
            "</p></div>";
          activeRide = null;
          activeStops = [];
          online = false;
          try {
            await setPresence(false, lastPos);
          } catch (e) {}
          stopGps();
          render();
        } else {
          gpsMode = "trip";
          render();
          showActiveRide();
        }
      }
      async function logout() {
        if (online || activeRide) {
          try {
            await setPresence(false, lastPos);
          } catch (e) {}
        }
        stopOffers();
        stopGps();
        await client.auth.signOut();
        location.href = "auth.html";
      }
      window.addEventListener("beforeunload", () => {
        if (watch !== null) navigator.geolocation.clearWatch(watch);
      });
    </script>
  </body>
</html>
