<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07100b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="VASI"><meta name="application-name" content="VASI"><title>VASI — Ride</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030704}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="vasiApp" src="./app-easy.html" title="VASI — Ride & Driver"></iframe><script>(function(){const f=document.getElementById('vasiApp');function boot(){try{const w=f.contentWindow,d=f.contentDocument;const nav=d.querySelector('.nav'),homePanel=d.getElementById('homePanel'),booking=d.getElementById('bookingPanel'),rides=d.getElementById('ridePanel'),account=d.getElementById('accountScreen');if(!nav)return;function sync(){const bookingOpen=booking&&!booking.classList.contains('hidden');const ridesOpen=rides&&!rides.classList.contains('hidden');const accountOpen=account&&account.classList.contains('show');const homeOpen=homePanel&&!homePanel.classList.contains('hidden')&&!bookingOpen&&!ridesOpen&&!accountOpen;nav.style.display=homeOpen?'grid':'none';}const originalHome=typeof w.home==='function'?w.home:null;w.home=function(){if(originalHome)originalHome();[booking,rides,account].forEach(x=>{if(x)x.classList.remove('show')});if(booking)booking.classList.add('hidden');if(rides)rides.classList.add('hidden');if(homePanel)homePanel.classList.remove('hidden');sync();};const originalPlan=typeof w.plan==='function'?w.plan:null;if(originalPlan)w.plan=function(){originalPlan();sync();};const originalShowRides=typeof w.showRides==='function'?w.showRides:null;if(originalShowRides)w.showRides=function(){originalShowRides();sync();};const originalAccount=typeof w.account==='function'?w.account:null;if(originalAccount)w.account=function(){originalAccount();sync();};const originalServices=typeof w.services==='function'?w.services:null;if(originalServices)w.services=function(){originalServices();sync();};const originalActivity=typeof w.activity==='function'?w.activity:null;if(originalActivity)w.activity=function(){originalActivity();sync();};new MutationObserver(sync).observe(d.body,{subtree:true,attributes:true,attributeFilter:['class','style']});sync();}catch(e){console.warn('VASI navigation bridge',e)}}if(f.contentDocument&&f.contentDocument.readyState==='complete')boot();else f.addEventListener('load',boot);})();</script></body></html>
