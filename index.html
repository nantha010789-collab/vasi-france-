<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#050505" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>VASI — Move. Eat. Deliver.</title>
    <style>
      :root {
        font-family: Inter, system-ui, sans-serif;
        color: #fff;
        background: #050505;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #050505;
      }
      .app {
        min-height: 100vh;
        max-width: 720px;
        margin: auto;
        padding: 22px 18px 40px;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        font-size: 30px;
        font-weight: 900;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      .pill {
        border: 1px solid #303030;
        background: #151515;
        border-radius: 999px;
        padding: 8px 12px;
        color: #ddd;
        text-decoration: none;
      }
      #accountBtn {
        max-width: 112px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .hero {
        padding: 42px 0 26px;
      }
      .eyebrow {
        color: #aaa;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
      }
      .hero h1 {
        font-size: 46px;
        line-height: 0.98;
        margin: 10px 0 14px;
        letter-spacing: -3px;
      }
      .hero p {
        color: #aaa;
        font-size: 16px;
      }
      .services {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .card {
        min-height: 145px;
        border: 1px solid #292929;
        border-radius: 22px;
        padding: 17px;
        background: #111;
        cursor: pointer;
        text-align: left;
        color: #fff;
      }
      .card strong {
        display: block;
        font-size: 19px;
        margin-top: 42px;
      }
      .card span {
        color: #999;
        font-size: 12px;
      }
      .section {
        margin-top: 30px;
      }
      .panel {
        border: 1px solid #292929;
        background: #101010;
        border-radius: 22px;
        padding: 18px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        padding: 12px 0;
        border-bottom: 1px solid #222;
      }
      .muted {
        color: #999;
      }
      .cta {
        width: 100%;
        border: 0;
        border-radius: 16px;
        padding: 16px;
        margin-top: 14px;
        background: #fff;
        color: #050505;
        font-weight: 800;
        font-size: 16px;
      }
      .driver {
        display: block;
        width: 100%;
        border: 1px solid #303030;
        border-radius: 16px;
        padding: 14px;
        margin-top: 10px;
        background: #171717;
        color: #fff;
        font-weight: 800;
        font-size: 15px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="top">
        <div class="brand">VASI</div>
        <div class="actions">
          <button class="pill" onclick="location.href='activity.html'">
            Activity
          </button>
          <button
            id="accountBtn"
            class="pill"
            onclick="openAccount()"
          >
            Login</button
          ><button id="langBtn" class="pill" onclick="openLanguageSettings()" aria-label="Language">🌐</button>
        </div>
      </header>
      <section class="hero">
        <div class="eyebrow">Europe mobility platform</div>
        <h1>Move.<br />Eat.<br />Deliver.</h1>
        <p>One VASI app for rides, food and delivery.</p>
      </section>
      <section class="services">
        <button class="card" onclick="location.href='ride-flow.html'">
          <strong>🚗 Ride</strong><span>Fast city trips</span></button
        ><button class="card" onclick="location.href='eats.html'">
          <strong>🍔 Eats</strong><span>Food delivery</span></button
        ><button class="card" onclick="location.href='delivery.html'">
          <strong>📦 Delivery</strong><span>Send anything</span>
        </button>
      </section>
      <section class="section">
        <div class="panel">
          <div class="row">
            <span class="muted">France & Europe</span
            ><span class="muted">VASI</span>
          </div>
          <button class="cta" onclick="location.href='ride-flow.html'">
            Book a ride</button
          ><button class="driver" onclick="location.href='auth.html?role=ride'">
            🚕 Driver app
          </button>
          <button class="driver" onclick="location.href='support.html'">
            💬 AI Customer Service
          </button>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./vasi-notifications.js"></script>
    <script src="./vasi-languages.js"></script>
    <script>
      const client = supabase.createClient(
        "https://vhfyvkrvysrooaqzcxsp.supabase.co",
        "sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT",
      );
      let signedIn = false;
      function openAccount() {
        location.href = signedIn ? "account.html" : "auth.html?role=customer";
      }
      async function showAccountState() {
        const { data } = await client.auth.getSession();
        const session = data.session;
        if (!session) {
          signedIn = false;
          document.getElementById("accountBtn").textContent = "Login";
          return;
        }
        signedIn = true;
        const { data: profile } = await client
          .from("profiles")
          .select("full_name")
          .eq("id", session.user.id)
          .maybeSingle();
        const firstName = profile?.full_name?.trim().split(/\s+/)[0];
        document.getElementById("accountBtn").textContent =
          firstName || "Account";
      }
      client.auth.onAuthStateChange(() => {
        setTimeout(showAccountState, 0);
      });
      function openLanguageSettings() {
        location.href = signedIn
          ? "settings.html#preferences"
          : "auth.html?role=customer&next=settings.html";
      }
      showAccountState();
      VasiNotifications.start(client, { role: "customer" });
    </script>
  </body>
</html>
