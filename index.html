<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07120d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VASI">
<title>VASI — France & Europe</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07100b}
iframe{display:block;width:100%;height:100%;border:0}
#eatsBtn{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:calc(82px + env(safe-area-inset-bottom));border:1px solid #ffffff2b;border-radius:22px;background:#19c463;color:#fff;padding:11px 18px;font:900 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-shadow:0 10px 28px #0008;display:flex;align-items:center;gap:7px}
#eatsBtn:active{transform:translateX(-50%) scale(.97)}
#eatsOverlay{display:none;position:fixed;inset:0;z-index:40;background:#030704}
#eatsOverlay.show{display:block}
#eatsClose{position:absolute;z-index:50;right:14px;top:14px;width:46px;height:46px;border:1px solid #ffffff33;border-radius:50%;background:#151f19;color:#fff;font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-shadow:0 8px 25px #0008}
</style>
</head>
<body>
<iframe src="/app.html" title="VASI"></iframe>
<button id="eatsBtn" onclick="openEats()">🍔 Food Delivery</button>
<div id="eatsOverlay">
<button id="eatsClose" onclick="closeEats()">×</button>
<iframe src="/eats.html" title="VASI Eats Food Delivery"></iframe>
</div>
<script>
function openEats(){document.getElementById('eatsOverlay').classList.add('show')}
function closeEats(){document.getElementById('eatsOverlay').classList.remove('show')}
</script>
</body>
</html>
