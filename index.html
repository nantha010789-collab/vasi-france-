<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VASI — Ride anywhere</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fa;color:#111827}button,input{font:inherit}header{height:72px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 7%;position:sticky;top:0;z-index:5}.logo{font-size:28px;font-weight:900;letter-spacing:-1.5px}.logo span{color:#21c46b}.nav{display:flex;gap:28px;color:#4b5563;font-weight:600}.nav a{cursor:pointer}.account{border:1px solid #ddd;border-radius:24px;padding:10px 17px;background:#fff;font-weight:700}.hero{max-width:1180px;margin:auto;min-height:calc(100vh - 72px);display:grid;grid-template-columns:440px 1fr;gap:50px;align-items:center;padding:50px 25px}.panel{background:#fff;border-radius:24px;padding:28px;box-shadow:0 12px 40px #1111}.eyebrow{font-size:13px;font-weight:800;color:#21a85d;text-transform:uppercase;letter-spacing:1px}.panel h1{font-size:42px;line-height:1.02;margin:10px 0 12px;letter-spacing:-2px}.sub{color:#6b7280;margin:0 0 25px}.field{border:1px solid #d8dde5;border-radius:14px;padding:14px 15px;margin:10px 0;display:flex;gap:12px;align-items:center}.dot{width:11px;height:11px;border-radius:50%;background:#111}.dot.green{background:#21c46b}.field input{border:0;outline:0;width:100%;font-size:15px}.swap{position:absolute;right:14px;top:50%;transform:translateY(-50%);border:1px solid #ddd;background:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer}.fields{position:relative}.options{display:flex;gap:8px;margin:18px 0}.chip{padding:10px 13px;border:1px solid #e1e5eb;border-radius:12px;background:#fff;cursor:pointer;font-weight:700}.chip.active{background:#111827;color:#fff;border-color:#111827}.cta{width:100%;border:0;border-radius:14px;padding:16px;background:#21c46b;color:#fff;font-weight:900;font-size:17px;cursor:pointer}.estimate{display:flex;justify-content:space-between;margin-top:18px;padding-top:17px;border-top:1px solid #eee;color:#4b5563}.map{height:650px;border-radius:30px;overflow:hidden;position:relative;background:#dfe7df;box-shadow:0 12px 40px #1111;background-image:linear-gradient(25deg,transparent 48%,#fff 49%,#fff 51%,transparent 52%),linear-gradient(115deg,transparent 47%,#fff 48%,#fff 51%,transparent 52%),linear-gradient(#d5e2d3 2px,transparent 2px),linear-gradient(90deg,#d5e2d3 2px,transparent 2px);background-size:180px 180px,220px 220px,70px 70px,70px 70px}.map:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 54% 45%,#21c46b 0 7px,transparent 8px),radial-gradient(circle at 73% 68%,#111827 0 7px,transparent 8px);filter:drop-shadow(0 4px 4px #0003)}.mapcard{position:absolute;z-index:2;left:25px;bottom:25px;background:#fff;border-radius:18px;padding:17px 20px;width:270px;box-shadow:0 8px 25px #0002}.mapcard b{font-size:16px}.mapcard small{display:block;color:#6b7280;margin-top:5px}@media(max-width:850px){.nav{display:none}.hero{grid-template-columns:1fr;padding:25px}.map{height:330px;order:-1}.panel h1{font-size:36px}header{padding:0 20px}}
</style>
</head>
<body>
<header><div class="logo">VASI<span>.</span></div><nav class="nav"><a>Ride</a><a>Drive</a><a>Business</a><a>Help</a></nav><button class="account">Sign in</button></header>
<main class="hero"><section class="panel"><div class="eyebrow">VASI France</div><h1>Move freely.<br>Ride boldly.</h1><p class="sub">Book a ride in seconds across France and Europe.</p><div class="fields"><div class="field"><span class="dot green"></span><input id="from" placeholder="Pickup location" value="My location"></div><button class="swap" onclick="swap()">↕</button><div class="field"><span class="dot"></span><input id="to" placeholder="Where to?"></div></div><div class="options"><button class="chip active">Ride</button><button class="chip">Schedule</button><button class="chip">Courier</button></div><button class="cta" onclick="book()">See prices</button><div class="estimate"><span>Estimated fare</span><strong id="price">—</strong></div></section><section class="map"><div class="mapcard"><b>VASI is ready when you are</b><small>Fast pickup • Safe rides • Transparent pricing</small></div></section></main>
<script>function swap(){let a=document.getElementById('from'),b=document.getElementById('to');[a.value,b.value]=[b.value,a.value]}function book(){let to=document.getElementById('to').value.trim();if(!to){document.getElementById('to').focus();return}document.getElementById('price').textContent='€12–€18';document.querySelector('.cta').textContent='Choose a ride';}</script>
</body></html>
