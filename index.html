<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07100b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="VASI"><meta name="application-name" content="VASI"><title>VASI — Ride</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030704}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="vasiApp" src="./app-easy.html" title="VASI — Ride & Driver"></iframe><script>(function(){const f=document.getElementById('vasiApp');function boot(){try{const w=f.contentWindow,d=f.contentDocument;if(!d)return;const nav=d.querySelector('.nav'),homePanel=d.getElementById('homePanel'),booking=d.getElementById('bookingPanel'),rides=d.getElementById('ridePanel'),account=d.getElementById('accountScreen'),topAccount=d.querySelector('.top .round');if(topAccount)topAccount.style.display='none';function sync(){const bookingOpen=booking&&!booking.classList.contains('hidden');const ridesOpen=rides&&!rides.classList.contains('hidden');const accountOpen=account&&account.classList.contains('show');const homeOpen=homePanel&&!homePanel.classList.contains('hidden')&&!bookingOpen&&!ridesOpen&&!accountOpen;if(nav)nav.style.display=homeOpen?'grid':'none';}const wrap=(name)=>{const fn=w[name];if(typeof fn!=='function')return;w[name]=function(){const r=fn.apply(this,arguments);setTimeout(sync,0);return r;}};['home','plan','showRides','account','services','activity'].forEach(wrap);if(nav){nav.style.display='none';}new MutationObserver(sync).observe(d.body,{subtree:true,attributes:true,attributeFilter:['class','style']});sync();}catch(e){console.warn('VASI navigation bridge',e)}}if(f.contentDocument&&f.contentDocument.readyState==='complete')boot();else f.addEventListener('load',boot);})();</script></body></html>
