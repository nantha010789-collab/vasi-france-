<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <title>Add your restaurant · VASI</title>
    <style>
      :root{font-family:Inter,system-ui;color:#fff;background:#050505}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:22px 18px 50px}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-size:30px;font-weight:950}.btn,input,select{border:1px solid #333;background:#171717;color:#fff;border-radius:14px;padding:14px;font:inherit}.btn{font-weight:850;cursor:pointer}.primary{background:#fff;color:#050505;width:100%;margin-top:16px}.hero{padding:42px 0 18px}.hero h1{font-size:clamp(36px,10vw,48px);line-height:1;margin:0 0 12px}.muted{color:#999;line-height:1.5}.offer{background:#102818;border:1px solid #28683d;color:#8bf0aa;padding:14px;border-radius:16px;margin:15px 0}.panel{background:#101010;border:1px solid #292929;border-radius:22px;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-size:12px;color:#bbb;font-weight:700}label input,label select{display:block;width:100%;margin-top:7px}.full{grid-column:1/-1}.status{text-align:center;min-height:24px;color:#aaa}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
    </style>
    <link rel="stylesheet" href="./vasi-mobile-fit.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="top"><div class="brand">VASI.</div><button class="btn" type="button" onclick="location.href='eats.html'">Back</button></header>
      <section class="hero"><p class="muted">VASI Restaurant Partners</p><h1>Grow your restaurant.</h1><p class="muted">Register your business, add your menu and start receiving local orders after approval.</p></section>
      <div class="offer"><b>Launch offer · first 3 months</b><br />5% commission with your delivery team · 10% with a VASI courier · €0 setup fee.</div>
      <section class="panel">
        <form id="form" class="grid">
          <label>Restaurant name<input name="name" autocomplete="organization" required /></label>
          <label>Legal business name<input name="legal_name" autocomplete="organization" required /></label>
          <label>SIRET / SIREN<input name="siret" inputmode="numeric" required /></label>
          <label>Cuisine<input name="cuisine" placeholder="Indian, French, Pizza…" required /></label>
          <label>Business email<input name="email" type="email" autocomplete="email" required /></label>
          <label>Phone<input name="phone" type="tel" autocomplete="tel" required /></label>
          <label class="full">Restaurant address<input name="address" autocomplete="street-address" required /></label>
          <label>Postal code<input name="postal_code" autocomplete="postal-code" required /></label>
          <label>City<input name="city" autocomplete="address-level2" required /></label>
          <label class="full">Delivery service<select name="delivery_mode"><option value="vasi">VASI courier · 10%</option><option value="own">My own delivery team · 5%</option></select></label>
          <button class="btn primary full" type="submit">Submit for VASI approval</button>
        </form>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const client=supabase.createClient('https://vhfyvkrvysrooaqzcxsp.supabase.co','sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT'),status=document.getElementById('status');
      async function session(){const{data:{session}}=await client.auth.getSession();if(!session){localStorage.setItem('vasi_role','restaurant');localStorage.setItem('vasi_return','restaurant-register.html');location.href='auth.html?role=restaurant';return null}return session}
      document.getElementById('form').onsubmit=async event=>{event.preventDefault();const current=await session();if(!current)return;status.textContent='Submitting securely…';const body=Object.fromEntries(new FormData(event.target));body.action='register';const response=await fetch('/api/restaurant-partner',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+current.access_token},body:JSON.stringify(body)}),data=await response.json();if(!response.ok){status.textContent=data.error||'Could not submit';return}status.textContent='Application received. Opening your dashboard…';setTimeout(()=>location.href='restaurant-dashboard.html',900)};
      session();
    </script>
    <script src="./vasi-languages.js"></script>
  </body>
</html>
