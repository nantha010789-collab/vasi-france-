<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>VASI Admin</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#050505;color:#fff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1000px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:30px;font-weight:950}.pill{background:#1a1a1a;border:1px solid #333;color:#bbb;border-radius:999px;padding:9px 12px;font-size:11px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px}.stat,.card{background:#111;border:1px solid #292929;border-radius:18px;padding:16px}.stat b{display:block;font-size:28px;margin-top:8px}.muted{color:#999;font-size:12px}.filters{display:flex;gap:7px;margin:15px 0;overflow:auto}.filters button,.action{border:1px solid #333;background:#181818;color:#fff;border-radius:12px;padding:10px 13px;font-weight:800}.filters .active{background:#fff;color:#050505}.partner{border-top:1px solid #292929;padding:14px 0}.actions{display:flex;gap:7px;margin-top:9px}.approve{background:#fff;color:#050505}.reject{background:#351919}.doc{display:inline-block;background:#202020;border-radius:8px;padding:5px 7px;margin:5px 4px 0 0;font-size:10px}.status{font-size:12px;color:#aaa}.empty{color:#888}.danger{color:#ffb0b0}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><header class="top"><div><div class="brand">VASI Admin</div><div class="muted">Operations & partner verification</div></div><div><button class="pill" onclick="logout()">Sign out</button> <button class="pill" onclick="location.href='index.html'">VASI</button></div></header><section class="grid"><div class="stat">Drivers<b id="drivers">—</b></div><div class="stat">Pending docs<b id="docs">—</b></div><div class="stat">Rides<b id="rides">—</b></div><div class="stat">Payments<b id="payments">—</b></div></section><section class="card" style="margin-top:12px"><h2>Partner verification</h2><div class="filters"><button class="active" onclick="filter('pending',this)">Pending</button><button onclick="filter('approved',this)">Approved</button><button onclick="filter('rejected',this)">Rejected</button></div><div id="list"><p class="empty">Loading…</p></div><p class="muted">Only authorized VASI administrators can approve partners. Approval controls whether a partner can go online.</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://vhfyvkrvysrooaqzcxsp.supabase.co','sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT');const endpoint='https://vhfyvkrvysrooaqzcxsp.supabase.co/functions/v1/admin-service';let current='pending';const $=id=>document.getElementById(id);async function call(body){const {data:{session}}=await db.auth.getSession();if(!session){location.href='admin-login.html';return null}const r=await fetch(endpoint,{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(r.status===401||r.status===403){await db.auth.signOut();location.href='admin-login.html';return null}return j}async function dashboard(){const d=await call({action:'dashboard'});if(!d)return;if(d.error){$('list').innerHTML='<p class="danger">'+d.error+'</p>';return}const x=d.dashboard||{};$('drivers').textContent=x.drivers??0;$('docs').textContent=x.pending_documents??0;$('rides').textContent=x.rides??0;$('payments').textContent=x.payments??0;load()}async function load(){const d=await call({action:'list_partners',status:current});if(!d)return;if(d.error){$('list').innerHTML='<p class="danger">'+d.error+'</p>';return}const rows=d.partners||[];if(!rows.length){$('list').innerHTML='<p class="empty">No '+current+' partners.</p>';return}$('list').innerHTML=rows.map(p=>{const docs=p.documents||[];return `<article class="partner"><b>${p.full_name||'Partner'}</b><div class="status">${p.role==='ride'?'🚕 Ride Driver · VTC':'🛵 Courier · Eats + Delivery'} · ${p.vehicle_type||'—'} · ${p.status||current}</div><div>${docs.map(d=>`<span class="doc">${d}</span>`).join('')}</div><div class="actions">${current==='pending'?`<button class="action approve" onclick="review('${p.id}','approved')">✓ Approve</button><button class="action reject" onclick="review('${p.id}','rejected')">✕ Reject</button>`:''}</div></article>`}).join('')}async function review(id,status){let reason='';if(status==='rejected')reason=prompt('Reason for rejection:')||'Documents not approved';const d=await call({action:'review_partner',partner_id:id,status,reason});if(d?.error)return alert(d.error);dashboard()}function filter(x,el){current=x;document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));el.classList.add('active');load()}async function logout(){await db.auth.signOut();location.href='admin-login.html'}db.auth.getSession().then(({data:{session}})=>{if(!session)location.href='admin-login.html';else dashboard()})</script></body></html>
