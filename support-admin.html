<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Support Admin · VASI</title><style>:root{font-family:Inter,system-ui;color:#fff;background:#050505}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:20px}.top,.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.ticket{background:#111;border:1px solid #292929;border-radius:18px;padding:16px;margin-top:12px}.btn,select,textarea{border:1px solid #333;background:#181818;color:#fff;border-radius:12px;padding:11px;font:inherit}.btn{font-weight:800}.muted{color:#999}.reply{width:100%;min-height:80px;margin:10px 0}.badge{background:#292929;padding:6px 9px;border-radius:999px}</style>  <link rel="stylesheet" href="./vasi-mobile-fit.css" />
  </head><body><main class="wrap"><header class="top"><h1>VASI Support Admin</h1><button class="btn" onclick="location.href='vasi-admin.html'">Admin home</button></header><div id="list"><p class="muted">Loading tickets…</p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const client=supabase.createClient('https://vhfyvkrvysrooaqzcxsp.supabase.co','sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT'),list=document.getElementById('list');let token='';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/support?admin=1',{headers:{Authorization:'Bearer '+token}}),d=await r.json();if(!r.ok){list.innerHTML='<p>'+esc(d.error)+'</p>';return}list.innerHTML=d.tickets.map(t=>`<article class="ticket"><div class="row"><b>#${t.id.slice(0,8).toUpperCase()} · ${esc(t.subject)}</b><span class="badge">${esc(t.status)}</span></div><p class="muted">${esc(t.user_role)} · ${esc(t.category)} · ${esc(t.priority)} · ${new Date(t.created_at).toLocaleString()}</p><p>${esc(t.description)}</p><p class="muted">AI: ${esc(t.ai_reply||'—')}</p><textarea class="reply" id="r-${t.id}" placeholder="Human support reply">${esc(t.human_reply||'')}</textarea><div class="row"><select id="s-${t.id}"><option value="in_progress">In progress</option><option value="resolved">Resolved</option><option value="waiting_human">Waiting human</option><option value="closed">Closed</option></select><button class="btn" onclick="save('${t.id}')">Save reply</button></div></article>`).join('')||'<p class="muted">No tickets.</p>'}async function save(id){const r=await fetch('/api/support',{method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({id,status:document.getElementById('s-'+id).value,human_reply:document.getElementById('r-'+id).value})}),d=await r.json();if(!r.ok)return alert(d.error);load()}client.auth.getSession().then(({data:{session}})=>{if(!session)location.href='admin-login.html';else{token=session.access_token;load()}})</script><script src="./vasi-languages.js"></script></body></html>
