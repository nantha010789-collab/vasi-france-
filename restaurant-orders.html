<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>Commandes · VASI Restaurant</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#fff;background:#050505;--line:#303030;--panel:#111;--soft:#181818;--muted:#a7a7a7;--green:#7be79a}*{box-sizing:border-box}body{margin:0;background:#050505}.wrap{width:min(100%,760px);margin:auto;padding:max(16px,env(safe-area-inset-top)) 14px calc(84px + env(safe-area-inset-bottom))}.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}.brand{display:flex;align-items:center;justify-content:center;gap:8px}.brand img{width:106px;max-width:30vw}.brand b{font-size:18px}.btn{font:inherit;border:1px solid #383838;background:#181818;color:#fff;border-radius:14px;padding:11px 14px;min-height:46px;font-weight:850;cursor:pointer}.primary{background:#fff;color:#050505;border-color:#fff}.danger{color:#ff9a92}.card{margin-top:14px;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:24px}.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.hero h1{margin:0;font-size:30px}.muted{color:var(--muted);line-height:1.45}.live{color:var(--green);font-size:12px;font-weight:850}.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;border:1px solid #383838;background:#181818;color:#ccc;border-radius:999px;padding:10px 14px;font:inherit;font-size:13px;font-weight:850}.tab.active{background:#fff;color:#050505;border-color:#fff}.order{border:1px solid #313131;border-radius:20px;padding:16px;margin-top:12px;background:#151515}.order.new{border-color:#3c7f4e;background:#102417}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.id{font-size:18px;font-weight:950}.time{font-size:12px;color:#aaa;margin-top:3px}.badge{display:inline-flex;padding:7px 10px;border-radius:999px;background:#292929;font-size:12px;font-weight:850}.items{display:grid;gap:8px;margin:14px 0}.item{display:flex;justify-content:space-between;gap:12px;padding:11px 12px;background:#1d1d1d;border-radius:13px}.meta{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.pill{padding:8px 10px;border-radius:999px;background:#232323;color:#ccc;font-size:12px;font-weight:750}.scheduled{color:#ffd28a}.address{margin-top:10px}.actions{display:grid;gap:8px;margin-top:14px}.actions .btn{width:100%;min-height:52px;border-radius:16px;font-size:16px}.prep-title{font-size:13px;color:#bbb}.prep-options{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.prep-options .btn{min-height:46px}.empty{text-align:center;padding:38px 14px;color:var(--muted)}.message{text-align:center;min-height:22px;color:#bbb;margin-top:12px}.pulse{animation:pulse 1.2s ease-in-out 3}@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(123,231,154,.16)}}
@media(max-width:520px){.wrap{padding-left:12px;padding-right:12px}.top{grid-template-columns:auto 1fr}.top>.btn:last-child{grid-column:1/-1;width:100%}.brand b{display:none}.hero{align-items:center}.hero h1{font-size:28px}.card{padding:17px}}
</style></head><body><main class="wrap"><header class="top"><button class="btn" onclick="location.href='restaurant-dashboard.html'">← Retour</button><div class="brand"><img src="./assets/vasi-logo.png" alt="VASI"><b>Commandes</b></div><button class="btn" id="refresh">Actualiser</button></header><section class="card"><div class="hero"><div><h1>Commandes</h1><p class="muted">Suivez chaque commande étape par étape.</p><span class="live">● Mises à jour en direct</span></div></div><div id="tabs" class="tabs"></div><div id="orders"></div></section><p id="msg" class="message" aria-live="polite"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"></script><script src="./vasi-region.js"></script><script>
const U='https://vhfyvkrvysrooaqzcxsp.supabase.co',K='sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT';const client=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:localStorage}});let token='',data={orders:[]},tab='new';const seen=new Set(JSON.parse(localStorage.getItem('vasi_seen_restaurant_orders')||'[]'));const msg=document.getElementById('msg'),ordersEl=document.getElementById('orders'),tabsEl=document.getElementById('tabs');const money=v=>VasiRegion.money(Number(v||0),VasiRegion.getRegion().code),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(body){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);try{const r=await fetch('/api/restaurant-partner',{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store',signal:controller.signal});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Service restaurant indisponible');return j}finally{clearTimeout(timer)}}
function label(s){return {pending:'Nouvelle',accepted:'Acceptée',preparing:'En préparation',ready_for_pickup:'Prête',picked_up:'Récupérée',delivered:'Livrée',cancelled:'Annulée'}[s]||s}
function normItems(raw){if(!raw)return[];if(Array.isArray(raw))return raw;if(Array.isArray(raw.items))return raw.items;try{const p=typeof raw==='string'?JSON.parse(raw):raw;return Array.isArray(p)?p:(Array.isArray(p?.items)?p.items:[])}catch{return[]}}
function itemRows(o){const rows=normItems(o.items);if(!rows.length)return '<div class="muted">Détails des articles indisponibles.</div>';return rows.map(i=>{const q=Number(i.quantity||i.qty||1),name=i.name||i.item_name||i.title||'Article',price=i.total??i.price;return `<div class="item"><span><b>${q} ×</b> ${esc(name)}</span><span>${price!=null?money(Number(price)*(!i.total&&q>1?q:1)):''}</span></div>`}).join('')}
function filtered(){const all=data.orders||[];if(tab==='new')return all.filter(o=>o.status==='pending');if(tab==='prep')return all.filter(o=>['accepted','preparing'].includes(o.status));if(tab==='ready')return all.filter(o=>['ready_for_pickup','picked_up'].includes(o.status));return all.filter(o=>['delivered','cancelled'].includes(o.status))}
function action(o){if(o.status==='pending')return `<div class="prep-title">Temps de préparation estimé</div><div class="prep-options"><button class="btn primary" onclick="acceptOrder('${o.id}',10)">10 min</button><button class="btn primary" onclick="acceptOrder('${o.id}',20)">20 min</button><button class="btn primary" onclick="acceptOrder('${o.id}',30)">30 min</button></div><button class="btn danger" onclick="rejectOrder('${o.id}')">Refuser la commande</button>`;if(o.status==='accepted')return `<button class="btn primary" onclick="setStatus('${o.id}','preparing')">Commencer la préparation</button>`;if(o.status==='preparing')return `<button class="btn primary" onclick="setStatus('${o.id}','ready_for_pickup')">Prête pour le retrait</button>`;if(o.status==='ready_for_pickup'&&o.delivery_mode==='own')return `<button class="btn primary" onclick="completeOwnDelivery('${o.id}')">Terminer la livraison · saisir le PIN</button>`;if(o.status==='ready_for_pickup')return '<div class="muted">En attente du coursier.</div>';if(o.status==='picked_up')return '<div class="muted">Commande remise au coursier.</div>';return ''}
function tabs(){const all=data.orders||[],c={new:all.filter(o=>o.status==='pending').length,prep:all.filter(o=>['accepted','preparing'].includes(o.status)).length,ready:all.filter(o=>['ready_for_pickup','picked_up'].includes(o.status)).length};tabsEl.innerHTML=`<button class="tab ${tab==='new'?'active':''}" onclick="changeTab('new')">Nouvelles (${c.new})</button><button class="tab ${tab==='prep'?'active':''}" onclick="changeTab('prep')">En préparation (${c.prep})</button><button class="tab ${tab==='ready'?'active':''}" onclick="changeTab('ready')">Prêtes (${c.ready})</button><button class="tab ${tab==='history'?'active':''}" onclick="changeTab('history')">Historique</button>`}
function cards(){const rows=filtered();ordersEl.innerHTML=rows.length?rows.map(o=>{const fresh=o.status==='pending'&&!seen.has(o.id),created=o.created_at?new Date(o.created_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'',scheduled=o.scheduled_for?new Date(o.scheduled_for).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}):'';return `<article class="order ${o.status==='pending'?'new':''} ${fresh?'pulse':''}"><div class="head"><div><div class="id">Commande #${esc(o.id.slice(0,8).toUpperCase())}</div><div class="time">Reçue à ${esc(created)}</div></div><span class="badge">${esc(label(o.status))}</span></div>${scheduled?`<div class="meta"><span class="pill scheduled">⏰ Programmée · ${esc(scheduled)}</span></div>`:''}<div class="items">${itemRows(o)}</div><div class="meta"><span class="pill">Total ${money(o.total)}</span><span class="pill">${o.delivery_mode==='own'?'Votre livraison':'Coursier VASI'}</span>${o.restaurant_preparation_minutes?`<span class="pill">Préparation ${Number(o.restaurant_preparation_minutes)} min</span>`:''}${o.unavailable_item_preference?`<span class="pill">Indisponible: ${esc(o.unavailable_item_preference)}</span>`:''}</div>${o.delivery_address?`<div class="muted address">📍 ${esc(o.delivery_address)}</div>`:''}<div class="actions">${action(o)}</div></article>`}).join(''):'<div class="empty">Aucune commande dans cette section.</div>'}
function render(){tabs();cards()}
function beep(){try{const C=window.AudioContext||window.webkitAudioContext,a=new C(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(.05,a.currentTime);o.start();o.stop(a.currentTime+.18)}catch(_){}}
async function load(silent=false){try{const next=await api();if(!next.restaurant){location.replace('restaurant-dashboard.html');return}const newIds=(next.orders||[]).filter(o=>o.status==='pending'&&!seen.has(o.id)).map(o=>o.id);data=next;render();if(newIds.length&&!silent){beep();newIds.forEach(id=>seen.add(id));localStorage.setItem('vasi_seen_restaurant_orders',JSON.stringify([...seen].slice(-100)))}if(!silent)msg.textContent=''}catch(e){msg.textContent=/fetch|aborted/i.test(e.message)?'Connexion impossible. Réessayez.':e.message}}
async function acceptOrder(id,preparation_minutes){msg.textContent='Acceptation…';try{await api({action:'accept_order',id,preparation_minutes});tab='prep';await load(true);msg.textContent='Commande acceptée.'}catch(e){msg.textContent=e.message}}
async function rejectOrder(id){if(!confirm('Refuser cette commande et rembourser intégralement le client ?'))return;msg.textContent='Remboursement en cours…';try{await api({action:'reject_order',id});await load(true);msg.textContent='Commande refusée et client remboursé.'}catch(e){msg.textContent=e.message}}
async function completeOwnDelivery(id){const pin=prompt('Saisissez le PIN de livraison à 4 chiffres du client');if(pin===null)return;msg.textContent='Vérification du PIN…';try{const result=await api({action:'complete_own_delivery',id,pin});if(result.ok===false)throw Error(result.error||'PIN incorrect');await load(true);msg.textContent='Livraison terminée.'}catch(e){msg.textContent=e.message}}
async function setStatus(id,status){msg.textContent='Mise à jour…';try{await api({action:'order_status',id,status});await load(true);msg.textContent='Commande mise à jour.'}catch(e){msg.textContent=e.message}}
function changeTab(v){tab=v;render()}document.getElementById('refresh').onclick=()=>load(false);client.auth.getSession().then(async({data:{session}})=>{if(!session){localStorage.setItem('vasi_role','restaurant');localStorage.setItem('vasi_return','restaurant-orders.html');location.replace('auth.html?role=restaurant');return}token=session.access_token;await load(true);client.channel('restaurant-orders-live').on('postgres_changes',{event:'*',schema:'public',table:'eats_orders',filter:`restaurant_id=eq.${data.restaurant.id}`},()=>load(false)).subscribe();setInterval(()=>load(false),30000)}).catch(e=>msg.textContent=e.message);
</script></body></html>
