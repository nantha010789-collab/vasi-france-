<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VASI Partner Admin</title><style>body{margin:0;background:#070707;color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:30px;font-weight:950}.card{background:#111;border:1px solid #292929;border-radius:18px;padding:16px;margin-top:12px}.filters{display:flex;gap:8px;overflow:auto}.filters button,.action{border:1px solid #333;background:#181818;color:#fff;border-radius:12px;padding:10px;font-weight:800}.filters .active{background:#fff;color:#050505}.partner{border:1px solid #2b2b2b;border-radius:16px;padding:14px;margin-top:9px}.meta{color:#999;font-size:12px;margin:5px 0}.actions{display:flex;gap:8px;margin-top:10px}.approve{background:#fff;color:#050505}.reject{background:#321717}.empty{color:#999}.note{color:#888;font-size:11px;line-height:1.5}</style>  <link rel="stylesheet" href="./vasi-mobile-fit.css" />
  </head><body><main class="wrap"><header class="top"><div class="brand">VASI Admin</div><button class="action" onclick="location.href='index.html'">Home</button></header><section class="card"><h2>Partner verification</h2><div class="filters"><button class="active" onclick="setFilter('pending',this)">Pending</button><button onclick="setFilter('approved',this)">Approved</button><button onclick="setFilter('rejected',this)">Rejected</button></div><div id="list"><p class="empty">Loading…</p></div><p class="note">Only authorized VASI admins should use this page. Approval controls the partner's ability to go online.</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const client=supabase.createClient('https://vhfyvkrvysrooaqzcxsp.supabase.co','sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT');let filter='pending';const $=id=>document.getElementById(id);async function admin(body){const {data:{session}}=await client.auth.getSession();if(!session){location.href='auth.html';return null}const r=await fetch('https://vhfyvkrvysrooaqzcxsp.supabase.co/functions/v1/admin-service',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify(body)});return r.json()}async function load(){const d=await admin({action:'list_partners',status:filter});if(!d)return;if(d.error){$('list').innerHTML='<p class="empty">'+d.error+'</p>';return}const rows=d.partners||[];if(!rows.length){$('list').innerHTML='<p class="empty">No '+filter+' partners.</p>';return}$('list').innerHTML=rows.map(p=>`<article class="partner"><b>${p.full_name||'Partner'}</b><div class="meta">${p.role==='ride'?'🚕 Ride Driver · VTC':'🛵 Courier · Eats + Delivery'} · ${p.vehicle_type||'—'}</div><div class="meta">Status: ${p.status||filter} · ${p.phone||''}</div><div class="actions"><button class="action approve" onclick="review('${p.id}','approved')">✓ Approve</button><button class="action reject" onclick="review('${p.id}','rejected')">✕ Reject</button></div></article>`).join('')}async function review(id,status){const reason=status==='rejected'?prompt('Reason for rejection (optional):')||'Documents not approved':'';const d=await admin({action:'review_partner',partner_id:id,status,reason});if(d?.error)return alert(d.error);load()}function setFilter(f,el){filter=f;document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));el.classList.add('active');load()}load();</script><script src="./vasi-languages.js"></script></body></html>
