<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>VASI Login</title><style>body{margin:0;background:#050505;color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:520px;margin:auto;padding:28px 20px}.logo{font-size:32px;font-weight:900;margin:10px 0 50px}.card{background:#111;border:1px solid #292929;border-radius:24px;padding:22px}.switch{display:flex;gap:8px;margin-bottom:20px}.switch button,.btn{flex:1;padding:14px;border-radius:14px;border:1px solid #333;background:#181818;color:#fff;font-weight:700}.btn.primary{background:#fff;color:#000;border:0;width:100%;margin-top:12px}.input{width:100%;padding:15px;border-radius:14px;border:1px solid #333;background:#181818;color:#fff;margin:8px 0;box-sizing:border-box}.muted{color:#999;font-size:13px;line-height:1.5}.active{outline:2px solid #fff}.hidden{display:none}#msg{margin-top:14px;color:#aaa}</style></head><body><main class="wrap"><div class="logo">VASI</div><section class="card"><div class="switch"><button id="customerBtn" onclick="setRole('customer')">Customer</button><button id="driverBtn" onclick="setRole('driver')">Driver</button></div><h1 id="title">Customer login</h1><p class="muted">Enter your email. VASI will send a secure one-time sign-in link.</p><input id="email" class="input" type="email" placeholder="you@example.com" autocomplete="email"><button class="btn primary" onclick="sendLink()">Continue</button><p id="msg"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://vhfyvkrvysrooaqzcxsp.supabase.co';const SUPABASE_KEY='sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT';const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let role=localStorage.getItem('vasi_role')||'customer';function setRole(next){role=next;localStorage.setItem('vasi_role',role);render()}function render(){const driver=role==='driver';document.getElementById('title').textContent=driver?'Driver login':'Customer login';document.getElementById('customerBtn').classList.toggle('active',!driver);document.getElementById('driverBtn').classList.toggle('active',driver)}async function sendLink(){const email=document.getElementById('email').value.trim();if(!email)return show('Enter your email address.');show('Sending secure login link…');localStorage.setItem('vasi_role',role);const {error}=await client.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+'/auth.html',shouldCreateUser:true}});if(error)return show(error.message);show('Check your email for the VASI sign-in link.')}function show(t){document.getElementById('msg').textContent=t}render();client.auth.onAuthStateChange((event,session)=>{if(session){const savedRole=localStorage.getItem('vasi_role')||'customer';location.href=savedRole==='driver'?'driver.html':'index.html'}})</script></body></html>
