<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#050505" />
    <title>VASI Login & Registration</title>
    <style>
      body {
        margin: 0;
        background: #050505;
        color: #fff;
        font-family: Inter, system-ui, sans-serif;
      }
      .wrap {
        max-width: 560px;
        margin: auto;
        padding: 28px 20px;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 10px 0 38px;
      }
      .logo {
        font-size: 32px;
        font-weight: 900;
      }
      .back {
        border: 1px solid #333;
        background: #181818;
        color: #fff;
        border-radius: 999px;
        padding: 11px 16px;
        text-decoration: none;
        font-weight: 700;
      }
      .card {
        background: #111;
        border: 1px solid #292929;
        border-radius: 24px;
        padding: 22px;
      }
      .switch {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
        margin-bottom: 20px;
      }
      .switch button,
      .btn {
        padding: 14px;
        border-radius: 14px;
        border: 1px solid #333;
        background: #181818;
        color: #fff;
        font-weight: 700;
      }
      .btn.primary {
        background: #fff;
        color: #000;
        border: 0;
        width: 100%;
        margin-top: 12px;
      }
      .input {
        width: 100%;
        padding: 15px;
        border-radius: 14px;
        border: 1px solid #333;
        background: #181818;
        color: #fff;
        margin: 8px 0;
        box-sizing: border-box;
      }
      .muted {
        color: #999;
        font-size: 13px;
        line-height: 1.5;
      }
      .active {
        outline: 2px solid #fff;
      }
      .small {
        font-size: 11px;
        color: #999;
        margin-top: 10px;
      }
      .link {
        display: block;
        text-align: center;
        color: #fff;
        margin-top: 14px;
      }
      .hidden {
        display: none;
      }
      #msg {
        margin-top: 14px;
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header class="top">
        <div class="logo">VASI</div>
        <a class="back" href="index.html" aria-label="Return to VASI home"
          >← Back</a
        >
      </header>
      <section class="card">
        <div class="switch">
          <button id="customerBtn" onclick="setRole('customer')">
            Customer</button
          ><button id="rideBtn" onclick="setRole('ride')">🚕 Ride</button
          ><button id="courierBtn" onclick="setRole('courier')">
            🛵 Courier
          </button><button id="restaurantBtn" onclick="setRole('restaurant')">
            🍽️ Restaurant
          </button>
        </div>
        <h1 id="title">Customer login</h1>
        <p id="desc" class="muted">Quick phone sign-in for VASI customers.</p>
        <input
          id="identity"
          class="input"
          type="tel"
          inputmode="tel"
          placeholder="06 12 34 56 78"
          autocomplete="tel"
        />
        <div id="codeStep" class="hidden">
          <input
            id="otp"
            class="input"
            type="text"
            inputmode="numeric"
            maxlength="6"
            placeholder="6-digit SMS code"
            autocomplete="one-time-code"
          />
          <button class="btn" type="button" onclick="changePhone()">
            Change phone number
          </button>
        </div>
        <button id="continueBtn" class="btn primary" onclick="submitAuth()">
          Send SMS code</button
        ><a id="register" class="link hidden" href="partner-register-v2.html"
          >New partner? Register with VASI →</a
        >
        <p class="small">
          Ride = passenger trips. Courier = delivery. Restaurant = food partner.
        </p>
        <p class="small">
          Login help:
          <a
            class="link"
            href="mailto:nantha010789@gmail.com?subject=VASI%20login%20help"
            >nantha010789@gmail.com</a
          >
        </p>
        <p id="msg"></p>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = "https://vhfyvkrvysrooaqzcxsp.supabase.co";
      const SUPABASE_KEY = "sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT";
      const PRODUCTION_ORIGIN = "https://vasi-new.vercel.app";
      const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      let phoneAwaitingCode = "";
      const requestedRole = new URLSearchParams(location.search).get("role");
      let role = ["customer", "ride", "courier", "restaurant"].includes(requestedRole)
        ? requestedRole
        : localStorage.getItem("vasi_role") || "customer";
      localStorage.setItem("vasi_role", role);
      function setRole(next) {
        role = next;
        localStorage.setItem("vasi_role", role);
        phoneAwaitingCode = "";
        $("codeStep").classList.add("hidden");
        $("identity").disabled = false;
        $("identity").value = "";
        $("otp").value = "";
        show("");
        render();
      }
      function render() {
        const customer = role === "customer";
        $("title").textContent = customer ? "Customer login" : role === "ride" ? "Ride Driver login" : role === "courier" ? "Courier login" : "Restaurant owner login";
        $("desc").textContent = customer ? "Enter your mobile number. We will send a 6-digit SMS code." : role === "ride" ? "VTC passenger driver account." : role === "courier" ? "Eats + Delivery courier account." : "Manage your restaurant, menu and VASI Eats orders.";
        $("identity").type = customer ? "tel" : "email";
        $("identity").inputMode = customer ? "tel" : "email";
        $("identity").autocomplete = customer ? "tel" : "email";
        $("identity").placeholder = customer ? "06 12 34 56 78" : "you@example.com";
        $("continueBtn").textContent = customer ? (phoneAwaitingCode ? "Verify & continue" : "Send SMS code") : "Continue";
        $("codeStep").classList.toggle("hidden", !customer || !phoneAwaitingCode);
        ["customerBtn", "rideBtn", "courierBtn", "restaurantBtn"].forEach((id) =>
          $(id).classList.remove("active"),
        );
        $(
          customer ? "customerBtn" : role === "ride" ? "rideBtn" : role === "courier" ? "courierBtn" : "restaurantBtn",
        ).classList.add("active");
        $("register").classList.toggle("hidden", customer);
        $("register").href = role === "restaurant" ? "restaurant-register.html" : "partner-register-v2.html";
        $("register").textContent = role === "restaurant" ? "New restaurant? Join VASI →" : "New partner? Register with VASI →";
      }
      async function submitAuth() {
        if (role === "customer") return phoneAwaitingCode ? verifyPhoneCode() : sendPhoneCode();
        return sendEmailLink();
      }
      function normalizePhone(value) {
        const compact = value.replace(/[\s().-]/g, "");
        if (/^0[1-9]\d{8}$/.test(compact)) return "+33" + compact.slice(1);
        if (/^33[1-9]\d{8}$/.test(compact)) return "+" + compact;
        if (/^\+[1-9]\d{7,14}$/.test(compact)) return compact;
        return "";
      }
      async function sendPhoneCode() {
        const phone = normalizePhone($("identity").value.trim());
        if (!phone) return show("Enter a valid mobile number, for example 06 12 34 56 78.");
        show("Sending your SMS code…");
        localStorage.setItem("vasi_role", "customer");
        const { error } = await client.auth.signInWithOtp({ phone });
        if (error) {
          const unavailable = /unsupported phone provider/i.test(error.message);
          return show(
            unavailable
              ? "SMS login is being connected. Please try again shortly."
              : error.message,
          );
        }
        phoneAwaitingCode = phone;
        $("identity").disabled = true;
        $("codeStep").classList.remove("hidden");
        $("continueBtn").textContent = "Verify & continue";
        $("otp").focus();
        show("SMS sent. Enter the 6-digit code.");
      }
      async function verifyPhoneCode() {
        const token = $("otp").value.replace(/\D/g, "");
        if (token.length !== 6) return show("Enter the 6-digit SMS code.");
        show("Checking your code…");
        const { error } = await client.auth.verifyOtp({
          phone: phoneAwaitingCode,
          token,
          type: "sms",
        });
        if (error) return show(error.message);
        show("Signed in. Opening VASI…");
      }
      function changePhone() {
        phoneAwaitingCode = "";
        $("identity").disabled = false;
        $("codeStep").classList.add("hidden");
        $("continueBtn").textContent = "Send SMS code";
        $("otp").value = "";
        $("identity").focus();
        show("");
      }
      async function sendEmailLink() {
        const email = $("identity").value.trim();
        if (!email) return show("Enter your email address.");
        show("Sending secure login link…");
        localStorage.setItem("vasi_role", role);
        const { error } = await client.auth.signInWithOtp({
          email,
          options: {
            emailRedirectTo:
              PRODUCTION_ORIGIN + "/auth.html?role=" + encodeURIComponent(role),
            shouldCreateUser: true,
          },
        });
        if (error) return show(error.message);
        show("Check your email for the VASI sign-in link.");
      }
      function $(id) {
        return document.getElementById(id);
      }
      function show(t) {
        $("msg").textContent = t;
      }
      function destination(savedRole) {
        if (savedRole === "ride") return "driver.html";
        if (savedRole === "courier") return "delivery-driver.html";
        if (savedRole === "restaurant") return "restaurant-dashboard.html";
        const back = localStorage.getItem("vasi_return");
        if (back) {
          localStorage.removeItem("vasi_return");
          return back;
        }
        return "app.html";
      }
      render();
      $("identity").addEventListener("keydown", (event) => {
        if (event.key === "Enter") submitAuth();
      });
      $("otp").addEventListener("input", () => {
        $("otp").value = $("otp").value.replace(/\D/g, "").slice(0, 6);
      });
      $("otp").addEventListener("keydown", (event) => {
        if (event.key === "Enter") submitAuth();
      });
      client.auth.onAuthStateChange((event, session) => {
        if (session) {
          location.href = destination(
            localStorage.getItem("vasi_role") || "customer",
          );
        }
      });
    </script>
  </body>
</html>
