<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#050505" />
    <title>VASI Login & Registration</title>
    <style>
      body {
        margin: 0;
        background: #050505;
        color: #fff;
        font-family: Inter, system-ui, sans-serif;
      }
      .wrap {
        max-width: 560px;
        margin: auto;
        padding: 28px 20px;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 10px 0 38px;
      }
      .logo {
        font-size: 32px;
        font-weight: 900;
      }
      .back {
        border: 1px solid #333;
        background: #181818;
        color: #fff;
        border-radius: 999px;
        padding: 11px 16px;
        text-decoration: none;
        font-weight: 700;
      }
      .card {
        background: #111;
        border: 1px solid #292929;
        border-radius: 24px;
        padding: 22px;
      }
      .switch {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
        margin-bottom: 20px;
      }
      .switch button,
      .btn {
        padding: 14px;
        border-radius: 14px;
        border: 1px solid #333;
        background: #181818;
        color: #fff;
        font-weight: 700;
      }
      .btn.primary {
        background: #fff;
        color: #000;
        border: 0;
        width: 100%;
        margin-top: 12px;
      }
      .input {
        width: 100%;
        padding: 15px;
        border-radius: 14px;
        border: 1px solid #333;
        background: #181818;
        color: #fff;
        margin: 8px 0;
        box-sizing: border-box;
      }
      .muted {
        color: #999;
        font-size: 13px;
        line-height: 1.5;
      }
      .active {
        outline: 2px solid #fff;
      }
      .small {
        font-size: 11px;
        color: #999;
        margin-top: 10px;
      }
      .link {
        display: block;
        text-align: center;
        color: #fff;
        margin-top: 14px;
      }
      .hidden {
        display: none;
      }
      #msg {
        margin-top: 14px;
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header class="top">
        <div class="logo">VASI</div>
        <a class="back" href="index.html" aria-label="Return to VASI home"
          >← Back</a
        >
      </header>
      <section class="card">
        <div class="switch">
          <button id="customerBtn" onclick="setRole('customer')">
            Customer</button
          ><button id="rideBtn" onclick="setRole('ride')">🚕 Ride</button
          ><button id="courierBtn" onclick="setRole('courier')">
            🛵 Courier
          </button><button id="restaurantBtn" onclick="setRole('restaurant')">
            🍽️ Restaurant
          </button>
        </div>
        <h1 id="title">Customer login</h1>
        <p id="desc" class="muted">Secure email sign-in for VASI customers.</p>
        <input
          id="email"
          class="input"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
        /><button class="btn primary" onclick="sendLink()">Continue</button
        ><a id="register" class="link hidden" href="partner-register-v2.html"
          >New partner? Register with VASI →</a
        >
        <p class="small">
          Ride = passenger trips. Courier = delivery. Restaurant = food partner.
        </p>
        <p class="small">
          Login help:
          <a
            class="link"
            href="mailto:nantha010789@gmail.com?subject=VASI%20login%20help"
            >nantha010789@gmail.com</a
          >
        </p>
        <p id="msg"></p>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = "https://vhfyvkrvysrooaqzcxsp.supabase.co";
      const SUPABASE_KEY = "sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT";
      const PRODUCTION_ORIGIN = "https://vasi-new.vercel.app";
      const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      const requestedRole = new URLSearchParams(location.search).get("role");
      let role = ["customer", "ride", "courier", "restaurant"].includes(requestedRole)
        ? requestedRole
        : localStorage.getItem("vasi_role") || "customer";
      localStorage.setItem("vasi_role", role);
      function setRole(next) {
        role = next;
        localStorage.setItem("vasi_role", role);
        render();
      }
      function render() {
        const customer = role === "customer";
        $("title").textContent = customer ? "Customer login" : role === "ride" ? "Ride Driver login" : role === "courier" ? "Courier login" : "Restaurant owner login";
        $("desc").textContent = customer ? "Secure email sign-in for VASI customers." : role === "ride" ? "VTC passenger driver account." : role === "courier" ? "Eats + Delivery courier account." : "Manage your restaurant, menu and VASI Eats orders.";
        ["customerBtn", "rideBtn", "courierBtn", "restaurantBtn"].forEach((id) =>
          $(id).classList.remove("active"),
        );
        $(
          customer ? "customerBtn" : role === "ride" ? "rideBtn" : role === "courier" ? "courierBtn" : "restaurantBtn",
        ).classList.add("active");
        $("register").classList.toggle("hidden", customer);
        $("register").href = role === "restaurant" ? "restaurant-register.html" : "partner-register-v2.html";
        $("register").textContent = role === "restaurant" ? "New restaurant? Join VASI →" : "New partner? Register with VASI →";
      }
      async function sendLink() {
        const email = $("email").value.trim();
        if (!email) return show("Enter your email address.");
        show("Sending secure login link…");
        localStorage.setItem("vasi_role", role);
        const { error } = await client.auth.signInWithOtp({
          email,
          options: {
            emailRedirectTo:
              PRODUCTION_ORIGIN + "/auth.html?role=" + encodeURIComponent(role),
            shouldCreateUser: true,
          },
        });
        if (error) return show(error.message);
        show("Check your email for the VASI sign-in link.");
      }
      function $(id) {
        return document.getElementById(id);
      }
      function show(t) {
        $("msg").textContent = t;
      }
      function destination(savedRole) {
        if (savedRole === "ride") return "driver.html";
        if (savedRole === "courier") return "delivery-driver.html";
        if (savedRole === "restaurant") return "restaurant-dashboard.html";
        const back = localStorage.getItem("vasi_return");
        if (back) {
          localStorage.removeItem("vasi_return");
          return back;
        }
        return "app.html";
      }
      render();
      client.auth.onAuthStateChange((event, session) => {
        if (session) {
          location.href = destination(
            localStorage.getItem("vasi_role") || "customer",
          );
        }
      });
    </script>
  </body>
</html>
