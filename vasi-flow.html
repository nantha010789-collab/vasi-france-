<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151515"><title>VASI</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#151515}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="/vasi-rich.html" title="VASI"></iframe><script>
const frame=document.getElementById('app');
function enhance(){const d=frame.contentDocument;if(!d||!d.body||d.getElementById('vasi-natural-flow'))return;
const s=d.createElement('style');s.id='vasi-natural-flow';s.textContent=`
/* Natural VASI bottom-sheet interaction */
.bottom{transition:opacity .2s ease,transform .2s ease}
.sheet{touch-action:none;transition:height .28s cubic-bezier(.2,.8,.2,1),max-height .28s ease,transform .28s ease}
.sheet.vasi-collapsed{max-height:42vh!important}
.sheet.vasi-expanded{max-height:86vh!important}
body.vasi-booking .bottom{display:none!important}
body.vasi-booking .sheet{padding-bottom:calc(24px + env(safe-area-inset-bottom))!important;max-height:86vh!important}
.vasi-home-float{position:fixed;z-index:75;left:18px;top:78px;width:48px;height:48px;border:0;border-radius:50%;background:#151515ed;color:#fff;font-size:22px;box-shadow:0 6px 22px #0008;display:none}
body.vasi-booking .vasi-home-float{display:grid;place-items:center}
`;
d.head.appendChild(s);
let home=d.getElementById('vasi-home-float');if(!home){home=d.createElement('button');home.id='vasi-home-float';home.className='vasi-home-float';home.textContent='⌂';home.title='Home';home.onclick=()=>{try{d.defaultView.showView('homeView')}catch(e){};d.body.classList.remove('vasi-booking');const sh=d.querySelector('.sheet');if(sh){sh.classList.remove('vasi-expanded');sh.classList.add('vasi-collapsed')}};d.body.appendChild(home)}
const sh=d.querySelector('.sheet');if(sh){sh.classList.add('vasi-collapsed');let sy=0,ey=0;sh.addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});sh.addEventListener('touchmove',e=>{ey=e.touches[0].clientY},{passive:true});sh.addEventListener('touchend',()=>{const dy=ey-sy;if(Math.abs(dy)<35)return;if(dy<0){sh.classList.remove('vasi-collapsed');sh.classList.add('vasi-expanded')}else{sh.classList.remove('vasi-expanded');sh.classList.add('vasi-collapsed')}})}
const orig=d.defaultView.showView;if(typeof orig==='function'&&!d.defaultView.__vasiNatural){d.defaultView.showView=function(id){orig(id);d.body.classList.toggle('vasi-booking',id!=='homeView');if(sh){sh.classList.toggle('vasi-expanded',id!=='homeView');sh.classList.toggle('vasi-collapsed',id==='homeView')}};d.defaultView.__vasiNatural=true}
d.querySelectorAll('.backTitle button').forEach(b=>b.addEventListener('click',()=>setTimeout(()=>{const v=d.querySelector('.view.active');d.body.classList.toggle('vasi-booking',!(v&&v.id==='homeView'))},40)));
}
frame.addEventListener('load',()=>{enhance();setTimeout(enhance,300);setTimeout(enhance,1000)});</script></body></html>
