<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VASI — Ride</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#dfe7ef;color:#fff}button,input{font:inherit}button{cursor:pointer}.map{position:fixed;inset:0;background:linear-gradient(135deg,#b9c7d1,#e7edf1)}.shade{position:absolute;inset:0;background:linear-gradient(#07100aaa 0%,transparent 38%,#0003 100%)}.top{position:fixed;z-index:5;top:0;left:0;right:0;height:75px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:31px;font-weight:950;letter-spacing:-2px}.logo i{color:#18c964;font-style:normal}.account{width:46px;height:46px;border:1px solid #fff4;border-radius:50%;background:#111b;color:#fff;font-size:21px}.panel{position:fixed;z-index:4;left:10px;right:10px;bottom:82px;background:#111412ee;border:1px solid #fff2;border-radius:27px;padding:14px;max-height:76vh;overflow:auto;backdrop-filter:blur(18px);box-shadow:0 18px 55px #000b}.hidden{display:none!important}.grab{width:48px;height:5px;background:#68716b;border-radius:5px;margin:0 auto 14px}.search{height:58px;background:#252a26;border-radius:17px;display:flex;align-items:center;gap:8px;padding:6px}.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;padding:0 8px;font-size:17px}.search input::placeholder{color:#aab2ad}.green{border:0;border-radius:14px;background:#18c964;color:#061109;font-weight:900;padding:12px 15px}.heading{margin:17px 2px 10px}.heading b{font-size:21px}.heading small{display:block;color:#9ca59f;margin-top:4px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quick button,.option,.pay{border:1px solid #303631;background:#181c19;color:#fff;border-radius:15px;padding:12px 5px;font-weight:850}.quick span{display:block;font-size:24px;margin-bottom:5px}.quick small{display:block;color:#aeb6b1;font-size:10px;margin-top:3px}.recent{width:100%;margin-top:14px;text-align:left;border:1px solid #303631;background:#181c19;color:#fff;border-radius:15px;padding:13px}.title{display:flex;align-items:center;gap:8px;font-size:21px;font-weight:900}.back{border:0;background:none;color:#fff;font-size:32px;padding:0}.route{margin:12px 0;border:1px solid #303631;border-radius:16px;overflow:hidden}.row{display:flex;align-items:center;gap:10px;padding:13px;border-bottom:1px solid #303631}.row:last-child{border:0}.dot{width:10px;height:10px;border-radius:50%;background:#fff}.sq{width:10px;height:10px;border-radius:2px;background:#18c964}.row input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:16px}.suggestions{display:flex;gap:7px;overflow:auto}.suggest{white-space:nowrap;border:1px solid #303631;background:#181c19;color:#ddd;border-radius:12px;padding:9px}.full{width:100%;height:54px;margin-top:12px}.ride{width:100%;display:grid;grid-template-columns:50px 1fr auto;align-items:center;gap:10px;text-align:left;margin:6px 0;padding:12px;border:1px solid #303631;background:#181c19;color:#fff;border-radius:16px}.ride.selected{border-color:#18c964;background:#16221a}.car{width:50px;height:44px;border-radius:12px;background:#252a26;display:grid;place-items:center;font-size:25px}.ride small{display:block;color:#9da69f;margin-top:3px}.price{font-weight:950}.paygrid,.options{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pay.selected{border-color:#18c964;background:#17251b}.nav{position:fixed;z-index:6;left:11px;right:11px;bottom:9px;height:68px;background:#111512f5;border:1px solid #fff2;border-radius:35px;display:grid;grid-template-columns:repeat(4,1fr);padding:5px}.nav button{border:0;background:none;color:#89918c;border-radius:29px;font-size:10px;font-weight:850}.nav button.active{background:#252a27;color:#fff}.nav span{display:block;font-size:22px}.fab{position:fixed;z-index:5;right:16px;width:50px;height:50px;border-radius:50%;border:1px solid #ddd;background:#fff;color:#111;font-size:20px}.loc{bottom:148px}.safe{bottom:207px}.modal{position:fixed;z-index:20;inset:0;background:#000b;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{width:100%;background:#151815;border-radius:27px 27px 0 0;padding:20px 17px 28px}.sheet h2{margin:0 0 8px}.sheet p{color:#aab2ac;line-height:1.5}.close{float:right;border:0;background:none;color:#aaa;font-size:30px}.field{width:100%;height:50px;margin:6px 0;border-radius:13px;border:1px solid #3a413c;background:#242925;color:#fff;padding:0 12px}.toast{position:fixed;z-index:30;left:50%;bottom:92px;transform:translateX(-50%);background:#fff;color:#111;padding:11px 16px;border-radius:20px;font-size:12px;font-weight:900;display:none;white-space:nowrap}@media(min-width:800px){.panel,.nav{left:22px;right:auto;width:440px}.panel{bottom:22px}.nav{bottom:9px}.fab{right:25px}}
</style></head>
<body>
<div class="map"><div class="shade"></div></div>
<header class="top"><div class="logo">VASI<i>.</i></div><button id="account" class="account">♙</button></header>
<main id="home" class="panel">
<div class="grab"></div><div class="search"><span>⌖</span><input id="search" placeholder="Where to?" autocomplete="off"><button id="searchBtn" class="green">Search</button></div>
<div class="heading"><b>Where are you going?</b><small>Fast, safe VTC rides with VASI</small></div>
<div class="quick"><button data-service="VASI Go"><span>🚗</span>Go<small>Everyday</small></button><button data-service="VASI Comfort"><span>🚘</span>Comfort<small>Extra space</small></button><button id="reserve"><span>🗓️</span>Reserve<small>Book ahead</small></button><button data-service="VASI XL"><span>🚐</span>XL<small>Groups</small></button></div>
<button id="recent" class="recent">◷ &nbsp; Paris — Recent destination</button></main>
<main id="booking" class="panel hidden"><div class="grab"></div><div class="title"><button id="backHome" class="back">‹</button>Plan your ride</div><div class="route"><div class="row"><span class="dot"></span><input value="Current location" readonly></div><div class="row"><span class="sq"></span><input id="destination" placeholder="Where to?" autocomplete="off"></div></div><div class="suggestions"><button class="suggest" data-dest="Paris">◷ Paris</button><button class="suggest" data-dest="Aéroport CDG">✈️ CDG</button><button class="suggest" data-dest="Creil">◷ Creil</button><button class="suggest" data-dest="Lille">◷ Lille</button></div><button id="seePrices" class="green full">See prices</button></main>
<main id="rides" class="panel hidden"><div class="grab"></div><div class="title"><button id="backBooking" class="back">‹</button>Choose your VASI ride</div><div id="rideList"></div><div class="heading"><b>Payment</b></div><div class="paygrid"><button class="pay selected" data-pay="cash">💶 Cash</button><button class="pay" data-pay="card">💳 Card</button><button class="pay" data-pay="apple_pay"> Apple Pay</button><button class="pay" data-pay="google_pay">🟢 Google Pay</button></div><div class="heading"><b>Trip options</b></div><div class="options"><button class="option" id="addStop">➕ Add stop</button><button class="option" id="someone">👥 Someone else</button><button class="option" id="reserve2">🕐 Reserve</button><button class="option" id="share">↗ Share trip</button></div><button id="confirm" class="green full">Choose VASI Go · €8.50</button></main>
<nav class="nav"><button class="active" data-nav="home"><span>⌂</span>Home</button><button data-nav="services"><span>▦</span>Services</button><button data-nav="activity"><span>▤</span>Activity</button><button data-nav="account"><span>♙</span>Account</button></nav>
<button id="loc" class="fab loc">⌖</button><button id="safe" class="fab safe">🛡️</button>
<div id="modal" class="modal"><section class="sheet"><button id="close" class="close">×</button><div id="modalBody"></div></section></div><div id="toast" class="toast"></div>
<script>
(function(){
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const home=$('#home'),booking=$('#booking'),rides=$('#rides'),destination=$('#destination'),search=$('#search');
let selected={name:'VASI Go',price:8.5},payment='cash',stops=0;
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(window.vt);window.vt=setTimeout(()=>e.style.display='none',2200)}
function show(panel){[home,booking,rides].forEach(x=>x.classList.add('hidden'));panel.classList.remove('hidden')}
function openModal(html){$('#modalBody').innerHTML=html;$('#modal').classList.add('show')}
$('#close').addEventListener('click',()=>$('#modal').classList.remove('show'));
$('#searchBtn').addEventListener('click',()=>{if(!search.value.trim()){toast('Enter a destination');return}destination.value=search.value.trim();show(booking)});
$$('[data-service]').forEach(b=>b.addEventListener('click',()=>{selected.name=b.dataset.service;if(!search.value.trim())search.value='Paris';destination.value=search.value;show(booking)}));
$('#recent').addEventListener('click',()=>{search.value='Paris';destination.value='Paris';show(booking)});
$('#backHome').addEventListener('click',()=>show(home));$('#backBooking').addEventListener('click',()=>show(booking));
$$('[data-dest]').forEach(b=>b.addEventListener('click',()=>{destination.value=b.dataset.dest;search.value=b.dataset.dest;renderRides();show(rides)}));
$('#seePrices').addEventListener('click',()=>{if(!destination.value.trim()){toast('Choose a destination first');return}renderRides();show(rides)});
function renderRides(){const list=[['VASI Go',8.5,'🚗','4 min · Everyday'],['VASI Comfort',11.9,'🚘','6 min · Extra comfort'],['VASI XL',16.9,'🚐','8 min · Groups'],['VASI Premium',25.9,'⭐','5 min · Premium']];$('#rideList').innerHTML='';list.forEach(x=>{const b=document.createElement('button');b.className='ride'+(selected.name===x[0]?' selected':'');b.innerHTML='<span class="car">'+x[2]+'</span><span><b>'+x[0]+'</b><small>'+x[3]+'</small></span><span class="price">€'+x[1].toFixed(2)+'</span>';b.addEventListener('click',()=>{selected={name:x[0],price:x[1]};$$('.ride').forEach(r=>r.classList.remove('selected'));b.classList.add('selected');$('#confirm').textContent='Choose '+selected.name+' · €'+selected.price.toFixed(2)});$('#rideList').appendChild(b)})}
$$('[data-pay]').forEach(b=>b.addEventListener('click',()=>{payment=b.dataset.pay;$$('.pay').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');toast(b.textContent.trim()+' selected')}));
$('#addStop').addEventListener('click',()=>{if(stops>=2){toast('Maximum 2 stops');return}stops++;toast('Stop '+stops+' added')});
$('#someone').addEventListener('click',()=>openModal('<h2>Ride for someone else</h2><p>Enter the passenger details.</p><input class="field" placeholder="Passenger name"><input class="field" placeholder="Mobile number"><button id="continue" class="green full">Continue</button>'));
$('#reserve').addEventListener('click',()=>openModal('<h2>Reserve your VASI</h2><p>Schedule your pickup in advance.</p><input class="field" type="date"><input class="field" type="time"><input class="field" placeholder="Destination"><button id="reserveNow" class="green full">Reserve ride</button>'));$('#reserve2').addEventListener('click',()=>$('#reserve').click());
$('#share').addEventListener('click',async()=>{const text='VASI trip · '+(destination.value||'Trip details');try{if(navigator.share)await navigator.share({title:'VASI trip',text});else{await navigator.clipboard.writeText(text);toast('Trip details copied')}}catch(e){}});
$('#confirm').addEventListener('click',()=>{if(!destination.value.trim()){toast('Choose a destination first');return}if(window.parent&&window.parent.vasiBackend&&window.parent.vasiBackend.requestRide){window.parent.vasiBackend.requestRide();return}openModal('<h2>Confirm VASI ride</h2><p><b>'+selected.name+'</b><br>Destination: '+destination.value+'<br>Payment: '+payment+'<br>Estimated fare: <b>€'+selected.price.toFixed(2)+'</b></p><button id="request" class="green full">Confirm & request ride</button>')});
$$('[data-nav]').forEach(b=>b.addEventListener('click',()=>{const n=b.dataset.nav;if(n==='home')show(home);else if(n==='services')openModal('<h2>VASI Services</h2><p>🚗 VASI Go<br>🚘 VASI Comfort<br>🚐 VASI XL<br>⭐ VASI Premium<br>📦 VASI Courier<br>✈️ Airport rides</p>');else if(n==='activity')openModal('<h2>Activity</h2><p>Your VASI trips will appear here.</p>');else openModal('<h2>Account</h2><p>Passenger profile</p><button id="settings" class="green full">Settings</button><button id="safetyAccount" class="green full">Safety Center</button><button id="driver" class="green full">Drive with VASI</button>')});
$('#account').addEventListener('click',()=>openModal('<h2>Account</h2><p>Passenger profile</p><button id="settings2" class="green full">Settings</button><button id="safety2" class="green full">Safety Center</button>'));
$('#loc').addEventListener('click',()=>{if(window.parent&&window.parent.vasiUseGoogleLocation){window.parent.vasiUseGoogleLocation();return}if(navigator.geolocation)navigator.geolocation.getCurrentPosition(()=>toast('Location found'),()=>toast('Location permission needed'));else toast('Location unavailable')});
$('#safe').addEventListener('click',()=>openModal('<h2>VASI Safety Center</h2><p>Check driver photo, vehicle model and registration plate before entering.</p><button id="call112" class="green full">Emergency · 112</button>'));
document.addEventListener('click',e=>{if(e.target.id==='continue'){$('#modal').classList.remove('show');toast('Passenger saved')}if(e.target.id==='reserveNow'){$('#modal').classList.remove('show');toast('Reservation saved')}if(e.target.id==='request'){$('#modal').classList.remove('show');toast('VASI ride requested')}if(e.target.id==='call112')location.href='tel:112';if(e.target.id==='settings'||e.target.id==='settings2')openModal('<h2>Settings</h2><p>Language</p><select class="field"><option>Français</option><option>English</option><option>தமிழ்</option><option>Deutsch</option></select>');if(e.target.id==='safetyAccount'||e.target.id==='safety2')$('#safe').click();if(e.target.id==='driver')openModal('<h2>Drive with VASI</h2><p>VTC driver onboarding for France and Europe.</p>')});
})();
</script></body></html>
