<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#050505" />
    <meta
      name="description"
      content="Book VASI rides, food delivery and local courier services across France and Europe."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VASI" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./vasi-icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./vasi-icon-192.png" />
    <link rel="preload" as="image" href="./assets/vasi-logo.png" />
    <title>VASI — Move. Eat. Deliver.</title>
    <style>
      :root {
        font-family: Inter, system-ui, sans-serif;
        color: #fff;
        background: #050505;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #050505;
      }
      body {
        margin: 0;
      }
      .app {
        height: 100vh;
        height: 100dvh;
        min-height: 0;
        width: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        display: flex;
        flex-direction: column;
        max-width: 720px;
        margin: auto;
        padding:
          calc(env(safe-area-inset-top, 0px) + 18px)
          max(18px, env(safe-area-inset-right, 0px))
          calc(env(safe-area-inset-bottom, 0px) + 40px)
          max(18px, env(safe-area-inset-left, 0px));
      }
      .app::-webkit-scrollbar {
        display: none;
      }
      .top {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .brand {
        font-size: 30px;
        font-weight: 900;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      .pill {
        border: 1px solid #303030;
        background: #151515;
        border-radius: 999px;
        padding: 8px 12px;
        color: #ddd;
        text-decoration: none;
      }
      #accountBtn {
        max-width: 112px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .hero {
        padding: clamp(26px, 5.5vh, 42px) 0 clamp(18px, 3.2vh, 26px);
      }
      .eyebrow {
        color: #aaa;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
      }
      .hero h1 {
        font-size: clamp(34px, 9.5vw, 44px);
        line-height: 1.02;
        margin: 10px 0 14px;
        letter-spacing: clamp(-2.5px, -0.55vw, -1.5px);
      }
      .hero p {
        color: #aaa;
        font-size: 16px;
      }
      .services {
        flex: 0 0 auto;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }
      .card {
        min-width: 0;
        min-height: clamp(118px, 18vh, 145px);
        border: 1px solid #292929;
        border-radius: 22px;
        padding: clamp(12px, 4vw, 17px);
        background: #111;
        cursor: pointer;
        text-align: left;
        color: #fff;
      }
      .card strong {
        display: block;
        font-size: clamp(16px, 4.8vw, 19px);
        margin-top: clamp(24px, 5.2vh, 42px);
        overflow-wrap: anywhere;
      }
      .card span {
        color: #999;
        font-size: clamp(11px, 3.1vw, 12px);
        line-height: 1.35;
        overflow-wrap: anywhere;
      }
      .section {
        flex: 0 0 auto;
        margin-top: clamp(20px, 3.8vh, 30px);
      }
      .panel {
        border: 1px solid #292929;
        background: #101010;
        border-radius: 22px;
        padding: clamp(14px, 4.5vw, 18px);
      }
      .row {
        display: flex;
        justify-content: space-between;
        padding: 12px 0;
        border-bottom: 1px solid #222;
      }
      .muted {
        color: #999;
      }
      .cta {
        width: 100%;
        border: 0;
        border-radius: 16px;
        padding: 16px;
        margin-top: 14px;
        background: #fff;
        color: #050505;
        font-weight: 800;
        font-size: 16px;
      }
      .driver {
        display: block;
        width: 100%;
        border: 1px solid #303030;
        border-radius: 16px;
        padding: 14px;
        margin-top: 10px;
        background: #171717;
        color: #fff;
        font-weight: 800;
        font-size: 15px;
        text-align: center;
      }
      @media (max-width: 520px) and (max-height: 950px) {
        .app {
          padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
          padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
        }
        .hero {
          padding-top: clamp(18px, 3dvh, 26px);
          padding-bottom: clamp(12px, 2dvh, 18px);
        }
        .hero p {
          margin-block: 10px 0;
        }
        .card {
          min-height: clamp(108px, 14dvh, 132px);
        }
        .card strong {
          margin-top: clamp(18px, 3.4dvh, 30px);
        }
        .section {
          margin-top: clamp(14px, 2.2dvh, 20px);
        }
        .panel {
          padding: 14px;
        }
        .row {
          padding-block: 10px;
        }
        .cta {
          padding-block: 13px;
          margin-top: 12px;
        }
        .driver {
          padding-block: 11px;
          margin-top: 8px;
        }
      }
      @media (max-height: 740px) {
        .app {
          padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
          padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
        }
        .hero {
          padding-top: 22px;
          padding-bottom: 14px;
        }
        .hero h1 {
          font-size: clamp(32px, 8.8vw, 38px);
          margin-block: 8px 10px;
        }
        .hero p {
          margin-block: 8px;
        }
        .card {
          min-height: 108px;
        }
        .card strong {
          margin-top: 20px;
        }
        .section {
          margin-top: 16px;
        }
        .panel {
          padding: 13px;
        }
        .row {
          padding-block: 8px;
        }
        .cta {
          padding-block: 12px;
          margin-top: 10px;
        }
        .driver {
          padding-block: 11px;
          margin-top: 8px;
        }
      }
      @media (max-height: 620px) {
        .hero {
          padding-top: 14px;
          padding-bottom: 10px;
        }
        .eyebrow {
          font-size: 12px;
        }
        .hero h1 {
          font-size: 30px;
        }
        .hero p {
          font-size: 14px;
        }
        .card {
          min-height: 96px;
        }
        .card strong {
          margin-top: 12px;
        }
      }
      @media (max-width: 520px) and (min-height: 760px) {
        .app {
          justify-content: space-between;
        }
        .hero {
          padding-block: 0;
        }
        .section {
          margin-top: 0;
        }
      }
      @media (max-width: 520px) {
        .brand {
          flex: 0 0 auto;
          font-size: 27px;
        }
        .actions {
          min-width: 0;
          justify-content: flex-end;
          gap: 6px;
        }
        .pill {
          min-height: 42px;
          padding: 8px 10px;
          font-size: 14px;
          line-height: 1;
        }
        #accountBtn {
          max-width: 100px;
        }
        #langBtn {
          flex: 0 0 42px;
          width: 42px;
          padding-inline: 0;
        }
      }
      @media (max-width: 360px) {
        .app {
          padding-left: max(12px, env(safe-area-inset-left, 0px));
          padding-right: max(12px, env(safe-area-inset-right, 0px));
        }
        .top {
          gap: 8px;
        }
        .brand {
          font-size: 24px;
        }
        .pill {
          padding-inline: 8px;
          font-size: 13px;
        }
        #accountBtn {
          max-width: 86px;
        }
      }
      @media (max-width: 520px) {
        html[lang="fr"] .eyebrow {
          font-size: 12px;
          letter-spacing: 1.15px;
        }
        html[lang="fr"] .hero h1 {
          font-size: clamp(33px, 8.8vw, 39px);
          line-height: 1.04;
        }
        html[lang="fr"] .hero p {
          font-size: 15px;
          line-height: 1.35;
        }
        html[lang="fr"] .services {
          gap: 8px;
        }
        html[lang="fr"] .card {
          padding-inline: 10px;
        }
        html[lang="fr"] .card strong {
          font-size: clamp(13px, 3.7vw, 15px);
          white-space: nowrap;
          overflow-wrap: normal;
          word-break: normal;
        }
        html[lang="fr"] .card span {
          font-size: clamp(10px, 2.8vw, 11px);
          overflow-wrap: normal;
          word-break: normal;
          hyphens: none;
        }
        html[lang="fr"] .section {
          margin-top: clamp(16px, 2.2dvh, 20px);
        }
        html[lang="fr"] .driver {
          font-size: clamp(13px, 3.7vw, 15px);
        }
      }
    </style>
    <style id="vasi-service-photo-cards">
      .card {
        min-height: clamp(154px, 21dvh, 180px);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding: 9px;
        background: #101010;
      }
      .card > .service-photo {
        width: 100%;
        height: clamp(66px, 9.5dvh, 86px);
        flex: 0 0 auto;
        display: block;
        overflow: hidden;
        border: 1px solid #2d2d2d;
        border-radius: 14px;
        background: #071a42;
      }
      .card > .service-photo img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        object-position: center;
      }
      .card > strong {
        margin: 9px 2px 0;
        line-height: 1.05;
      }
      .card > span:not(.service-photo) {
        margin: 3px 2px 0;
        line-height: 1.25;
      }
      .card:active .service-photo img { transform: scale(.98); }
      @media (max-height: 700px) {
        .card { min-height: 138px; padding: 7px; }
        .card > .service-photo { height: 58px; border-radius: 12px; }
        .card > strong { margin-top: 7px; }
      }
      @media (max-width: 360px) {
        .services { gap: 7px; }
        .card { padding: 6px; border-radius: 18px; }
        .card > .service-photo { height: 54px; border-radius: 11px; }
        .card > strong { font-size: 13px; }
        .card > span:not(.service-photo) { font-size: 10px; }
      }
    </style>
      <style id="vasi-launch-splash">
      #vasiLaunchSplash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #050505;
        opacity: 1;
        visibility: visible;
        transition: opacity 260ms ease, visibility 260ms ease;
      }
      #vasiLaunchSplash.is-leaving {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .vasi-launch-lockup {
        display: grid;
        justify-items: center;
        gap: 14px;
        padding: max(24px, env(safe-area-inset-top, 0px))
          max(24px, env(safe-area-inset-right, 0px))
          max(24px, env(safe-area-inset-bottom, 0px))
          max(24px, env(safe-area-inset-left, 0px));
        transition: opacity 240ms ease, transform 240ms ease;
      }
      #vasiLaunchSplash.is-leaving .vasi-launch-lockup {
        opacity: 0;
        transform: scale(1.045);
      }
      .vasi-launch-mark {
        display: block;
        width: clamp(106px, 29vw, 132px);
        height: clamp(106px, 29vw, 132px);
        object-fit: contain;
        animation: vasiMarkIn 480ms cubic-bezier(.18,.8,.22,1) both;
      }
      .vasi-launch-name {
        display: flex;
        align-items: baseline;
        margin: -4px 0 0;
        font: 950 clamp(38px, 11vw, 52px)/1 Inter, system-ui, sans-serif;
        letter-spacing: .025em;
      }
      .vasi-launch-name span {
        display: inline-block;
        opacity: 0;
        transform: translateY(12px);
        animation: vasiLetterIn 340ms cubic-bezier(.2,.75,.25,1) forwards;
      }
      .vasi-launch-name span:nth-child(1) { color: #1765ff; animation-delay: 180ms; }
      .vasi-launch-name span:nth-child(2) { color: #fff; animation-delay: 235ms; }
      .vasi-launch-name span:nth-child(3) { color: #ff3153; animation-delay: 290ms; }
      .vasi-launch-name span:nth-child(4) { color: #ff3153; animation-delay: 345ms; }
      .vasi-launch-rule {
        width: 78px;
        height: 3px;
        border-radius: 999px;
        background: linear-gradient(90deg, #1765ff 0 33.33%, #fff 33.33% 66.66%, #ff3153 66.66% 100%);
        transform: scaleX(0);
        animation: vasiRuleIn 360ms cubic-bezier(.2,.75,.25,1) 520ms forwards;
      }
      @keyframes vasiMarkIn {
        from { opacity: 0; transform: scale(.72); }
        70% { opacity: 1; transform: scale(1.045); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes vasiLetterIn {
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes vasiRuleIn {
        to { transform: scaleX(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .vasi-launch-mark,
        .vasi-launch-name span,
        .vasi-launch-rule { animation: none; opacity: 1; transform: none; }
        #vasiLaunchSplash,
        .vasi-launch-lockup { transition-duration: 120ms; }
      }
    </style>
  </head>
  <body>
    <div id="vasiLaunchSplash" aria-hidden="true">
      <div class="vasi-launch-lockup">
        <img class="vasi-launch-mark" src="./vasi-icon-192.png" alt="" />
        <div class="vasi-launch-name">
          <span>V</span><span>A</span><span>S</span><span>I</span>
        </div>
        <div class="vasi-launch-rule"></div>
      </div>
    </div>
    <script id="vasi-launch-script">
      (() => {
        const splash = document.getElementById("vasiLaunchSplash");
        if (!splash) return;
        let alreadyShown = false;
        try {
          alreadyShown = sessionStorage.getItem("vasiLaunchShown") === "1";
          if (!alreadyShown) sessionStorage.setItem("vasiLaunchShown", "1");
        } catch {}
        if (alreadyShown) {
          splash.remove();
          return;
        }
        const reduced = window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches;
        window.setTimeout(() => {
          splash.classList.add("is-leaving");
          window.setTimeout(() => splash.remove(), reduced ? 140 : 280);
        }, reduced ? 260 : 1080);
      })();
    </script>
    <main class="app">
      <header class="top">
        <div class="brand"><img class="vasi-wordmark" src="./assets/vasi-logo.png" alt="VASI" style="display:block;width:112px;max-width:28vw;height:auto;max-height:46px;object-fit:contain" /></div>
        <div class="actions">
          <button class="pill" onclick="location.href='activity.html'">
            Activity
          </button>
          <button
            id="accountBtn"
            class="pill"
            onclick="openAccount()"
          >
            Login</button
          ><button id="langBtn" class="pill" onclick="openLanguageSettings()" aria-label="Language">🌐</button>
        </div>
      </header>
      <section class="hero">
        <div class="eyebrow">Europe mobility platform</div>
        <h1>Move.<br />Eat.<br />Deliver.</h1>
        <p>One VASI app for rides, food and delivery.</p>
      </section>
      <section class="services" aria-label="VASI services">
        <button class="card" onclick="location.href='ride-flow.html'">
          <span class="service-photo" aria-hidden="true"><img src="./assets/ride-service.webp" alt="" loading="eager" decoding="async" /></span>
          <strong>Ride</strong><span>Fast city trips</span>
        </button>
        <button class="card" onclick="location.href='eats.html'">
          <span class="service-photo" aria-hidden="true"><img src="./assets/eats-service.webp" alt="" loading="eager" decoding="async" /></span>
          <strong>Eats</strong><span>Food delivery</span>
        </button>
        <button class="card" onclick="location.href='delivery.html'">
          <span class="service-photo" aria-hidden="true"><img src="./assets/delivery-service.webp" alt="" loading="eager" decoding="async" /></span>
          <strong>Delivery</strong><span>Send anything</span>
        </button>
      </section>
      <section class="section">
        <div class="panel">
          <div class="row">
            <span class="muted">France & Europe</span
            ><span class="muted">VASI</span>
          </div>
          <button class="cta" onclick="location.href='ride-flow.html'">
            Book a ride</button
          ><button class="driver" onclick="location.href='auth.html?role=ride'">
            🚕 Driver app
          </button>
          <button class="driver" onclick="location.href='support.html'">
            💬 AI Customer Service
          </button>
          <button class="driver" onclick="location.href='legal.html'">
            § Legal & Privacy
          </button>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"></script>
    <script src="./vasi-notifications.js"></script>
    <script src="./vasi-languages.js"></script>
    <script>
      const client = supabase.createClient(
        "https://vhfyvkrvysrooaqzcxsp.supabase.co",
        "sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT",
      );
      let signedIn = false;
      function openAccount() {
        location.href = signedIn ? "account.html" : "auth.html?role=customer";
      }
      async function showAccountState() {
        const { data } = await client.auth.getSession();
        const session = data.session;
        if (!session) {
          signedIn = false;
          document.getElementById("accountBtn").textContent = "Login";
          return;
        }
        signedIn = true;
        const { data: profile } = await client
          .from("profiles")
          .select("full_name")
          .eq("id", session.user.id)
          .maybeSingle();
        const firstName = profile?.full_name?.trim().split(/\s+/)[0];
        document.getElementById("accountBtn").textContent =
          firstName || "Account";
      }
      client.auth.onAuthStateChange(() => {
        setTimeout(showAccountState, 0);
      });
      function openLanguageSettings() {
        location.href = signedIn
          ? "settings.html#preferences"
          : "auth.html?role=customer&next=settings.html";
      }
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";
      window.scrollTo(0, 0);
      showAccountState();
      VasiNotifications.start(client, { role: "customer" });
    </script>
  </body>
</html>
