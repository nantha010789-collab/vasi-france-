<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="VASI"><title>VASI — Ride</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--green:#18c765}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}.app{width:100%;height:100%;max-width:560px;margin:auto;background:#111;position:relative;overflow:hidden}.map{height:57%;position:relative;background:#ddd}.map #map{position:absolute;inset:0}.top{position:absolute;z-index:1000;top:28px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:center}.pill{height:62px;border:0;border-radius:34px;background:#151515ee;color:#fff;box-shadow:0 12px 28px #0005;padding:0 25px;font-size:18px;font-weight:850}.lang{display:flex;gap:10px;align-items:center}.signin{padding:0 23px}.user{font-size:25px;margin-left:8px}.sheet{position:absolute;z-index:1100;left:0;right:0;bottom:0;height:48%;background:#111;border-radius:36px 36px 0 0;box-shadow:0 -14px 40px #0006;padding:18px 40px calc(92px + env(safe-area-inset-bottom));overflow:auto}.handle{width:44px;height:5px;border-radius:10px;background:#3d3d3f;margin:0 auto 34px}.sheet h1{font-size:38px;line-height:1.08;text-align:center;margin:0 0 18px;font-weight:850;letter-spacing:-1.2px}.subtitle{text-align:center;color:#a9a9ad;font-size:18px;margin-bottom:38px}.destination{height:70px;border:0;border-radius:22px;background:#292929;color:#b9b9bd;width:100%;padding:0 22px;display:flex;align-items:center;gap:13px;font-size:20px}.destination input{border:0;outline:0;background:transparent;color:#fff;width:100%;font-size:20px}.destination input::placeholder{color:#b4b4b7}.searchIcon{font-size:25px;color:#ddd}.searchBtn{height:82px;width:100%;margin-top:22px;border:0;border-radius:25px;background:#f7f7f7;color:#111;font-size:23px;font-weight:850}.nav{position:absolute;z-index:1200;bottom:14px;left:24px;right:24px;height:86px;border:2px solid #39393b;border-radius:48px;background:#111e;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:6px}.nav button{height:72px;border:0;background:transparent;color:#a4a4a7;border-radius:38px;font-size:12px;font-weight:800}.nav button span{display:block;font-size:25px;line-height:29px;margin-bottom:3px}.nav .active{background:#2c2c2e;color:#fff}.modal{display:none;position:absolute;inset:0;z-index:2000;background:#000a;align-items:flex-end}.modal.show{display:flex}.box{width:100%;background:#171717;border-radius:30px 30px 0 0;padding:25px 24px calc(30px + env(safe-area-inset-bottom));border:1px solid #333}.box h2{margin:0 0 12px;font-size:26px}.box p{color:#aaa}.box input{width:100%;height:52px;border:1px solid #444;border-radius:13px;background:#242424;color:#fff;padding:0 14px;margin:6px 0}.primary{width:100%;height:54px;border:0;border-radius:14px;background:var(--green);color:#fff;font-weight:850;margin-top:10px}.close{float:right;border:0;background:#303030;color:#fff;border-radius:50%;width:35px;height:35px;font-size:22px}.service{background:#242424;border:1px solid #3a3a3a;border-radius:15px;padding:15px;margin:8px 0;display:flex;justify-content:space-between}.service small{display:block;color:#aaa}@media(max-width:380px){.sheet{padding-left:25px;padding-right:25px}.sheet h1{font-size:32px}.subtitle{font-size:16px;margin-bottom:25px}.top{left:16px;right:16px}.pill{font-size:16px;padding:0 17px;height:55px}.signin{padding:0 15px}.nav{left:12px;right:12px}}</style></head><body><div class="app"><div class="map"><div id="map"></div><div class="top"><button class="pill lang" onclick="language()">🇬🇧 <span>English</span></button><button class="pill signin" onclick="signin()">Sign in <span class="user">♙</span></button></div></div><section class="sheet"><div class="handle"></div><h1>Set your destination</h1><div class="subtitle">Safe rides, upfront prices</div><div class="destination"><span>●</span><input id="to" placeholder="Where to?" autocomplete="off"><span class="searchIcon">⌕</span></div><button class="searchBtn" onclick="searchRide()">Search destination</button></section><nav class="nav"><button class="active" onclick="nav('home',this)"><span>⌂</span>Home</button><button onclick="nav('services',this)"><span>▦</span>Services</button><button onclick="nav('activity',this)"><span>▤</span>Activity</button><button onclick="nav('account',this)"><span>♙</span>Account</button></nav><div id="modal" class="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><div id="content"></div></div></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map',{zoomControl:false,attributionControl:true}).setView([48.574,2.535],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);L.marker([48.574,2.535]).addTo(map).bindPopup('<b>VASI</b><br>Pickup location').openPopup();function modal(h){document.getElementById('content').innerHTML=h;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function signin(){modal('<h2>Sign in to VASI</h2><p>Use your mobile number or email to continue.</p><input type="tel" placeholder="+33 6 12 34 56 78"><input type="email" placeholder="Email address"><button class="primary" onclick="closeModal()">Continue</button>')}function language(){modal('<h2>VASI Language</h2><button class="primary" onclick="closeModal()">🇬🇧 English</button><button class="primary" onclick="closeModal()">🇫🇷 Français</button><button class="primary" onclick="closeModal()">🇩🇪 Deutsch</button>')}function searchRide(){const v=document.getElementById('to').value.trim();if(!v)return modal('<h2>Where are you going?</h2><p>Enter a destination to see VASI ride options and an upfront price.</p><button class="primary" onclick="closeModal()">OK</button>');modal('<h2>VASI ride search</h2><p>Destination: <b>'+v.replace(/[<>]/g,'')+'</b></p><p>Choose your VASI ride and confirm the upfront price.</p><button class="primary" onclick="closeModal()">Show VASI rides</button>')}function nav(name,el){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));el.classList.add('active');if(name==='services')modal('<h2>VASI Services</h2><div class="service"><div><b>VASI Go</b><small>Everyday rides</small></div><b>4 seats</b></div><div class="service"><div><b>VASI Comfort</b><small>More comfort</small></div><b>4 seats</b></div><div class="service"><div><b>VASI XL</b><small>Groups & luggage</small></div><b>6 seats</b></div>');else if(name==='activity')modal('<h2>VASI Activity</h2><p>Your recent rides will appear here.</p>');else if(name==='account')signin();else closeModal()}</script></body></html>
