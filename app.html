<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0b"><title>VASI — France & Europe</title><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:680px;margin:auto;padding:22px 16px 110px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:34px;font-weight:950;letter-spacing:-2px}.logo i{color:#19c463;font-style:normal}.account{width:44px;height:44px;border:1px solid #333;background:#171717;color:#fff;border-radius:50%;font-size:20px}.hero{margin-top:30px}.hero h1{font-size:34px;line-height:1.05;margin:0 0 10px}.muted{color:#999}.where{display:flex;gap:10px;margin-top:22px;background:#181818;border:1px solid #2d2d2d;padding:10px;border-radius:18px}.where input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;font-size:17px;padding:8px}.go{border:0;border-radius:13px;background:#19c463;color:#fff;font-weight:900;padding:0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.card{border:1px solid #2d2d2d;background:#141414;color:#fff;border-radius:20px;padding:18px;text-align:left;min-height:126px}.card span{font-size:30px}.card b{display:block;font-size:18px;margin-top:15px}.card small{color:#999}.info{margin-top:20px;background:#111;border:1px solid #262626;border-radius:18px;padding:16px}.info b{display:block;margin-bottom:5px}.nav{position:fixed;left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom));height:72px;background:#151515f5;border:1px solid #333;border-radius:37px;display:grid;grid-template-columns:repeat(4,1fr);padding:5px;max-width:656px;margin:auto}.nav button{border:0;background:none;color:#888;border-radius:30px;font-size:10px;font-weight:800}.nav button.active{background:#2b2b2b;color:#fff}.nav span{display:block;font-size:22px;line-height:28px}@media(max-width:420px){.hero h1{font-size:30px}.grid{gap:9px}.card{padding:15px}}</style></head><body><main class="wrap"><header class="top"><div class="logo">VASI<i>.</i></div><button class="account" onclick="location.href='auth.html'">♙</button></header><section class="hero"><h1>Where are you going?</h1><div class="muted">Move, eat and deliver across France & Europe with VASI.</div><div class="where"><input id="dest" placeholder="Enter destination"><button class="go" onclick="book()">Go</button></div></section><section class="grid"><button class="card" onclick="book()"><span>🚗</span><b>Ride now</b><small>Go, Comfort, XL & Van</small></button><button class="card" onclick="reserve()"><span>🗓️</span><b>Reserve</b><small>Choose your own date & time</small></button><button class="card" onclick="location.href='eats.html'"><span>🍔</span><b>VASI Eats</b><small>Order food delivery</small></button><button class="card" onclick="location.href='delivery.html'"><span>📦</span><b>Delivery</b><small>Send a parcel or item</small></button><button class="card" onclick="location.href='ride-history.html'"><span>▤</span><b>Activity</b><small>Trips, fares & receipts</small></button><button class="card" onclick="location.href='auth.html'"><span>♙</span><b>Account</b><small>Sign in or manage account</small></button></section><section class="info"><b>Transparent VASI ride pricing</b><div class="muted">Your live route, stops and server-calculated fare are shown in the booking flow. Waiting and cancellation fees appear in your receipt when applicable.</div></section></main><nav class="nav"><button class="active"><span>⌂</span>Home</button><button onclick="book()"><span>🚗</span>Ride</button><button onclick="location.href='ride-history.html'"><span>▤</span>Activity</button><button onclick="location.href='auth.html'"><span>♙</span>Account</button></nav><script>function book(){const d=document.getElementById('dest').value.trim();if(d)localStorage.setItem('vasi_destination_hint',d);location.href='ride-flow.html'}function reserve(){localStorage.setItem('vasi_open_schedule','1');location.href='ride-flow.html'}document.getElementById('dest').addEventListener('keydown',e=>{if(e.key==='Enter')book()});</script></body></html>
