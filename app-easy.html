<style>
:root{--g:#19c463;--bg:#111;--card:#202020;--muted:#999;--line:#333}*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{background:var(--bg);color:#fff;overflow:hidden}button,input,select{font:inherit}button{cursor:pointer}.map{position:fixed;inset:0;z-index:0;filter:brightness(.65)}.top{position:fixed;z-index:30;top:0;left:0;right:0;height:64px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#111e,transparent)}.logo{font-size:29px;font-weight:950;letter-spacing:-2px}.logo i{color:var(--g);font-style:normal}.round{width:42px;height:42px;border:1px solid #ffffff25;border-radius:50%;background:#151515e8;color:#fff;font-size:20px}.panel{position:fixed;z-index:20;left:10px;right:10px;bottom:92px;background:#171717f7;border:1px solid var(--line);border-radius:27px;padding:13px 14px calc(15px + env(safe-area-inset-bottom));max-height:72vh;overflow:auto;box-shadow:0 15px 50px #0009}.hidden{display:none!important}.grab{width:55px;height:5px;border-radius:9px;background:#444;margin:0 auto 12px}.search{height:56px;background:#272727;border-radius:16px;display:flex;align-items:center;gap:9px;padding:0 13px}.search input{flex:1;background:none;border:0;outline:0;color:#fff;font-size:17px}.search button,.cta{border:0;border-radius:13px;background:var(--g);color:#fff;font-weight:900}.search button{padding:10px}.section{font-size:17px;font-weight:900;margin:15px 0 8px}.cards,.paygrid,.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card,.pay,.opt,.choice{border:1px solid var(--line);background:#222;color:#eee;border-radius:15px;padding:12px;text-align:left}.card b,.choice b{display:block}.card small,.pay small,.opt small,.choice small,.ride small{display:block;color:var(--muted);margin-top:4px}.card{min-height:92px}.cta{width:100%;height:53px;font-size:16px;margin-top:10px}.title{display:flex;align-items:center;gap:6px}.title h2{margin:0;font-size:22px}.back,.close{border:0;background:none;color:#fff;font-size:31px}.route{border:1px solid #444;border-radius:16px;padding:5px;margin:10px 0}.dest{display:flex;gap:9px;padding:12px 5px;border-bottom:1px solid #333}.dest:last-child{border:0}.dest input{flex:1;background:none;border:0;outline:0;color:#fff}.suggest{padding:12px 5px;border-bottom:1px solid #303030;display:flex;gap:10px}.ride{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;padding:11px 3px;border-bottom:1px solid #303030;border-radius:12px}.ride.sel{background:#1d2a22;outline:2px solid var(--g)}.car{width:58px;height:46px;background:#292929;border-radius:12px;display:grid;place-items:center;font-size:27px}.price{font-weight:950}.pay.sel{border:2px solid var(--g);background:#17271d}.nav{position:fixed;z-index:40;bottom:10px;left:12px;right:12px;height:72px;background:#151515f7;border:1px solid #333;border-radius:37px;display:grid;grid-template-columns:repeat(4,1fr);padding:5px}.nav button{border:0;background:none;color:#888;border-radius:30px;font-size:10px;font-weight:800}.nav button.active{background:#2b2b2b;color:#fff}.nav span{display:block;font-size:22px;line-height:27px}.fab{position:fixed;z-index:25;right:16px;width:48px;height:48px;border:0;border-radius:50%;background:#fff;color:#111}.loc{bottom:170px}.safe{bottom:112px}.screen{position:fixed;z-index:60;inset:0;background:#111;display:none;overflow:auto;padding:18px 17px 105px}.screen.show{display:block}.item{padding:16px 4px;border-bottom:1px solid #2d2d2d;display:flex;gap:13px;align-items:center}.item small{color:var(--muted);display:block}.modal{display:none;position:fixed;z-index:100;inset:0;background:#000b;align-items:flex-end}.modal.show{display:flex}.sheet{width:min(560px,100%);background:#181818;border-radius:28px 28px 0 0;padding:21px 17px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.sheet p{color:#aaa;line-height:1.45}.field{width:100%;height:50px;background:#232323;border:1px solid #3a3a3a;border-radius:13px;color:#fff;padding:0 12px;margin:6px 0}.toast{position:fixed;z-index:110;left:50%;bottom:96px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 15px;border-radius:22px;font-weight:850;font-size:12px;white-space:nowrap}

<body>
<div id="map" class="map"></div><header class="top"><div class="logo">VASI<i>.</i></div><button class="round" onclick="account()">♙</button></header>
<main id="home" class="panel"><div class="grab"></div><div class="search"><span>⌕</span><input id="to" data-i="where" placeholder="Where to?"><button onclick="plan()" data-i="search">Search</button></div><div class="section" data-i="rideWith">Ride with VASI</div><div class="cards"><button class="card" onclick="startRide()">🚗 <b>VASI Go</b><small data-i="everyday">Everyday rides</small></button><button class="card" onclick="startRide()">🚘 <b>VASI Comfort</b><small data-i="comfort">More comfort</small></button><button class="card" onclick="reserve()">🗓️ <b>VASI Reserve</b><small data-i="bookAhead">Book ahead</small></button><button class="card" onclick="startRide()">🚐 <b>VASI XL</b><small data-i="groups">Groups & luggage</small></button></div><div class="section" data-i="recent">Recent</div><button class="choice" onclick="dest('Paris')">◷ <b>Paris</b><small>France</small></button></main>
<main id="booking" class="panel hidden"><div class="grab"></div><div class="title"><button class="back" onclick="home()">‹</button><h2 data-i="plan">Plan your ride</h2></div><div class="route"><div class="dest"><span>●</span><input value="My current location" readonly></div><div class="dest"><span>■</span><input id="destination" data-i="where" placeholder="Where to?"></div></div><div id="suggestions"><button class="suggest" onclick="choose('Paris')">◷ Paris</button><button class="suggest" onclick="choose('Aéroport CDG')">✈️ Aéroport CDG</button><button class="suggest" onclick="choose('Creil')">◷ Creil</button><button class="suggest" onclick="choose('Lille')">◷ Lille</button></div><button class="cta" onclick="showRides()" data-i="seePrices">See prices</button></main>
<main id="rides" class="panel hidden"><div class="grab"></div><div class="title"><button class="back" onclick="plan()">‹</button><h2 data-i="chooseRide">Choose your VASI ride</h2></div><div id="rideList"></div><div class="section" data-i="payment">Payment</div><div class="paygrid"><button class="pay sel" onclick="payment(this,'cash')">💶 Cash<small data-i="payAfter">Pay after ride</small></button><button class="pay" onclick="payment(this,'card')">💳 Card<small>Secure checkout</small></button><button class="pay" onclick="payment(this,'apple_pay')"> Apple Pay<small>Fast checkout</small></button><button class="pay" onclick="payment(this,'google_pay')">🟢 Google Pay<small>Fast checkout</small></button></div><div class="section" data-i="options">Trip options</div><div class="opts"><button class="opt" onclick="addStop()">➕ <span data-i="addStop">Add stop</span><small>Up to 2 stops</small></button><button class="opt" onclick="passenger()">👥 <span data-i="someone">Ride for someone else</span></button><button class="opt" onclick="reserve()">🕐 <span data-i="reserve">Reserve ride</span></button><button class="opt" onclick="shareTrip()">↗ <span data-i="share">Share trip</span></button></div><button class="cta" id="confirm" onclick="confirmRide()">Choose VASI Go · €8.50</button></main>
<nav class="nav"><button class="active" onclick="home()"><span>⌂</span><label data-i="home">Home</label></button><button onclick="services()"><span>▦</span><label data-i="services">Services</label></button><button onclick="activity()"><span>▤</span><label data-i="activity">Activity</label></button><button onclick="account()"><span>♙</span><label data-i="account">Account</label></button></nav>
<button class="fab loc" onclick="locate()">⌖</button><button class="fab safe" onclick="safety()">🛡️</button>
<section id="accountScreen" class="screen"><button class="close" onclick="home()">×</button><h1 data-i="account">Account</h1><div class="item" onclick="settings()">⚙️ <span data-i="settings">Settings</span></div><div class="item" onclick="safety()">🛡️ <span data-i="safety">Safety Center</span></div><div class="item" onclick="wallet()">💳 <span data-i="wallet">Wallet & payments</span></div><div class="item" onclick="driver()">🚗 <span data-i="driver">Drive with VASI</span></div></section>
<div id="modal" class="modal"><section class="sheet"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></section></div><div id="toast" class="toast" style="display:none"></div>

here:'Wohin?',search:'Suchen',rideWith:'Mit VASI fahren',everyday:'Alltägliche Fahrten',comfort:'Mehr Komfort',bookAhead:'Im Voraus buchen',groups:'Gruppen & Gepäck',recent:'Zuletzt',plan:'Fahrt planen',seePrices:'Preise ansehen',chooseRide:'VASI-Fahrt wählen',payment:'Zahlung',payAfter:'Nach der Fahrt zahlen',options:'Optionen',addStop:'Stopp hinzufügen',someone:'Für jemand anderen',reserve:'Fahrt reservieren',share:'Fahrt teilen',home:'Start',services:'Dienste',activity:'Aktivität',account:'Konto',settings:'Einstellungen',safety:'Sicherheitscenter',wallet:'Wallet & Zahlungen',driver:'Mit VASI fahren',language:'Sprache'},nl:{where:'Waarheen?',search:'Zoeken',rideWith:'Rijden met VASI',everyday:'Dagelijkse ritten',comfort:'Meer comfort',bookAhead:'Vooraf boeken',groups:'Groepen & bagage',recent:'Recent',plan:'Plan je rit',seePrices:'Prijzen bekijken',chooseRide:'Kies je VASI-rit',payment:'Betaling',payAfter:'Na de rit betalen',options:'Ritopties',addStop:'Stop toevoegen',someone:'Voor iemand anders',reserve:'Rit reserveren',share:'Rit delen',home:'Home',services:'Diensten',activity:'Activiteit',account:'Account',settings:'Instellingen',safety:'Veiligheidscentrum',wallet:'Wallet & betalingen',driver:'Rijden met VASI',language:'Taal'},es:{where:'¿A dónde?',search:'Buscar',rideWith:'Viaja con VASI',everyday:'Viajes diarios',comfort:'Más comodidad',bookAhead:'Reservar',groups:'Grupos y equipaje',recent:'Reciente',plan:'Planifica tu viaje',seePrices:'Ver precios',chooseRide:'Elige tu viaje VASI',payment:'Pago',payAfter:'Pagar después',options:'Opciones',addStop:'Añadir parada',someone:'Para otra persona',reserve:'Reservar viaje',share:'Compartir viaje',home:'Inicio',services:'Servicios',activity:'Actividad',account:'Cuenta',settings:'Ajustes',safety:'Centro de seguridad',wallet:'Cartera y pagos',driver:'Conduce con VASI',language:'Idioma'},it:{where:'Dove vuoi andare?',search:'Cerca',rideWith:'Viaggia con VASI',everyday:'Corse quotidiane',comfort:'Più comfort',bookAhead:'Prenota in anticipo',groups:'Gruppi e bagagli',recent:'Recenti',plan:'Pianifica il viaggio',seePrices:'Vedi prezzi',chooseRide:'Scegli la corsa VASI',payment:'Pagamento',payAfter:'Paga dopo la corsa',options:'Opzioni',addStop:'Aggiungi fermata',someone:'Per qualcun altro',reserve:'Prenota corsa',share:'Condividi corsa',home:'Home',services:'Servizi',activity:'Attività',account:'Account',settings:'Impostazioni',safety:'Centro sicurezza',wallet:'Portafoglio e pagamenti',driver:'Guida con VASI',language:'Lingua'},pt:{where:'Para onde?',search:'Pesquisar',rideWith:'Viaje com VASI',everyday:'Viagens diárias',comfort:'Mais conforto',bookAhead:'Reservar com antecedência',groups:'Grupos e bagagem',recent:'Recentes',plan:'Planeie a viagem',seePrices:'Ver preços',chooseRide:'Escolha a viagem VASI',payment:'Pagamento',payAfter:'Pagar depois da viagem',options:'Opções',addStop:'Adicionar paragem',someone:'Para outra pessoa',reserve:'Reservar viagem',share:'Partilhar viagem',home:'Início',services:'Serviços',activity:'Atividade',account:'Conta',settings:'Definições',safety:'Centro de segurança',wallet:'Carteira e pagamentos',driver:'Conduzir com VASI',language:'Idioma'}};
let lang=localStorage.vasiLang||'en',selected={name:'VASI Go',price:8.5},pay='cash',stops=0,map;
const $=id=>document.getElementById(id);function toast(t){let e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',2200)}function closeModal(){$('modal').classList.remove('show')}function modal(h){$('modalBody').innerHTML=h;$('modal').classList.add('show')}
function applyLang(){document.querySelectorAll('[data-i]').forEach(e=>{let k=e.dataset.i;if(T[lang]?.[k]){if(e.tagName==='INPUT')e.placeholder=T[lang][k];else e.textContent=T[lang][k]}});document.documentElement.lang=lang}applyLang();
function hide(){['home','booking','rides'].forEach(id=>$(id).classList.add('hidden'));$('accountScreen').classList.remove('show')}function nav(n){document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',i===n))}function home(){hide();$('home').classList.remove('hidden');nav(0)}function dest(x){$('to').value=x;plan()}function startRide(){if(!$('to').value)$('to').value='Paris';plan()}function plan(){hide();$('booking').classList.remove('hidden');$('destination').value=$('to').value||''}function choose(x){$('to').value=x;$('destination').value=x;showRides()}function showRides(){if(!$('destination').value.trim()){toast('Choose a destination');return}hide();$('rides').classList.remove('hidden');renderRides()}function renderRides(){let r=[['VASI Go',8.5,'🚗','11 min · Everyday rides'],['VASI Comfort',11.9,'🚘','13 min · More comfort'],['VASI XL',16.9,'🚐','16 min · Groups & luggage'],['VASI Premium',25.9,'⭐','12 min · Top quality']];$('rideList').innerHTML=r.map((x,i)=>`<div class="ride ${i===0?'sel':''}" onclick="selectRide(this,'${x[0]}',${x[1]})"><div class="car">${x[2]}</div><div><b>${x[0]}</b><small>${x[3]}</small></div><div class="price">€${x[1].toFixed(2)}</div></div>`).join('')}function selectRide(e,n,p){document.querySelectorAll('.ride').forEach(x=>x.classList.remove('sel'));e.classList.add('sel');selected={name:n,price:p};$('confirm').textContent=`Choose ${n} · €${p.toFixed(2)}`}function payment(e,n){document.querySelectorAll('.pay').forEach(x=>x.classList.remove('sel'));e.classList.add('sel');pay=n;toast(n==='google_pay'?'Google Pay selected':n==='apple_pay'?'Apple Pay selected':n+' selected')}
function addStop(){if(stops>=2){toast('Maximum 2 stops');return}stops++;toast('Stop '+stops+' added')}function passenger(){modal(`<h2>Ride for someone else</h2><input class="field" placeholder="Passenger name"><input class="field" placeholder="Mobile number"><button class="cta" onclick="closeModal();toast('Passenger saved')">Continue</button>`)}function reserve(){modal(`<h2>Reserve your VASI</h2><input class="field" type="date"><input class="field" type="time"><input class="field" placeholder="Destination"><button class="cta" onclick="closeModal();toast('Reservation saved')">Reserve ride</button>`)}function shareTrip(){toast('Trip sharing ready')}function confirmRide(){modal(`<h2>Confirm VASI ride</h2><p><b>${selected.name}</b><br>Destination: ${$('destination').value}<br>Payment: ${pay}<br>Upfront price: <b>€${selected.price.toFixed(2)}</b></p><button class="cta" onclick="closeModal();toast('VASI ride requested')">Confirm & request ride</button>`)}
function account(){hide();$('accountScreen').classList.add('show');nav(3)}function services(){nav(1);modal('<h2>VASI Services</h2><p>🚕 VASI Go<br>🚘 VASI Comfort<br>🚐 VASI XL<br>⭐ VASI Premium<br>📦 Courier<br>🚗 Drive with VASI</p>')}function activity(){nav(2);modal('<h2>Activity</h2><p>Your completed and cancelled VASI trips will appear here.</p>')}function wallet(){modal('<h2>VASI Wallet & payments</h2><p>💶 Cash<br>💳 Card<br> Apple Pay<br>🟢 Google Pay</p>')}function safety(){modal('<h2>VASI Safety Center</h2><p>🚨 Emergency 112<br>📍 Share live trip<br>🔢 Pickup PIN<br>👨 Driver & vehicle details<br>📞 Private calling<br>💬 In-app messaging<br>👥 Trusted contact</p><button class="cta" onclick="closeModal();toast('Emergency: call 112 if needed')">Done</button>')}function driver(){modal('<h2>Drive with VASI</h2><p>VTC driver onboarding for France and Europe.</p><input class="field" placeholder="Vehicle registration"><input class="field" placeholder="Driving licence number"><button class="cta" onclick="closeModal();toast(\'Driver setup saved\')">Continue</button>')}
function settings(){modal(`<h2>${T[lang].settings}</h2><p>${T[lang].language}</p><select class="field" onchange="setLang(this.value)"><option value="fr">🇫🇷 Français</option><option value="en">🇬🇧 English</option><option value="ta">🇹🇦 தமிழ்</option><option value="de">🇩🇪 Deutsch</option><option value="nl">🇳🇱 Nederlands</option><option value="es">🇪🇸 Español</option><option value="it">🇮🇹 Italiano</option><option value="pt">🇵🇹 Português</option></select><button class="cta" onclick="closeModal()">Done</button>`);document.querySelector('#modal select').value=lang}function setLang(v){lang=v;localStorage.vasiLang=v;applyLang();closeModal();toast('Language changed')}
function locate(){if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{map.setView([p.coords.latitude,p.coords.longitude],15);toast('Location found')},()=>toast('Location permission needed'));else toast('Location unavailable')}
map=L.map('map',{zoomControl:false}).setView([48.85,2.35],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
</script></body></html>
