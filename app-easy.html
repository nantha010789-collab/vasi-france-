<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070907">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VASI">
<title>VASI — Premium Ride</title>
<style>
:root{--green:#18c964;--green2:#0fa653;--bg:#080a09;--panel:#111412ee;--card:#191d1a;--line:#303631;--muted:#9aa39d;--white:#fff;--shadow:0 18px 55px #000b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#dfe7ef;color:var(--white)}button,input,select{font:inherit}button{cursor:pointer}.map{position:fixed;inset:0;background:#dfe7ef}.map:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#07100a55 0%,transparent 35%,#00000022 100%);pointer-events:none}.top{position:fixed;z-index:30;top:0;left:0;right:0;height:72px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#050806dd,transparent)}.logo{font-size:31px;font-weight:950;letter-spacing:-2.4px;text-shadow:0 2px 10px #0008}.logo i{color:var(--green);font-style:normal}.round{width:45px;height:45px;border:1px solid #ffffff35;border-radius:50%;background:#111a;color:#fff;font-size:21px;backdrop-filter:blur(12px)}.panel{position:fixed;z-index:20;left:10px;right:10px;bottom:84px;background:var(--panel);border:1px solid #ffffff12;border-radius:28px;padding:12px 14px calc(14px + env(safe-area-inset-bottom));max-height:76vh;overflow:auto;box-shadow:var(--shadow);backdrop-filter:blur(20px)}.hidden{display:none!important}.grab{width:48px;height:5px;border-radius:10px;background:#59605b;margin:0 auto 13px}.search{height:59px;background:#242925;border:1px solid #ffffff10;border-radius:18px;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px}.search .pin{font-size:20px}.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font-size:17px;font-weight:650}.search input::placeholder{color:#aab2ad}.search button,.cta{border:0;border-radius:15px;background:var(--green);color:#061109;font-weight:950}.search button{padding:11px 14px}.welcome{display:flex;align-items:end;justify-content:space-between;margin:17px 2px 10px}.welcome h2{font-size:21px;margin:0;font-weight:900}.welcome small{color:var(--muted)}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quick button{border:1px solid var(--line);background:#171a18;color:#fff;border-radius:15px;padding:11px 5px;min-height:76px;font-weight:800}.quick span{display:block;font-size:24px;margin-bottom:5px}.quick small{display:block;color:#b0b8b3;font-size:10px}.section{font-size:16px;font-weight:900;margin:17px 2px 9px}.recent{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:16px;background:#171a18}.recent .icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#252b27}.recent b{display:block}.recent small{color:var(--muted)}.title{display:flex;align-items:center;gap:7px}.title h2{margin:0;font-size:22px;letter-spacing:-.4px}.back,.close{border:0;background:none;color:#fff;font-size:33px;line-height:1;padding:0 5px}.route{margin:11px 0 5px;border:1px solid var(--line);border-radius:17px;overflow:hidden;background:#181c19}.destRow{display:flex;align-items:center;gap:10px;padding:13px 12px;border-bottom:1px solid #2a2e2b}.destRow:last-child{border:0}.dot{width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px #ffffff16}.square{width:10px;height:10px;background:var(--green);border-radius:2px}.destRow input{flex:1;background:none;border:0;outline:0;color:#fff;font-size:16px}.destRow input::placeholder{color:#89918b}.swap{border:0;background:#262b27;color:#fff;border-radius:11px;width:34px;height:34px}.suggestions{display:flex;gap:7px;overflow:auto;padding:7px 0 2px}.suggest{white-space:nowrap;border:1px solid var(--line);background:#171a18;color:#ddd;border-radius:13px;padding:9px 11px}.cta{width:100%;height:54px;font-size:16px;margin-top:11px;box-shadow:0 8px 22px #18c96422}.ride{display:grid;grid-template-columns:56px 1fr auto;gap:11px;align-items:center;padding:12px 8px;border:1px solid transparent;border-radius:17px;margin:5px 0;background:#181c19}.ride.sel{border-color:var(--green);background:#16221a;box-shadow:0 0 0 1px #18c96422}.car{width:56px;height:46px;border-radius:13px;background:#242a26;display:grid;place-items:center;font-size:26px}.ride b{font-size:15px}.ride small{display:block;color:var(--muted);margin-top:3px}.price{font-size:17px;font-weight:950}.check{font-size:15px;color:var(--green);margin-left:5px}.paygrid,.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pay,.opt{border:1px solid var(--line);background:#181c19;color:#eee;border-radius:15px;padding:12px;text-align:left}.pay.sel{border-color:var(--green);background:#17251b}.pay b{display:block}.pay small,.opt small{display:block;color:var(--muted);margin-top:4px}.opt{min-height:65px;font-weight:800}.confirmBar{position:sticky;bottom:0;padding-top:9px;background:linear-gradient(transparent,var(--panel) 20%)}.nav{position:fixed;z-index:40;bottom:9px;left:11px;right:11px;height:69px;background:#111512f2;border:1px solid #ffffff16;border-radius:35px;display:grid;grid-template-columns:repeat(4,1fr);padding:5px;box-shadow:0 12px 35px #0009;backdrop-filter:blur(18px)}.nav button{border:0;background:none;color:#808983;border-radius:29px;font-size:10px;font-weight:850}.nav button.active{background:#252a27;color:#fff}.nav span{display:block;font-size:22px;line-height:27px}.fab{position:fixed;z-index:25;right:16px;width:50px;height:50px;border:1px solid #ddd;border-radius:50%;background:#fff;color:#111;font-size:21px;box-shadow:0 8px 22px #0003}.loc{bottom:148px}.safe{bottom:207px}.screen{position:fixed;z-index:60;inset:0;background:#0b0e0c;display:none;overflow:auto;padding:24px 17px 110px}.screen.show{display:block}.screen h1{font-size:29px;margin:8px 0 18px}.item{padding:17px 5px;border-bottom:1px solid #2b302c;display:flex;align-items:center;gap:13px;font-weight:750}.item small{color:var(--muted);display:block;font-weight:500}.modal{display:none;position:fixed;z-index:100;inset:0;background:#000b;align-items:flex-end}.modal.show{display:flex}.sheet{width:min(560px,100%);background:#151815;border:1px solid #ffffff12;border-radius:28px 28px 0 0;padding:21px 17px calc(25px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;box-shadow:0 -10px 50px #0008}.sheet h2{margin:0 0 10px;font-size:23px}.sheet p{color:#aab2ac;line-height:1.5}.field{width:100%;height:51px;background:#242925;border:1px solid #3a413c;border-radius:14px;color:#fff;padding:0 13px;margin:6px 0}.status{display:flex;align-items:center;gap:9px;background:#18201b;border:1px solid #2d3b31;border-radius:15px;padding:12px;margin-top:10px}.status strong{color:var(--green)}.pill{display:inline-flex;padding:6px 9px;border-radius:99px;background:#243028;color:#b9c4bc;font-size:11px;font-weight:800}@media(min-width:800px){.panel{left:22px;right:auto;width:440px;bottom:22px}.nav{left:22px;right:auto;width:440px}.screen{left:calc(50% - 280px);right:calc(50% - 280px);border-radius:25px}.safe{bottom:82px}.loc{bottom:140px}}
</style></head>
<body>
<div id="map" class="map"></div>
<header class="top"><div class="logo">VASI<i>.</i></div><button class="round" onclick="account()">♙</button></header>

<main id="homePanel" class="panel">
 <div class="grab"></div>
 <div class="search"><span class="pin">⌖</span><input id="to" placeholder="Where to?" autocomplete="off"><button onclick="plan()">Search</button></div>
 <div class="welcome"><div><h2>Where are you going?</h2><small>Fast, safe VTC rides with VASI</small></div><span class="pill">24/7</span></div>
 <div class="quick"><button onclick="startRide('VASI Go')"><span>🚗</span>Go<small>Everyday</small></button><button onclick="startRide('VASI Comfort')"><span>🚘</span>Comfort<small>Extra space</small></button><button onclick="reserve()"><span>🗓️</span>Reserve<small>Book ahead</small></button><button onclick="startRide('VASI XL')"><span>🚐</span>XL<small>Groups</small></button></div>
 <div class="section">Recent</div>
 <button class="recent" onclick="dest('Paris')"><div class="icon">◷</div><div><b>Paris</b><small>France · Recent destination</small></div></button>
</main>

<main id="bookingPanel" class="panel hidden">
 <div class="grab"></div>
 <div class="title"><button class="back" onclick="home()">‹</button><h2>Plan your ride</h2></div>
 <div class="route">
  <div class="destRow"><span class="dot"></span><input value="Current location" readonly></div>
  <div class="destRow"><span class="square"></span><input id="destInput" placeholder="Where to?" autocomplete="off"><button class="swap" onclick="useCurrentLocation()">⌖</button></div>
 </div>
 <div class="suggestions"><button class="suggest" onclick="choose('Paris')">◷ Paris</button><button class="suggest" onclick="choose('Aéroport CDG')">✈️ CDG Airport</button><button class="suggest" onclick="choose('Creil')">◷ Creil</button><button class="suggest" onclick="choose('Lille')">◷ Lille</button></div>
 <button class="cta" onclick="showRides()">See prices</button>
</main>

<main id="ridePanel" class="panel hidden">
 <div class="grab"></div>
 <div class="title"><button class="back" onclick="plan()">‹</button><h2>Choose your VASI ride</h2></div>
 <div id="rideList"></div>
 <div class="section">Payment</div>
 <div class="paygrid"><button class="pay sel" onclick="payment(this,'cash')"><b>💶 Cash</b><small>Pay after ride</small></button><button class="pay" onclick="payment(this,'card')"><b>💳 Card</b><small>Secure checkout</small></button><button class="pay" onclick="payment(this,'apple_pay')"><b> Apple Pay</b><small>Fast checkout</small></button><button class="pay" onclick="payment(this,'google_pay')"><b>🟢 Google Pay</b><small>Fast checkout</small></button></div>
 <div class="section">Trip options</div>
 <div class="opts"><button class="opt" onclick="addStop()">➕ Add stop<small>Up to 2 stops</small></button><button class="opt" onclick="passenger()">👥 Someone else<small>Book for another person</small></button><button class="opt" onclick="reserve()">🕐 Reserve<small>Schedule a ride</small></button><button class="opt" onclick="shareTrip()">↗ Share trip<small>Send trip details</small></button></div>
 <div class="confirmBar"><button id="confirmBtn" class="cta" onclick="confirmRide()">Choose VASI Go · €8.50</button></div>
</main>

<nav id="nav" class="nav"><button class="active" onclick="home()"><span>⌂</span>Home</button><button onclick="services()"><span>▦</span>Services</button><button onclick="activity()"><span>▤</span>Activity</button><button onclick="account()"><span>♙</span>Account</button></nav>
<button class="fab safe" onclick="safety()">🛡️</button><button class="fab loc" onclick="useCurrentLocation()">⌖</button>

<section id="accountScreen" class="screen"><button class="close" onclick="home()">×</button><h1>Account</h1><div class="status"><span>●</span><div><b>VASI account</b><small>Passenger profile</small></div></div><div class="item" onclick="settings()">⚙️ <span>Settings</span></div><div class="item" onclick="safety()">🛡️ <span>Safety Center</span></div><div class="item" onclick="wallet()">💳 <span>Wallet & payments</span></div><div class="item" onclick="driver()">🚗 <span>Drive with VASI</span></div></section>
<div id="modal" class="modal"><section class="sheet"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></section></div>
<div id="toast" style="display:none;position:fixed;z-index:120;left:50%;bottom:92px;transform:translateX(-50%);background:#fff;color:#111;padding:11px 16px;border-radius:22px;font-weight:850;font-size:12px;white-space:nowrap;box-shadow:0 8px 25px #0005"></div>
<script>
const T={en:{where:'Where to?'},fr:{where:'Où allez-vous ?'},ta:{where:'எங்கே செல்ல வேண்டும்?'},de:{where:'Wohin?'},nl:{where:'Waarheen?'},es:{where:'¿A dónde?'},it:{where:'Dove vuoi andare?'},pt:{where:'Para onde?'}};
let lang=localStorage.vasiLang||'en',selected={name:'VASI Go',price:8.5},pay='cash',stops=0;
const $=id=>document.getElementById(id);
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',2300)}
function hide(){['homePanel','bookingPanel','ridePanel'].forEach(id=>$(id).classList.add('hidden'));$('accountScreen').classList.remove('show');$('nav').classList.add('hidden')}
function nav(n){document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',i===n))}
function home(){hide();$('homePanel').classList.remove('hidden');$('nav').classList.remove('hidden');nav(0)}
function dest(x){$('to').value=x;plan()}
function startRide(service){if(!$('to').value)$('to').value='Paris';selected.name=service||'VASI Go';plan()}
function plan(){hide();$('bookingPanel').classList.remove('hidden');$('destInput').value=$('to').value||''}
function choose(x){$('to').value=x;$('destInput').value=x;showRides()}
function showRides(){if(!$('destInput').value.trim()){toast('Choose a destination first');return}hide();$('ridePanel').classList.remove('hidden');renderRides()}
function renderRides(){const r=[['VASI Go',8.5,'🚗','4 min · Everyday rides'],['VASI Comfort',11.9,'🚘','6 min · More comfort'],['VASI XL',16.9,'🚐','8 min · Groups & luggage'],['VASI Premium',25.9,'⭐','5 min · Premium service']];$('rideList').innerHTML=r.map((x,i)=>`<button class="ride ${x[0]===selected.name?'sel':''}" onclick="selectRide(this,'${x[0]}',${x[1]})"><span class="car">${x[2]}</span><span><b>${x[0]}</b><small>${x[3]}</small></span><span class="price">€${x[1].toFixed(2)}</span></button>`).join('');if(!r.some(x=>x[0]===selected.name)){selected={name:'VASI Go',price:8.5}}updateConfirm()}
function selectRide(e,n,p){document.querySelectorAll('.ride').forEach(x=>x.classList.remove('sel'));e.classList.add('sel');selected={name:n,price:p};updateConfirm()}
function updateConfirm(){$('confirmBtn').textContent=`Choose ${selected.name} · €${selected.price.toFixed(2)}`}
function payment(e,n){document.querySelectorAll('.pay').forEach(x=>x.classList.remove('sel'));e.classList.add('sel');pay=n;toast(n==='google_pay'?'Google Pay selected':n==='apple_pay'?'Apple Pay selected':n==='card'?'Card selected':'Cash selected')}
function addStop(){if(stops>=2){toast('Maximum 2 stops');return}stops++;toast('Stop '+stops+' added')}
function passenger(){modal('<h2>Ride for someone else</h2><p>Enter the passenger details and VASI will keep the booking information together.</p><input class="field" placeholder="Passenger name"><input class="field" placeholder="Mobile number"><button class="cta" onclick="closeModal();toast(\'Passenger saved\')">Continue</button>')}
function reserve(){modal('<h2>Reserve your VASI</h2><p>Schedule your pickup in advance.</p><input class="field" type="date"><input class="field" type="time"><input class="field" placeholder="Destination"><button class="cta" onclick="closeModal();toast(\'Reservation saved\')">Reserve ride</button>')}
function shareTrip(){const text='VASI trip · '+($('destInput')?.value||'Trip details');if(navigator.share)navigator.share({title:'VASI trip',text}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>toast('Trip details copied'));else toast('Trip sharing ready')}
function confirmRide(){if(!$('destInput').value.trim()){toast('Choose a destination first');return}try{if(window.parent!==window.parent.parent&&window.parent.vasiBackend?.requestRide){window.parent.vasiBackend.requestRide();return}}catch(e){}try{if(window.parent?.vasiBackend?.requestRide){window.parent.vasiBackend.requestRide();return}}catch(e){}modal(`<h2>Confirm VASI ride</h2><p><b>${selected.name}</b><br>Destination: ${$('destInput').value}<br>Payment: ${pay.replace('_',' ')}<br>Estimated fare: <b>€${selected.price.toFixed(2)}</b></p><button class="cta" onclick="closeModal();toast('VASI ride requested')">Confirm & request ride</button>`)}
function account(){hide();$('accountScreen').classList.add('show');$('nav').classList.remove('hidden');nav(3)}
function services(){hide();$('nav').classList.remove('hidden');nav(1);modal('<h2>VASI Services</h2><p>🚗 <b>VASI Go</b> — everyday VTC<br>🚘 <b>VASI Comfort</b> — extra comfort<br>🚐 <b>VASI XL</b> — groups & luggage<br>⭐ <b>VASI Premium</b> — premium service<br>📦 <b>VASI Courier</b> — deliveries<br>✈️ <b>Airport rides</b> — planned transfers</p>')}
function activity(){hide();$('nav').classList.remove('hidden');nav(2);modal('<h2>Activity</h2><div class="status"><span>◷</span><div><b>Your VASI trips</b><small>Completed and cancelled rides will appear here.</small></div></div>')}
function wallet(){modal('<h2>Wallet & payments</h2><p>Choose how you want to pay for your VASI rides.</p><div class="status"><span>💶</span><div><b>Cash</b><small>Pay after the ride</small></div></div><div class="status"><span>💳</span><div><b>Card</b><small>Secure checkout</small></div></div><div class="status"><span></span><div><b>Apple Pay</b><small>Fast checkout</small></div></div>')}
function safety(){modal('<h2>VASI Safety Center</h2><p>Designed for safer VTC journeys.</p><div class="status"><span>🚨</span><div><b>Emergency 112</b><small>Call emergency services when needed.</small></div></div><div class="status"><span>📍</span><div><b>Live trip sharing</b><small>Share your journey with a trusted person.</small></div></div><div class="status"><span>🔢</span><div><b>Pickup PIN</b><small>Confirm the right driver before entering.</small></div></div><button class="cta" onclick="closeModal();location.href='tel:112'">Emergency · 112</button>')}
function driver(){modal('<h2>Drive with VASI</h2><p>VTC driver onboarding for France and Europe.</p><input class="field" placeholder="Vehicle registration"><input class="field" placeholder="VTC licence / card number"><button class="cta" onclick="closeModal();toast(\'Driver application saved\')">Continue</button>')}
function settings(){modal(`<h2>Settings</h2><p>Language</p><select class="field" onchange="setLang(this.value)"><option value="fr">🇫🇷 Français</option><option value="en">🇬🇧 English</option><option value="ta">🇹🇦 தமிழ்</option><option value="de">🇩🇪 Deutsch</option><option value="nl">🇳🇱 Nederlands</option><option value="es">🇪🇸 Español</option><option value="it">🇮🇹 Italiano</option><option value="pt">🇵🇹 Português</option></select><button class="cta" onclick="closeModal()">Done</button>`);document.querySelector('#modal select').value=lang}
function setLang(v){lang=v;localStorage.vasiLang=v;document.querySelector('#to').placeholder=T[v]?.where||T.en.where;document.querySelector('#destInput').placeholder=T[v]?.where||T.en.where;closeModal();toast('Language changed')}
function modal(h){$('modalBody').innerHTML=h;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
function useCurrentLocation(){try{if(window.parent?.vasiUseGoogleLocation){window.parent.vasiUseGoogleLocation();return}}catch(e){}try{if(window.parent?.vasiGoogleUseLocation){window.parent.vasiGoogleUseLocation();return}}catch(e){}if(navigator.geolocation)navigator.geolocation.getCurrentPosition(()=>toast('Location found'),()=>toast('Location permission needed'),{enableHighAccuracy:true,timeout:10000});else toast('Location unavailable')}
setLang(lang);
</script>
</body></html>
