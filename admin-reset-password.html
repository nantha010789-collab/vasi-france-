<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#111827">
  <title>Nouveau mot de passe Admin — VASI</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;background:#f4f6f8;color:#101828}*{box-sizing:border-box}body{margin:0}.wrap{max-width:500px;margin:auto;min-height:100vh;padding:24px 18px;display:flex;align-items:center}.card{width:100%;background:#fff;border:1px solid #e4e7ec;border-radius:22px;padding:28px;box-shadow:0 20px 60px #10182812}.brand{font-size:30px;font-weight:950}.eyebrow{color:#667085;text-transform:uppercase;letter-spacing:1.5px;font-size:11px;margin-top:7px}h1{margin:28px 0 6px;font-size:28px}.intro{color:#667085;line-height:1.5}.field{width:100%;min-height:50px;margin-top:11px;background:#fff;border:1px solid #d0d5dd;color:#101828;border-radius:12px;padding:13px;font-size:16px;outline:none}.field:focus{border-color:#175cd3;box-shadow:0 0 0 3px #84adff55}.btn{width:100%;min-height:50px;margin-top:13px;border:0;border-radius:12px;padding:13px;background:#111827;color:#fff;font-weight:800;font-size:16px;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.msg{min-height:20px;color:#b42318;font-size:13px;margin-top:10px;line-height:1.45}.msg.ok{color:#027a48}.secure{margin-top:18px;padding:12px;border-radius:12px;background:#f9fafb;color:#667085;font-size:12px;line-height:1.5}.hidden{display:none}label{display:block;margin-top:12px;font-size:14px;font-weight:700}a{color:#175cd3;font-weight:750}
  </style>
</head>
<body>
  <main class="wrap"><section class="card">
    <div class="brand">VASI</div><div class="eyebrow">Centre d’opérations sécurisé</div>
    <h1>Nouveau mot de passe</h1>
    <p id="intro" class="intro">Vérification du lien sécurisé en cours…</p>
    <div id="resetFields" class="hidden">
      <label>Nouveau mot de passe<input id="password" class="field" type="password" autocomplete="new-password" minlength="12"></label>
      <label>Confirmer le mot de passe<input id="confirm" class="field" type="password" autocomplete="new-password" minlength="12"></label>
      <button id="submit" class="btn" type="button">Enregistrer le nouveau mot de passe</button>
    </div>
    <div id="msg" class="msg" role="alert"></div>
    <div id="loginLink" class="hidden"><a href="admin-login.html">Retour à la connexion administrateur</a></div>
    <div class="secure">🔐 Utilisez au moins 12 caractères et un mot de passe unique, réservé à votre compte administrateur VASI.</div>
  </section></main>
  <script>if(location.hostname.endsWith('.github.io'))location.replace('https://vasi-new.vercel.app/admin-reset-password.html'+location.hash);</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"></script>
  <script src="./vasi-account-role.js?v=2"></script>
  <script>
    const db=supabase.createClient('https://vhfyvkrvysrooaqzcxsp.supabase.co','sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT'),$=id=>document.getElementById(id);
    const hashParams=new URLSearchParams(location.hash.slice(1));
    const isRecoveryLink=hashParams.get('type')==='recovery';
    let recoveryReady=false,checkFinished=false;
    function allowReset(){
      if(recoveryReady)return;recoveryReady=true;checkFinished=true;
      $('intro').textContent='Choisissez un nouveau mot de passe pour votre compte administrateur.';$('resetFields').classList.remove('hidden');$('msg').textContent='';
    }
    function rejectReset(){
      if(recoveryReady||checkFinished)return;checkFinished=true;
      $('intro').textContent='Ce lien est invalide ou a expiré.';$('msg').textContent='Demandez un nouveau lien depuis la page de connexion administrateur.';$('loginLink').classList.remove('hidden');
    }
    db.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session)allowReset()});
    setTimeout(async()=>{
      if(recoveryReady)return;
      const {data:{session}}=await db.auth.getSession();
      if(isRecoveryLink&&session)allowReset();else rejectReset();
    },1400);
    async function updatePassword(){
      if(!recoveryReady)return rejectReset();
      const password=$('password').value,confirm=$('confirm').value,button=$('submit');
      if(password.length<12){$('msg').textContent='Le mot de passe doit contenir au moins 12 caractères.';return}
      if(password!==confirm){$('msg').textContent='Les deux mots de passe ne correspondent pas.';return}
      button.disabled=true;$('msg').textContent='Enregistrement sécurisé…';
      const {error}=await db.auth.updateUser({password});
      if(error){$('msg').textContent='Impossible de modifier le mot de passe. Demandez un nouveau lien et réessayez.';button.disabled=false;return}
      await db.auth.signOut({scope:'local'});VasiAccountRole.clear();
      $('resetFields').classList.add('hidden');$('intro').textContent='Votre mot de passe a été modifié.';$('msg').textContent='Vous pouvez maintenant vous connecter avec votre nouveau mot de passe.';$('msg').classList.add('ok');$('loginLink').classList.remove('hidden');
    }
    $('submit').addEventListener('click',updatePassword);$('confirm').addEventListener('keydown',event=>{if(event.key==='Enter')updatePassword()});
  </script>
</body>
</html>
