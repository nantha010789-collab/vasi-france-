<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Aperçu mobile · VASI Driver</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#070e1b;color:#edf4ff;font:15px/1.45 system-ui;min-height:100dvh}
    header{max-width:820px;margin:auto;padding:20px 16px 12px}h1{margin:0;font-size:24px}p{margin:8px 0;color:#b3bed0}a{color:#c5d9ff}
    .sizes{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.sizes button{min-height:44px;padding:10px 14px;border:1px solid #405676;border-radius:12px;background:#122039;color:#fff;font:inherit;cursor:pointer}.sizes button[aria-pressed="true"]{background:#1557ff;border-color:#82aaff}
    .device{width:min(100%,390px);margin:8px auto 24px;border:1px solid #34455e;border-radius:20px;overflow:hidden;background:#070e1b;transition:width .15s}
    iframe{display:block;width:100%;height:844px;max-height:90dvh;border:0}
    @media(prefers-reduced-motion:reduce){.device{transition:none}}
  </style>
</head>
<body>
  <header><h1>Aperçu mobile VASI Driver</h1><p>Démo interactive · données simulées · aucun compte ni paiement réel.</p><a href="./driver-home.html">Retour à VASI Driver</a><div class="sizes" aria-label="Largeur de l’aperçu"><button type="button" data-width="320" aria-pressed="false">320 px</button><button type="button" data-width="390" aria-pressed="true">390 px</button><button type="button" data-width="430" aria-pressed="false">430 px</button><button type="button" data-width="768" aria-pressed="false">Tablette</button></div></header>
  <main class="device" id="device"><iframe src="./driver-preview.html" title="Démo VASI Driver au format mobile"></iframe></main>
  <script>
    document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{
      document.getElementById('device').style.width=`min(100%,${Number(button.dataset.width)}px)`;
      document.querySelectorAll('[data-width]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
    }));
  </script>
</body>
</html>
