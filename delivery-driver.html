<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <title>VASI Courier</title>
    <style>
      :root {
        font-family: Inter, system-ui, sans-serif;
        color: #fff;
        background: #050505;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #050505;
      }
      .wrap {
        max-width: 700px;
        margin: auto;
        padding: 18px;
      }
      .top,
      .online {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .brand {
        font-size: 30px;
        font-weight: 950;
      }
      .badge {
        background: #222;
        border-radius: 999px;
        padding: 8px 11px;
        color: #bbb;
        font-size: 11px;
      }
      .card {
        background: #111;
        border: 1px solid #292929;
        border-radius: 22px;
        padding: 16px;
        margin-top: 12px;
      }
      .toggle {
        display: flex;
        gap: 7px;
      }
      .btn {
        flex: 1;
        border: 1px solid #333;
        background: #181818;
        color: #fff;
        border-radius: 14px;
        padding: 13px;
        font-weight: 800;
      }
      .btn.active,
      .accept {
        background: #fff;
        color: #050505;
      }
      .navigate {
        display: block;
        width: 100%;
        margin-top: 9px;
        padding: 12px;
        border: 1px solid #3d3d3d;
        border-radius: 13px;
        background: #202020;
        color: #fff;
        font-weight: 850;
        text-align: center;
        text-decoration: none;
      }
      .home {
        flex: none;
        text-decoration: none;
      }
      .job {
        border: 1px solid #292929;
        background: #151515;
        border-radius: 17px;
        padding: 14px;
        margin-top: 9px;
      }
      .job b {
        display: block;
        font-size: 16px;
      }
      .job small {
        display: block;
        color: #999;
        margin-top: 5px;
        line-height: 1.5;
      }
      .accept {
        margin-top: 10px;
        width: 100%;
        padding: 12px;
        border: 0;
        border-radius: 13px;
        font-weight: 900;
      }
      .status {
        color: #999;
        font-size: 13px;
        line-height: 1.5;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #777;
        display: inline-block;
        margin-right: 7px;
      }
      .green {
        background: #7dff9b;
      }
      .money {
        color: #7dff9b;
        font-size: 22px;
        font-weight: 950;
        margin: 8px 0 2px;
      }
      .protect {
        border: 1px solid #285f37;
        background: #102116;
        color: #b9ffc9;
        border-radius: 12px;
        padding: 10px;
        margin-top: 10px;
        font-size: 12px;
        line-height: 1.45;
      }
    </style>
    <link rel="stylesheet" href="./vasi-mobile-fit.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="top">
        <div class="brand">VASI</div>
        <div><a class="btn home" href="support.html">Support</a> <a class="btn home" href="index.html">Home</a></div>
      </header>
      <section class="card">
        <span class="badge">🛵 COURIER · EATS + DELIVERY</span>
        <p id="profile" class="status">Checking courier account…</p>
      </section>
      <section class="card online">
        <div>
          <b>Courier status</b>
          <div class="status">
            <span id="dot" class="dot"></span><span id="state">Offline</span>
          </div>
        </div>
        <button id="onlineBtn" class="btn" onclick="toggleOnline()">
          Go online
        </button>
      </section>
      <section class="card">
        <b>Payments &amp; RIB</b>
        <p id="payoutStatus" class="status">Checking payout account…</p>
        <button id="payoutBtn" class="btn" onclick="openPayoutSetup()" hidden>
          Connect my RIB
        </button>
        <p id="earnings" class="status"></p>
      </section>
      <section class="card">
        <div class="toggle">
          <button id="eatsBtn" class="btn active" onclick="setTab('eats')">
            🍔 Eats</button
          ><button id="deliveryBtn" class="btn" onclick="setTab('delivery')">
            📦 Delivery
          </button>
        </div>
        <div id="jobs" class="status" style="margin-top: 12px">
          Go online to see courier jobs.
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./vasi-notifications.js"></script>
    <script>
      const client = supabase.createClient(
          "https://vhfyvkrvysrooaqzcxsp.supabase.co",
          "sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT",
        ),
        ENDPOINT =
          "https://vhfyvkrvysrooaqzcxsp.supabase.co/functions/v1/delivery-driver-service";
      let online = false,
        tab = "eats",
        activeJob = null,
        courierProfile = null;
      const $ = (id) => document.getElementById(id),
        esc = (value) =>
          String(value ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
      async function service(body) {
        const {
          data: { session },
        } = await client.auth.getSession();
        if (!session) {
          localStorage.setItem("vasi_role", "courier");
          location.href = "auth.html?role=courier";
          return { error: "Login required" };
        }
        try {
          const response = await fetch(ENDPOINT, {
              method: "POST",
              headers: {
                Authorization: "Bearer " + session.access_token,
                "Content-Type": "application/json",
              },
              body: JSON.stringify(body),
            }),
            data = await response.json();
          if (!response.ok)
            return { error: data.error || "Courier service unavailable" };
          return data;
        } catch (error) {
          return { error: error.message || "Courier service unavailable" };
        }
      }
      async function loadProfile() {
        const data = await service({ action: "get_profile" });
        if (data.error) return ($("profile").textContent = data.error);
        const profile = data.driver || data.courier || {};
        courierProfile = profile;
        online = !!profile.online;
        $("profile").textContent =
          (profile.full_name || "VASI Courier") +
          (profile.verified ? " · ✓ Verified" : " · Verification pending");
        $("state").textContent = online ? "Online" : "Offline";
        $("dot").classList.toggle("green", online);
        $("onlineBtn").textContent = online ? "Go offline" : "Go online";
        const paid = (data.earnings || [])
          .filter((item) => item.status === "paid")
          .reduce((sum, item) => sum + Number(item.amount || 0), 0);
        $("earnings").textContent = paid
          ? `Recent Eats earnings paid: €${paid.toFixed(2)}`
          : "Your completed Eats earnings will appear here.";
        await loadPayoutStatus();
        await loadJobs();
      }
      async function payoutRequest(create = false) {
        return service({
          action: create ? "create_payout_onboarding" : "get_payout_account",
        });
      }
      async function loadPayoutStatus() {
        const button = $("payoutBtn");
        if (!courierProfile?.verified) {
          $("payoutStatus").textContent = "RIB setup becomes available after courier approval.";
          button.hidden = true;
          return;
        }
        const data = await payoutRequest();
        if (data.error) {
          $("payoutStatus").textContent = data.error;
          button.hidden = false;
          return;
        }
        if (data.payouts_enabled) {
          $("payoutStatus").textContent = "✓ RIB verified · earnings are released after the delivery PIN.";
          button.hidden = true;
        } else {
          $("payoutStatus").textContent = data.details_submitted
            ? "Stripe is checking your payout information."
            : "Connect and verify your RIB before your first delivery.";
          button.textContent = data.connected ? "Continue RIB verification" : "Connect my RIB";
          button.hidden = false;
        }
      }
      async function openPayoutSetup() {
        const button = $("payoutBtn");
        button.disabled = true;
        const data = await payoutRequest(true);
        button.disabled = false;
        if (data.error) return alert(data.error);
        if (data.url) location.href = data.url;
      }
      async function toggleOnline() {
        const requested = !online,
          data = await service({ action: "set_online", online: requested });
        if (data.error) return ($("jobs").textContent = data.error);
        online = requested;
        $("state").textContent = online ? "Online" : "Offline";
        $("dot").classList.toggle("green", online);
        $("onlineBtn").textContent = online ? "Go offline" : "Go online";
        loadJobs();
      }
      function setTab(next) {
        tab = next;
        $("eatsBtn").classList.toggle("active", next === "eats");
        $("deliveryBtn").classList.toggle("active", next === "delivery");
        loadJobs();
      }
      function mapUrl(destination) {
        return "https://www.google.com/maps/dir/?api=1&destination=" +
          encodeURIComponent(String(destination || ""));
      }
      async function loadJobs() {
        const current = await service({ action: "get_current_jobs" });
        if (!current.error && (current.eat || current.delivery)) {
          activeJob = current.eat
            ? { type: "eats", job: current.eat }
            : { type: "delivery", job: current.delivery };
          renderActiveJob();
          return;
        }
        activeJob = null;
        if (!online)
          return ($("jobs").textContent = "Go online to see courier jobs.");
        const data = await service({ action: "get_available_jobs" });
        if (data.error) return ($("jobs").textContent = data.error);
        if (data.active_job) {
          activeJob = data.active_job;
          renderActiveJob();
          return;
        }
        const jobs = tab === "eats" ? data.eats || [] : data.deliveries || [];
        if (!jobs.length)
          return ($("jobs").textContent =
            "No " +
            (tab === "eats" ? "Eats" : "Delivery") +
            " jobs right now.");
        $("jobs").innerHTML = jobs
          .map((job) =>
            tab === "eats"
              ? `<article class="job"><b>🍔 ${esc(job.restaurant_name || "Restaurant")}</b><div class="money">You earn €${Number(job.courier_offer_amount || 0).toFixed(2)}</div><small>Deliver to: ${esc(job.delivery_address || "—")} · ${Number(job.delivery_distance_km || 0).toFixed(1)} km · about ${Math.round(Number(job.estimated_delivery_minutes || 0))} min</small><div class="protect">VASI protection: minimum €4 per delivery and €20/hour based on the estimated active time. You see the guaranteed offer before accepting.</div><button class="accept" data-id="${esc(job.id)}" data-type="eats">Accept · €${Number(job.courier_offer_amount || 0).toFixed(2)}</button></article>`
              : `<article class="job"><b>📦 ${esc(job.item_type || "Parcel")}</b><small>${esc(job.pickup_address || "Pickup")} → ${esc(job.dropoff_address || "Drop-off")} · €${esc(job.quote ?? "—")}</small><button class="accept" data-id="${esc(job.id)}" data-type="delivery">Accept Delivery</button></article>`,
          )
          .join("");
      }
      function renderActiveJob() {
        if (!activeJob) return;
        const { type, job } = activeJob,
          isEats = type === "eats",
          pickedUp = job.status === "picked_up";
        $("jobs").innerHTML = isEats
          ? `<article class="job"><span class="badge">ACTIVE EATS · #${esc(String(job.id||'').slice(0,8).toUpperCase())}</span><b>🍔 ${esc(job.restaurant_name || "Restaurant")}</b><div class="money">Your earning €${Number(job.courier_offer_amount || 0).toFixed(2)}</div><small>Deliver to: ${esc(job.delivery_address || "—")} · ${Number(job.delivery_distance_km || 0).toFixed(1)} km · about ${Math.round(Number(job.estimated_delivery_minutes || 0))} min</small>${pickedUp ? '<small>Ask the customer for the 4-digit delivery PIN only when handing over the food.</small>' : ""}<a class="navigate" href="${esc(mapUrl(pickedUp?job.delivery_address:job.restaurant_name))}" target="_blank" rel="noopener">🧭 ${pickedUp?'Navigate to customer':'Navigate to restaurant'}</a><button class="accept" data-job-action="${pickedUp ? "delivered" : "picked_up"}" data-id="${esc(job.id)}" data-type="eats">${pickedUp ? "Enter PIN · Complete delivery" : "Food picked up"}</button></article>`
          : `<article class="job"><span class="badge">ACTIVE DELIVERY · #${esc(String(job.id||'').slice(0,8).toUpperCase())}</span><b>📦 ${esc(job.item_type || "Parcel")}</b><small>${esc(job.pickup_address || "Pickup")} → ${esc(job.dropoff_address || "Drop-off")} · €${esc(job.quote ?? "—")}</small><a class="navigate" href="${esc(mapUrl(pickedUp?job.dropoff_address:job.pickup_address))}" target="_blank" rel="noopener">🧭 ${pickedUp?'Navigate to drop-off':'Navigate to pickup'}</a><button class="accept" data-job-action="${pickedUp ? "delivered" : "picked_up"}" data-id="${esc(job.id)}" data-type="delivery">${pickedUp ? "Complete delivery" : "Parcel picked up"}</button></article>`;
      }
      async function acceptJob(id, type) {
        const data = await service({
          action: type === "eats" ? "accept_eats" : "accept_delivery",
          order_id: id,
        });
        if (data.error) return ($("jobs").textContent = data.error);
        online = false;
        $("state").textContent = "Active job";
        $("dot").classList.remove("green");
        $("onlineBtn").textContent = "Go online";
        activeJob = {
          type,
          job: type === "eats" ? data.eat : data.delivery,
        };
        renderActiveJob();
      }
      async function updateJob(id, type, status) {
        let pin = null;
        if (type === "eats" && status === "delivered") {
          pin = String(prompt("Enter the customer's 4-digit Eats delivery PIN") || "").trim();
          if (!pin) return;
          if (!/^\d{4}$/.test(pin)) return alert("Enter the 4-digit delivery PIN");
        }
        const data = await service({
          action: type === "eats" ? "update_eats" : "update_delivery",
          order_id: id,
          status,
          pin,
        });
        if (data.error) return alert(data.error);
        if (status === "delivered") {
          activeJob = null;
          $("state").textContent = "Offline";
          const payoutMessage = data.payout?.status === "paid"
            ? ` €${Number(data.payout.amount || 0).toFixed(2)} released to your Stripe balance.`
            : data.payout?.message ? ` ${data.payout.message}.` : "";
          $("jobs").textContent = "✓ Delivery completed." + payoutMessage + " Go online for another job.";
          loadProfile();
          return;
        }
        activeJob.job = type === "eats" ? data.eat : data.delivery;
        renderActiveJob();
      }
      $("jobs").addEventListener("click", (event) => {
        const button = event.target.closest("button[data-id]");
        if (!button) return;
        if (button.dataset.jobAction)
          updateJob(
            button.dataset.id,
            button.dataset.type,
            button.dataset.jobAction,
          );
        else acceptJob(button.dataset.id, button.dataset.type);
      });
      client.auth.getSession().then(({ data: { session } }) => {
        if (!session) {
          localStorage.setItem("vasi_role", "courier");
          location.href = "auth.html?role=courier";
          return;
        }
        loadProfile();
      });
      setInterval(loadJobs, 10000);
      VasiNotifications.start(client, { role: "courier" });
    </script>
  <script src="./vasi-languages.js"></script></body>
</html>
