<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>VASI Driver</title><style>:root{font-family:Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#fff;background:#050505}*{box-sizing:border-box}body{margin:0;background:#050505}.wrap{max-width:700px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:30px;font-weight:950}.badge{background:#222;border-radius:999px;padding:8px 11px;color:#bbb;font-size:11px}.card{background:#111;border:1px solid #292929;border-radius:22px;padding:16px;margin-top:12px}.btn{border:1px solid #333;background:#181818;color:#fff;border-radius:14px;padding:13px;font-weight:800}.active{background:#fff;color:#050505}.online{display:flex;align-items:center;justify-content:space-between;gap:12px}.online .btn{min-width:130px}.dot{width:9px;height:9px;border-radius:50%;background:#777;display:inline-block;margin-right:7px}.green{background:#7dff9b}.status{color:#999;font-size:13px}.profile{font-size:12px;color:#999}.profile b{color:#fff}.offer{border:1px solid #444;border-radius:20px;padding:16px;background:#171717}.row{display:flex;justify-content:space-between;gap:10px;margin:10px 0}.muted{color:#999;font-size:12px}.fare{font-size:28px;font-weight:950}.stop{padding:9px;border:1px solid #333;border-radius:12px;margin-top:6px;color:#ddd;font-size:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.actions .btn{width:100%}.accept{background:#fff;color:#050505}.rideState{font-size:15px;font-weight:900}.hidden{display:none!important}.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:12px 0}.progress span{height:5px;border-radius:8px;background:#333}.progress span.done{background:#fff}</style></head><body><main class="wrap"><header class="top"><div class="brand">VASI</div><span class="badge">🚗 DRIVER</span></header><section class="card"><div class="profile" id="profile">Checking driver verification…</div></section><section class="card online"><div><b>Driver status</b><div class="status"><span id="dot" class="dot"></span><span id="state">Offline</span></div></div><button id="onlineBtn" class="btn" onclick="toggleOnline()">Go online</button></section><section id="offerCard" class="card hidden"><div class="offer"><div class="row"><div><div class="muted">NEW VASI RIDE OFFER</div><h2 id="service">VASI Ride</h2></div><div id="fare" class="fare">€—</div></div><div><div class="muted">PICKUP</div><strong id="pickup">—</strong></div><div class="row"><div><div class="muted">DESTINATION</div><strong id="destination">—</strong></div></div><div id="stops"></div><div class="row"><span class="muted">Pickup time</span><strong id="pickupTime">Now</strong></div><div class="row"><span class="muted">Distance / ETA</span><strong id="eta">—</strong></div><div class="actions"><button class="btn" onclick="offerAction('decline')">Decline</button><button class="btn accept" onclick="offerAction('accept')">Accept ride</button></div></div></section><section id="activeCard" class="card hidden"><div class="muted">ACTIVE VASI RIDE</div><h2 id="activeTitle">Ride</h2><div class="progress" id="progress"><span></span><span></span><span></span><span></span><span></span></div><p id="activeState" class="rideState">Accepted</p><p id="activeRoute" class="muted"></p><button id="nextBtn" class="btn accept" style="width:100%" onclick="advanceRide()">Start arriving</button></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const client=supabase.createClient('https://vhfyvkrvysrooaqzcxsp.supabase.co','sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT');const ENDPOINT='https://vhfyvkrvysrooaqzcxsp.supabase.co/functions/v1/delivery-driver-service';let online=false,offer=null,ride=null,poll=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function session(){return(await client.auth.getSession()).data.session}async function service(body){const s=await session();if(!s){location.href='auth.html';return {error:'Login required'}}const r=await fetch(ENDPOINT,{method:'POST',headers:{Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify(body)});return r.json()}async function loadProfile(){const d=await service({action:'get_profile'});if(d.error)return $('profile').textContent=d.error;const p=d.driver||{};$('profile').innerHTML=`<b>${esc(p.full_name||'VASI Driver')}</b> · ${p.verified?'✓ Verified':'Pending verification'}`}async function toggleOnline(){online=!online;const d=await service({action:'set_online',online});if(d.error){online=!online;$('state').textContent=d.error;return}$('state').textContent=online?'Online · searching for ride offers':'Offline';$('dot').classList.toggle('green',online);$('onlineBtn').textContent=online?'Go offline':'Go online';if(online){startPolling()}else{clearInterval(poll);$('offerCard').classList.add('hidden')}}function startPolling(){clearInterval(poll);poll=setInterval(checkOffers,4000);checkOffers()}async function checkOffers(){if(!online||ride)return;try{const d=await service({action:'get_ride_offers'});const o=d.offer||d.offers?.[0];if(o){offer=o;renderOffer(o)}}catch(e){}}function renderOffer(o){$('offerCard').classList.remove('hidden');$('service').textContent=o.service||'VASI Ride';$('fare').textContent=o.estimated_fare!=null?'€'+Number(o.estimated_fare).toFixed(2):'€—';$('pickup').textContent=o.pickup_address||'Pickup location';$('destination').textContent=o.destination_address||'Destination';$('pickupTime').textContent=o.scheduled_for?new Date(o.scheduled_for).toLocaleString():'Now';$('eta').textContent=o.eta_minutes!=null?o.eta_minutes+' min':'Nearby';$('stops').innerHTML=(o.stops||[]).map((s,i)=>`<div class="stop">📍 Stop ${i+1}: ${esc(typeof s==='string'?s:s.address)}</div>`).join('')}async function offerAction(action){if(!offer?.id)return;const d=await service({action:action==='accept'?'accept_ride':'decline_ride',ride_id:offer.id});if(d.error){$('state').textContent=d.error;return}if(action==='accept'){ride=d.ride||d;showActive(ride)}else{$('state').textContent='Offer declined · waiting for next ride'}offer=null;$('offerCard').classList.add('hidden')}function showActive(r){$('activeCard').classList.remove('hidden');$('activeTitle').textContent=r.service||'VASI Ride';$('activeRoute').textContent=(r.pickup_address||'Pickup')+' → '+(r.destination_address||'Destination');updateState(String(r.status||'accepted').toLowerCase())}const states=['accepted','driver_arriving','arrived','in_progress','completed'];const buttons={accepted:'Start arriving',driver_arriving:'Mark arrived',arrived:'Start trip',in_progress:'Complete trip',completed:'Completed'};function updateState(st){const i=Math.max(0,states.indexOf(st));$('activeState').textContent=st.replaceAll('_',' ');document.querySelectorAll('#progress span').forEach((x,n)=>x.classList.toggle('done',n<=i));$('nextBtn').textContent=buttons[st]||'Update status';$('nextBtn').disabled=st==='completed'}async function advanceRide(){if(!ride?.id)return;const s=await session();if(!s)return;const i=states.indexOf(String(ride.status||'accepted').toLowerCase());const next=states[Math.min(states.length-1,i+1)];const r=await fetch('/api/driver-ride-status?id='+encodeURIComponent(ride.id),{method:'POST',headers:{Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify({status:next})});if(!r.ok)return;$('activeState').textContent=next.replaceAll('_',' ');updateState(next);if(next==='completed'){ride=null;online=true;setTimeout(startPolling,1000)}}client.auth.getSession().then(({data:{session}})=>{if(!session)location.href='auth.html';else loadProfile()});</script></body></html>
