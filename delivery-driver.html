<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>VASI Courier</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#fff;background:#050505}*{box-sizing:border-box}body{margin:0;background:#050505}.wrap{max-width:700px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:30px;font-weight:950}.badge{background:#222;border-radius:999px;padding:8px 11px;color:#bbb;font-size:11px}.card{background:#111;border:1px solid #292929;border-radius:22px;padding:16px;margin-top:12px}.toggle{display:flex;gap:7px}.btn{flex:1;border:1px solid #333;background:#181818;color:#fff;border-radius:14px;padding:13px;font-weight:800}.active{background:#fff;color:#050505}.job{border:1px solid #292929;background:#151515;border-radius:17px;padding:14px;margin-top:9px}.job b{display:block;font-size:16px}.job small{display:block;color:#999;margin-top:5px}.accept{margin-top:10px;width:100%;padding:12px;border:0;border-radius:13px;background:#fff;color:#050505;font-weight:900}.status{color:#999;font-size:13px}.online{display:flex;align-items:center;justify-content:space-between}.dot{width:9px;height:9px;border-radius:50%;background:#777;display:inline-block;margin-right:7px}.green{background:#7dff9b}.vehicle{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.vehicle button{border:1px solid #333;background:#181818;color:#fff;border-radius:12px;padding:10px 4px;font-size:11px;font-weight:800}.vehicle button.active{background:#fff;color:#050505}.profile{font-size:12px;color:#999}.profile b{color:#fff}</style></head><body><main class="wrap"><header class="top"><div class="brand">VASI</div><span class="badge">🛵 COURIER</span></header><section class="card"><div class="profile" id="profile">Checking courier verification…</div><div class="vehicle"><button class="active" data-v="bike" onclick="setVehicle('bike')">🚲 Vélo</button><button data-v="scooter" onclick="setVehicle('scooter')">🛵 Scooter</button><button data-v="moto" onclick="setVehicle('moto')">🏍️ Moto</button><button data-v="car" onclick="setVehicle('car')">🚗 Car</button></div></section><section class="card online"><div><b>Courier online</b><div class="status"><span id="dot" class="dot"></span><span id="state">Offline</span></div></div><button id="onlineBtn" class="btn" onclick="toggleOnline()">Go online</button></section><section class="card"><div class="toggle"><button id="eatsBtn" class="btn active" onclick="setTab('eats')">🍔 Eats</button><button id="deliveryBtn" class="btn" onclick="setTab('delivery')">📦 Delivery</button></div><div id="jobs" class="status" style="margin-top:12px">Go online to see courier jobs.</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const client=supabase.createClient('https://vhfyvkrvysrooaqzcxsp.supabase.co','sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT');const ENDPOINT='https://vhfyvkrvysrooaqzcxsp.supabase.co/functions/v1/delivery-driver-service';let online=false,tab='eats',vehicle='bike';async function service(body){const {data:{session}}=await client.auth.getSession();if(!session){location.href='auth.html';return {error:'Login required'}}const r=await fetch(ENDPOINT,{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify(body)});return r.json()}async function loadProfile(){const d=await service({action:'get_profile'});if(d.error)return $('profile').textContent=d.error;const p=d.driver;$('profile').innerHTML=`<b>${p.full_name||'VASI Courier'}</b> · ${p.verified?'✓ Verified':'Pending verification'} · ${p.online?'Online':'Offline'}`;if(p.vehicle_type)setVehicle(p.vehicle_type)}async function toggleOnline(){online=!online;const d=await service({action:'set_online',online,vehicle_type:vehicle});if(d.error){online=!online;return $('jobs').textContent=d.error}$('state').textContent=online?'Online':'Offline';$('dot').classList.toggle('green',online);$('onlineBtn').textContent=online?'Go offline':'Go online';loadJobs()}function setVehicle(v){vehicle=v;document.querySelectorAll('.vehicle button').forEach(x=>x.classList.toggle('active',x.dataset.v===v));if(online)service({action:'set_vehicle',vehicle_type:v})}function setTab(t){tab=t;$('eatsBtn').classList.toggle('active',t==='eats');$('deliveryBtn').classList.toggle('active',t==='delivery');loadJobs()}async function loadJobs(){if(!online){$('jobs').textContent='Go online to see courier jobs.';return}const d=await service({action:'get_available_jobs'});if(d.error)return $('jobs').textContent=d.error;const arr=tab==='eats'?(d.eats||[]):(d.deliveries||[]);if(!arr.length){$('jobs').textContent='No '+(tab==='eats'?'Eats':'Delivery')+' jobs right now.';return}$('jobs').innerHTML=arr.map(j=>tab==='eats'?`<article class="job"><b>🍔 ${j.restaurant_name||'Restaurant'}</b><small>Deliver to: ${j.delivery_address||'—'} · €${j.total??'—'}</small><button class="accept" onclick="acceptJob('${j.id}','eats')">Accept Eats</button></article>`:`<article class="job"><b>📦 ${j.item_type||'Parcel'}</b><small>${j.pickup_address||'Pickup'} → ${j.dropoff_address||'Drop-off'} · €${j.quote??'—'}</small><button class="accept" onclick="acceptJob('${j.id}','delivery')">Accept Delivery</button></article>`).join('')}async function acceptJob(id,type){const d=await service({action:type==='eats'?'accept_eats':'accept_delivery',order_id:id});$('jobs').textContent=d.error||'✓ Job accepted.'}function $(id){return document.getElementById(id)}client.auth.getSession().then(({data:{session}})=>{if(!session)location.href='auth.html';else loadProfile()});setInterval(loadJobs,10000);</script></body></html>
