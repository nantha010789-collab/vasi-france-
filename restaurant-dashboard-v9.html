<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>VASI Restaurant</title><style>:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#fff;background:#050505;--line:#303030;--panel:#111;--muted:#a7a7a7;--green:#7be79a}*{box-sizing:border-box}body{margin:0;background:#050505}.wrap{width:min(100%,760px);margin:auto;padding:max(16px,env(safe-area-inset-top)) 14px calc(88px + env(safe-area-inset-bottom))}.top{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}.brand{text-align:center}.brand img{width:104px;max-width:28vw}.btn,input,textarea,select{font:inherit;border:1px solid #383838;background:#181818;color:#fff;border-radius:14px;padding:12px 14px}.btn{min-height:46px;font-weight:850;cursor:pointer}.primary{background:#fff;color:#050505;border-color:#fff}.card{margin-top:14px;padding:18px;border:1px solid var(--line);border-radius:24px;background:var(--panel)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:var(--muted);line-height:1.45}.badge{display:inline-flex;padding:7px 10px;border-radius:999px;background:#292929;font-size:12px;font-weight:850}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px}.stat{padding:14px;border:1px solid var(--line);border-radius:17px;background:#171717}.stat b{display:block;font-size:22px;margin-top:6px}.orders-link{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:16px;border-radius:18px;background:#fff;color:#050505;text-decoration:none;font-weight:950}.orders-link span:last-child{font-size:22px}.menu-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.search{width:100%;margin-top:12px}.menu-row{display:grid;grid-template-columns:72px minmax(0,1fr);gap:13px;align-items:center;padding:16px 0;border-top:1px solid var(--line)}.menu-row:first-child{border-top:0}.pic,.placeholder{width:72px;height:68px;border-radius:14px;object-fit:cover;border:1px solid #303030;background:#1c1c1c}.placeholder{display:grid;place-items:center;font-size:24px}.menu-actions{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}.menu-actions .btn{width:100%}.empty{text-align:center;padding:28px 10px;color:var(--muted)}.modal{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.72);z-index:30}.modal.open{display:flex}.sheet{width:min(100%,680px);max-height:92dvh;overflow:auto;background:#101010;border:1px solid #333;border-radius:24px 24px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom))}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px}.form label{font-size:13px;font-weight:750;color:#bbb}.form input,.form textarea,.form select{display:block;width:100%;margin-top:7px}.form textarea{min-height:90px}.full{grid-column:1/-1}.message{text-align:center;color:#bbb;min-height:22px}@media(max-width:560px){.top{grid-template-columns:auto 1fr}.top>#signOut{grid-column:1/-1;width:100%}.stats{grid-template-columns:1fr 1fr}.menu-head{flex-direction:column}.menu-head .btn{width:100%}.form{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main class="wrap"><header class="top"><button class="btn" onclick="history.length>1?history.back():location.href='index.html'">← Retour</button><div class="brand"><img src="./assets/vasi-logo.png" alt="VASI"></div><button class="btn" id="signOut">Déconnexion</button></header><div id="app"><section class="card"><p class="muted">Chargement…</p></section></div><p id="msg" class="message"></p></main><div id="editor" class="modal"><section class="sheet"><div class="row"><div><b id="title">Ajouter un article</b><div class="muted">Menu VASI</div></div><button class="btn" onclick="closeEditor()">Fermer</button></div><form id="itemForm" class="form" onsubmit="saveItem(event)"><label>Nom de l’article<input name="name" required></label><label>Catégorie<input name="category"></label><label>Prix<input name="price" type="number" min="0.5" max="500" step="0.01" required></label><label>Disponibilité<select name="active"><option value="true">Disponible</option><option value="false">Masqué</option></select></label><label class="full">Description<textarea name="description"></textarea></label><label class="full">Allergènes<input name="allergens"></label><label class="full">Photo<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><button class="btn primary full" type="submit">Enregistrer l’article</button></form></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"></script><script src="./vasi-region.js"></script><script>const U='https://vhfyvkrvysrooaqzcxsp.supabase.co',K='sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT';const client=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:localStorage}});let token='',data={},editing=null;const app=document.getElementById('app'),msg=document.getElementById('msg'),money=v=>VasiRegion.money(Number(v||0),VasiRegion.getRegion().code),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(body){const r=await fetch('/api/restaurant-partner',{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Service restaurant indisponible');return j}function menuRows(){const q=(document.getElementById('q')?.value||'').toLowerCase();const items=(data.menu||[]).filter(i=>[i.name,i.category,i.description].join(' ').toLowerCase().includes(q));if(!items.length)return '<div class="empty">Aucun article dans ce menu.</div>';return items.map(i=>`<div class="menu-row">${i.photo_url?`<img class="pic" src="${esc(i.photo_url)}" alt="">`:'<div class="placeholder">🍽️</div>'}<div><b>${esc(i.name)}</b><div class="muted">${esc(i.category||'Menu')} · ${money(i.price)} · ${i.active?'Disponible':'Masqué'}</div></div><div class="menu-actions"><button class="btn" onclick="openEditor('${i.id}')">Modifier</button><button class="btn" onclick="toggleItem('${i.id}',${!i.active})">${i.active?'Masquer':'Afficher'}</button></div></div>`).join('')}function render(){const r=data.restaurant,orders=data.orders||[],done=orders.filter(o=>o.status==='delivered'),sales=done.reduce((s,o)=>s+Number(o.total||0),0),pending=orders.filter(o=>o.status==='pending').length,active=orders.filter(o=>['accepted','preparing','ready_for_pickup','picked_up'].includes(o.status)).length;app.innerHTML=`<section class="card"><div class="row"><div><h1 style="margin:0 0 8px">${esc(r.name)}</h1><span class="badge">${r.status==='approved'?'Approuvé':esc(r.status)}</span></div><button class="btn" disabled>${r.is_open?'Ouvert':'Fermé'}</button></div><p class="muted">${esc(r.cuisine)} · ${r.delivery_mode==='own'?'Votre livraison':'Coursier VASI'} · 10 % de commission</p><div class="stats"><div class="stat"><span class="muted">Nouvelles</span><b>${pending}</b></div><div class="stat"><span class="muted">En cours</span><b>${active}</b></div><div class="stat"><span class="muted">Ventes</span><b>${money(sales)}</b></div><div class="stat"><span class="muted">Articles</span><b>${(data.menu||[]).length}</b></div></div><a class="orders-link" href="restaurant-orders.html"><span>Commandes</span><span>→</span></a></section><section class="card"><div class="menu-head"><div><h2 style="margin:0 0 6px">Menu</h2><p class="muted" style="margin:0">Articles, catégories, prix et disponibilité.</p></div><button class="btn primary" onclick="openEditor()">+ Ajouter un article</button></div><input id="q" class="search" placeholder="Rechercher un article…" oninput="document.getElementById('list').innerHTML=menuRows()"><div id="list">${menuRows()}</div></section>`}function openEditor(id){editing=(data.menu||[]).find(i=>i.id===id)||null;const f=document.getElementById('itemForm');f.reset();f.name.value=editing?.name||'';f.category.value=editing?.category||'';f.price.value=editing?.price||'';f.description.value=editing?.description||'';f.allergens.value=(editing?.allergens||[]).join(', ');f.active.value=String(editing?.active!==false);document.getElementById('title').textContent=editing?'Modifier l’article':'Ajouter un article';document.getElementById('editor').classList.add('open')}function closeEditor(){document.getElementById('editor').classList.remove('open');editing=null}async function updateItem(body){const r=await fetch('/api/restaurant-menu-item',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Modification impossible');return j}async function saveItem(e){e.preventDefault();const b=Object.fromEntries(new FormData(e.target));msg.textContent='Enregistrement…';try{let item;if(editing)item=(await updateItem({id:editing.id,...b,active:b.active==='true'})).item;else item=(await api({action:'add_item',name:b.name,category:b.category,price:b.price,description:b.description,allergens:b.allergens})).item;const file=document.getElementById('photo').files?.[0],id=item?.id||editing?.id;if(file&&id){if(file.size>2*1024*1024)throw Error('La photo doit faire moins de 2 Mo.');const image=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)});await api({action:'submit_photo',id,image})}closeEditor();await load();msg.textContent='Article enregistré.'}catch(err){msg.textContent=err.message}}async function toggleItem(id,active){try{await api({action:'toggle_item',id,active});await load()}catch(e){msg.textContent=e.message}}async function load(){try{data=await api();if(!data.restaurant){location.replace('restaurant-register-form.html');return}render();msg.textContent=''}catch(e){msg.textContent=e.message}}document.getElementById('editor').onclick=e=>{if(e.target.id==='editor')closeEditor()};document.getElementById('signOut').onclick=async()=>{await client.auth.signOut();location.replace('index.html')};client.auth.getSession().then(async({data:{session}})=>{if(!session){localStorage.setItem('vasi_role','restaurant');localStorage.setItem('vasi_return','restaurant-dashboard.html');location.replace('auth.html?role=restaurant');return}token=session.access_token;await load()}).catch(e=>msg.textContent=e.message);</script></body></html>
