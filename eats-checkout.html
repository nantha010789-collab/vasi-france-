<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VASI Eats Checkout</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#fff;background:#050505}*{box-sizing:border-box}body{margin:0;background:#050505}.app{max-width:720px;margin:auto;padding:20px 18px 40px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:30px;font-weight:900}button,input{font:inherit}.back{border:1px solid #303030;background:#151515;color:#ddd;border-radius:12px;padding:9px 13px}.hero{padding:30px 0 18px}.hero h1{font-size:40px;margin:8px 0}.muted{color:#999}.panel{border:1px solid #292929;border-radius:22px;background:#111;padding:18px;margin-top:14px}.row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #222}.field{width:100%;padding:14px;border-radius:14px;border:1px solid #292929;background:#181818;color:#fff;margin-top:10px}.cta{width:100%;border:0;border-radius:16px;padding:16px;background:#fff;color:#050505;font-weight:800;margin-top:16px}.status{text-align:center;color:#aaa;min-height:22px}.success{font-weight:800;color:#fff}</style></head><body><main class="app"><header class="top"><div class="brand">VASI</div><button class="back" onclick="location.href='eats.html'">Back</button></header><section class="hero"><div class="muted">VASI Eats</div><h1>Checkout</h1><p class="muted">Review your order and delivery details.</p></section><section class="panel"><div class="row"><span>Restaurant</span><b id="restaurant">VASI Restaurant</b></div><div class="row"><span>Items</span><b id="items">1 item</b></div><div class="row"><span>Subtotal</span><b>€12.50</b></div><div class="row"><span>Delivery</span><b>€2.99</b></div><div class="row"><span>Total</span><b>€15.49</b></div><input class="field" id="address" placeholder="Delivery address"><button class="cta" onclick="placeOrder()">Place VASI order</button><p id="status" class="status"></p></section></main><script>const p=new URLSearchParams(location.search);if(p.get('restaurant'))document.getElementById('restaurant').textContent=p.get('restaurant');if(p.get('items'))document.getElementById('items').textContent=p.get('items')+' items';function placeOrder(){const a=document.getElementById('address').value.trim();if(!a){document.getElementById('status').textContent='Please enter a delivery address.';return}document.getElementById('status').innerHTML='<span class="success">Order placed successfully. VASI is preparing it.</span>'}</script></body></html>
