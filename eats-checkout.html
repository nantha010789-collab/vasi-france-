<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <title>VASI Eats Checkout</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      :root{font-family:Inter,system-ui,sans-serif;color:#fff;background:#050505}*{box-sizing:border-box}body{margin:0;background:#050505}.app{max-width:720px;margin:auto;padding:20px 18px 40px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:30px;font-weight:900;letter-spacing:-1px}.back{border:1px solid #303030;background:#151515;color:#ddd;border-radius:999px;padding:10px 15px;text-decoration:none;font-weight:750}.hero{padding:30px 0 18px}.hero h1{font-size:clamp(36px,10vw,46px);line-height:1;margin:8px 0}.muted{color:#999}.panel{border:1px solid #292929;border-radius:24px;background:#111;padding:18px;margin-top:14px}.row{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid #252525}.row b{text-align:right}.address-input{width:100%;padding:14px;border-radius:14px;border:1px solid #333;background:#181818;color:#fff;font:inherit}.address-section{margin-top:20px}.map{height:210px;margin:12px 0;border:1px solid #303030;border-radius:18px;overflow:hidden}.cta{width:100%;border:0;border-radius:16px;padding:16px;background:#fff;color:#050505;font-weight:850;margin-top:16px;cursor:pointer}.cta:disabled{cursor:not-allowed;opacity:.5}.status{text-align:center;color:#aaa;line-height:1.5;min-height:22px}.success{font-weight:850;color:#fff}.login{display:inline-block;margin-top:8px;color:#fff}@media(max-width:390px){.app{padding-inline:14px}.panel{padding:14px}}
    </style>
    <link rel="stylesheet" href="./vasi-mobile-fit.css" />
  </head>
  <body>
    <main class="app">
      <header class="top"><div class="brand" aria-label="VASI">VASI</div><a class="back" href="eats.html">Back</a></header>
      <section class="hero"><div class="muted">VASI Eats</div><h1>Checkout</h1><p class="muted">Review your basket and confirm the delivery pin before ordering.</p></section>
      <section class="panel" aria-labelledby="checkout-title">
        <h2 id="checkout-title" class="vasi-sr-only">Order summary</h2>
        <div class="row"><span>Restaurant</span><b id="restaurant">Loading…</b></div><div id="lines"></div>
        <div class="row"><span>Subtotal</span><b id="subtotal">—</b></div><div class="row"><span>Delivery</span><b id="delivery">—</b></div><div class="row"><span>Total</span><b id="total">—</b></div>
        <div class="address-section vasi-address-shell" id="addressShell">
          <label class="vasi-field-label" for="address"><span aria-hidden="true">📍</span> Delivery address</label>
          <input class="address-input" id="address" placeholder="Start typing your full delivery address" autocomplete="street-address" />
          <div class="vasi-address-suggestions" id="addressSuggestions" hidden></div><div class="vasi-address-confirmation" id="addressConfirmation" hidden></div>
          <p class="vasi-address-status" id="addressStatus" role="status" aria-live="polite"></p>
        </div>
        <div id="map" class="map" aria-label="Confirmed delivery location map" hidden></div>
        <button class="cta" id="orderBtn" type="button" onclick="placeOrder()" disabled>Place VASI order</button>
        <p id="status" class="status" role="status" aria-live="polite">Checking basket…</p>
      </section>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./vasi-notifications.js"></script><script src="./vasi-address-search.js"></script>
    <script>
      const client=supabase.createClient('https://vhfyvkrvysrooaqzcxsp.supabase.co','sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT');const el=id=>document.getElementById(id);const basket=JSON.parse(localStorage.getItem('vasi_eats_basket')||'{"restaurant_id":null,"items":{}}');const payload=()=>({restaurant_id:basket.restaurant_id,items:Object.entries(basket.items||{}).map(([id,quantity])=>({id,quantity}))});const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'EUR'}).format(Number(n));let basketReady=false,deliveryMap=null;
      const addressSearch=VasiAddressSearch.attach({input:'#address',suggestions:'#addressSuggestions',confirmation:'#addressConfirmation',status:'#addressStatus',onSelect:showPin});
      el('address').addEventListener('vasi:address-cleared',()=>{el('map').hidden=true;el('orderBtn').disabled=true;el('status').textContent='Choose an address from the suggestions to confirm the delivery pin.'});
      function api(path){return(location.hostname.endsWith('.github.io')?'https://vasi-new.vercel.app':'')+path}
      function showPin(place){el('map').hidden=false;if(!deliveryMap){deliveryMap=L.map('map',{zoomControl:false});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(deliveryMap)}deliveryMap.eachLayer(layer=>{if(!(layer instanceof L.TileLayer))deliveryMap.removeLayer(layer)});L.marker([place.lat,place.lng]).addTo(deliveryMap).bindPopup('Delivery address').openPopup();deliveryMap.setView([place.lat,place.lng],16);setTimeout(()=>deliveryMap.invalidateSize(),0);el('orderBtn').disabled=!basketReady;el('status').textContent='Delivery pin confirmed. You can place your order.'}
      async function price(){try{const response=await fetch(api('/api/eats-order'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload(),action:'quote'})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Could not price basket');el('restaurant').textContent=data.restaurant.name;el('lines').innerHTML=data.items.map(i=>`<div class="row"><span>${i.quantity} × ${i.name}</span><b>${money(i.line_total)}</b></div>`).join('');el('subtotal').textContent=money(data.subtotal);el('delivery').textContent=data.delivery_fee?money(data.delivery_fee):'FREE';el('total').textContent=money(data.total);basketReady=true;el('orderBtn').disabled=!addressSearch.isConfirmed();el('status').textContent='Choose an address from the suggestions to confirm the delivery pin.'}catch(error){el('status').textContent=error.message+' Return to the menu.'}}
      async function placeOrder(){const place=addressSearch.getValue(),button=el('orderBtn');if(!place){el('status').textContent='Choose an address from the suggestions and confirm its map pin.';return}button.disabled=true;el('status').textContent='Checking address and placing order…';try{const{data:{session}}=await client.auth.getSession();if(!session){localStorage.setItem('vasi_role','customer');localStorage.setItem('vasi_return','eats-checkout.html');el('status').innerHTML='Please login before ordering. <a class="login" href="auth.html?role=customer">Login</a>';button.disabled=false;return}const response=await fetch(api('/api/eats-order'),{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({...payload(),action:'book',delivery_address:place.label,delivery_place_id:place.place_id})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Could not place order');localStorage.removeItem('vasi_eats_basket');const pin=/^\d{4}$/.test(String(data.delivery_pin||''))?String(data.delivery_pin):'••••';el('status').innerHTML='<span class="success">Order placed successfully.</span><br><span class="muted">Order ID: '+String(data.order_id||'').slice(0,8).toUpperCase()+'</span><br><br><span class="muted">DELIVERY PIN</span><br><span style="font:900 38px ui-monospace;letter-spacing:8px;color:#fff">'+pin+'</span><br><span class="muted">Give this PIN to the courier only when your food arrives.</span><br><a class="login" href="activity.html?filter=eats">View Eats activity</a>';button.textContent='Order placed'}catch(error){el('status').textContent=error.message;button.disabled=false}}
      price();VasiNotifications.start(client,{role:'customer'});
    </script><script src="./vasi-languages.js"></script>
  </body>
</html>
