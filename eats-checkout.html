<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VASI Eats Checkout</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#fff;background:#050505}*{box-sizing:border-box}body{margin:0;background:#050505}.app{max-width:720px;margin:auto;padding:20px 18px 40px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:30px;font-weight:900}button,input{font:inherit}.back{border:1px solid #303030;background:#151515;color:#ddd;border-radius:12px;padding:9px 13px}.hero{padding:30px 0 18px}.hero h1{font-size:40px;margin:8px 0}.muted{color:#999}.panel{border:1px solid #292929;border-radius:22px;background:#111;padding:18px;margin-top:14px}.row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #222}.field{width:100%;padding:14px;border-radius:14px;border:1px solid #292929;background:#181818;color:#fff;margin-top:10px}.cta{width:100%;border:0;border-radius:16px;padding:16px;background:#fff;color:#050505;font-weight:800;margin-top:16px}.status{text-align:center;color:#aaa;min-height:22px}.success{font-weight:800;color:#fff}.login{display:inline-block;margin-top:8px;color:#fff}</style></head><body><main class="app"><header class="top"><div class="brand">VASI</div><button class="back" onclick="location.href='eats.html'">Back</button></header><section class="hero"><div class="muted">VASI Eats</div><h1>Checkout</h1><p class="muted">Review your order and delivery details.</p></section><section class="panel"><div class="row"><span>Restaurant</span><b id="restaurant">VASI Restaurant</b></div><div class="row"><span>Items</span><b id="items">1 item</b></div><div class="row"><span>Subtotal</span><b>€12.50</b></div><div class="row"><span>Delivery</span><b>€2.99</b></div><div class="row"><span>Total</span><b>€15.49</b></div><input class="field" id="address" placeholder="Delivery address" autocomplete="street-address"><button class="cta" id="orderBtn" onclick="placeOrder()">Place VASI order</button><p id="status" class="status"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://vhfyvkrvysrooaqzcxsp.supabase.co';const SUPABASE_KEY='sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT';const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const p=new URLSearchParams(location.search);const restaurant=p.get('restaurant')||'VASI Restaurant';const itemCount=Math.max(1,Number(p.get('items')||1));const address=document.getElementById('address');document.getElementById('restaurant').textContent=restaurant;document.getElementById('items').textContent=itemCount+' item'+(itemCount>1?'s':'');address.value=localStorage.getItem('vasi_eats_address')||'';function loginForCheckout(){localStorage.setItem('vasi_role','customer');localStorage.setItem('vasi_eats_address',address.value.trim());const back=location.pathname.replace(/^\//,'')+location.search;localStorage.setItem('vasi_return',back);location.href='auth.html?role=customer&return='+encodeURIComponent(back)}async function placeOrder(){const deliveryAddress=address.value.trim();const status=document.getElementById('status');const btn=document.getElementById('orderBtn');if(!deliveryAddress){status.textContent='Please enter a delivery address.';return}btn.disabled=true;status.textContent='Placing your VASI order…';try{const {data:{session}}=await client.auth.getSession();if(!session){localStorage.setItem('vasi_eats_address',deliveryAddress);status.innerHTML='Please login before placing an order. <button class="login" style="border:0;background:none;padding:0" onclick="loginForCheckout()">Login</button>';btn.disabled=false;return}const subtotal=12.50;const deliveryFee=2.99;const total=subtotal+deliveryFee;const {data,error}=await client.from('eats_orders').insert({customer_id:session.user.id,restaurant_name:restaurant,items:[{name:restaurant,quantity:itemCount}],delivery_address:deliveryAddress,subtotal,delivery_fee:deliveryFee,total,currency:'EUR',status:'pending'}).select('id').single();if(error)throw error;localStorage.removeItem('vasi_eats_address');status.innerHTML='<span class="success">Order placed successfully.</span><br><span class="muted">Order ID: '+data.id+'</span>';btn.textContent='Order placed';}catch(e){status.textContent=e?.message||'Could not place the order. Please try again.';btn.disabled=false}}</script></body></html>
