<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VASI Eats Checkout</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#fff;background:#050505}*{box-sizing:border-box}body{margin:0;background:#050505}.app{max-width:720px;margin:auto;padding:20px 18px 40px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:30px;font-weight:900}.back{border:1px solid #303030;background:#151515;color:#ddd;border-radius:12px;padding:9px 13px}.hero{padding:30px 0 18px}.hero h1{font-size:40px;margin:8px 0}.muted{color:#999}.panel{border:1px solid #292929;border-radius:22px;background:#111;padding:18px;margin-top:14px}.row{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid #222}.field{width:100%;padding:14px;border-radius:14px;border:1px solid #292929;background:#181818;color:#fff;margin-top:14px}.cta{width:100%;border:0;border-radius:16px;padding:16px;background:#fff;color:#050505;font-weight:800;margin-top:16px}.cta:disabled{opacity:.5}.status{text-align:center;color:#aaa;min-height:22px}.success{font-weight:800;color:#fff}.login{display:inline-block;margin-top:8px;color:#fff}</style></head><body><main class="app"><header class="top"><div class="brand">VASI</div><button class="back" onclick="location.href='eats.html'">Back</button></header><section class="hero"><div class="muted">VASI Eats</div><h1>Checkout</h1><p class="muted">Your total is calculated securely from the selected menu.</p></section><section class="panel"><div class="row"><span>Restaurant</span><b id="restaurant">Loading…</b></div><div id="lines"></div><div class="row"><span>Subtotal</span><b id="subtotal">—</b></div><div class="row"><span>Delivery</span><b id="delivery">—</b></div><div class="row"><span>Total</span><b id="total">—</b></div><input class="field" id="address" placeholder="Full delivery address" autocomplete="street-address"><button class="cta" id="orderBtn" onclick="placeOrder()" disabled>Place VASI order</button><p id="status" class="status">Checking basket…</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const client=supabase.createClient('https://vhfyvkrvysrooaqzcxsp.supabase.co','sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT');const el=id=>document.getElementById(id);const basket=JSON.parse(localStorage.getItem('vasi_eats_basket')||'{"restaurant_id":null,"items":{}}');const payload=()=>({restaurant_id:basket.restaurant_id,items:Object.entries(basket.items||{}).map(([id,quantity])=>({id,quantity}))});const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'EUR'}).format(Number(n));
async function price(){try{const response=await fetch('/api/eats-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload(),action:'quote'})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Could not price basket');el('restaurant').textContent=data.restaurant.name;el('lines').innerHTML=data.items.map(i=>`<div class="row"><span>${i.quantity} × ${i.name}</span><b>${money(i.line_total)}</b></div>`).join('');el('subtotal').textContent=money(data.subtotal);el('delivery').textContent=data.delivery_fee?money(data.delivery_fee):'FREE';el('total').textContent=money(data.total);el('orderBtn').disabled=false;el('status').textContent=data.delivery_fee?'Free delivery from €25.':'Free delivery applied.'}catch(error){el('status').textContent=error.message+' Return to the menu.'}}
async function placeOrder(){const address=el('address').value.trim(),button=el('orderBtn');if(!address){el('status').textContent='Please enter your full delivery address.';return}button.disabled=true;el('status').textContent='Checking address and placing order…';try{const{data:{session}}=await client.auth.getSession();if(!session){localStorage.setItem('vasi_role','customer');localStorage.setItem('vasi_return','eats-checkout.html');el('status').innerHTML='Please login before ordering. <a class="login" href="auth.html?role=customer">Login</a>';button.disabled=false;return}const response=await fetch('/api/eats-order',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({...payload(),action:'book',delivery_address:address})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Could not place order');localStorage.removeItem('vasi_eats_basket');const pin=/^\d{4}$/.test(String(data.delivery_pin||''))?String(data.delivery_pin):'••••';el('status').innerHTML='<span class="success">Order placed successfully.</span><br><span class="muted">Order ID: '+String(data.order_id||'').slice(0,8).toUpperCase()+'</span><br><br><span class="muted">DELIVERY PIN</span><br><span style="font:900 38px ui-monospace;letter-spacing:8px;color:#fff">'+pin+'</span><br><span class="muted">Give this PIN to the courier only when your food arrives.</span><br><a class="login" href="activity.html?filter=eats">View Eats activity</a>';button.textContent='Order placed'}catch(error){el('status').textContent=error.message;button.disabled=false}}
price();
</script></body></html>
