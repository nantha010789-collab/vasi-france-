<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>VASI Eats Checkout</title>
    <style>
      :root{font-family:Inter,system-ui,sans-serif;color:#fff;background:#050505}*{box-sizing:border-box}body{margin:0;background:#050505}.app{max-width:720px;margin:auto;padding:20px 18px 40px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:30px;font-weight:900}.back{border:1px solid #303030;background:#151515;color:#ddd;border-radius:12px;padding:9px 13px}.hero{padding:30px 0 18px}.hero h1{font-size:40px;margin:8px 0}.muted{color:#999}.panel{border:1px solid #292929;border-radius:22px;background:#111;padding:18px;margin-top:14px}.row{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid #222}.field{width:100%;padding:14px;border-radius:14px;border:1px solid #292929;background:#181818;color:#fff;margin-top:14px}.cta{width:100%;border:0;border-radius:16px;padding:16px;background:#fff;color:#050505;font-weight:800;margin-top:16px}.cta:disabled{opacity:.5}.status{text-align:center;color:#aaa;min-height:22px;line-height:1.5}.success{font-weight:800;color:#fff}.login{display:inline-block;margin-top:8px;color:#fff}.payment{display:none}.payment.visible{display:block}.payment-box{margin-top:14px;padding:14px;border:1px solid #303030;border-radius:14px;background:#fff}.secure{color:#9fdbac;font-size:12px;margin:12px 0 0}.pin{font:900 38px ui-monospace;letter-spacing:8px;color:#fff}
    </style>
    <link rel="stylesheet" href="./vasi-mobile-fit.css" />
  </head>
  <body>
    <main class="app">
      <header class="top"><div class="brand"><img class="vasi-wordmark" src="./assets/vasi-logo.png" alt="VASI" style="display:block;width:112px;max-width:28vw;height:auto;max-height:46px;object-fit:contain" /></div><button class="back" onclick="location.href='eats.html'">Back</button></header>
      <section class="hero"><div class="muted">VASI Eats</div><h1>Checkout</h1><p class="muted">Your price and courier protection are calculated securely.</p></section>
      <section class="panel">
        <div class="row"><span>Restaurant</span><b id="restaurant">Loading…</b></div>
        <div id="lines"></div>
        <div class="row"><span>Subtotal</span><b id="subtotal">—</b></div>
        <div class="row"><span>Delivery</span><b id="delivery">—</b></div>
        <div class="row"><span>Service fee</span><b id="serviceFee">—</b></div>
        <div class="row"><span>Total</span><b id="total">—</b></div>
        <input class="field" id="address" placeholder="Full delivery address" autocomplete="street-address" />
        <button class="cta" id="orderBtn" onclick="preparePayment()" disabled>Continue to secure payment</button>
        <div id="paymentPanel" class="payment">
          <div id="paymentElement" class="payment-box"></div>
          <p class="secure">🔒 Card payment is processed securely by Stripe. The courier is paid only after your delivery PIN.</p>
          <button class="cta" id="payBtn" onclick="payNow()">Pay now</button>
        </div>
        <p id="status" class="status">Checking basket…</p>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"></script>
    <script src="https://js.stripe.com/v3/"></script>
    <script src="./vasi-notifications.js"></script>
    <script>
      const client = supabase.createClient(
        "https://vhfyvkrvysrooaqzcxsp.supabase.co",
        "sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT",
      );
      const PAYMENT_ENDPOINT = "https://vhfyvkrvysrooaqzcxsp.supabase.co/functions/v1/eats-payment";
      const el = (id) => document.getElementById(id);
      const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);
      const basket = JSON.parse(localStorage.getItem("vasi_eats_basket") || '{"restaurant_id":null,"items":{}}');
      const basketPayload = () => ({
        restaurant_id: basket.restaurant_id,
        items: Object.entries(basket.items || {}).map(([id, quantity]) => ({ id, quantity })),
      });
      const money = (amount) => new Intl.NumberFormat("en-GB", { style: "currency", currency: "EUR" }).format(Number(amount));
      let stripeInstance = null;
      let stripeElements = null;
      let orderId = null;

      function showTotals(data) {
        el("restaurant").textContent = data.restaurant.name;
        el("lines").innerHTML = data.items.map((item) => `<div class="row"><span>${esc(item.quantity)} × ${esc(item.name)}</span><b>${money(item.line_total)}</b></div>`).join("");
        el("subtotal").textContent = money(data.subtotal);
        el("delivery").textContent = data.delivery_fee ? money(data.delivery_fee) : "FREE";
        el("serviceFee").textContent = money(data.service_fee);
        el("total").textContent = money(data.total);
      }

      async function requestPayment(session, body) {
        const response = await fetch(PAYMENT_ENDPOINT, {
          method: "POST",
          headers: { Authorization: "Bearer " + session.access_token, "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "Payment service unavailable");
        return data;
      }

      async function price() {
        try {
          const response = await fetch("/api/eats-order", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ...basketPayload(), action: "quote" }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "Could not price basket");
          showTotals(data);
          el("orderBtn").disabled = false;
          el("status").textContent = "Enter your address for the final delivery price.";
        } catch (error) {
          el("status").textContent = error.message + " Return to the menu.";
        }
      }

      async function preparePayment() {
        const address = el("address").value.trim();
        const button = el("orderBtn");
        if (!address) return (el("status").textContent = "Please enter your full delivery address.");
        button.disabled = true;
        el("status").textContent = "Checking address and preparing secure payment…";
        try {
          const { data: { session } } = await client.auth.getSession();
          if (!session) {
            localStorage.setItem("vasi_role", "customer");
            localStorage.setItem("vasi_return", "eats-checkout.html");
            el("status").innerHTML = 'Please login before ordering. <a class="login" href="auth.html?role=customer">Login</a>';
            button.disabled = false;
            return;
          }
          const orderResponse = await fetch("/api/eats-order", {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: "Bearer " + session.access_token },
            body: JSON.stringify({ ...basketPayload(), action: "book", delivery_address: address }),
          });
          const order = await orderResponse.json();
          if (!orderResponse.ok) throw new Error(order.error || "Could not prepare order");
          orderId = order.order_id;
          showTotals(order);

          const configResponse = await fetch("/api/payment-config", { cache: "no-store" });
          const config = await configResponse.json();
          if (!config.enabled || !config.publishable_key) throw new Error("Card payment is not configured");
          const payment = await requestPayment(session, { action: "create", order_id: orderId });
          stripeInstance = Stripe(config.publishable_key);
          stripeElements = stripeInstance.elements({
            clientSecret: payment.client_secret,
            appearance: { theme: "stripe", variables: { borderRadius: "10px" } },
          });
          stripeElements.create("payment", { layout: "tabs" }).mount("#paymentElement");
          el("paymentPanel").classList.add("visible");
          el("address").disabled = true;
          button.hidden = true;
          el("status").textContent = "Final total confirmed. Enter your card details.";
        } catch (error) {
          el("status").textContent = error.message;
          button.disabled = false;
        }
      }

      async function payNow() {
        if (!stripeInstance || !stripeElements || !orderId) return;
        const button = el("payBtn");
        button.disabled = true;
        el("status").textContent = "Processing payment…";
        try {
          const result = await stripeInstance.confirmPayment({
            elements: stripeElements,
            confirmParams: { return_url: location.origin + "/eats-checkout.html?order_id=" + encodeURIComponent(orderId) },
            redirect: "if_required",
          });
          if (result.error) throw new Error(result.error.message || "Card payment failed");
          const { data: { session } } = await client.auth.getSession();
          if (!session) throw new Error("Login session expired");
          const confirmed = await requestPayment(session, { action: "confirm", order_id: orderId });
          if (!confirmed.paid) throw new Error("Payment confirmation is still pending");
          localStorage.removeItem("vasi_eats_basket");
          const pin = /^\d{4}$/.test(String(confirmed.delivery_pin || "")) ? String(confirmed.delivery_pin) : "••••";
          el("paymentPanel").classList.remove("visible");
          el("status").innerHTML = `<span class="success">Payment successful. Your order is now visible to VASI couriers.</span><br><span class="muted">Order ID: ${esc(orderId.slice(0, 8).toUpperCase())}</span><br><br><span class="muted">DELIVERY PIN</span><br><span class="pin">${esc(pin)}</span><br><span class="muted">Give this PIN only when your food arrives. It releases the courier earning.</span><br><a class="login" href="activity.html?filter=eats">View Eats activity</a>`;
        } catch (error) {
          el("status").textContent = error.message;
          button.disabled = false;
        }
      }

      price();
      VasiNotifications.start(client, { role: "customer" });
    </script>
    <script src="./vasi-languages.js"></script>
  </body>
</html>
