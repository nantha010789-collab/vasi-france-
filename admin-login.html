<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#111827"><title>Connexion Admin — VASI</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#f4f6f8;color:#101828}*{box-sizing:border-box}body{margin:0}.wrap{max-width:500px;margin:auto;min-height:100vh;padding:24px 18px;display:flex;align-items:center}.card{width:100%;background:#fff;border:1px solid #e4e7ec;border-radius:22px;padding:28px;box-shadow:0 20px 60px #10182812}.brand{font-size:30px;font-weight:950}.eyebrow{color:#667085;text-transform:uppercase;letter-spacing:1.5px;font-size:11px;margin-top:7px}h1{margin:28px 0 6px;font-size:28px}.intro{color:#667085;line-height:1.5}.field{width:100%;min-height:50px;margin-top:11px;background:#fff;border:1px solid #d0d5dd;color:#101828;border-radius:12px;padding:13px;font-size:16px;outline:none}.field:focus{border-color:#175cd3;box-shadow:0 0 0 3px #84adff55}.btn{width:100%;min-height:50px;margin-top:13px;border:0;border-radius:12px;padding:13px;background:#111827;color:#fff;font-weight:800;font-size:16px}.msg{min-height:20px;color:#b42318;font-size:13px;margin-top:10px}.secure{margin-top:18px;padding:12px;border-radius:12px;background:#f9fafb;color:#667085;font-size:12px;line-height:1.5}</style></head><body><main class="wrap"><section class="card"><div class="brand">VASI</div><div class="eyebrow">Centre d’opérations sécurisé</div><h1>Connexion administrateur</h1><p class="intro">Utilisez uniquement votre compte administrateur VASI autorisé.</p><label>Adresse e-mail<input id="email" class="field" type="email" autocomplete="username" inputmode="email"></label><label>Mot de passe<input id="password" class="field" type="password" autocomplete="current-password"></label><button id="submit" class="btn" type="button">Se connecter</button><div id="msg" class="msg" role="alert"></div><div class="secure">🔐 L’accès est contrôlé par authentification et liste d’autorisation VASI. Aucun mot de passe n’est stocké dans cette page.</div></section></main><script>if(location.hostname.endsWith('.github.io'))location.replace('https://vasi-new.vercel.app/admin-login.html');</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"></script><script>const db=supabase.createClient('https://vhfyvkrvysrooaqzcxsp.supabase.co','sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT'),$=id=>document.getElementById(id);async function login(){const email=$('email').value.trim().toLowerCase(),password=$('password').value,button=$('submit');if(!email||!password){$('msg').textContent='Saisissez votre e-mail et votre mot de passe.';return}button.disabled=true;$('msg').textContent='Connexion en cours…';const{data,error}=await db.auth.signInWithPassword({email,password});if(error){$('msg').textContent='Connexion impossible. Vérifiez vos identifiants.';button.disabled=false;return}const r=await fetch('https://vhfyvkrvysrooaqzcxsp.supabase.co/functions/v1/admin-service',{method:'POST',headers:{Authorization:'Bearer '+data.session.access_token,'Content-Type':'application/json'},body:JSON.stringify({action:'check_access'})});if(!r.ok){await db.auth.signOut();$('msg').textContent='Ce compte n’est pas autorisé à administrer VASI.';button.disabled=false;return}location.replace('admin/')}$('submit').addEventListener('click',login);$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});</script></body></html>
