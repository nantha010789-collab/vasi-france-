<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>VASI Admin Login</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#050505;color:#fff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:520px;margin:auto;min-height:100vh;padding:24px 18px;display:flex;align-items:center}.card{width:100%;background:#111;border:1px solid #292929;border-radius:24px;padding:22px}.brand{font-size:32px;font-weight:950}.eyebrow{color:#999;text-transform:uppercase;letter-spacing:1.4px;font-size:11px;margin-top:8px}.field{width:100%;margin-top:10px;background:#181818;border:1px solid #333;color:#fff;border-radius:14px;padding:14px;font-size:16px;outline:none}.btn{width:100%;margin-top:12px;border:0;border-radius:15px;padding:15px;background:#fff;color:#050505;font-weight:900;font-size:16px}.btn:disabled{opacity:.55;cursor:not-allowed}.msg{min-height:20px;color:#999;font-size:12px;margin-top:10px}.secure{margin-top:18px;padding:12px;border-radius:13px;background:#171717;color:#aaa;font-size:11px;line-height:1.5}</style></head><body><main class="wrap"><section class="card"><div class="brand">VASI</div><div class="eyebrow">Secure administration</div><h1>Admin login</h1><input id="email" class="field" type="email" autocomplete="username" inputmode="email" placeholder="Admin email"><input id="password" class="field" type="password" autocomplete="current-password" placeholder="Password"><button id="loginBtn" class="btn" onclick="login()">Sign in to Admin</button><div id="msg" class="msg"></div><div class="secure">🔐 Admin access is restricted. Your account must be authenticated and present in the VASI admin allowlist.</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://vhfyvkrvysrooaqzcxsp.supabase.co','sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT');const endpoint='https://vhfyvkrvysrooaqzcxsp.supabase.co/functions/v1/admin-service';const $=id=>document.getElementById(id);let busy=false;
function setBusy(value,message=''){busy=value;$('loginBtn').disabled=value;$('email').disabled=value;$('password').disabled=value;if(message)$('msg').textContent=message}
async function checkAccess(session){if(!session?.access_token)return false;try{const r=await fetch(endpoint,{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({action:'check_access'})});const result=await r.json().catch(()=>({}));return r.ok&&!result.error}catch(e){return false}}
async function login(){if(busy)return;const email=$('email').value.trim().toLowerCase(),password=$('password').value;if(!email||!password){$('msg').textContent='Enter your admin email and password.';return}setBusy(true,'Signing in…');try{const {data,error}=await db.auth.signInWithPassword({email,password});if(error||!data?.session){$('msg').textContent='Email, password, or admin access is not valid.';return}const allowed=await checkAccess(data.session);if(!allowed){await db.auth.signOut();$('msg').textContent='This account is not authorized for VASI Admin.';return}location.replace('vasi-admin.html')}catch(e){await db.auth.signOut().catch(()=>{});$('msg').textContent='Admin login is temporarily unavailable. Please try again.'}finally{if(!location.pathname.endsWith('vasi-admin.html'))setBusy(false)}}
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('email').addEventListener('keydown',e=>{if(e.key==='Enter')$('password').focus()});
(async()=>{const {data:{session}}=await db.auth.getSession();if(!session)return;setBusy(true,'Checking existing admin session…');if(await checkAccess(session)){location.replace('vasi-admin.html');return}await db.auth.signOut();setBusy(false,'Please sign in with an authorized VASI Admin account.')})();
</script></body></html>
