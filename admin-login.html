<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>VASI Admin Login</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#050505;color:#fff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:520px;margin:auto;min-height:100vh;padding:24px 18px;display:flex;align-items:center}.card{width:100%;background:#111;border:1px solid #292929;border-radius:24px;padding:22px}.brand{font-size:32px;font-weight:950}.eyebrow{color:#999;text-transform:uppercase;letter-spacing:1.4px;font-size:11px;margin-top:8px}.field{width:100%;margin-top:10px;background:#181818;border:1px solid #333;color:#fff;border-radius:14px;padding:14px;font-size:16px;outline:none}.btn{width:100%;margin-top:12px;border:0;border-radius:15px;padding:15px;background:#fff;color:#050505;font-weight:900;font-size:16px}.msg{min-height:20px;color:#999;font-size:12px;margin-top:10px}.secure{margin-top:18px;padding:12px;border-radius:13px;background:#171717;color:#aaa;font-size:11px;line-height:1.5}</style></head><body><main class="wrap"><section class="card"><div class="brand">VASI</div><div class="eyebrow">Secure administration</div><h1>Admin login</h1><input id="email" class="field" type="email" autocomplete="username" placeholder="Admin email"><input id="password" class="field" type="password" autocomplete="current-password" placeholder="Password"><button class="btn" onclick="login()">Sign in to Admin</button><div id="msg" class="msg"></div><div class="secure">🔐 Admin access is restricted. Your account must be authenticated and present in the VASI admin allowlist.</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://vhfyvkrvysrooaqzcxsp.supabase.co','sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT');const $=id=>document.getElementById(id);async function login(){const email=$('email').value.trim().toLowerCase(),password=$('password').value;if(!email||!password){$('msg').textContent='Enter your admin email and password.';return}$('msg').textContent='Signing in…';const {data,error}=await db.auth.signInWithPassword({email,password});if(error){$('msg').textContent=error.message;return}const r=await fetch('https://vhfyvkrvysrooaqzcxsp.supabase.co/functions/v1/admin-service',{method:'POST',headers:{Authorization:'Bearer '+data.session.access_token,'Content-Type':'application/json'},body:JSON.stringify({action:'check_access'})});const result=await r.json();if(!r.ok||result.error){await db.auth.signOut();$('msg').textContent=result.error||'Admin access denied.';return}location.href='vasi-admin.html'}$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});</script></body></html>
