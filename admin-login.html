<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#111827">
  <title>Connexion Admin — VASI</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;background:#f4f6f8;color:#101828}*{box-sizing:border-box}body{margin:0}.wrap{max-width:500px;margin:auto;min-height:100vh;padding:24px 18px;display:flex;align-items:center}.card{width:100%;background:#fff;border:1px solid #e4e7ec;border-radius:22px;padding:28px;box-shadow:0 20px 60px #10182812}.brand{font-size:30px;font-weight:950}.eyebrow{color:#667085;text-transform:uppercase;letter-spacing:1.5px;font-size:11px;margin-top:7px}h1{margin:28px 0 6px;font-size:28px}.intro{color:#667085;line-height:1.5}.field{width:100%;min-height:50px;margin-top:11px;background:#fff;border:1px solid #d0d5dd;color:#101828;border-radius:12px;padding:13px;font-size:16px;outline:none}.field:focus{border-color:#175cd3;box-shadow:0 0 0 3px #84adff55}.btn{width:100%;min-height:50px;margin-top:13px;border:0;border-radius:12px;padding:13px;background:#111827;color:#fff;font-weight:800;font-size:16px;cursor:pointer}.btn.secondary{background:#fff;color:#101828;border:1px solid #d0d5dd}.btn:disabled{opacity:.55;cursor:not-allowed}.msg{min-height:20px;color:#b42318;font-size:13px;margin-top:10px}.secure{margin-top:18px;padding:12px;border-radius:12px;background:#f9fafb;color:#667085;font-size:12px;line-height:1.5}.hidden{display:none}label{display:block;margin-top:12px;font-size:14px;font-weight:700}
  </style>
</head>
<body>
  <main class="wrap"><section class="card">
    <div class="brand">VASI</div><div class="eyebrow">Centre d’opérations sécurisé</div>
    <h1>Connexion administrateur</h1>
    <p id="intro" class="intro">Utilisez uniquement votre compte administrateur VASI autorisé.</p>
    <div id="loginFields">
      <label>Adresse e-mail<input id="email" class="field" type="email" autocomplete="username" inputmode="email"></label>
      <label>Mot de passe<input id="password" class="field" type="password" autocomplete="current-password"></label>
    </div>
    <button id="submit" class="btn" type="button">Se connecter</button>
    <button id="forgot" class="btn secondary" type="button">Mot de passe oublié ?</button>
    <div id="msg" class="msg" role="alert"></div>
    <div class="secure">🔐 Compte administrateur séparé, session contrôlée côté serveur et actions sensibles enregistrées dans le journal VASI.</div>
  </section></main>
  <script>if(location.hostname.endsWith('.github.io'))location.replace('https://vasi-new.vercel.app/admin-login.html');</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"></script>
  <script src="./vasi-account-role.js?v=2"></script>
  <script>
    const db=supabase.createClient('https://vhfyvkrvysrooaqzcxsp.supabase.co','sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT'),$=id=>document.getElementById(id);
    let mustSignOut=false;
    async function signOutAndContinue(){
      await db.auth.signOut({scope:'local'});VasiAccountRole.clear();mustSignOut=false;
      $('loginFields').classList.remove('hidden');$('intro').textContent='Utilisez uniquement votre compte administrateur VASI autorisé.';$('submit').textContent='Se connecter';$('submit').classList.remove('secondary');$('msg').textContent='Vous pouvez maintenant vous connecter avec le compte administrateur.';
    }
    async function checkExistingSession(){
      const {data:{session}}=await db.auth.getSession();
      if(!session){VasiAccountRole.clear();return}
      const activeRole=VasiAccountRole.active();
      if(activeRole==='admin'){
        const response=await fetch('https://vhfyvkrvysrooaqzcxsp.supabase.co/functions/v1/admin-service',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({action:'check_access'})});
        if(response.ok){location.replace('admin/');return}
      }
      mustSignOut=true;$('loginFields').classList.add('hidden');$('intro').textContent='Un autre compte VASI est actuellement connecté. Déconnectez-le avant d’ouvrir le compte administrateur.';$('submit').textContent='Se déconnecter et continuer';$('submit').classList.add('secondary');
    }
    async function login(){
      if(mustSignOut)return signOutAndContinue();
      const email=$('email').value.trim().toLowerCase(),password=$('password').value,button=$('submit');
      if(!email||!password){$('msg').textContent='Saisissez votre e-mail et votre mot de passe.';return}
      button.disabled=true;$('msg').textContent='Connexion en cours…';
      const{data,error}=await db.auth.signInWithPassword({email,password});
      if(error){$('msg').textContent='Connexion impossible. Vérifiez vos identifiants.';button.disabled=false;return}
      const response=await fetch('https://vhfyvkrvysrooaqzcxsp.supabase.co/functions/v1/admin-service',{method:'POST',headers:{Authorization:'Bearer '+data.session.access_token,'Content-Type':'application/json'},body:JSON.stringify({action:'check_access'})});
      if(!response.ok){await db.auth.signOut({scope:'local'});VasiAccountRole.clear();$('msg').textContent='Ce compte n’est pas autorisé à administrer VASI.';button.disabled=false;return}
      VasiAccountRole.remember('admin');location.replace('admin/');
    }
    async function requestReset(){
      const email=$('email').value.trim().toLowerCase(),button=$('forgot');
      if(!email){$('msg').textContent='Saisissez d’abord votre adresse e-mail administrateur.';$('email').focus();return}
      button.disabled=true;$('msg').textContent='Envoi du lien sécurisé…';
      const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/admin-reset-password.html'});
      $('msg').textContent=error?'Impossible d’envoyer le lien pour le moment. Réessayez.':'Si cette adresse est autorisée, un lien sécurisé vient d’être envoyé. Vérifiez aussi les courriers indésirables.';
      button.disabled=false;
    }
    $('submit').addEventListener('click',login);$('forgot').addEventListener('click',requestReset);$('password').addEventListener('keydown',event=>{if(event.key==='Enter')login()});checkExistingSession();
  </script>
  <script src="./vasi-navigation.js?v=4"></script>
</body>
</html>
