name: Verify VASI car design

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "vasi-rich.html"
      - ".github/workflows/vasi-car-design.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify ride card assets
        run: |
          test -f vasi-rich.html
          grep -q "VASI_CARS" vasi-rich.html
          grep -q "car-van" vasi-rich.html
