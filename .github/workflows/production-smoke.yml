name: Verify live VASI

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy VASI to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live VASI surfaces
        run: npm run smoke:live
