<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07100b"><title>VASI Driver</title><style>:root{--g:#19c463;--bg:#070907;--card:#151a16;--line:#2b332d;--muted:#9aa59d}*{box-sizing:border-box}body{margin:0;background:#e6ebe7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}.app{max-width:520px;min-height:100vh;margin:auto;background:var(--bg);position:relative}.top{padding:18px 17px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:30px;font-weight:950;letter-spacing:-2px}.logo i{color:var(--g);font-style:normal}.badge{font-size:11px;background:#1c2720;padding:7px 10px;border-radius:99px;color:#b9c5bd}.main{padding:8px 16px 105px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:17px;margin:10px 0}.online{display:flex;justify-content:space-between;align-items:center}.online h1{margin:0;font-size:22px}.online p,.muted{color:var(--muted);font-size:13px}.toggle{width:62px;height:36px;border:0;border-radius:30px;background:#343a36;padding:4px}.toggle:after{content:"";display:block;width:28px;height:28px;background:#fff;border-radius:50%;transition:.2s}.toggle.on{background:var(--g)}.toggle.on:after{transform:translateX(26px)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#111611;border:1px solid var(--line);border-radius:15px;padding:12px}.stat b{font-size:20px}.stat small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.ride{border:1px solid var(--line);border-radius:18px;padding:14px;margin:9px 0;background:#111611}.rideTop{display:flex;justify-content:space-between;gap:10px}.ride h3{margin:0 0 5px;font-size:16px}.ride small{color:var(--muted)}.fare{font-size:18px;font-weight:950}.route{margin:12px 0}.route div{padding:8px 0;border-bottom:1px solid #232923}.route div:last-child{border:0}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--g);margin-right:8px}.dest{display:inline-block;width:8px;height:8px;background:#fff;margin-right:8px}.btn{width:100%;height:48px;border:0;border-radius:13px;background:var(--g);font-weight:950;margin-top:8px}.btn.secondary{background:#242a26;color:#fff}.btn.danger{background:#b42318;color:#fff}.empty{text-align:center;padding:25px;color:var(--muted)}.login{padding:45px 18px}.login h1{font-size:30px}.input{width:100%;height:50px;border-radius:13px;border:1px solid var(--line);background:#151a16;color:#fff;padding:0 13px;margin:6px 0}.nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(490px,calc(100% - 22px));height:68px;background:#121713f2;border:1px solid #ffffff18;border-radius:35px;display:grid;grid-template-columns:repeat(3,1fr);padding:5px;backdrop-filter:blur(18px)}.nav button{border:0;background:none;color:#88928b;border-radius:28px;font-weight:850}.nav .active{background:#242b26;color:#fff}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;z-index:10}.modal.show{display:flex}.sheet{width:min(520px,100%);background:#151a16;border-radius:25px 25px 0 0;padding:20px 17px 30px}.sheet h2{margin:0 0 8px}.sheet p{color:var(--muted);line-height:1.45}</style></head><body><div class="app"><header class="top"><div class="logo">VASI<i>.</i></div><span id="statusBadge" class="badge">Driver</span></header><main id="login" class="login"><h1>Drive with VASI</h1><p class="muted">Sign in to receive nearby VASI rides.</p><input id="email" class="input" type="email" placeholder="Driver email"><button class="btn" onclick="sendLogin()">Send sign-in link</button></main><main id="main" class="main hidden"><section class="card online"><div><h1 id="hello">Driver</h1><p id="verification">Checking verification…</p></div><button id="toggle" class="toggle" onclick="toggleOnline()"></button></section><section class="stats"><div class="stat"><b id="today">€0</b><small>Today</small></div><div class="stat"><b id="trips">0</b><small>Trips</small></div><div class="stat"><b id="rating">—</b><small>Rating</small></div></section><section class="card"><h2 style="margin:0">Current ride</h2><div id="current"><div class="empty">No active ride</div></div></section><section class="card"><h2 style="margin:0">Nearby requests</h2><div id="requests"><div class="empty">Go online to receive requests.</div></div></section></main><nav id="nav" class="nav hidden"><button class="active">🚗<br>Driving</button><button onclick="openProfile()">👤<br>Profile</button><button onclick="logout()">↪<br>Sign out</button></nav><div id="modal" class="modal"><section class="sheet"><button style="float:right;border:0;background:none;color:#fff;font-size:25px" onclick="closeModal()">×</button><div id="modalBody"></div></section></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://vhfyvkrvysrooaqzcxsp.supabase.co',KEY='sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKt';const sb=supabase.createClient(URL,KEY);const $=id=>document.getElementById(id);let driver=null,online=false,current=null,poll=null,geo=null;async function session(){return(await sb.auth.getSession()).data.session}async function call(action,body={}){const {data,error}=await sb.functions.invoke('driver-service',{body:{action,...body}});if(error)throw error;return data}function toast(x){alert(x)}async function sendLogin(){const e=$('email').value.trim();if(!e)return toast('Enter your email');const {error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.href}});if(error)return toast(error.message);toast('Check your email for the sign-in link.')}async function init(){const s=await session();if(!s)return;try{const r=await call('get_profile');driver=r.driver;online=!!driver.online;showApp();refresh()}catch(e){toast(e.message||'Driver profile required')}}function showApp(){$('login').classList.add('hidden');$('main').classList.remove('hidden');$('nav').classList.remove('hidden');$('hello').textContent=driver.full_name||'VASI Driver';$('verification').textContent=driver.verified?'Verified driver':'Verification required';$('rating').textContent=driver.rating?Number(driver.rating).toFixed(1):'—';paintOnline()}function paintOnline(){$('toggle').classList.toggle('on',online);$('statusBadge').textContent=online?'ONLINE':'OFFLINE'}async function toggleOnline(){try{const r=await call('set_online',{online:!online});driver=r.driver;online=!!driver.online;paintOnline();if(online)startGPS();else stopGPS();refresh()}catch(e){toast(e.message||'Cannot change online status')}}function startGPS(){stopGPS();if(!navigator.geolocation)return;geo=navigator.geolocation.watchPosition(async p=>{try{await call('update_location',{latitude:p.coords.latitude,longitude:p.coords.longitude,heading:p.coords.heading})}catch(_e){}},()=>{}, {enableHighAccuracy:true,maximumAge:5000,timeout:10000})}function stopGPS(){if(geo!==null)navigator.geolocation.clearWatch(geo);geo=null}async function refresh(){try{const [a,c]=await Promise.all([call('get_available_rides'),call('get_current_ride')]);renderRequests(a.rides||[]);current=c.ride;renderCurrent();}catch(e){if(!String(e.message||'').includes('Unauthorized'))console.log(e)}clearTimeout(poll);poll=setTimeout(refresh,5000)}function renderRequests(rows){if(!online){$('requests').innerHTML='<div class="empty">Go online to receive requests.</div>';return}if(!rows.length){$('requests').innerHTML='<div class="empty">No new requests nearby.</div>';return}$('requests').innerHTML=rows.map(r=>`<article class="ride"><div class="rideTop"><div><h3>${r.service||'VASI Go'}</h3><small>${r.payment_method||'cash'} · ${r.currency||'EUR'}</small></div><div class="fare">${Number(r.estimated_fare||0).toFixed(2)} €</div></div><div class="route"><div><span class="dot"></span>${esc(r.pickup_address||'Pickup')}</div><div><span class="dest"></span>${esc(r.destination_address||'Destination')}</div></div><button class="btn" onclick="accept('${r.id}')">Accept ride</button></article>`).join('')}function renderCurrent(){if(!current){$('current').innerHTML='<div class="empty">No active ride</div>';return}const s=current.status;$('current').innerHTML=`<div class="ride"><div class="rideTop"><div><h3>${current.service||'VASI Go'}</h3><small>${s.replaceAll('_',' ')}</small></div><div class="fare">${Number(current.final_fare||current.estimated_fare||0).toFixed(2)} €</div></div><div class="route"><div><span class="dot"></span>${esc(current.pickup_address||'Pickup')}</div><div><span class="dest"></span>${esc(current.destination_address||'Destination')}</div></div>${s==='accepted'?'<button class="btn" onclick="arrive()">I am arriving</button>':''}${s==='driver_arriving'?'<button class="btn" onclick="startRide()">Start ride</button>':''}${s==='in_progress'?'<button class="btn" onclick="completeRide()">Complete ride</button>':''}</div>`}async function accept(id){try{const r=await call('accept_ride',{ride_id:id});current=r.ride;renderCurrent();toast('Ride accepted');refresh()}catch(e){toast(e.message||'Ride is no longer available');refresh()}}async function arrive(){try{const r=await call('arriving',{ride_id:current.id});current=r.ride;renderCurrent()}catch(e){toast(e.message)}}async function startRide(){try{const r=await call('start_ride',{ride_id:current.id});current=r.ride;renderCurrent()}catch(e){toast(e.message)}}async function completeRide(){const fare=prompt('Final fare (€)',String(current.estimated_fare||0));if(fare===null)return;try{const r=await call('complete_ride',{ride_id:current.id,final_fare:Number(fare)});current=null;renderCurrent();toast('Ride completed');refresh()}catch(e){toast(e.message)}}function esc(s){return String(s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}function openProfile(){if(!driver)return;openModal(`<h2>Driver profile</h2><p><b>${esc(driver.full_name||'Driver')}</b></p><p>${esc(driver.vehicle_make||'')} ${esc(driver.vehicle_model||'')} · ${esc(driver.vehicle_plate||'')}</p><p>Verification: ${driver.verified?'Verified':'Pending'}</p><button class="btn secondary" onclick="closeModal()">Close</button>`)}function openModal(x){$('modalBody').innerHTML=x;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}async function logout(){stopGPS();clearTimeout(poll);await sb.auth.signOut();location.reload()}sb.auth.onAuthStateChange((_e,s)=>{if(s)setTimeout(init,250)});init();</script></body></html>
