<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07100b"><title>VASI Driver</title><style>:root{--g:#19c463;--bg:#070907;--c:#151a16;--l:#2b332d;--m:#9aa59d}*{box-sizing:border-box}body{margin:0;background:#e6ebe7;font-family:system-ui;color:#fff}.app{max-width:520px;min-height:100vh;margin:auto;background:var(--bg)}header{padding:18px;display:flex;justify-content:space-between}.logo{font-size:28px;font-weight:900}.logo i{color:var(--g);font-style:normal}.main{padding:10px 16px 30px}.card{background:var(--c);border:1px solid var(--l);border-radius:20px;padding:16px;margin:10px 0}.input{width:100%;height:48px;background:var(--c);border:1px solid var(--l);border-radius:12px;color:#fff;padding:0 12px;margin:5px 0}.btn{width:100%;height:48px;border:0;border-radius:12px;background:var(--g);font-weight:900;margin-top:8px}.secondary{background:#29302b;color:#fff}.danger{background:#b42318;color:#fff}.toggle{width:62px;height:36px;border:0;border-radius:30px;background:#343a36}.toggle.on{background:var(--g)}.pill{background:#1c2720;padding:7px 10px;border-radius:20px;font-size:11px}.ride{background:#111611;border:1px solid var(--l);border-radius:17px;padding:14px;margin:9px 0}.route{margin:10px 0}.route div{padding:7px 0}.muted,.empty{color:var(--m);font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#111611;border:1px solid var(--l);border-radius:14px;padding:12px}.stat b{font-size:19px}.stat small{display:block;color:var(--m)}.hidden{display:none!important}</style></head><body><div class="app"><header><div class="logo">VASI<i>.</i></div><span id="badge" class="pill">OFFLINE</span></header><main id="login" class="main"><h1>Drive with VASI</h1><p class="muted">Sign in to receive rides.</p><input id="email" class="input" type="email" placeholder="Driver email"><button class="btn" onclick="login()">Send sign-in link</button></main><main id="app" class="main hidden"><section class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><h2 id="name" style="margin:0">Driver</h2><p id="verify" class="muted">Checking…</p></div><button id="toggle" class="toggle" onclick="toggleOnline()"></button></div></section><div class="stats"><div class="stat"><b id="rating">—</b><small>Rating</small></div><div class="stat"><b id="trips">0</b><small>Trips</small></div><div class="stat"><b id="earn">€0</b><small>Today</small></div></div><section class="card"><h2>Payments</h2><p class="muted">Connect Stripe to receive card-ride payouts.</p><button class="btn" onclick="stripeOnboarding()">Connect Stripe</button></section><section class="card"><h2>Current ride</h2><div id="current" class="empty">No active ride</div></section><section class="card"><h2>Ride requests</h2><div id="requests" class="empty">Go online to receive requests.</div></section><button class="btn secondary" onclick="logout()">Sign out</button></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const U='https://vhfyvkrvysrooaqzcxsp.supabase.co',K='sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKt';const sb=supabase.createClient(U,K);const $=x=>document.getElementById(x);let driver=null,online=false,current=null,timer=null,geo=null;async function login(){const e=$('email').value.trim();if(!e)return alert('Enter your email');const {error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.href}});if(error)return alert(error.message);alert('Check your email.')}async function call(action,body={}){const {data,error}=await sb.functions.invoke('driver-service',{body:{action,...body}});if(error)throw error;return data}async function init(){const s=(await sb.auth.getSession()).data.session;if(!s)return;try{const r=await call('get_profile');driver=r.driver;online=!!driver.online;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('name').textContent=driver.full_name||'VASI Driver';$('verify').textContent=driver.verified?'Verified driver':'Verification required';$('rating').textContent=driver.rating?Number(driver.rating).toFixed(1):'—';paint();refresh()}catch(e){alert(e.message||'Driver profile required')}}function paint(){$('toggle').classList.toggle('on',online);$('badge').textContent=online?'ONLINE':'OFFLINE'}async function toggleOnline(){try{const r=await call('set_online',{online:!online});driver=r.driver;online=!!driver.online;paint();online?gps():stopGps();refresh()}catch(e){alert(e.message)}}function gps(){stopGps();geo=navigator.geolocation?.watchPosition(async p=>{try{await call('update_location',{latitude:p.coords.latitude,longitude:p.coords.longitude,heading:p.coords.heading})}catch(_){}})}function stopGps(){if(geo!==null)navigator.geolocation.clearWatch(geo);geo=null}async function refresh(){try{const [a,c]=await Promise.all([call('get_available_rides'),call('get_current_ride')]);current=c.ride;renderRequests(a.rides||[]);renderCurrent()}catch(e){}clearTimeout(timer);timer=setTimeout(refresh,4000)}function renderRequests(rows){if(!online){$('requests').innerHTML='<div class="empty">Go online to receive requests.</div>';return}if(!rows.length){$('requests').innerHTML='<div class="empty">No new requests.</div>';return}$('requests').innerHTML=rows.map(r=>`<div class="ride"><b>${r.service||'VASI Go'}</b> · ${Number(r.estimated_fare||0).toFixed(2)} ${r.currency||'EUR'}<div class="route">🟢 ${esc(r.pickup_address||'Pickup')}<br>⚪ ${esc(r.destination_address||'Destination')}</div><button class="btn" onclick="accept('${r.id}')">Accept</button></div>`).join('')}function renderCurrent(){if(!current){$('current').innerHTML='<div class="empty">No active ride</div>';return}const s=current.status;$('current').innerHTML=`<div class="ride"><b>${s.replaceAll('_',' ')}</b><div class="route">🟢 ${esc(current.pickup_address)}<br>⚪ ${esc(current.destination_address)}</div>${s==='accepted'?'<button class="btn" onclick="step(\'arriving\')">I am arriving</button>':''}${s==='driver_arriving'?'<button class="btn" onclick="step(\'start_ride\')">Start ride</button>':''}${s==='in_progress'?'<button class="btn" onclick="complete()">Complete ride</button>':''}</div>`}async function accept(id){try{current=(await call('accept_ride',{ride_id:id})).ride;renderCurrent();refresh()}catch(e){alert(e.message)}}async function step(a){try{current=(await call(a,{ride_id:current.id})).ride;renderCurrent()}catch(e){alert(e.message)}}async function complete(){const fare=prompt('Final fare (€)',String(current.estimated_fare||0));if(fare===null)return;const n=Number(fare);if(!Number.isFinite(n)||n<0)return alert('Invalid fare');try{const rideId=current.id;await call('complete_ride',{ride_id:rideId,final_fare:n});const s=(await sb.auth.getSession()).data.session;const r=await fetch('/api/capture-payment',{method:'POST',headers:{Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify({ride_id:rideId,final_fare:n})});const d=await r.json();if(!r.ok&&d.error&&!String(d.error).includes('Stripe payment not found'))alert(d.error);current=null;renderCurrent();refresh()}catch(e){alert(e.message)}}async function stripeOnboarding(){const s=(await sb.auth.getSession()).data.session;if(!s)return;const country=(prompt('Driver country code (FR or GB)', 'FR')||'FR').toUpperCase();const r=await fetch('/api/driver-stripe-onboarding',{method:'POST',headers:{Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify({country})});const d=await r.json();if(!r.ok)return alert(d.error||'Stripe onboarding failed');location.href=d.url}function esc(s){return String(s||'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}async function logout(){stopGps();clearTimeout(timer);await sb.auth.signOut();location.reload()}sb.auth.onAuthStateChange(()=>setTimeout(init,250));init();</script></body></html>
