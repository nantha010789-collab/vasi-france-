<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant dashboard · VASI</title><style>:root{font-family:Inter,system-ui;color:#fff;background:#050505}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:20px 18px 50px}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:29px;font-weight:950}.btn,input{border:1px solid #333;background:#181818;color:#fff;border-radius:12px;padding:11px;font:inherit}.btn{font-weight:800;cursor:pointer}.on{background:#58ca75;color:#07150b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#101010;border:1px solid #292929;border-radius:20px;padding:17px;margin-top:14px}.muted{color:#999;font-size:13px}.badge{display:inline-block;padding:7px 10px;border-radius:999px;background:#292929;text-transform:capitalize}.menu-item,.order{border-top:1px solid #292929;padding:13px 0}.form{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}.status{min-height:22px;color:#aaa}@media(max-width:650px){.grid,.form{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="top"><div class="brand">VASI Partner</div><div><button class="btn" onclick="location.href='eats.html'">Eats</button> <button class="btn" onclick="logout()">Sign out</button></div></header><div id="app"><p class="muted">Loading restaurant…</p></div><p id="message" class="status"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/vasi-notifications.js"></script><script>const client=supabase.createClient('https://vhfyvkrvysrooaqzcxsp.supabase.co','sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT'),app=document.getElementById('app'),msg=document.getElementById('message');let token='',data={};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(body){const r=await fetch('/api/restaurant-partner',{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){try{data=await api();if(!data.restaurant){location.href='restaurant-register.html';return}render()}catch(e){msg.textContent=e.message}}function render(){const r=data.restaurant,rate=(Number(r.commission_rate)*100).toFixed(0);app.innerHTML=`<section class="card"><div class="row"><div><h1>${esc(r.name)}</h1><span class="badge">${esc(r.status)}</span></div><button class="btn ${r.is_open?'on':''}" onclick="toggleOpen(${!r.is_open})">${r.is_open?'Online':'Offline'}</button></div><p class="muted">${esc(r.cuisine)} · ${esc(r.delivery_mode==='own'?'Own delivery':'VASI courier')} · ${rate}% launch commission until ${new Date(r.launch_commission_ends_at).toLocaleDateString()}</p>${r.status==='pending'?'<p>Your application is being reviewed. Add your menu now; online ordering unlocks after approval.</p>':''}${r.status==='rejected'?`<p>Changes needed: ${esc(r.rejection_reason)}</p>`:''}</section><div class="grid"><section class="card"><h2>Menu</h2><form class="form" onsubmit="addItem(event)"><input name="name" placeholder="Item name" required><input name="category" placeholder="Category"><input name="price" type="number" min="0.5" step="0.01" placeholder="€ Price" required><input name="description" placeholder="Description"><input name="allergens" placeholder="Allergens, comma separated"><button class="btn" type="submit">Add item</button></form><div>${(data.menu||[]).map(i=>`<div class="menu-item row"><div><b>${esc(i.name)}</b><div class="muted">€${Number(i.price).toFixed(2)} · ${esc(i.category)}</div></div><button class="btn" onclick="toggleItem('${i.id}',${!i.active})">${i.active?'Hide':'Show'}</button></div>`).join('')||'<p class="muted">No menu items yet.</p>'}</div></section><section class="card"><h2>Orders</h2><div>${(data.orders||[]).map(o=>`<div class="order"><div class="row"><b>#${o.id.slice(0,8).toUpperCase()}</b><span class="badge">${esc(o.status)}</span></div><p class="muted">€${Number(o.total).toFixed(2)} · ${new Date(o.created_at).toLocaleString()}</p><div class="row"><button class="btn" onclick="order('${o.id}','accepted')">Accept</button><button class="btn" onclick="order('${o.id}','preparing')">Preparing</button><button class="btn" onclick="order('${o.id}','ready_for_pickup')">Ready</button></div></div>`).join('')||'<p class="muted">No orders yet.</p>'}</div></section></div>`}async function act(body){msg.textContent='Saving…';try{await api(body);msg.textContent='Saved.';await load()}catch(e){msg.textContent=e.message}}function addItem(e){e.preventDefault();act({action:'add_item',...Object.fromEntries(new FormData(e.target))})}function toggleItem(id,active){act({action:'toggle_item',id,active})}function toggleOpen(is_open){act({action:'toggle_open',is_open})}function order(id,status){act({action:'order_status',id,status})}async function logout(){await client.auth.signOut();location.href='index.html'}client.auth.getSession().then(({data:{session}})=>{if(!session){localStorage.setItem('vasi_role','customer');localStorage.setItem('vasi_return','restaurant-dashboard.html');location.href='auth.html?role=customer'}else{token=session.access_token;load()}});VasiNotifications.start(client,{role:"restaurant"});</script></body></html>
