async function compressPhoto(file){if(!file||!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Choisissez une photo JPG, PNG ou WebP.');if(file.size>8*1024*1024)throw Error('La photo doit faire moins de 8 Mo.');const source=await new Promise((resolve,reject)=>{const image=new Image(),u=URL.createObjectURL(file);image.onload=()=>{URL.revokeObjectURL(u);resolve(image)};image.onerror=()=>reject(Error('Cette photo ne peut pas être ouverte.'));image.src=u}),scale=Math.min(1,1600/Math.max(source.naturalWidth,source.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(source.naturalWidth*scale));canvas.height=Math.max(1,Math.round(source.naturalHeight*scale));canvas.getContext('2d',{alpha:false}).drawImage(source,0,0,canvas.width,canvas.height);for(const quality of [.86,.76,.66,.56]){const value=canvas.toDataURL('image/webp',quality);if(value.length<2.65*1024*1024)return value}throw Error('La photo reste trop volumineuse.')}
