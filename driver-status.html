<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#06183f" />
  <link rel="manifest" href="./driver-manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./vasi-driver-icon-512.png" />
  <title>VASI Driver · État de votre dossier</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#030916;color:#fff;font:16px system-ui,sans-serif;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 24px)}main{max-width:560px;margin:0 auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:30px}header img{width:110px}a{color:#a9c3ff}h1{font-size:28px;line-height:1.15}p{color:#becbe3;line-height:1.6}.card{padding:24px;border:1px solid #28406c;background:#0b1730;border-radius:22px}.tag{color:#a9c3ff;font-size:13px;font-weight:800}button,.action{display:block;width:100%;padding:15px;margin-top:14px;border-radius:13px;border:1px solid #28406c;background:#1557ff;color:#fff;text-align:center;text-decoration:none;font:inherit;font-weight:700}button.secondary{background:transparent}.hidden,[hidden]{display:none!important}li{margin:8px 0;font-size:14px;line-height:1.5}#reason{color:#ffbdc3;white-space:pre-wrap}footer{margin-top:24px;text-align:center;font-size:14px}
  </style>
</head>
<body>
  <main>
    <header><a href="driver-home.html">Retour</a><img src="./assets/vasi-logo.png" alt="VASI Driver" /></header>
    <section class="card" aria-live="polite" aria-busy="true" id="statusCard">
      <span class="tag" id="stateLabel">VÉRIFICATION DU DOSSIER</span>
      <h1 id="heading">Vérification de votre compte…</h1>
      <p id="description">La connexion ne remplace pas la validation de votre dossier par VASI.</p>
      <p id="reason" hidden></p>
      <p id="progress" hidden></p>
      <ul id="documents"></ul>
      <a id="registrationLink" class="action" hidden>Compléter mon inscription</a>
      <a id="workspaceLink" class="action" hidden>Ouvrir mon espace professionnel</a>
      <button id="refresh" class="secondary" type="button">Actualiser le statut</button>
      <button id="logout" class="secondary" type="button">Se déconnecter</button>
    </section>
    <footer><a href="support.html">Assistance VASI</a></footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"></script>
  <script src="./vasi-account-role.js"></script>
  <script src="./vasi-provider-access.js"></script>
  <script>
    const client = supabase.createClient("https://vhfyvkrvysrooaqzcxsp.supabase.co", "sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT", {auth:{storageKey:"vasi-driver-auth"}});
    const accountRole = VasiAccountRole.scoped("driver");
    const requested = new URLSearchParams(location.search).get("role");
    const role = requested === "courier" ? "courier" : "ride";
    const $ = id => document.getElementById(id);
    const names = {identity:"Pièce d’identité",vtc:"Carte VTC",licence:"Permis de conduire",business:"Justificatif d’entreprise",insurance:"Assurance professionnelle",carte_grise:"Carte grise",selfie:"Selfie de vérification",bag:"Sac de livraison",vehicle_photo:"Photo du véhicule",transport_licence:"Licence de transport"};
    $("registrationLink").href = "partner-register-v2.html?role=" + role + "&surface=driver";
    $("workspaceLink").href = role === "ride" ? "driver.html" : "delivery-driver.html";
    let loading = false;
    async function refresh() {
      if (loading) return;
      loading = true;
      $("refresh").disabled = true;
      $("statusCard").setAttribute("aria-busy", "true");
      for (const id of ["registrationLink","workspaceLink","progress","reason"]) $(id).hidden = true;
      $("documents").replaceChildren();
      try {
        const {data:{session},error} = await client.auth.getSession();
        if (error) throw error;
        if (!session) { accountRole.setIntent(role); location.replace("auth.html?role=" + role + "&surface=driver"); return; }
        if (!accountRole.require(role, session)) return;
        const access = await VasiProviderAccess.read(client, role, session.user.id);
        const states = {
          incomplete:["INSCRIPTION INCOMPLÈTE","Complétez votre inscription","Votre connexion est créée, mais votre dossier professionnel n’est pas complet. Ajoutez les documents requis et envoyez votre dossier."],
          pending:["EN ATTENTE DE VALIDATION","Votre dossier est en cours de vérification","VASI doit vérifier et approuver votre dossier. Les courses, revenus, RIB et le passage en ligne restent bloqués avant cette validation."],
          rejected:["ACTION REQUISE","Votre dossier nécessite une correction","Corrigez les pièces demandées puis renvoyez votre dossier pour vérification. Votre espace de travail reste bloqué."],
          approved:["DOSSIER APPROUVÉ","Votre dossier a été validé","Vous pouvez ouvrir votre espace professionnel. Un RIB vérifié et la permission GPS restent nécessaires pour passer en ligne."]
        };
        const copy = states[access.state];
        $("stateLabel").textContent = copy[0]; $("heading").textContent = copy[1]; $("description").textContent = copy[2];
        $("progress").hidden = false;
        $("progress").textContent = access.present.length + "/" + access.required.length + " documents ajoutés" + (role === "ride" ? " · " + access.approved.length + " validés" : "");
        for (const type of access.required) {
          const item = document.createElement("li");
          const doc = access.documents.find(entry => entry.document_type === type);
          const expired = doc?.expires_at && new Date(doc.expires_at).getTime() <= Date.now();
          const label = !access.present.includes(type) ? "Manquant" : expired ? "Expiré" : doc?.status === "rejected" ? "Refusé" : access.approved.includes(type) || access.state === "approved" ? "Validé" : "En vérification";
          item.textContent = (names[type] || type) + " — " + label;
          $("documents").appendChild(item);
        }
        const reasons = [access.profile?.rejection_reason, ...access.documents.map(doc => doc.rejection_reason)].filter(Boolean);
        if (reasons.length) { $("reason").textContent = [...new Set(reasons)].join("\n"); $("reason").hidden = false; }
        $("registrationLink").hidden = !["incomplete","rejected"].includes(access.state);
        $("registrationLink").textContent = access.state === "rejected" ? "Corriger et renvoyer mon dossier" : "Compléter mon inscription";
        $("workspaceLink").hidden = access.state !== "approved";
      } catch (_) {
        $("stateLabel").textContent = "STATUT INDISPONIBLE";
        $("heading").textContent = "Impossible de vérifier votre dossier";
        $("description").textContent = "Réessayez avec une connexion internet. L’espace professionnel reste bloqué tant que la validation n’est pas confirmée.";
      } finally { loading = false; $("refresh").disabled = false; $("statusCard").setAttribute("aria-busy","false"); }
    }
    $("refresh").addEventListener("click", refresh);
    $("logout").addEventListener("click", async () => { await client.auth.signOut({scope:"local"}); accountRole.clear(); location.replace("driver-home.html"); });
    window.addEventListener("pageshow", refresh);
    refresh();
  </script>
  <script src="./vasi-languages.js?v=4"></script>
  <script src="./vasi-pwa.js"></script>
</body>
</html>
