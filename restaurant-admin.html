<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant approvals · VASI</title><style>:root{font-family:Inter,system-ui;color:#fff;background:#050505}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:20px}.top,.actions{display:flex;justify-content:space-between;gap:9px;align-items:center}.card{background:#111;border:1px solid #292929;border-radius:18px;padding:17px;margin-top:14px}.btn{border:1px solid #333;background:#191919;color:#fff;border-radius:12px;padding:10px 13px;font-weight:800}.active,.approve{background:#fff;color:#050505}.muted{color:#999}.restaurant{border-top:1px solid #292929;padding:15px 0}</style></head><body><main class="wrap"><header class="top"><h1>Restaurant approvals</h1><button class="btn" onclick="location.href='vasi-admin.html'">Admin home</button></header><section class="card"><div class="actions"><div><button class="btn active" onclick="setFilter('pending',this)">Pending</button> <button class="btn" onclick="setFilter('approved',this)">Approved</button> <button class="btn" onclick="setFilter('rejected',this)">Rejected</button></div></div><div id="list"><p class="muted">Loading…</p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const client=supabase.createClient('https://vhfyvkrvysrooaqzcxsp.supabase.co','sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT'),list=document.getElementById('list');let token='',filter='pending';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/restaurant-admin?status='+filter,{headers:{Authorization:'Bearer '+token}}),d=await r.json();if(!r.ok){list.innerHTML='<p>'+esc(d.error)+'</p>';return}list.innerHTML=d.restaurants.map(x=>`<article class="restaurant"><h3>${esc(x.name)}</h3><p class="muted">${esc(x.legal_name)} · SIRET ${esc(x.siret)}<br>${esc(x.address)}, ${esc(x.postal_code)} ${esc(x.city)}<br>${esc(x.email)} · ${esc(x.phone)}<br>${x.delivery_mode==='own'?'Own delivery · 5%':'VASI courier · 10%'}</p>${filter==='pending'?`<button class="btn approve" onclick="review('${x.id}','approved')">Approve</button> <button class="btn" onclick="review('${x.id}','rejected')">Reject</button>`:''}</article>`).join('')||'<p class="muted">No '+filter+' restaurants.</p>'}async function review(id,status){const reason=status==='rejected'?(prompt('Reason for rejection')||'Application needs changes'):'';const r=await fetch('/api/restaurant-admin',{method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({id,status,reason})}),d=await r.json();if(!r.ok)return alert(d.error);load()}function setFilter(x,b){filter=x;document.querySelectorAll('.actions .btn').forEach(v=>v.classList.remove('active'));b.classList.add('active');load()}client.auth.getSession().then(({data:{session}})=>{if(!session)location.href='admin-login.html';else{token=session.access_token;load()}})</script></body></html>
