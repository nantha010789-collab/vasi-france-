<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>VASI Ride</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{font-family:Inter,system-ui,sans-serif;color:#fff;background:#050505}*{box-sizing:border-box}body{margin:0;background:#050505}.app{min-height:100vh;max-width:760px;margin:auto;padding:16px;background:#050505}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:30px;font-weight:900}.back{border:1px solid #333;background:#151515;color:#fff;border-radius:12px;padding:9px 13px}.map{height:43vh;min-height:300px;margin:14px 0;border-radius:24px;overflow:hidden;border:1px solid #292929;background:#ddd}.panel{border:1px solid #292929;background:#111;border-radius:22px;padding:16px}.field{padding:13px;border-radius:14px;background:#181818;margin-bottom:9px;color:#999;cursor:pointer}.field b{color:#fff;display:block;margin-top:4px}.types{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:12px 0}.type{border:1px solid #303030;background:#151515;color:#fff;border-radius:16px;padding:13px;text-align:left;cursor:pointer}.type.active{border-color:#fff;background:#222}.type strong{display:block;font-size:16px}.type span{display:block;color:#999;font-size:11px;margin-top:4px}.type .price{color:#fff;font-weight:800;font-size:15px;margin-top:8px}.cta{width:100%;border:0;border-radius:16px;padding:16px;background:#fff;color:#050505;font-weight:800;font-size:16px}.cta:disabled{opacity:.45}.info{display:flex;justify-content:space-between;margin:12px 0;color:#aaa}.fare{font-size:24px;font-weight:900;color:#fff}.status{text-align:center;color:#888;font-size:13px;min-height:20px}.leaflet-control-attribution{font-size:9px}.driver{font-size:22px}.hidden{display:none}.cancel{background:transparent;color:#aaa;border:0;width:100%;padding:12px}.success{color:#fff;font-weight:700}.policy{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.policy div{background:#151515;border-radius:13px;padding:10px;color:#999;font-size:11px}.policy b{display:block;color:#fff;font-size:13px;margin-top:3px}.waiting{font-size:12px;color:#aaa;text-align:center;margin:8px 0}.error{color:#ffb4b4}</style></head><body><main class="app"><header class="top"><div class="brand">VASI</div><button class="back" onclick="location.href='index.html'">Home</button></header><div id="map" class="map"></div><section class="panel"><div class="field" onclick="useLocation()">📍 Pickup<b id="pickup">Use my current location</b></div><div class="field" onclick="focusDestination()">🏁 Destination<b id="destination">Tap map to choose destination</b></div><div id="types" class="types hidden"></div><div class="info"><span>Upfront fare</span><span class="fare" id="fare">—</span></div><div id="tripInfo" class="status"></div><div class="policy"><div>Cancellation<b>€5</b></div><div>Waiting<b>3 min free · €0.30/min</b></div></div><button id="routeBtn" class="cta" onclick="buildRoute()">Set destination</button><button id="cancelBtn" class="cancel hidden" onclick="cancelRide()">Cancel ride</button><div id="waiting" class="waiting hidden"></div><p id="status" class="status">Getting ready…</p></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>let map,pickupMarker,destMarker,routeLine,pickup=null,destination=null,driver=null,driverTimer=null,waitTimer=null,waitSeconds=0,rideRequested=false;let route={km:0,mins:0};let selected='go';const fallback=[49.189,2.449];const classes={go:{name:'Go',seats:4,emoji:'🚗',base:4.2,km:1.25,min:.20,minFare:6},comfort:{name:'Comfort',seats:4,emoji:'🚘',base:5.0,km:1.40,min:.22,minFare:7},xl:{name:'XL',seats:6,emoji:'🚙',base:6.2,km:1.65,min:.25,minFare:9},van:{name:'Van',seats:9,emoji:'🚐',base:7.5,km:1.90,min:.29,minFare:12}};function priceFor(km,mins,key){const c=classes[key];return Math.max(c.minFare,c.base+km*c.km+mins*c.min)}function init(){map=L.map('map',{zoomControl:false}).setView(fallback,13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);map.on('click',e=>{if(!pickup){pickup=[e.latlng.lat,e.latlng.lng];setPickup(pickup)}else{destination=[e.latlng.lat,e.latlng.lng];setDestination(destination)}});useLocation()}function useLocation(){if(!navigator.geolocation){setPickup(fallback);return}document.getElementById('status').textContent='Requesting your location…';navigator.geolocation.getCurrentPosition(p=>setPickup([p.coords.latitude,p.coords.longitude]),()=>{setPickup(fallback);document.getElementById('status').textContent='Location permission unavailable — choose on map'})}function setPickup(p){pickup=p;if(pickupMarker)pickupMarker.remove();pickupMarker=L.marker(p).addTo(map).bindPopup('VASI pickup').openPopup();map.setView(p,14);document.getElementById('pickup').textContent='Current location';document.getElementById('status').textContent='Now choose your destination';document.getElementById('routeBtn').textContent='Set destination'}function setDestination(p){destination=p;if(destMarker)destMarker.remove();destMarker=L.marker(p).addTo(map).bindPopup('Destination');map.fitBounds(L.latLngBounds([pickup,destination]),{padding:[35,35]});document.getElementById('destination').textContent='Destination selected';document.getElementById('routeBtn').textContent='Get upfront fares';document.getElementById('status').textContent='Ready to calculate your trip'}function focusDestination(){document.getElementById('status').textContent='Tap the map to choose your destination'}async function buildRoute(){if(!pickup){useLocation();return}if(!destination){document.getElementById('status').textContent='Tap the map to choose your destination';return}document.getElementById('status').textContent='Calculating route…';try{const u=`https://router.project-osrm.org/route/v1/driving/${pickup[1]},${pickup[0]};${destination[1]},${destination[0]}?overview=full&geometries=geojson`;const r=await fetch(u);const d=await r.json();if(!d.routes?.length)throw Error();const r0=d.routes[0];if(routeLine)routeLine.remove();routeLine=L.geoJSON(r0.geometry).addTo(map);map.fitBounds(routeLine.getBounds(),{padding:[35,35]});route.km=r0.distance/1000;route.mins=Math.ceil(r0.duration/60);renderTypes();document.getElementById('types').classList.remove('hidden');selectType(selected);document.getElementById('routeBtn').textContent='Request VASI ride';document.getElementById('routeBtn').onclick=requestRide;document.getElementById('tripInfo').textContent=`${route.km.toFixed(1)} km · about ${route.mins} min`;document.getElementById('status').textContent='Choose your VASI vehicle — price is shown before booking'}catch(e){document.getElementById('status').innerHTML='<span class="error">Route service unavailable — try again</span>'}}function renderTypes(){document.getElementById('types').innerHTML=Object.entries(classes).map(([key,c])=>`<button class="type" id="type-${key}" onclick="selectType('${key}')"><strong>${c.emoji} ${c.name}</strong><span>${c.seats} seats</span><span class="price">€${priceFor(route.km,route.mins,key).toFixed(2)}</span></button>`).join('')}function selectType(key){selected=key;document.querySelectorAll('.type').forEach(x=>x.classList.remove('active'));const el=document.getElementById('type-'+key);if(el)el.classList.add('active');if(route.km){document.getElementById('fare').textContent='€'+priceFor(route.km,route.mins,key).toFixed(2)}}function requestRide(){rideRequested=true;document.getElementById('routeBtn').disabled=true;document.getElementById('status').textContent=`Searching nearby VASI ${classes[selected].name} drivers…`;setTimeout(()=>{if(!pickup)return;driver=L.marker([pickup[0]+.006,pickup[1]+.008],{icon:L.divIcon({className:'driver',html:classes[selected].emoji,iconSize:[30,30]})}).addTo(map).bindPopup(`VASI ${classes[selected].name} · ${classes[selected].seats} seats`);document.getElementById('status').innerHTML='<span class="success">Driver found · arriving in 4 min</span>';document.getElementById('routeBtn').textContent='Driver on the way';document.getElementById('cancelBtn').classList.remove('hidden');let i=0;driverTimer=setInterval(()=>{if(!driver||!destination)return;const a=driver.getLatLng(),t=L.latLng(destination),n=.08;driver.setLatLng([a.lat+(t.lat-a.lat)*n,a.lng+(t.lng-a.lng)*n]);i++;if(i>35){clearInterval(driverTimer);startWaiting()}},900)},1200)}function startWaiting(){waitSeconds=0;document.getElementById('status').innerHTML='<span class="success">Driver arrived — trip ready</span>';document.getElementById('waiting').classList.remove('hidden');document.getElementById('waiting').textContent='Waiting: 0:00 · Free';waitTimer=setInterval(()=>{waitSeconds++;const mins=Math.floor(waitSeconds/60),secs=waitSeconds%60,paid=Math.max(0,Math.ceil((waitSeconds-180)/60)*.30);document.getElementById('waiting').textContent=waitSeconds<=180?`Waiting: ${mins}:${String(secs).padStart(2,'0')} · Free`:`Waiting: ${mins}:${String(secs).padStart(2,'0')} · €${paid.toFixed(2)}`},1000)}function cancelRide(){clearInterval(driverTimer);clearInterval(waitTimer);if(rideRequested){document.getElementById('status').textContent='Ride cancelled · €5 cancellation fee'}else{document.getElementById('status').textContent='Ride cancelled'}resetRide(false)}function resetRide(showStatus=true){clearInterval(driverTimer);clearInterval(waitTimer);if(driver)driver.remove();driver=null;destination=null;route={km:0,mins:0};rideRequested=false;if(destMarker)destMarker.remove();if(routeLine)routeLine.remove();document.getElementById('fare').textContent='—';document.getElementById('destination').textContent='Tap map to choose destination';document.getElementById('types').innerHTML='';document.getElementById('types').classList.add('hidden');document.getElementById('routeBtn').disabled=false;document.getElementById('routeBtn').textContent='Set destination';document.getElementById('routeBtn').onclick=buildRoute;document.getElementById('cancelBtn').classList.add('hidden');document.getElementById('waiting').classList.add('hidden');if(showStatus)document.getElementById('status').textContent='Ride reset'}init();</script></body></html>
