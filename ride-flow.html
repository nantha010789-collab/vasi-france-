<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>VASI Ride</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{font-family:Inter,system-ui,sans-serif;color:#fff;background:#050505}*{box-sizing:border-box}body{margin:0;background:#050505}.app{min-height:100vh;max-width:720px;margin:auto;padding:16px;background:#050505}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:30px;font-weight:900}.back{border:1px solid #333;background:#151515;color:#fff;border-radius:12px;padding:9px 13px}.map{height:48vh;min-height:330px;margin:14px 0;border-radius:24px;overflow:hidden;border:1px solid #292929;background:#ddd}.panel{border:1px solid #292929;background:#111;border-radius:22px;padding:16px}.field{padding:13px;border-radius:14px;background:#181818;margin-bottom:9px;color:#999;cursor:pointer}.field b{color:#fff;display:block;margin-top:4px}.cta{width:100%;border:0;border-radius:16px;padding:16px;background:#fff;color:#050505;font-weight:800;font-size:16px}.cta:disabled{opacity:.45}.info{display:flex;justify-content:space-between;margin:12px 0;color:#aaa}.info b{color:#fff}.status{text-align:center;color:#888;font-size:13px;min-height:20px}.leaflet-control-attribution{font-size:9px}.driver{font-size:22px}.hidden{display:none}.cancel{background:transparent;color:#aaa;border:0;width:100%;padding:12px}.fare{font-size:24px;font-weight:900;color:#fff}.success{color:#fff;font-weight:700}</style></head><body><main class="app"><header class="top"><div class="brand">VASI</div><button class="back" onclick="location.href='index.html'">Home</button></header><div id="map" class="map"></div><section class="panel"><div class="field" onclick="useLocation()">📍 Pickup<b id="pickup">Use my current location</b></div><div class="field" onclick="focusDestination()">🏁 Destination<b id="destination">Tap map to choose destination</b></div><div class="info"><span>Estimated fare</span><span class="fare" id="fare">—</span></div><button id="routeBtn" class="cta" onclick="buildRoute()">Set destination</button><button id="cancelBtn" class="cancel hidden" onclick="resetRide()">Cancel</button><p id="status" class="status">Getting ready…</p></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>let map,pickupMarker,destMarker,routeLine,pickup=null,destination=null,driver=null,driverTimer=null;const fallback=[49.189,2.449];function init(){map=L.map('map',{zoomControl:false}).setView(fallback,13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);map.on('click',e=>{if(!pickup){pickup=[e.latlng.lat,e.latlng.lng];setPickup(pickup)}else{destination=[e.latlng.lat,e.latlng.lng];setDestination(destination)}});useLocation()}function useLocation(){if(!navigator.geolocation){setPickup(fallback);return}document.getElementById('status').textContent='Requesting your location…';navigator.geolocation.getCurrentPosition(p=>setPickup([p.coords.latitude,p.coords.longitude]),()=>{setPickup(fallback);document.getElementById('status').textContent='Location permission unavailable — choose on map'})}function setPickup(p){pickup=p;if(pickupMarker)pickupMarker.remove();pickupMarker=L.marker(p).addTo(map).bindPopup('VASI pickup').openPopup();map.setView(p,14);document.getElementById('pickup').textContent='Current location';document.getElementById('status').textContent='Now choose your destination';document.getElementById('routeBtn').textContent='Set destination'}function setDestination(p){destination=p;if(destMarker)destMarker.remove();destMarker=L.marker(p).addTo(map).bindPopup('Destination');map.fitBounds(L.latLngBounds([pickup,destination]),{padding:[35,35]});document.getElementById('destination').textContent='Destination selected';document.getElementById('routeBtn').textContent='Get fare & route';document.getElementById('status').textContent='Ready to calculate your trip'}function focusDestination(){document.getElementById('status').textContent='Tap the map to choose your destination'}async function buildRoute(){if(!pickup){useLocation();return}if(!destination){document.getElementById('status').textContent='Tap the map to choose your destination';return}document.getElementById('status').textContent='Calculating route…';try{const u=`https://router.project-osrm.org/route/v1/driving/${pickup[1]},${pickup[0]};${destination[1]},${destination[0]}?overview=full&geometries=geojson`;const r=await fetch(u);const d=await r.json();if(!d.routes?.length)throw Error();const route=d.routes[0];if(routeLine)routeLine.remove();routeLine=L.geoJSON(route.geometry).addTo(map);map.fitBounds(routeLine.getBounds(),{padding:[35,35]});const km=route.distance/1000;const mins=Math.ceil(route.duration/60);const fare=Math.max(6,4.5+km*1.35+mins*0.22);document.getElementById('fare').textContent='€'+fare.toFixed(2);document.getElementById('status').textContent=`${km.toFixed(1)} km · about ${mins} min`;document.getElementById('routeBtn').textContent='Request VASI ride';document.getElementById('routeBtn').onclick=requestRide}catch(e){document.getElementById('status').textContent='Route service unavailable — try again'}}function requestRide(){document.getElementById('routeBtn').disabled=true;document.getElementById('status').textContent='Searching nearby VASI drivers…';setTimeout(()=>{if(!pickup)return;driver=L.marker([pickup[0]+0.006,pickup[1]+0.008],{icon:L.divIcon({className:'driver',html:'🚗',iconSize:[30,30]})}).addTo(map).bindPopup('VASI driver');document.getElementById('status').innerHTML='<span class="success">Driver found · arriving in 4 min</span>';document.getElementById('routeBtn').textContent='Driver on the way';document.getElementById('cancelBtn').classList.remove('hidden');let i=0;driverTimer=setInterval(()=>{if(!driver||!destination)return;const a=driver.getLatLng(),t=L.latLng(destination),n=.08;driver.setLatLng([a.lat+(t.lat-a.lat)*n,a.lng+(t.lng-a.lng)*n]);i++;if(i>35){clearInterval(driverTimer);document.getElementById('status').innerHTML='<span class="success">Driver arrived — trip ready</span>'}},900)},1200)}function resetRide(){clearInterval(driverTimer);if(driver)driver.remove();driver=null;destination=null;if(destMarker)destMarker.remove();if(routeLine)routeLine.remove();document.getElementById('fare').textContent='—';document.getElementById('destination').textContent='Tap map to choose destination';document.getElementById('routeBtn').disabled=false;document.getElementById('routeBtn').textContent='Set destination';document.getElementById('routeBtn').onclick=buildRoute;document.getElementById('cancelBtn').classList.add('hidden');document.getElementById('status').textContent='Ride cancelled'}init();</script></body></html>
