<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>VASI Ride</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{font-family:Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#fff;background:#050505}*{box-sizing:border-box}body{margin:0;background:#050505}.app{min-height:100vh;max-width:760px;margin:auto;padding:14px 14px 28px}.top{display:flex;justify-content:space-between;align-items:center;padding:4px 2px}.brand{font-size:30px;font-weight:950;letter-spacing:-1.5px}.back,.iconbtn{border:1px solid #333;background:#151515;color:#fff;border-radius:13px;padding:9px 13px}.map{height:46vh;min-height:320px;margin:12px 0;border-radius:24px;overflow:hidden;border:1px solid #292929}.panel{border:1px solid #292929;background:#111;border-radius:24px;padding:15px;box-shadow:0 12px 40px #0007}.grab{width:52px;height:4px;border-radius:9px;background:#3b3b3b;margin:0 auto 13px}.field{padding:13px;border-radius:15px;background:#181818;margin-bottom:8px;color:#999;cursor:pointer;border:1px solid #252525}.field b{color:#fff;display:block;margin-top:4px}.field input{width:100%;margin-top:5px;background:transparent;border:0;outline:0;color:#fff;font-size:15px}.section{font-size:13px;font-weight:900;color:#aaa;text-transform:uppercase;letter-spacing:.8px;margin:14px 0 8px}.types{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.type{border:1px solid #303030;background:#151515;color:#fff;border-radius:17px;padding:12px;text-align:left;cursor:pointer}.type.active{border:2px solid #fff;background:#222;padding:11px}.type strong{display:block;font-size:16px}.type span{display:block;color:#999;font-size:11px;margin-top:3px}.type .price{color:#fff;font-weight:900;font-size:15px;margin-top:8px}.fareRow{display:flex;justify-content:space-between;align-items:center;margin:13px 0}.fareLabel{color:#aaa}.fare{font-size:25px;font-weight:950}.trip{text-align:center;color:#aaa;font-size:12px}.paygrid,.options{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.pay,.option{border:1px solid #333;background:#181818;color:#eee;border-radius:13px;padding:10px 6px;font-size:11px;font-weight:800}.pay.active,.option.active{border:2px solid #fff;padding:9px;background:#252525}.cta{width:100%;border:0;border-radius:17px;padding:16px;background:#fff;color:#050505;font-weight:900;font-size:16px;margin-top:12px}.cta:disabled{opacity:.45}.status{text-align:center;color:#888;font-size:12px;min-height:18px;margin:9px 0}.success{color:#fff;font-weight:800}.error{color:#ffb4b4}.cancel{background:transparent;color:#aaa;border:0;width:100%;padding:12px}.driverCard{display:flex;gap:12px;align-items:center;background:#181818;border:1px solid #303030;border-radius:17px;padding:13px;margin-top:10px}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#292929;font-size:24px}.driverCard b{display:block}.driverCard small{display:block;color:#999;margin-top:3px}.driverCard .eta{margin-left:auto;font-weight:900}.policy{display:grid;grid-template-columns:1fr 1fr;gap:7px}.policy div{background:#151515;border-radius:13px;padding:9px;color:#999;font-size:10px}.policy b{display:block;color:#fff;font-size:12px;margin-top:3px}.waiting{text-align:center;color:#aaa;font-size:12px;margin:8px 0}.stops{display:grid;gap:7px;margin:8px 0}.stop{display:flex;align-items:center;justify-content:space-between;background:#181818;border:1px solid #333;border-radius:13px;padding:10px 12px;color:#eee;font-size:12px}.stop button{border:0;background:transparent;color:#aaa;font-size:16px}.hidden{display:none!important}@media(max-width:480px){.paygrid,.options{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="app"><header class="top"><div class="brand">VASI</div><button class="back" onclick="location.href='index.html'">Home</button></header><div id="map" class="map"></div><section class="panel"><div class="grab"></div><div class="field" onclick="useLocation()">📍 Pickup<b id="pickup">Use my current location</b></div><div class="field" onclick="focusDestination()">🏁 Destination<b id="destination">Tap map to choose destination</b></div><div id="searchWrap" class="hidden"><div class="field"><input id="destSearch" placeholder="Enter destination or place" onkeydown="if(event.key==='Enter')searchDestination()"><button class="iconbtn" onclick="searchDestination()">Search</button></div></div><div id="booking" class="hidden"><div class="section">Route</div><div id="stops" class="stops"></div><button class="option" style="width:100%;margin-bottom:8px" onclick="addStop()">➕ Add stop <span id="stopCount">0/5</span></button><div class="section">Choose vehicle</div><div id="types" class="types"></div><div class="fareRow"><span class="fareLabel">Upfront fare</span><span class="fare" id="fare">—</span></div><div id="tripInfo" class="trip"></div><div class="section">Payment</div><div class="paygrid"><button class="pay active" onclick="payment(this,'cash')">💶 Cash</button><button class="pay" onclick="payment(this,'card')">💳 Card</button><button class="pay" onclick="payment(this,'apple_pay')"> Apple Pay</button></div><div class="section">Pickup time</div><div class="options"><button id="nowBtn" class="option active" onclick="pickupNow(this)">⚡ Now</button><button class="option" onclick="chooseCustomTime()">🗓️ Custom date & time</button></div><div id="customTime" class="hidden"><input id="pickupDate" type="date" style="width:100%;padding:12px;border-radius:13px;background:#181818;color:#fff;border:1px solid #333;margin-top:7px"><input id="pickupClock" type="time" style="width:100%;padding:12px;border-radius:13px;background:#181818;color:#fff;border:1px solid #333;margin-top:7px"><button class="option" style="width:100%;margin-top:7px" onclick="applyCustomTime()">✓ Use this pickup time</button></div><div class="policy" style="margin-top:10px"><div>Cancellation<b>€5</b></div><div>Waiting<b>3 min free · €0.30/min</b></div></div><button id="routeBtn" class="cta" onclick="requestRide()">Request VASI ride</button></div><div id="driverArea" class="hidden"><div class="driverCard"><div class="avatar" id="driverEmoji">🚗</div><div><b id="driverTitle">VASI driver</b><small id="driverSub">Finding your driver…</small></div><div class="eta" id="eta">—</div></div><div id="waiting" class="waiting hidden"></div><button id="cancelBtn" class="cancel" onclick="cancelRide()">Cancel ride · €5</button></div><p id="status" class="status">Getting your pickup location…</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const SUPABASE_URL='https://vhfyvkrvysrooaqzcxsp.supabase.co',SUPABASE_KEY='sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT',sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let map,pickupMarker,destMarker,routeLine,driverMarker,pickup=null,destination=null,statusTimer=null,waitTimer=null,waitSeconds=0,ride=null,selected='go',pay='cash',pickupChoice='Now',customPickup=null,stops=[],route={km:0,mins:0},etaLastUpdate=0;const fallback=[49.189,2.449],classes={go:{name:'Go',seats:4,emoji:'🚗',base:4.2,km:1.25,min:.20,minFare:6},comfort:{name:'Comfort',seats:4,emoji:'🚘',base:5,km:1.40,min:.22,minFare:7},xl:{name:'XL',seats:6,emoji:'🚙',base:6.2,km:1.65,min:.25,minFare:9},van:{name:'Van',seats:9,emoji:'🚐',base:7.5,km:1.90,min:.29,minFare:12}};const $=id=>document.getElementById(id),money=n=>'€'+Number(n||0).toFixed(2);function priceFor(km,mins,key){const c=classes[key];return Math.max(c.minFare,c.base+km*c.km+mins*c.min)}function init(){map=L.map('map',{zoomControl:false}).setView(fallback,13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);map.on('click',e=>{if(!pickup)setPickup([e.latlng.lat,e.latlng.lng]);else setDestination([e.latlng.lat,e.latlng.lng])});useLocation()}function useLocation(){if(!navigator.geolocation){setPickup(fallback);return}$('status').textContent='Requesting your location…';navigator.geolocation.getCurrentPosition(p=>setPickup([p.coords.latitude,p.coords.longitude]),()=>{setPickup(fallback);$('status').textContent='Location permission unavailable — pickup set on map'})}function setPickup(p){pickup=p;if(pickupMarker)pickupMarker.remove();pickupMarker=L.marker(p).addTo(map).bindPopup('VASI pickup').openPopup();map.setView(p,14);$('pickup').textContent='Current location';$('status').textContent='Now choose your destination'}function setDestination(p,label='Destination selected'){destination=p;if(destMarker)destMarker.remove();destMarker=L.marker(p).addTo(map).bindPopup(label);map.fitBounds(L.latLngBounds([pickup,destination]),{padding:[35,35]});$('destination').textContent=label;buildRoute()}function focusDestination(){$('searchWrap').classList.remove('hidden');$('destSearch').focus();$('status').textContent='Enter a destination or tap the map'}async function searchDestination(){const q=$('destSearch').value.trim();if(!q)return;$('status').textContent='Finding destination…';try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));const d=await r.json();if(!d.length)throw Error();setDestination([Number(d[0].lat),Number(d[0].lon)],d[0].display_name.split(',').slice(0,2).join(','));$('searchWrap').classList.add('hidden')}catch(e){$('status').innerHTML='<span class="error">Destination not found — try another place</span>'}}async function buildRoute(){if(!pickup||!destination)return;$('status').textContent='Calculating route…';try{const u=`https://router.project-osrm.org/route/v1/driving/${pickup[1]},${pickup[0]};${destination[1]},${destination[0]}?overview=full&geometries=geojson`;const d=await(await fetch(u)).json();if(!d.routes?.length)throw Error();const r=d.routes[0];route.km=r.distance/1000;route.mins=Math.ceil(r.duration/60);if(routeLine)routeLine.remove();routeLine=L.geoJSON(r.geometry).addTo(map);map.fitBounds(routeLine.getBounds(),{padding:[35,35]});renderTypes();$('booking').classList.remove('hidden');selectType(selected);$('tripInfo').textContent=`${route.km.toFixed(1)} km · about ${route.mins} min`;$('status').textContent='Choose your vehicle, stops and pickup time'}catch(e){$('status').innerHTML='<span class="error">Route service unavailable — try again</span>'}}function renderTypes(){$('types').innerHTML=Object.entries(classes).map(([k,c])=>`<button class="type" id="type-${k}" onclick="selectType('${k}')"><strong>${c.emoji} ${c.name}</strong><span>${c.seats} seats</span><span class="price">${money(priceFor(route.km,route.mins,k))}</span></button>`).join('')}function selectType(k){selected=k;document.querySelectorAll('.type').forEach(x=>x.classList.remove('active'));const el=$('type-'+k);if(el)el.classList.add('active');const f=priceFor(route.km,route.mins,k);$('fare').textContent=money(f);$('routeBtn').textContent=`Request ${classes[k].name} · ${money(f)}`}function payment(el,v){pay=v;document.querySelectorAll('.pay').forEach(x=>x.classList.remove('active'));el.classList.add('active')}function addStop(){if(stops.length>=5)return toast('Maximum 5 stops');const n=prompt('Enter stop address');if(!n||!n.trim())return;stops.push(n.trim());renderStops()}function renderStops(){$('stops').innerHTML=stops.map((s,i)=>`<div class="stop"><span>📍 ${esc(s)}</span><button onclick="removeStop(${i})">×</button></div>`).join('');$('stopCount').textContent=stops.length+'/5'}function removeStop(i){stops.splice(i,1);renderStops()}function pickupNow(el){pickupChoice='Now';customPickup=null;document.querySelectorAll('.options .option').forEach(x=>x.classList.remove('active'));el.classList.add('active');$('customTime').classList.add('hidden');$('status').textContent='Ready to request your VASI ride'}function chooseCustomTime(){$('customTime').classList.remove('hidden');$('pickupDate').min=new Date().toISOString().slice(0,10);const n=new Date(Date.now()+60*60*1000);$('pickupDate').value=n.toISOString().slice(0,10);$('pickupClock').value=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');pickupChoice='Custom';document.querySelectorAll('.options .option').forEach(x=>x.classList.remove('active'));$('status').textContent='Choose your custom pickup date and time'}function applyCustomTime(){const d=$('pickupDate').value,t=$('pickupClock').value;if(!d||!t)return toast('Choose a date and time');const when=new Date(d+'T'+t);if(when.getTime()<Date.now()+30*60*1000)return toast('Pickup must be at least 30 minutes from now');customPickup=when.toISOString();pickupChoice='Custom';$('customTime').classList.add('hidden');$('status').textContent='Custom pickup: '+d+' '+t}function toast(msg){$('status').textContent=msg}async function getSession(){return(await sb.auth.getSession()).data.session}async function requestRide(){if(!pickup||!destination)return;const s=await getSession();if(!s){localStorage.setItem('vasi_return','ride-flow.html');$('status').innerHTML='<span class="error">Please sign in to book a real VASI ride.</span>';setTimeout(()=>location.href='auth.html',700);return}$('routeBtn').disabled=true;$('status').textContent='Creating your VASI ride…';const scheduled=pickupChoice==='Now'?null:customPickup;if(pickupChoice==='Custom'&&!scheduled){$('routeBtn').disabled=false;return toast('Please confirm your custom pickup time')}try{const res=await fetch('/api/create-ride',{method:'POST',headers:{Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify({pickup_address:$('pickup').textContent,pickup_lat:pickup[0],pickup_lng:pickup[1],destination_address:$('destination').textContent,destination_lat:destination[0],destination_lng:destination[1],service:'VASI '+classes[selected].name,payment_method:pay,estimated_fare:priceFor(route.km,route.mins,selected),currency:'EUR',scheduled_for:scheduled,stops:stops})});const d=await res.json();if(!res.ok)throw Error(d.error||'Could not create ride');ride=d.ride||d;if(!ride.id)throw Error('Ride ID missing');showRide(ride);startStatusPolling()}catch(e){$('routeBtn').disabled=false;$('status').innerHTML='<span class="error">'+esc(e.message||'Booking failed')+'</span>'}}function showRide(r){$('booking').classList.add('hidden');$('driverArea').classList.remove('hidden');const c=classes[selected];$('driverEmoji').textContent=c.emoji;$('driverTitle').textContent=r.driver_name||('VASI '+c.name+' driver');$('driverSub').textContent=(r.driver_name?'Driver assigned · ':'Searching nearby drivers · ')+c.seats+' seats · '+payLabel(pay);setRideStatus(r)}function payLabel(v){return v==='apple_pay'?'Apple Pay':v==='card'?'Card':'Cash'}async function updateDriverEta(lat,lng,st){if(!pickup||!['accepted','driver_arriving'].includes(st))return;if(Date.now()-etaLastUpdate<12000)return;etaLastUpdate=Date.now();try{const u=`https://router.project-osrm.org/route/v1/driving/${lng},${lat};${pickup[1]},${pickup[0]}?overview=false`;const d=await(await fetch(u)).json();const mins=d.routes?.[0]?.duration/60;if(Number.isFinite(mins))$('eta').textContent=Math.max(1,Math.ceil(mins))+' min'}catch(e){}}function setRideStatus(r){const st=String(r.status||'requested').toLowerCase();const driverLat=Number(r.driver_lat??r.driver_latitude),driverLng=Number(r.driver_lng??r.driver_longitude);if(Number.isFinite(driverLat)&&Number.isFinite(driverLng)){if(!driverMarker)driverMarker=L.marker([driverLat,driverLng]).addTo(map).bindPopup('VASI driver');else driverMarker.setLatLng([driverLat,driverLng]);updateDriverEta(driverLat,driverLng,st)}else if(!['driver_arriving','in_progress'].includes(st))$('eta').textContent='—';if(st==='driver_arriving')$('eta').textContent='Arrived';if(st==='in_progress')$('eta').textContent='On trip';if(r.driver_name)$('driverTitle').textContent='VASI '+classes[selected].name+' · '+r.driver_name;const car=[r.driver_vehicle_color,r.driver_vehicle_make,r.driver_vehicle_model,r.driver_vehicle_plate].filter(Boolean).join(' · ');if(car)$('driverSub').textContent=car;const labels={requested:'Finding a VASI driver…',searching_driver:'Finding a VASI driver…',driver_assigned:'Driver assigned · waiting for acceptance',accepted:'Driver accepted · on the way',driver_arriving:'Driver arrived — waiting for you',in_progress:'Trip in progress',completed:'Trip completed',cancelled:'Ride cancelled',canceled:'Ride cancelled'};$('status').innerHTML=st==='completed'?'<span class="success">Trip completed</span>':['cancelled','canceled'].includes(st)?'<span class="error">Ride cancelled</span>':'<span class="success">'+(labels[st]||st.replaceAll('_',' '))+'</span>';if(st==='driver_arriving'&&!waitTimer)startWaiting();if(['in_progress','completed','cancelled','canceled'].includes(st))$('cancelBtn').classList.add('hidden');if(['completed','cancelled','canceled'].includes(st)){clearInterval(statusTimer);clearInterval(waitTimer)}}async function startStatusPolling(){clearInterval(statusTimer);statusTimer=setInterval(loadRideStatus,4000);await loadRideStatus()}async function loadRideStatus(){if(!ride?.id)return;try{const s=await getSession();if(!s)return;const r=await fetch('/api/ride-status?id='+encodeURIComponent(ride.id),{headers:{Authorization:'Bearer '+s.access_token}});const d=await r.json();if(!r.ok)throw Error(d.error||'Status unavailable');ride=d;setRideStatus(ride)}catch(e){}}function startWaiting(){if(waitTimer)return;waitSeconds=0;$('waiting').classList.remove('hidden');waitTimer=setInterval(()=>{waitSeconds++;const m=Math.floor(waitSeconds/60),s=waitSeconds%60,fee=Math.max(0,Math.ceil((waitSeconds-180)/60)*.30);$('waiting').textContent=waitSeconds<=180?`Waiting: ${m}:${String(s).padStart(2,'0')} · Free`:`Waiting: ${m}:${String(s).padStart(2,'0')} · ${money(fee)}`},1000)}async function cancelRide(){if(!ride?.id)return;if(!confirm('Cancel this VASI ride? A €5 cancellation fee applies.'))return;const s=await getSession();if(!s)return;try{$('cancelBtn').disabled=true;const r=await fetch('/api/ride-status?id='+encodeURIComponent(ride.id),{method:'DELETE',headers:{Authorization:'Bearer '+s.access_token}});const d=await r.json();if(!r.ok)throw Error(d.error||'Cancellation could not be completed');ride=d.ride||ride;const fee=d.cancellation_fee??5;$('status').innerHTML='<span class="error">Ride cancelled · '+money(fee)+' cancellation fee</span>';$('cancelBtn').classList.add('hidden');$('eta').textContent='—';clearInterval(statusTimer);clearInterval(waitTimer)}catch(e){$('cancelBtn').disabled=false;$('status').innerHTML='<span class="error">'+esc(e.message)+'</span>'}}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}init();</script></body></html>
