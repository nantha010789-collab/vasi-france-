<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VASI Admin · Discounts</title><style>body{margin:0;background:#050505;color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:28px;font-weight:950}.card{background:#111;border:1px solid #292929;border-radius:18px;padding:16px;margin-top:12px}input,select{width:100%;padding:12px;margin:6px 0;background:#181818;color:#fff;border:1px solid #333;border-radius:10px;box-sizing:border-box}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:1px solid #333;background:#fff;color:#050505;border-radius:11px;padding:11px 14px;font-weight:900}.item{border-top:1px solid #292929;padding:14px 0}.muted{color:#999;font-size:12px}.danger{background:#311919;color:#fff}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style>  <link rel="stylesheet" href="./vasi-mobile-fit.css" />
  </head><body><main class="wrap"><header class="top"><div><div class="brand">VASI Admin</div><div class="muted">Discount & promo management</div></div><button class="btn" onclick="location.href='vasi-admin.html'">Dashboard</button></header><section class="card"><h2>Create discount</h2><div class="grid"><div><label>Promo code</label><input id="code" placeholder="VASI10"></div><div><label>Type</label><select id="type"><option value="percent">Percentage</option><option value="fixed">Fixed €</option></select></div><div><label>Value</label><input id="value" type="number" min="0" step="0.01"></div><div><label>Usage limit</label><input id="limit" type="number" min="1" placeholder="Optional"></div><div><label>Starts</label><input id="starts" type="datetime-local"></div><div><label>Ends</label><input id="ends" type="datetime-local"></div></div><button class="btn" onclick="createDiscount()">Create promo</button><p id="msg" class="muted"></p></section><section class="card"><h2>Discounts</h2><div id="list" class="muted">Loading…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"></script><script>const db=supabase.createClient('https://vhfyvkrvysrooaqzcxsp.supabase.co','sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT');const endpoint='https://vhfyvkrvysrooaqzcxsp.supabase.co/functions/v1/admin-service';async function call(body){const {data:{session}}=await db.auth.getSession();if(!session){location.href='admin-login.html';return null}const r=await fetch(endpoint,{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify(body)});if(r.status===401||r.status===403){await db.auth.signOut();location.href='admin-login.html';return null}return r.json()}async function createDiscount(){const code=document.getElementById('code').value.trim().toUpperCase();const value=Number(document.getElementById('value').value);const type=document.getElementById('type').value;const limit=document.getElementById('limit').value;const starts=document.getElementById('starts').value;const ends=document.getElementById('ends').value;if(!code||!value)return msg('Enter promo code and value');const d=await call({action:'create_discount',discount:{code,type,value,usage_limit:limit?Number(limit):null,starts_at:starts?new Date(starts).toISOString():null,ends_at:ends?new Date(ends).toISOString():null,active:true}});msg(d?.error||'✓ Discount created');if(!d?.error)load()}async function load(){const d=await call({action:'list_discounts'});if(!d)return;const rows=d.discounts||[];document.getElementById('list').innerHTML=rows.length?rows.map(x=>`<div class="item"><b>${x.code}</b> · ${x.type==='percent'?x.value+'%':'€'+x.value}<div class="muted">${x.active?'Active':'Disabled'} · Used ${x.usage_count||0}${x.usage_limit?' / '+x.usage_limit:''}</div><button class="btn danger" onclick="disable('${x.id}')">Disable</button></div>`).join(''):'No discounts yet.'}async function disable(id){const d=await call({action:'disable_discount',discount_id:id});if(d?.error)return msg(d.error);load()}function msg(x){document.getElementById('msg').textContent=x}load()</script><script src="./vasi-languages.js"></script></body></html>
