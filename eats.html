<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VASI Eats</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#fff;background:#050505}*{box-sizing:border-box}body{margin:0;background:#050505}.app{max-width:720px;margin:auto;padding:20px 18px 40px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:30px;font-weight:900}.back,.cart{border:1px solid #303030;background:#151515;color:#ddd;border-radius:12px;padding:9px 13px}.hero{padding:30px 0 18px}.hero h1{font-size:42px;margin:8px 0}.hero p,.muted{color:#999}.search{width:100%;padding:15px;border-radius:15px;border:1px solid #292929;background:#151515;color:#fff;font-size:16px}.list{display:grid;gap:12px;margin-top:18px}.restaurant{border:1px solid #292929;border-radius:20px;background:#111;padding:16px}.restaurant h2{font-size:19px;margin:0 0 5px}.menu{display:grid;gap:7px;margin-top:13px}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#181818;border-radius:14px;padding:11px}.item button{border:0;background:#fff;color:#050505;border-radius:10px;padding:8px 11px;font-weight:900}.status{text-align:center;color:#999;min-height:20px;margin-top:14px}.launch{border:1px solid #235d3a;background:#112b1c;color:#86efa9;border-radius:13px;padding:10px;text-align:center;font-size:12px;margin-top:12px}</style></head><body><main class="app"><header class="top"><div class="brand">VASI</div><div><button class="cart" onclick="checkout()">Cart <span id="count">0</span></button> <button class="back" onclick="location.href='index.html'">Home</button></div></header><section class="hero"><div class="muted">VASI Eats</div><h1>Food, your way.</h1><p>Choose items, see the exact total and order securely.</p></section><input id="search" class="search" placeholder="Search restaurant or food…" oninput="render()"><div class="launch">VASI launch menu · verified partner restaurants will be added here</div><section class="list" id="restaurants"><p class="muted">Loading menu…</p></section><p id="status" class="status"></p></main><script>
const el=id=>document.getElementById(id);let catalog=[];let basket=JSON.parse(localStorage.getItem('vasi_eats_basket')||'{"restaurant_id":null,"items":{}}');
function count(){return Object.values(basket.items||{}).reduce((a,b)=>a+Number(b||0),0)}function save(){localStorage.setItem('vasi_eats_basket',JSON.stringify(basket));el('count').textContent=count()}
function add(restaurantId,itemId){if(basket.restaurant_id&&basket.restaurant_id!==restaurantId){basket={restaurant_id:restaurantId,items:{}};el('status').textContent='Basket started for a new restaurant.'}basket.restaurant_id=restaurantId;basket.items[itemId]=(basket.items[itemId]||0)+1;save();render()}
function remove(itemId){if(!basket.items[itemId])return;basket.items[itemId]--;if(basket.items[itemId]<=0)delete basket.items[itemId];if(!count())basket.restaurant_id=null;save();render()}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=el('search').value.trim().toLowerCase();const rows=catalog.filter(r=>(r.name+' '+r.cuisine+' '+r.items.map(i=>i.name).join(' ')).toLowerCase().includes(q));el('restaurants').innerHTML=rows.map(r=>`<article class="restaurant"><h2>${r.icon} ${esc(r.name)}</h2><div class="muted">${esc(r.cuisine)} · ${esc(r.eta)}</div><div class="menu">${r.items.map(i=>`<div class="item"><div><b>${esc(i.name)}</b><div class="muted">€${Number(i.price).toFixed(2)}</div></div><div>${basket.restaurant_id===r.id&&basket.items[i.id]?`<button onclick="remove('${i.id}')">− ${basket.items[i.id]}</button> `:''}<button onclick="add('${r.id}','${i.id}')">Add</button></div></div>`).join('')}</div></article>`).join('')||'<p class="muted">No matching food found.</p>'}
function checkout(){if(!count()){el('status').textContent='Add an item before checkout.';return}location.href='eats-checkout.html'}
fetch('/api/eats-order').then(r=>r.json()).then(d=>{catalog=d.restaurants||[];render()}).catch(()=>{el('restaurants').innerHTML='<p class="muted">Menu is temporarily unavailable.</p>'});save();
</script></body></html>
