<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VASI Eats</title><style>:root{font-family:Inter,system-ui;color:#fff;background:#050505}*{box-sizing:border-box}body{margin:0}.app{max-width:720px;margin:auto;padding:20px 18px 50px}.top,.item{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:30px;font-weight:950}.btn{border:1px solid #333;background:#171717;color:#fff;border-radius:12px;padding:10px 13px;font-weight:800}.hero{padding:30px 0 16px}.hero h1{font-size:42px;margin:8px 0}.muted{color:#999}.search{width:100%;padding:15px;border-radius:15px;border:1px solid #292929;background:#151515;color:#fff;font-size:16px}.join{border:1px solid #235d3a;background:#112b1c;color:#86efa9;border-radius:13px;padding:11px;text-align:center;font-size:13px;margin-top:12px}.join a{color:#fff}.list,.menu{display:grid;gap:12px;margin-top:18px}.restaurant{border:1px solid #292929;border-radius:20px;background:#111;padding:16px}.restaurant h2{font-size:20px;margin:0 0 5px}.menu{gap:7px;margin-top:13px}.item{background:#181818;border-radius:14px;padding:11px}.item button{border:0;background:#fff;color:#050505;border-radius:10px;padding:8px 11px;font-weight:900}.status{text-align:center;color:#999;min-height:20px}</style>  <link rel="stylesheet" href="./vasi-mobile-fit.css" />
  </head><body><main class="app"><header class="top"><div class="brand">VASI.</div><div><button class="btn" onclick="checkout()">Cart <span id="count">0</span></button> <button class="btn" onclick="location.href='index.html'">Home</button></div></header><section class="hero"><div class="muted">VASI Eats</div><h1>Food, your way.</h1><p class="muted">Order from approved local restaurant partners.</p></section><input id="search" class="search" placeholder="Search restaurant or food…" oninput="render()"><div class="join">Own a restaurant? <a href="restaurant-register.html"><b>Join VASI</b></a> · <a href="restaurant-dashboard.html">Partner dashboard</a></div><section class="list" id="restaurants"><p class="muted">Loading partner restaurants…</p></section><p id="status" class="status"></p></main><script>const el=id=>document.getElementById(id);let catalog=[],basket=JSON.parse(localStorage.getItem('vasi_eats_basket')||'{"restaurant_id":null,"items":{}}');const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function count(){return Object.values(basket.items||{}).reduce((a,b)=>a+Number(b||0),0)}function save(){localStorage.setItem('vasi_eats_basket',JSON.stringify(basket));el('count').textContent=count()}function add(r,i){if(basket.restaurant_id&&basket.restaurant_id!==r){basket={restaurant_id:r,items:{}};el('status').textContent='Basket started for a new restaurant.'}basket.restaurant_id=r;basket.items[i]=(basket.items[i]||0)+1;save();render()}function remove(i){if(!basket.items[i])return;basket.items[i]--;if(basket.items[i]<=0)delete basket.items[i];if(!count())basket.restaurant_id=null;save();render()}function render(){const q=el('search').value.trim().toLowerCase(),rows=catalog.filter(r=>(r.name+' '+r.cuisine+' '+r.items.map(i=>i.name).join(' ')).toLowerCase().includes(q));el('restaurants').innerHTML=rows.map(r=>`<article class="restaurant"><h2>${r.icon} ${esc(r.name)}</h2><div class="muted">${esc(r.cuisine)} · ${esc(r.eta)} · Delivery €${Number(r.delivery_fee||0).toFixed(2)}</div><div class="menu">${r.items.map(i=>`<div class="item"><div><b>${esc(i.name)}</b><div class="muted">€${Number(i.price).toFixed(2)}</div></div><div>${basket.restaurant_id===r.id&&basket.items[i.id]?`<button onclick="remove('${i.id}')">− ${basket.items[i.id]}</button> `:''}<button onclick="add('${r.id}','${i.id}')">Add</button></div></div>`).join('')}</div></article>`).join('')||(q?'<p class="muted">No matching food found.</p>':'<p class="muted">No partner restaurants are online right now. Please check again soon.</p>')}function checkout(){if(!count()){el('status').textContent='Add an item before checkout.';return}location.href='eats-checkout.html'}fetch('/api/eats-order').then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error);catalog=d.restaurants||[];render()}).catch(e=>el('restaurants').innerHTML='<p class="muted">'+esc(e.message||'Menu unavailable')+'</p>');save()</script><script src="./vasi-languages.js"></script></body></html>
