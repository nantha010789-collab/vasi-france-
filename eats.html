<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>VASI Eats</title>
  <style>
    :root{font-family:Inter,system-ui;color:#fff;background:#050505;--muted:#a1a1a1;--line:#292929;--green:#7dff9b}
    *{box-sizing:border-box}body{margin:0;background:#050505}.app{max-width:760px;margin:auto;padding:max(20px,env(safe-area-inset-top)) 18px calc(112px + env(safe-area-inset-bottom))}
    button,input{font:inherit}.top,.item,.restaurant-head,.cartbar{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:30px;font-weight:950}.top-actions{display:flex;gap:7px}.btn{border:1px solid #333;background:#171717;color:#fff;border-radius:12px;padding:10px 13px;font-weight:800;min-height:44px;cursor:pointer}.hero{padding:30px 0 16px}.hero h1{font-size:clamp(38px,10vw,52px);letter-spacing:-.045em;margin:8px 0}.muted{color:var(--muted);font-size:13px;line-height:1.45}.search{width:100%;padding:15px;border-radius:15px;border:1px solid var(--line);background:#151515;color:#fff;font-size:16px}.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid #333;background:#141414;color:#ddd;border-radius:999px;padding:9px 13px;font-weight:800}.chip.active{background:#fff;color:#050505;border-color:#fff}.join{border:1px solid #235d3a;background:#112b1c;color:#86efa9;border-radius:13px;padding:11px;text-align:center;font-size:13px;margin-top:12px}.join a{color:#fff}.list,.menu{display:grid;gap:13px;margin-top:18px}.restaurant{border:1px solid var(--line);border-radius:22px;background:#101010;padding:16px}.restaurant h2{font-size:21px;margin:0 0 5px}.open{color:var(--green);font-size:12px;font-weight:900}.facts{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.fact{background:#1b1b1b;border-radius:999px;padding:6px 9px;font-size:12px;color:#ccc}.menu{gap:8px;margin-top:14px}.item{background:#181818;border-radius:15px;padding:11px;align-items:flex-start}.food{display:flex;gap:11px;min-width:0}.food-photo,.food-placeholder{width:72px;height:72px;flex:none;border-radius:12px;object-fit:cover;background:#232323}.food-placeholder{display:grid;place-items:center;font-size:25px}.food-copy{min-width:0}.food-copy b{display:block;margin:1px 0 3px}.allergen{color:#ffc766;font-size:11px;margin-top:4px}.quantity{display:flex;align-items:center;gap:6px;flex:none}.quantity button{border:0;background:#fff;color:#050505;border-radius:10px;min-width:38px;min-height:38px;padding:8px 10px;font-weight:950}.quantity .remove{background:#292929;color:#fff}.status{text-align:center;color:#aaa;min-height:20px}.cartbar{position:fixed;z-index:10;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 24px),724px);padding:11px 12px 11px 16px;border:1px solid #3c3c3c;border-radius:18px;background:rgba(24,24,24,.96);box-shadow:0 12px 35px #000;backdrop-filter:blur(12px)}.cartbar[hidden]{display:none}.cart-total{font-size:13px}.cart-total b{display:block;font-size:18px}.checkout{background:#fff;color:#050505;border:0;border-radius:13px;padding:12px 16px;font-weight:950;min-height:46px}.empty{padding:32px 8px;text-align:center}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:520px){.app{padding-left:12px;padding-right:12px}.item{align-items:center}.food-photo,.food-placeholder{width:58px;height:58px}.food-copy .muted{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.top .btn{padding:9px 10px}.restaurant{padding:14px}.quantity{gap:4px}.quantity button{min-width:34px;padding:7px}}
  </style>
  <link rel="stylesheet" href="./vasi-mobile-fit.css">
</head>
<body>
  <main class="app">
    <header class="top"><div class="brand">VASI.</div><div class="top-actions"><button class="btn" onclick="location.href='activity.html?filter=eats'">Orders</button><button class="btn" onclick="location.href='index.html'">Home</button></div></header>
    <section class="hero"><div class="muted">VASI Eats</div><h1>Food, your way.</h1><p class="muted">Approved local restaurants, live menus and protected delivery.</p></section>
    <label class="sr-only" for="search">Search restaurants, dishes or allergens</label>
    <input id="search" class="search" placeholder="Search restaurant, dish or cuisine…" autocomplete="off" oninput="render()">
    <nav id="chips" class="chips" aria-label="Cuisine filters"></nav>
    <div class="join">Own a restaurant? <a href="restaurant-register.html"><b>Join VASI</b></a> · <a href="restaurant-dashboard.html">Partner dashboard</a></div>
    <section class="list" id="restaurants"><p class="muted">Loading partner restaurants…</p></section>
    <p id="status" class="status" aria-live="polite"></p>
  </main>
  <aside id="cartbar" class="cartbar" hidden aria-live="polite">
    <div class="cart-total"><span id="cartRestaurant">Your basket</span><b><span id="count">0</span> items · <span id="basketTotal">€0.00</span></b></div>
    <button class="checkout" onclick="checkout()">View basket →</button>
  </aside>
  <script src="./vasi-languages.js"></script>
  <script>
    const el=id=>document.getElementById(id);
    const t=value=>window.VasiLanguage?.translate?.(value)||value;
    let catalog=[],activeCuisine='All',basket=JSON.parse(localStorage.getItem('vasi_eats_basket')||'{"restaurant_id":null,"items":{}}');
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const count=()=>Object.values(basket.items||{}).reduce((a,b)=>a+Number(b||0),0);
    const basketRestaurant=()=>catalog.find(r=>r.id===basket.restaurant_id);
    function basketValue(){const restaurant=basketRestaurant();return (restaurant?.items||[]).reduce((sum,item)=>sum+Number(item.price||0)*Number(basket.items[item.id]||0),0)}
    function save(){localStorage.setItem('vasi_eats_basket',JSON.stringify(basket));const quantity=count(),restaurant=basketRestaurant();el('count').textContent=quantity;el('basketTotal').textContent='€'+basketValue().toFixed(2);el('cartRestaurant').textContent=restaurant?.name||t('Your basket');el('cartbar').hidden=!quantity}
    function add(restaurantId,itemId){if(basket.restaurant_id&&basket.restaurant_id!==restaurantId){basket={restaurant_id:restaurantId,items:{}};el('status').textContent=t('New basket started. You can order from one restaurant at a time.')}basket.restaurant_id=restaurantId;basket.items[itemId]=(basket.items[itemId]||0)+1;save();render()}
    function remove(itemId){if(!basket.items[itemId])return;basket.items[itemId]--;if(basket.items[itemId]<=0)delete basket.items[itemId];if(!count())basket.restaurant_id=null;save();render()}
    function setCuisine(value){activeCuisine=value;renderChips();render()}
    function renderChips(){const cuisines=['All',...new Set(catalog.map(r=>r.cuisine).filter(Boolean))];el('chips').innerHTML=cuisines.map(c=>`<button class="chip ${c===activeCuisine?'active':''}" type="button" data-cuisine="${esc(c)}">${c==='All'?esc(t('All food')):esc(c)}</button>`).join('')}
    function searchable(restaurant){return [restaurant.name,restaurant.cuisine,...restaurant.items.flatMap(i=>[i.name,i.description,i.category,...(i.allergens||[])])].filter(Boolean).join(' ').toLowerCase()}
    function render(){
      const query=el('search').value.trim().toLowerCase();
      const rows=catalog.filter(r=>(activeCuisine==='All'||r.cuisine===activeCuisine)&&searchable(r).includes(query));
      el('restaurants').innerHTML=rows.map(r=>`<article class="restaurant">
        <div class="restaurant-head"><div><h2>${r.icon||'🍽️'} ${esc(r.name)}</h2><div class="muted">${esc(r.cuisine||t('Local restaurant'))}</div></div><span class="open">● ${esc(t('OPEN'))}</span></div>
        <div class="facts"><span class="fact">🕒 ${esc(r.eta)}</span><span class="fact">${esc(t('Delivery'))} €${Number(r.delivery_fee||0).toFixed(2)}</span><span class="fact">${esc(t('Min.'))} €${Number(r.minimum_order||0).toFixed(2)}</span></div>
        <div class="menu">${r.items.map(i=>{const qty=basket.restaurant_id===r.id?Number(basket.items[i.id]||0):0;return `<div class="item"><div class="food">${i.photo_url?`<img class="food-photo" src="${esc(i.photo_url)}" alt="${esc(i.name)}" loading="lazy">`:'<div class="food-placeholder" aria-hidden="true">🍽️</div>'}<div class="food-copy"><b>${esc(i.name)}</b><div class="muted">${esc(i.description||i.category||t('Freshly prepared'))}</div>${(i.allergens||[]).length?`<div class="allergen">${esc(t('Allergens'))}: ${esc(i.allergens.join(', '))}</div>`:''}<div><b>€${Number(i.price).toFixed(2)}</b></div></div></div><div class="quantity">${qty?`<button class="remove" aria-label="${esc(t('Remove one'))} ${esc(i.name)}" onclick="remove('${i.id}')">−</button><b>${qty}</b>`:''}<button aria-label="${esc(t('Add'))} ${esc(i.name)}" onclick="add('${r.id}','${i.id}')">+</button></div></div>`}).join('')}</div>
      </article>`).join('')||(catalog.length
        ? `<div class="empty"><b>${esc(t('No matching food found.'))}</b><p class="muted">${esc(t('Try another dish, cuisine or allergen search.'))}</p></div>`
        : `<div class="empty"><b>${esc(t('No restaurants are available yet.'))}</b><p class="muted">${esc(t('Approved partners will appear here as soon as their menus are ready.'))}</p></div>`);
      save();
    }
    function checkout(){if(!count()){el('status').textContent=t('Add an item before checkout.');return}location.href='eats-checkout.html'}
    el('chips').addEventListener('click',event=>{const button=event.target.closest('[data-cuisine]');if(button)setCuisine(button.dataset.cuisine)});
    fetch('/api/eats-order').then(async response=>{const result=await response.json();if(!response.ok)throw Error(result.error);catalog=result.restaurants||[];renderChips();render()}).catch(error=>el('restaurants').innerHTML='<p class="muted">'+esc(error.message||t('Menu unavailable'))+'</p>');
    window.addEventListener('vasi:languagechange',()=>{renderChips();render();save()});
    save();
  </script>
</body>
</html>
