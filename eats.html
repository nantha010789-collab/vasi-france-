<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VASI Eats</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#fff;background:#050505}*{box-sizing:border-box}body{margin:0;background:#050505}.app{max-width:720px;margin:auto;padding:20px 18px 40px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:30px;font-weight:900}.back,.cart{border:1px solid #303030;background:#151515;color:#ddd;border-radius:12px;padding:9px 13px}.hero{padding:30px 0 18px}.eyebrow{color:#999;font-size:12px;text-transform:uppercase;letter-spacing:1.4px}.hero h1{font-size:42px;margin:8px 0}.hero p{color:#aaa}.search{width:100%;padding:15px;border-radius:15px;border:1px solid #292929;background:#151515;color:#fff;font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.card{border:1px solid #292929;border-radius:20px;background:#111;padding:18px;color:#fff;text-align:left;min-height:145px}.icon{font-size:34px}.card h2{font-size:19px;margin:14px 0 5px}.muted{color:#999;font-size:13px}.list{display:grid;gap:10px;margin-top:18px}.restaurant{display:flex;justify-content:space-between;align-items:center;border:1px solid #292929;border-radius:18px;background:#111;padding:15px}.restaurant b{display:block;margin-bottom:5px}.add{border:1px solid #444;background:#fff;color:#050505;border-radius:12px;padding:10px 13px;font-weight:800}.cta{width:100%;border:0;border-radius:16px;padding:16px;margin-top:18px;background:#fff;color:#050505;font-weight:800;font-size:16px}.status{text-align:center;color:#999;min-height:20px}</style></head><body><main class="app"><header class="top"><div class="brand">VASI</div><div><button class="cart" onclick="checkout()">Cart <span id="count">0</span></button> <button class="back" onclick="location.href='index.html'">Home</button></div></header><section class="hero"><div class="eyebrow">VASI Eats</div><h1>Food, your way.</h1><p>Discover restaurants and order delivery across Europe.</p></section><input id="search" class="search" placeholder="Search restaurants or food…" oninput="filterRestaurants()"><section class="grid"><button class="card" onclick="pick('Burgers')"><div class="icon">🍔</div><h2>Burgers</h2><span class="muted">Popular near you</span></button><button class="card" onclick="pick('Pizza')"><div class="icon">🍕</div><h2>Pizza</h2><span class="muted">Hot & fresh</span></button><button class="card" onclick="pick('Asian')"><div class="icon">🍜</div><h2>Asian</h2><span class="muted">Noodles, sushi & more</span></button><button class="card" onclick="pick('Healthy')"><div class="icon">🥗</div><h2>Healthy</h2><span class="muted">Fresh choices</span></button></section><section class="list" id="restaurants"><div class="restaurant" data-name="Paris Burger"><div>🍔 <b>Paris Burger</b><span class="muted">20–30 min · €€</span></div><button class="add" onclick="addItem('Paris Burger')">Add</button></div><div class="restaurant" data-name="Napoli Pizza"><div>🍕 <b>Napoli Pizza</b><span class="muted">25–35 min · €€</span></div><button class="add" onclick="addItem('Napoli Pizza')">Add</button></div><div class="restaurant" data-name="Sakura Asian Kitchen"><div>🍜 <b>Sakura Asian Kitchen</b><span class="muted">30–40 min · €€€</span></div><button class="add" onclick="addItem('Sakura Asian Kitchen')">Add</button></div></section><button class="cta" onclick="checkout()">Review order</button><p id="status" class="status"></p></main><script>let cart=0,restaurant='Paris Burger';function addItem(name){cart++;restaurant=name;document.getElementById('count').textContent=cart;document.getElementById('status').textContent=name+' added to your VASI basket.'}function checkout(){if(!cart){document.getElementById('status').textContent='Add an item before checkout.';return}location.href='eats-checkout.html?restaurant='+encodeURIComponent(restaurant)+'&items='+cart}function filterRestaurants(){const q=document.getElementById('search').value.toLowerCase();document.querySelectorAll('.restaurant').forEach(x=>x.style.display=x.dataset.name.toLowerCase().includes(q)?'flex':'none')}function pick(category){document.getElementById('search').value=category;filterRestaurants();document.getElementById('status').textContent=category+' selected.'}</script></body></html>
