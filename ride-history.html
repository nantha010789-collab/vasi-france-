<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>VASI Activity</title><style>body{margin:0;background:#050505;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif}.wrap{max-width:680px;margin:auto;padding:22px 16px 40px}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-size:30px;font-weight:950}.back{border:1px solid #333;background:#171717;color:#fff;border-radius:13px;padding:10px 14px}.muted{color:#999}.card{background:#111;border:1px solid #292929;border-radius:20px;padding:16px;margin-top:12px}.row{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.route{margin-top:12px;display:grid;gap:9px}.point{display:flex;gap:9px}.point span{color:#aaa}.fare{font-size:22px;font-weight:950}.pill{display:inline-block;border-radius:999px;background:#202020;padding:5px 9px;font-size:11px;font-weight:850;text-transform:uppercase}.receipt{margin-top:13px;border-top:1px solid #292929;padding-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.receipt div{background:#181818;border-radius:12px;padding:10px;color:#999;font-size:11px}.receipt b{display:block;color:#fff;font-size:13px;margin-top:3px}.empty{text-align:center;padding:50px 10px;color:#999}.error{color:#ffb4b4}</style></head><body><main class="wrap"><header class="top"><div class="brand">VASI</div><button class="back" onclick="location.href='app.html'">Home</button></header><h1>Activity</h1><p class="muted">Your VASI rides and receipts.</p><div id="list"><div class="empty">Loading rides…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://vhfyvkrvysrooaqzcxsp.supabase.co','sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=(n,c='EUR')=>new Intl.NumberFormat('en-GB',{style:'currency',currency:c||'EUR'}).format(Number(n||0));const date=v=>v?new Date(v).toLocaleString():'—';async function load(){const session=(await sb.auth.getSession()).data.session;if(!session){localStorage.setItem('vasi_return','ride-history.html');location.href='auth.html';return}const {data,error}=await sb.rpc('get_customer_ride_history',{p_limit:50});if(error){$('list').innerHTML='<div class="empty error">'+esc(error.message)+'</div>';return}if(!data?.length){$('list').innerHTML='<div class="empty">No rides yet.</div>';return}$('list').innerHTML=data.map(r=>{const fare=r.final_fare??r.estimated_fare;const driver=r.driver_name||'VASI driver';const car=[r.vehicle_make,r.vehicle_model,r.vehicle_plate].filter(Boolean).join(' · ')||'Vehicle details unavailable';return `<article class="card"><div class="row"><div><span class="pill">${esc(r.status)}</span><h3>${esc(r.service||'VASI Ride')}</h3><div class="muted">${esc(date(r.completed_at||r.cancelled_at||r.requested_at))}</div></div><div class="fare">${money(fare,r.currency)}</div></div><div class="route"><div class="point"><span>●</span><div><small class="muted">Pickup</small><br>${esc(r.pickup_address)}</div></div><div class="point"><span>■</span><div><small class="muted">Destination</small><br>${esc(r.destination_address)}</div></div></div><div class="receipt"><div>Payment<b>${esc((r.payment_method||'cash').replaceAll('_',' '))}</b></div><div>Driver<b>${esc(driver)}</b></div><div>Vehicle<b>${esc(car)}</b></div><div>Ride ID<b>${esc(String(r.id).slice(0,8).toUpperCase())}</b></div></div></article>`}).join('')}load();</script></body></html>
