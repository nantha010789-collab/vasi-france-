<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>VASI Delivery</title>
<style>:root{font-family:Inter,system-ui,sans-serif;color:#fff;background:#050505}*{box-sizing:border-box}body{margin:0;background:#050505}.app{max-width:720px;margin:auto;padding:20px 18px 40px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:30px;font-weight:900}.back{border:1px solid #303030;background:#151515;color:#ddd;border-radius:12px;padding:9px 13px}.hero{padding:30px 0 18px}.eyebrow{color:#999;font-size:12px;text-transform:uppercase;letter-spacing:1.4px}.hero h1{font-size:42px;margin:8px 0}.hero p{color:#aaa}.panel{border:1px solid #292929;border-radius:22px;background:#111;padding:18px;margin-top:14px}.field{background:#181818;border-radius:15px;padding:13px;margin-bottom:10px}.field span{display:block;color:#999;font-size:12px;margin-bottom:5px}.field input{width:100%;background:transparent;border:0;outline:0;color:#fff;font-size:16px}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{border:1px solid #292929;background:#151515;border-radius:16px;padding:16px;color:#fff;text-align:left}.option.active{border-color:#fff}.option strong{display:block;margin-bottom:5px}.muted{color:#999;font-size:13px}.quote{display:flex;justify-content:space-between;margin:16px 0;font-size:15px}.quote b{font-size:24px}.cta{width:100%;border:0;border-radius:16px;padding:16px;background:#fff;color:#050505;font-weight:800;font-size:16px;margin-top:8px}.cta:disabled{opacity:.5}.status{text-align:center;color:#999;font-size:13px;min-height:20px}.login{display:inline-block;margin-top:8px;color:#fff}</style></head>
<body><main class="app"><header class="top"><div class="brand">VASI</div><button class="back" onclick="location.href='index.html'">Home</button></header><section class="hero"><div class="eyebrow">VASI Delivery</div><h1>Send anything.</h1><p>Fast local delivery for parcels, documents and everyday items.</p></section><section class="panel"><div class="field"><span>📍 Pickup</span><input id="pickup" placeholder="Full pickup address" autocomplete="street-address"></div><div class="field"><span>🏁 Drop-off</span><input id="dropoff" placeholder="Full destination address" autocomplete="street-address"></div><div class="options"><button id="parcel" class="option active" onclick="selectType('parcel')"><strong>📦 Parcel</strong><span class="muted">Small & medium</span></button><button id="document" class="option" onclick="selectType('document')"><strong>📄 Document</strong><span class="muted">Fast & secure</span></button></div><div id="quote" class="quote" hidden><span>Estimated delivery</span><b id="price">—</b></div><button class="cta" id="quoteBtn" onclick="getQuote()">Get delivery quote</button><button class="cta" id="bookBtn" onclick="bookDelivery()" hidden>Book VASI delivery</button><p id="status" class="status">Enter pickup and drop-off to continue.</p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/vasi-notifications.js"></script><script>
const client=supabase.createClient('https://vhfyvkrvysrooaqzcxsp.supabase.co','sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT');const el=id=>document.getElementById(id);let type='parcel';
function resetQuote(message){el('quote').hidden=true;el('bookBtn').hidden=true;el('status').textContent=message}
function selectType(next){type=next;el('parcel').classList.toggle('active',next==='parcel');el('document').classList.toggle('active',next==='document');resetQuote('Get a new quote for '+next+'.')}
async function requestDelivery(action,token){const response=await fetch('/api/delivery-order',{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify({action,item_type:type,pickup_address:el('pickup').value.trim(),dropoff_address:el('dropoff').value.trim()})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Delivery service unavailable');return data}
async function getQuote(){if(!el('pickup').value.trim()||!el('dropoff').value.trim())return resetQuote('Please enter both pickup and drop-off locations.');el('quoteBtn').disabled=true;el('status').textContent='Checking the real route and price…';try{const data=await requestDelivery('quote');el('pickup').value=data.pickup.address;el('dropoff').value=data.dropoff.address;el('price').textContent=new Intl.NumberFormat('en-GB',{style:'currency',currency:data.currency}).format(data.quote);el('quote').hidden=false;el('bookBtn').hidden=false;el('status').textContent=data.distance_km+' km · about '+data.duration_min+' min'}catch(error){resetQuote(error.message)}finally{el('quoteBtn').disabled=false}}
async function bookDelivery(){const button=el('bookBtn');button.disabled=true;el('status').textContent='Booking your VASI delivery…';try{const{data:{session}}=await client.auth.getSession();if(!session){localStorage.setItem('vasi_role','customer');localStorage.setItem('vasi_return','delivery.html');el('status').innerHTML='Please login before booking. <a class="login" href="auth.html?role=customer">Login</a>';button.disabled=false;return}const data=await requestDelivery('book',session.access_token);const shortId=String(data.order_id||'').slice(0,8).toUpperCase();el('status').innerHTML='Delivery booked successfully.<br><span class="muted">Booking ID: '+shortId+'</span>';button.textContent='Booked'}catch(error){el('status').textContent=error.message||'Could not book delivery. Please try again.';button.disabled=false}}
;VasiNotifications.start(client,{role:"customer"});</script><script src="/vasi-languages.js"></script></body></html>
