<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <title>VASI Delivery</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      :root{font-family:Inter,system-ui,sans-serif;color:#fff;background:#050505}*{box-sizing:border-box}body{margin:0;background:#050505}.app{max-width:720px;margin:auto;padding:20px 18px 40px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:30px;font-weight:900;letter-spacing:-1px}.back{border:1px solid #303030;background:#151515;color:#ddd;border-radius:999px;padding:10px 15px;text-decoration:none;font-weight:750}.hero{padding:30px 0 18px}.eyebrow{color:#8bf0aa;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1.4px}.hero h1{font-size:clamp(36px,10vw,48px);line-height:1;margin:10px 0}.hero p{color:#aaa;line-height:1.55}.panel{border:1px solid #292929;border-radius:24px;background:#111;padding:18px;margin-top:14px}.address-input{width:100%;padding:14px;border:1px solid #333;border-radius:14px;background:#181818;color:#fff;font:inherit}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:5px}.option{border:1px solid #292929;background:#151515;border-radius:16px;padding:16px;color:#fff;text-align:left;cursor:pointer}.option.active{border-color:#fff;background:#202020}.option strong{display:block;margin-bottom:5px}.muted{color:#999;font-size:13px}.map{height:220px;margin:16px 0;border:1px solid #303030;border-radius:18px;overflow:hidden}.quote{display:flex;justify-content:space-between;align-items:center;margin:16px 0;font-size:15px}.quote b{font-size:24px}.cta{width:100%;border:0;border-radius:16px;padding:16px;background:#fff;color:#050505;font-weight:850;font-size:16px;margin-top:8px;cursor:pointer}.cta.secondary{border:1px solid #333;background:#181818;color:#fff}.cta:disabled{cursor:not-allowed;opacity:.5}.status{text-align:center;color:#aaa;font-size:13px;line-height:1.45;min-height:20px}.login{display:inline-block;margin-top:8px;color:#fff}.section-label{display:block;margin:18px 0 9px;color:#aaa;font-size:12px;font-weight:850;letter-spacing:1.2px;text-transform:uppercase}@media(max-width:390px){.app{padding-inline:14px}.panel{padding:14px}.option{padding:13px}.hero{padding-top:24px}}
    </style>
    <link rel="stylesheet" href="./vasi-mobile-fit.css" />
  </head>
  <body>
    <main class="app">
      <header class="top"><div class="brand" aria-label="VASI">VASI</div><a class="back" href="index.html">Home</a></header>
      <section class="hero"><div class="eyebrow">VASI Delivery</div><h1>Send anything.</h1><p>Fast local delivery for parcels, documents and everyday items.</p></section>
      <section class="panel" aria-labelledby="delivery-form-title">
        <h2 id="delivery-form-title" class="vasi-sr-only">Delivery details</h2>
        <div class="vasi-address-shell" id="pickupShell">
          <label class="vasi-field-label" for="pickup"><span aria-hidden="true">📍</span> Pickup address</label>
          <input class="address-input" id="pickup" placeholder="Start typing the full pickup address" autocomplete="street-address" />
          <div class="vasi-address-suggestions" id="pickupSuggestions" hidden></div>
          <div class="vasi-address-confirmation" id="pickupConfirmation" hidden></div>
          <p class="vasi-address-status" id="pickupStatus" role="status" aria-live="polite"></p>
        </div>
        <div class="vasi-address-shell" id="dropoffShell">
          <label class="vasi-field-label" for="dropoff"><span aria-hidden="true">🏁</span> Drop-off address</label>
          <input class="address-input" id="dropoff" placeholder="Start typing the full destination address" autocomplete="street-address" />
          <div class="vasi-address-suggestions" id="dropoffSuggestions" hidden></div>
          <div class="vasi-address-confirmation" id="dropoffConfirmation" hidden></div>
          <p class="vasi-address-status" id="dropoffStatus" role="status" aria-live="polite"></p>
        </div>
        <span class="section-label">Item type</span>
        <div class="options" role="group" aria-label="Item type">
          <button id="parcel" class="option active" type="button" aria-pressed="true" onclick="selectType('parcel')"><strong><span aria-hidden="true">📦</span> Parcel</strong><span class="muted">Small & medium</span></button>
          <button id="document" class="option" type="button" aria-pressed="false" onclick="selectType('document')"><strong><span aria-hidden="true">📄</span> Document</strong><span class="muted">Fast & secure</span></button>
        </div>
        <div id="map" class="map" aria-label="Confirmed delivery route map" hidden></div>
        <div id="quote" class="quote" hidden><span>Estimated delivery</span><b id="price">—</b></div>
        <button class="cta" id="quoteBtn" type="button" onclick="getQuote()">Get delivery quote</button>
        <button class="cta secondary" id="bookBtn" type="button" onclick="bookDelivery()" hidden>Book VASI delivery</button>
        <p id="status" class="status" role="status" aria-live="polite">Select both suggested addresses to continue.</p>
      </section>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./vasi-notifications.js"></script>
    <script src="./vasi-address-search.js"></script>
    <script>
      const client=supabase.createClient('https://vhfyvkrvysrooaqzcxsp.supabase.co','sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT');
      const el=id=>document.getElementById(id);let type='parcel',routeMap=null;
      const pickupSearch=VasiAddressSearch.attach({input:'#pickup',suggestions:'#pickupSuggestions',confirmation:'#pickupConfirmation',status:'#pickupStatus',onSelect:resetForAddress});
      const dropoffSearch=VasiAddressSearch.attach({input:'#dropoff',suggestions:'#dropoffSuggestions',confirmation:'#dropoffConfirmation',status:'#dropoffStatus',onSelect:resetForAddress});
      el('pickup').addEventListener('vasi:address-cleared',resetForAddress);el('dropoff').addEventListener('vasi:address-cleared',resetForAddress);
      function resetQuote(message){el('quote').hidden=true;el('bookBtn').hidden=true;el('map').hidden=true;el('status').textContent=message}
      function resetForAddress(){resetQuote(pickupSearch.isConfirmed()&&dropoffSearch.isConfirmed()?'Addresses confirmed. Get your delivery quote.':'Select both suggested addresses to continue.')}
      function selectType(next){type=next;for(const key of ['parcel','document']){const active=key===next;el(key).classList.toggle('active',active);el(key).setAttribute('aria-pressed',String(active))}resetQuote('Get a new quote for '+next+'.')}
      function payload(action){const pickup=pickupSearch.getValue(),dropoff=dropoffSearch.getValue();return{action,item_type:type,pickup_address:pickup?.label||'',dropoff_address:dropoff?.label||'',pickup_place_id:pickup?.place_id,dropoff_place_id:dropoff?.place_id}}
      async function requestDelivery(action,token){const response=await fetch((location.hostname.endsWith('.github.io')?'https://vasi-new.vercel.app':'')+'/api/delivery-order',{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(payload(action))});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Delivery service unavailable');return data}
      function showRoute(data){el('map').hidden=false;if(!routeMap){routeMap=L.map('map',{zoomControl:false});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(routeMap)}routeMap.eachLayer(layer=>{if(!(layer instanceof L.TileLayer))routeMap.removeLayer(layer)});const points=(data.route||[]).map(([lng,lat])=>[lat,lng]);L.marker([data.pickup.lat,data.pickup.lng]).addTo(routeMap).bindPopup('Pickup');L.marker([data.dropoff.lat,data.dropoff.lng]).addTo(routeMap).bindPopup('Drop-off');if(points.length)L.polyline(points,{color:'#36d478',weight:5,opacity:.9}).addTo(routeMap);const bounds=L.latLngBounds([[data.pickup.lat,data.pickup.lng],[data.dropoff.lat,data.dropoff.lng],...points]);routeMap.fitBounds(bounds,{padding:[24,24]});setTimeout(()=>routeMap.invalidateSize(),0)}
      async function getQuote(){if(!pickupSearch.isConfirmed()||!dropoffSearch.isConfirmed())return resetQuote('Choose both addresses from the suggestions so the map pins can be confirmed.');el('quoteBtn').disabled=true;el('status').textContent='Checking the real route and price…';try{const data=await requestDelivery('quote');el('price').textContent=new Intl.NumberFormat('en-GB',{style:'currency',currency:data.currency}).format(data.quote);el('quote').hidden=false;el('bookBtn').hidden=false;el('status').textContent=data.distance_km+' km · about '+data.duration_min+' min';showRoute(data)}catch(error){resetQuote(error.message)}finally{el('quoteBtn').disabled=false}}
      async function bookDelivery(){const button=el('bookBtn');button.disabled=true;el('status').textContent='Booking your VASI delivery…';try{const{data:{session}}=await client.auth.getSession();if(!session){localStorage.setItem('vasi_role','customer');localStorage.setItem('vasi_return','delivery.html');el('status').innerHTML='Please login before booking. <a class="login" href="auth.html?role=customer">Login</a>';button.disabled=false;return}const data=await requestDelivery('book',session.access_token);const shortId=String(data.order_id||'').slice(0,8).toUpperCase();el('status').innerHTML='Delivery booked successfully.<br><span class="muted">Booking ID: '+shortId+'</span>';button.textContent='Booked'}catch(error){el('status').textContent=error.message||'Could not book delivery. Please try again.';button.disabled=false}}
      VasiNotifications.start(client,{role:'customer'});
    </script>
    <script src="./vasi-languages.js"></script>
  </body>
</html>
