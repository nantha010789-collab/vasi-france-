<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>VASI Delivery</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#fff;background:#050505}*{box-sizing:border-box}body{margin:0;background:#050505}.app{max-width:720px;margin:auto;padding:20px 18px 40px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:30px;font-weight:900}.back{border:1px solid #303030;background:#151515;color:#ddd;border-radius:12px;padding:9px 13px}.hero{padding:30px 0 18px}.eyebrow{color:#999;font-size:12px;text-transform:uppercase;letter-spacing:1.4px}.hero h1{font-size:42px;margin:8px 0}.hero p{color:#aaa}.panel{border:1px solid #292929;border-radius:22px;background:#111;padding:18px;margin-top:14px}.field{background:#181818;border-radius:15px;padding:13px;margin-bottom:10px}.field span{display:block;color:#999;font-size:12px;margin-bottom:5px}.field input{width:100%;background:transparent;border:0;outline:0;color:#fff;font-size:16px}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{border:1px solid #292929;background:#151515;border-radius:16px;padding:16px;color:#fff;text-align:left}.option.active{border-color:#fff}.option strong{display:block;margin-bottom:5px}.muted{color:#999;font-size:13px}.quote{display:flex;justify-content:space-between;margin:16px 0;font-size:15px}.quote b{font-size:24px}.cta{width:100%;border:0;border-radius:16px;padding:16px;background:#fff;color:#050505;font-weight:800;font-size:16px;margin-top:8px}.status{text-align:center;color:#999;font-size:13px;min-height:20px}</style></head><body><main class="app"><header class="top"><div class="brand">VASI</div><button class="back" onclick="location.href='index.html'">Home</button></header><section class="hero"><div class="eyebrow">VASI Delivery</div><h1>Send anything.</h1><p>Fast local delivery for parcels, documents and everyday items.</p></section><section class="panel"><div class="field"><span>📍 Pickup</span><input id="pickup" placeholder="Enter pickup location"></div><div class="field"><span>🏁 Drop-off</span><input id="dropoff" placeholder="Enter destination"></div><div class="options"><button id="parcel" class="option active" onclick="selectType('parcel')"><strong>📦 Parcel</strong><span class="muted">Small & medium</span></button><button id="document" class="option" onclick="selectType('document')"><strong>📄 Document</strong><span class="muted">Fast & secure</span></button></div><div id="quote" class="quote" hidden><span>Estimated delivery</span><b id="price">€6.00</b></div><button class="cta" onclick="getQuote()">Get delivery quote</button><p id="status" class="status">Enter pickup and drop-off to continue.</p></section></main><script>let type='parcel';function selectType(t){type=t;document.getElementById('parcel').classList.toggle('active',t==='parcel');document.getElementById('document').classList.toggle('active',t==='document');}function getQuote(){const p=document.getElementById('pickup').value.trim(),d=document.getElementById('dropoff').value.trim();if(!p||!d){document.getElementById('status').textContent='Please enter both pickup and drop-off locations.';return}const price=type==='parcel'?7.5:6;document.getElementById('price').textContent='€'+price.toFixed(2);document.getElementById('quote').hidden=false;document.getElementById('status').textContent='Quote ready · booking can continue from here.'}</script></body></html>
