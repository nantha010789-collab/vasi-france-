<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>VASI Restaurant</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#fff;background:#050505;--line:#2b2b2b;--panel:#101010;--muted:#9c9c9c;--green:#7be79a}*{box-sizing:border-box}body{margin:0;background:#050505}.wrap{width:min(100%,980px);margin:auto;padding:max(16px,env(safe-area-inset-top)) 14px calc(72px + env(safe-area-inset-bottom))}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand img{width:106px;display:block}.btn,input,select,textarea{font:inherit;border:1px solid #383838;background:#181818;color:#fff;border-radius:14px;padding:12px 14px}.btn{font-weight:850;min-height:45px;cursor:pointer}.primary{background:#fff;color:#050505;border-color:#fff}.card{margin-top:14px;padding:17px;background:var(--panel);border:1px solid var(--line);border-radius:22px}.muted{color:var(--muted);line-height:1.45}.badge{display:inline-flex;padding:7px 10px;border-radius:999px;background:#292929;font-size:12px;font-weight:850}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:13px}.stat{padding:13px;border:1px solid var(--line);border-radius:16px;background:#171717}.stat b{display:block;font-size:21px;margin-top:4px}.layout{display:grid;grid-template-columns:1.35fr .65fr;gap:14px}.payout{margin-top:13px;padding:13px;border:1px solid var(--line);border-radius:16px;background:#171717}.payout .btn{width:100%;margin-top:10px}.menu-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.search{width:100%;margin-top:12px}.menu-row{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:11px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}.menu-row:first-child{border-top:0}.pic,.placeholder{width:62px;height:58px;border-radius:12px;object-fit:cover;background:#1c1c1c;border:1px solid #303030}.placeholder{display:grid;place-items:center;font-size:24px}.menu-name{font-weight:900}.menu-actions{display:flex;gap:7px}.order{padding:12px 0;border-top:1px solid var(--line)}.order:first-child{border-top:0}.empty{text-align:center;padding:24px;color:var(--muted)}.modal{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.72);z-index:30}.modal.open{display:flex}.sheet{width:min(100%,680px);max-height:92dvh;overflow:auto;background:#101010;border:1px solid #333;border-radius:24px 24px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom))}.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px}.form label{font-size:13px;font-weight:750;color:#bbb}.form input,.form select,.form textarea{display:block;width:100%;margin-top:7px}.form textarea{min-height:92px;resize:vertical}.full{grid-column:1/-1}.message{text-align:center;color:#bbb;min-height:22px}@media(max-width:760px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.menu-row{grid-template-columns:58px minmax(0,1fr)}.menu-actions{grid-column:1/-1}.menu-actions .btn{flex:1}.form{grid-template-columns:1fr}.full{grid-column:auto}.menu-head{flex-direction:column}.menu-head .btn{width:100%}.top .brand{display:none}}
</style></head><body><main class="wrap"><header class="top"><button class="btn" onclick="history.length>1?history.back():location.href='index.html'">← Retour</button><div class="brand"><img src="./assets/vasi-logo.png" alt="VASI"></div><div><button class="btn" id="signOut">Déconnexion</button></div></header><div id="app"><section class="card"><p class="muted">Chargement…</p></section></div><p id="msg" class="message"></p></main>
<div id="editor" class="modal"><section class="sheet"><div class="sheet-head"><div><b id="title">Ajouter un article</b><div class="muted">Menu VASI</div></div><button class="btn" onclick="closeEditor()">Fermer</button></div><form id="itemForm" class="form" onsubmit="saveItem(event)"><label>Nom de l’article<input name="name" required></label><label>Catégorie<input name="category" placeholder="Burgers, boissons…"></label><label>Prix<input name="price" type="number" min="0.5" max="500" step="0.01" required></label><label>Disponibilité<select name="active"><option value="true">Disponible</option><option value="false">Masqué</option></select></label><label class="full">Description<textarea name="description" placeholder="Description du produit…"></textarea></label><label class="full">Allergènes<input name="allergens" placeholder="Gluten, lait, noix…"></label><label class="full">Photo<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><button class="btn primary full" type="submit">Enregistrer l’article</button></form></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"></script><script src="./vasi-region.js"></script><script>
const U='https://vhfyvkrvysrooaqzcxsp.supabase.co',K='sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT';const client=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:localStorage}});let token='',data={},editing=null,rib={};const app=document.getElementById('app'),msg=document.getElementById('msg'),money=v=>VasiRegion.money(Number(v||0),VasiRegion.getRegion().code),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(body){const r=await fetch('/api/restaurant-partner',{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Service restaurant indisponible');return j}async function refreshRib(){try{const r=await fetch('/api/restaurant-stripe-onboarding',{headers:{Authorization:'Bearer '+token},cache:'no-store'});const j=await r.json().catch(()=>({}));if(r.ok)rib=j}catch(_e){}}
function payoutBox(r){if(r.status!=='approved')return '<div class="payout"><b>Paiements & RIB</b><p class="muted">Disponible après validation.</p></div>';if(rib.payouts_enabled)return '<div class="payout"><b>Paiements & RIB</b><p style="color:var(--green);font-weight:800">✓ RIB vérifié</p></div>';return `<div class="payout"><b>Paiements & RIB</b><p class="muted">Connectez votre compte bancaire pour recevoir vos versements.</p><button class="btn primary" onclick="connectRib()">${rib.details_submitted?'Continuer la vérification':'Connecter mon RIB'}</button></div>`}
function rows(){const q=(document.getElementById('q')?.value||'').toLowerCase();const items=(data.menu||[]).filter(i=>[i.name,i.category,i.description].join(' ').toLowerCase().includes(q));if(!items.length)return '<div class="empty">Aucun article dans ce menu.</div>';return items.map(i=>`<div class="menu-row">${i.photo_url?`<img class="pic" src="${esc(i.photo_url)}" alt="">`:'<div class="placeholder">🍽️</div>'}<div><div class="menu-name">${esc(i.name)}</div><div class="muted">${esc(i.category||'Menu')} · ${money(i.price)} · ${i.active?'Disponible':'Masqué'}</div></div><div class="menu-actions"><button class="btn" onclick="openEditor('${i.id}')">Modifier</button><button class="btn" onclick="toggleItem('${i.id}',${!i.active})">${i.active?'Masquer':'Afficher'}</button></div></div>`).join('')}
function render(){const r=data.restaurant,orders=data.orders||[],done=orders.filter(o=>o.status==='delivered'),sales=done.reduce((s,o)=>s+Number(o.total||0),0);app.innerHTML=`<section class="card"><div class="row"><div><h1>${esc(r.name)}</h1><span class="badge">${r.status==='approved'?'Approuvé':esc(r.status)}</span></div><button class="btn" disabled>${r.is_open?'Ouvert':'Fermé'}</button></div><p class="muted">${esc(r.cuisine)} · ${r.delivery_mode==='own'?'Votre livraison':'Coursier VASI'} · 10 % de commission</p>${payoutBox(r)}<div class="stats"><div class="stat"><span class="muted">Commandes actives</span><b>${orders.filter(o=>['pending','accepted','preparing','ready_for_pickup','picked_up'].includes(o.status)).length}</b></div><div class="stat"><span class="muted">Livrées</span><b>${done.length}</b></div><div class="stat"><span class="muted">Ventes</span><b>${money(sales)}</b></div><div class="stat"><span class="muted">Articles</span><b>${(data.menu||[]).length}</b></div></div></section><div class="layout"><section class="card"><div class="menu-head"><div><h2>Menu</h2><p class="muted">Articles, catégories, prix et disponibilité.</p></div><button class="btn primary" onclick="openEditor()">+ Ajouter un article</button></div><input id="q" class="search" placeholder="Rechercher un article…" oninput="document.getElementById('list').innerHTML=rows()"><div id="list">${rows()}</div></section><section class="card"><h2>Commandes</h2>${orders.length?orders.map(o=>`<div class="order"><div class="row"><b>#${o.id.slice(0,8).toUpperCase()}</b><span class="badge">${esc(o.status)}</span></div><p class="muted">${money(o.total)}</p></div>`).join(''):'<p class="muted">Aucune commande.</p>'}</section></div>`}
function openEditor(id){editing=(data.menu||[]).find(i=>i.id===id)||null;const f=document.getElementById('itemForm');f.reset();f.name.value=editing?.name||'';f.category.value=editing?.category||'';f.price.value=editing?.price||'';f.description.value=editing?.description||'';f.allergens.value=(editing?.allergens||[]).join(', ');f.active.value=String(editing?.active!==false);document.getElementById('title').textContent=editing?'Modifier l’article':'Ajouter un article';document.getElementById('editor').classList.add('open')}function closeEditor(){document.getElementById('editor').classList.remove('open');editing=null}
async function updateItem(body){const r=await fetch('/api/restaurant-menu-item',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Modification impossible');return j}
async function saveItem(e){e.preventDefault();const b=Object.fromEntries(new FormData(e.target));msg.textContent='Enregistrement…';try{let item;if(editing){item=(await updateItem({id:editing.id,...b,active:b.active==='true'})).item}else{item=(await api({action:'add_item',name:b.name,category:b.category,price:b.price,description:b.description,allergens:b.allergens})).item}const file=document.getElementById('photo').files?.[0];const id=item?.id||editing?.id;if(file&&id){if(file.size>2*1024*1024)throw Error('La photo doit faire moins de 2 Mo.');const image=await toData(file);await api({action:'submit_photo',id,image})}closeEditor();await load();msg.textContent='Article enregistré.'}catch(err){msg.textContent=err.message}}
const toData=file=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)});async function toggleItem(id,active){try{await api({action:'toggle_item',id,active});await load()}catch(e){msg.textContent=e.message}}async function connectRib(){msg.textContent='Ouverture Stripe…';try{const r=await fetch('/api/restaurant-stripe-onboarding',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({country:'FR'})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Connexion RIB indisponible');location.href=j.url}catch(e){msg.textContent=e.message}}
async function load(){data=await api();if(!data.restaurant){location.replace('restaurant-register-form.html');return}await refreshRib();render()}document.getElementById('editor').onclick=e=>{if(e.target.id==='editor')closeEditor()};document.getElementById('signOut').onclick=async()=>{await client.auth.signOut();location.replace('index.html')};client.auth.getSession().then(async({data:{session}})=>{if(!session){localStorage.setItem('vasi_role','restaurant');localStorage.setItem('vasi_return','restaurant-dashboard.html');location.replace('auth.html?role=restaurant');return}token=session.access_token;await load()}).catch(e=>msg.textContent=e.message);
</script></body></html>
