<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>Espace restaurant · VASI</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#fff;background:#050505;--panel:#101010;--line:#2b2b2b;--muted:#9b9b9b;--green:#76e695}*{box-sizing:border-box}body{margin:0;background:#050505}.wrap{width:min(100%,980px);margin:auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(64px + env(safe-area-inset-bottom))}.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:9px;min-width:0}.brand img{width:108px;max-width:28vw;height:auto}.partner{font-size:18px;font-weight:900;white-space:nowrap}.actions{display:flex;gap:8px}.btn,input,select{font:inherit;border:1px solid #363636;background:#181818;color:#fff;border-radius:14px;padding:12px 14px}.btn{min-height:46px;font-weight:800;cursor:pointer}.primary{background:#fff;color:#050505;border-color:#fff}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}h1,h2{margin:0 0 10px}h1{font-size:clamp(28px,7vw,40px)}h2{font-size:22px}.muted{color:var(--muted);line-height:1.5}.badge{display:inline-flex;padding:7px 10px;border-radius:999px;background:#292929;font-size:12px;font-weight:850}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.stat{padding:14px;border:1px solid var(--line);border-radius:16px;background:#171717}.stat b{display:block;font-size:22px;margin-top:5px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.form label{color:#bbb;font-size:13px;font-weight:750}.form input,.form select{display:block;width:100%;margin-top:7px}.full{grid-column:1/-1}.menu-item,.order{padding:14px 0;border-top:1px solid var(--line)}.menu-item:first-child,.order:first-child{border-top:0}.message{min-height:22px;text-align:center;color:#bbb}.hidden{display:none!important}.payout{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#171717}.edit-note{padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#171717;margin:8px 0 14px}.photo{width:64px;height:54px;object-fit:cover;border-radius:10px;border:1px solid #333;vertical-align:middle;margin-right:10px}
@media(max-width:760px){.top{grid-template-columns:auto 1fr}.actions{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}.actions .btn{width:100%}.grid,.form{grid-template-columns:1fr}.full{grid-column:auto}.stats{grid-template-columns:1fr 1fr}.partner{font-size:16px}.card{padding:16px;border-radius:20px}.back{padding:10px 12px}.brand img{width:102px;max-width:35vw}}
</style></head><body><main class="wrap">
<header class="top"><button class="btn back" type="button" onclick="history.length>1?history.back():location.href='index.html'">← Retour</button><div class="brand"><img src="./assets/vasi-logo.png" alt="VASI"><span class="partner">Restaurant</span></div><div class="actions"><button class="btn" id="editBtn" type="button">Modifier</button><button class="btn" id="signOut" type="button">Déconnexion</button></div></header>
<div id="app"><section class="card"><p class="muted">Chargement du restaurant…</p></section></div><p id="msg" class="message" aria-live="polite"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"></script><script src="./vasi-region.js"></script><script>
const SUPABASE_URL='https://vhfyvkrvysrooaqzcxsp.supabase.co';const SUPABASE_KEY='sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT';
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:localStorage}});let token='',data={};const app=document.getElementById('app'),msg=document.getElementById('msg');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>VasiRegion.money(Number(v||0),VasiRegion.getRegion().code);const active=new Set(['pending','accepted','preparing','ready_for_pickup','picked_up']);
async function api(body){const r=await fetch('/api/restaurant-partner',{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Service restaurant indisponible');return j}
async function profile(body){const r=await fetch('/api/restaurant-profile',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Modification impossible');return j}
function statusFr(v){return {pending:'En vérification',approved:'Approuvé',rejected:'À corriger',accepted:'Acceptée',preparing:'En préparation',ready_for_pickup:'Prête',picked_up:'Récupérée',delivered:'Livrée'}[v]||v}
function profileForm(r){return `<section id="editCard" class="card hidden"><div class="row"><div><h2>Informations du restaurant</h2><p class="muted">Modifiez vos informations sans refaire l’inscription.</p></div><button class="btn" type="button" onclick="closeEdit()">Fermer</button></div><div class="edit-note muted">Votre compte restaurant reste connecté. Seules les informations de cet établissement seront mises à jour.</div><form class="form" onsubmit="saveProfile(event)"><label>Nom du restaurant<input name="name" value="${esc(r.name)}" required></label><label>Raison sociale<input name="legal_name" value="${esc(r.legal_name)}" required></label><label>SIRET / SIREN<input name="siret" value="${esc(r.siret)}" required></label><label>Type de cuisine<input name="cuisine" value="${esc(r.cuisine)}" required></label><label>E-mail professionnel<input name="email" type="email" value="${esc(r.email)}" required></label><label>Téléphone<input name="phone" type="tel" value="${esc(r.phone)}" required></label><label class="full">Adresse du restaurant<input name="address" value="${esc(r.address)}" required></label><label>Code postal<input name="postal_code" value="${esc(r.postal_code)}" required></label><label>Ville<input name="city" value="${esc(r.city)}" required></label><label>Livraison<select name="delivery_mode"><option value="vasi" ${r.delivery_mode!=='own'?'selected':''}>Coursier VASI · 10 %</option><option value="own" ${r.delivery_mode==='own'?'selected':''}>Ma propre équipe · 10 %</option></select></label><button class="btn primary full" type="submit">Enregistrer les modifications</button></form></section>`}
function render(){const r=data.restaurant,orders=data.orders||[],done=orders.filter(o=>o.status==='delivered'),sales=done.reduce((s,o)=>s+Number(o.total||0),0),payout=done.reduce((s,o)=>s+Number(o.restaurant_net??Number(o.subtotal||0)*.9)+(o.delivery_mode==='own'?Number(o.delivery_fee||0):0),0),rate=(Number(r.commission_rate||.1)*100).toFixed(0);const menu=(data.menu||[]).map(i=>`<div class="menu-item">${i.photo_url?`<img class="photo" src="${esc(i.photo_url)}" alt="">`:''}<b>${esc(i.name)}</b><div class="muted">${money(i.price)} · ${esc(i.category||'Menu')} · ${i.active?'Visible':'Masqué'}</div><div style="margin-top:8px"><button class="btn" onclick="toggleItem('${esc(i.id)}',${!i.active})">${i.active?'Masquer':'Afficher'}</button></div></div>`).join('')||'<p class="muted">Aucun article pour le moment.</p>';const ord=orders.map(o=>`<div class="order"><div class="row"><b>#${esc(o.id.slice(0,8).toUpperCase())}</b><span class="badge">${esc(statusFr(o.status))}</span></div><p class="muted">${money(o.total)} · ${esc(o.delivery_address||'')}</p>${o.status==='pending'?`<button class="btn primary" onclick="orderStatus('${o.id}','accepted')">Accepter</button>`:o.status==='accepted'?`<button class="btn primary" onclick="orderStatus('${o.id}','preparing')">Commencer la préparation</button>`:o.status==='preparing'?`<button class="btn primary" onclick="orderStatus('${o.id}','ready_for_pickup')">Prête à récupérer</button>`:''}</div>`).join('')||'<p class="muted">Aucune commande pour le moment.</p>';app.innerHTML=`<section class="card"><div class="row"><div><h1>${esc(r.name)}</h1><span class="badge">${esc(statusFr(r.status))}</span></div><button class="btn" ${r.status!=='approved'?'disabled':''} onclick="toggleOpen(${!r.is_open})">${r.is_open?'Ouvert':'Fermé'}</button></div><p class="muted">${esc(r.cuisine)} · ${r.delivery_mode==='own'?'Livraison par votre équipe':'Coursier VASI'} · ${rate} % de commission</p>${r.status==='pending'?'<p>Votre demande est en cours de vérification. Vous pouvez déjà préparer votre menu.</p>':''}<div class="payout"><b>Paiements & RIB</b><p class="muted">${r.status==='approved'?'Connectez et vérifiez votre RIB pour recevoir vos versements.':'Le RIB sera disponible après validation du restaurant.'}</p></div><div class="stats"><div class="stat"><span class="muted">Commandes actives</span><b>${orders.filter(o=>active.has(o.status)).length}</b></div><div class="stat"><span class="muted">Livrées</span><b>${done.length}</b></div><div class="stat"><span class="muted">Ventes</span><b>${money(sales)}</b></div><div class="stat"><span class="muted">Votre versement</span><b>${money(payout)}</b></div></div></section>${profileForm(r)}<div class="grid"><section class="card"><h2>Menu</h2><form class="form" onsubmit="addItem(event)"><label>Nom de l’article<input name="name" required></label><label>Catégorie<input name="category"></label><label>Prix<input name="price" type="number" min="0.5" step="0.01" required></label><label>Description<input name="description"></label><label class="full">Allergènes<input name="allergens"></label><button class="btn primary full">Ajouter l’article</button></form><div>${menu}</div></section><section class="card"><h2>Commandes</h2>${ord}</section></div>`}
async function load(){try{data=await api();if(!data.restaurant){location.replace('restaurant-register-form.html');return}render();msg.textContent=''}catch(e){msg.textContent=e.message}}
function openEdit(){document.getElementById('editCard')?.classList.remove('hidden');document.getElementById('editCard')?.scrollIntoView({behavior:'smooth',block:'start'})}function closeEdit(){document.getElementById('editCard')?.classList.add('hidden')}
async function saveProfile(e){e.preventDefault();msg.textContent='Enregistrement…';try{const result=await profile(Object.fromEntries(new FormData(e.target)));data.restaurant=result.restaurant;render();msg.textContent='Informations du restaurant enregistrées.'}catch(err){msg.textContent=err.message}}
async function act(body,text='Enregistré.'){msg.textContent='Enregistrement…';try{await api(body);await load();msg.textContent=text}catch(e){msg.textContent=e.message}}function toggleItem(id,a){act({action:'toggle_item',id,active:a})}function toggleOpen(a){act({action:'toggle_open',is_open:a})}function orderStatus(id,status){act({action:'order_status',id,status})}async function addItem(e){e.preventDefault();await act({action:'add_item',...Object.fromEntries(new FormData(e.target))},'Article ajouté.');e.target.reset()}
document.getElementById('editBtn').addEventListener('click',openEdit);document.getElementById('signOut').addEventListener('click',async()=>{await client.auth.signOut();location.replace('index.html')});
client.auth.getSession().then(async({data:{session}})=>{if(!session){localStorage.setItem('vasi_role','restaurant');localStorage.setItem('vasi_return','restaurant-dashboard.html');location.replace('auth.html?role=restaurant');return}token=session.access_token;await load()}).catch(e=>msg.textContent='Connexion restaurant indisponible.');
</script></body></html>
