<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>VASI Restaurant Partner</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#fff;background:#050505;--panel:#101010;--line:#2b2b2b;--muted:#9b9b9b;--green:#79e79a}*{box-sizing:border-box}body{margin:0;background:#050505}.wrap{width:min(100%,980px);margin:auto;padding:max(18px,env(safe-area-inset-top)) 16px calc(70px + env(safe-area-inset-bottom))}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:112px;max-width:32vw;height:auto}.partner{font-weight:900;font-size:20px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,input,select{font:inherit;border:1px solid #363636;background:#181818;color:#fff;border-radius:14px;padding:12px 14px}.btn{min-height:46px;font-weight:800;cursor:pointer}.primary{background:#fff;color:#050505;border-color:#fff}.card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:20px;margin-top:14px}h1,h2{margin:0 0 10px}h1{font-size:clamp(28px,7vw,42px)}h2{font-size:22px}.muted{color:var(--muted);line-height:1.5}.badge{display:inline-flex;padding:7px 10px;border-radius:999px;background:#292929;font-size:12px;font-weight:850;text-transform:capitalize}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.stat{padding:14px;border:1px solid var(--line);border-radius:17px;background:#171717}.stat b{display:block;font-size:22px;margin-top:5px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.form label{color:#bbb;font-size:13px;font-weight:750}.form input,.form select{display:block;width:100%;margin-top:7px}.full{grid-column:1/-1}.menu-item,.order{padding:14px 0;border-top:1px solid var(--line)}.menu-item:first-child,.order:first-child{border-top:0}.message{min-height:22px;text-align:center;color:#bbb}.hidden{display:none!important}.edit-note{padding:12px 14px;border-radius:14px;background:#171717;border:1px solid var(--line);margin:10px 0 14px}.payout{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#171717}.photo{width:64px;height:54px;object-fit:cover;border-radius:10px;border:1px solid #333;vertical-align:middle;margin-right:10px}@media(max-width:760px){.grid,.form{grid-template-columns:1fr}.full{grid-column:auto}.stats{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.actions{justify-content:flex-end}.partner{font-size:16px}.card{padding:16px;border-radius:20px}}@media(max-width:390px){.wrap{padding-left:12px;padding-right:12px}.actions .btn{padding:10px}.brand img{width:100px}}
</style><link rel="stylesheet" href="./vasi-mobile-fit.css"></head><body><main class="wrap">
<header class="top"><div class="brand"><img src="./assets/vasi-logo.png" alt="VASI"><span class="partner">Restaurant Partner</span></div><div class="actions"><button class="btn" id="editBtn" type="button">Edit restaurant</button><button class="btn" id="signOut" type="button">Sign out</button></div></header>
<div id="app"><section class="card"><p class="muted">Loading restaurant…</p></section></div><p id="msg" class="message" aria-live="polite"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"></script><script src="./vasi-region.js"></script><script>
let client,token='',data={};const app=document.getElementById('app'),msg=document.getElementById('msg');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>VasiRegion.money(Number(v||0),VasiRegion.getRegion().code);const active=new Set(['pending','accepted','preparing','ready_for_pickup','picked_up']);
async function api(body){const r=await fetch('/api/restaurant-partner',{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
async function profile(body){const r=await fetch('/api/restaurant-profile',{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Profile request failed');return j}
function profileForm(r){return `<section id="editCard" class="card hidden"><div class="row"><div><h2>Restaurant details</h2><p class="muted">Update your store information here instead of registering again.</p></div><button class="btn" type="button" onclick="closeEdit()">Close</button></div><div class="edit-note muted">Your VASI restaurant account stays connected. Saving changes updates this restaurant only.</div><form id="profileForm" class="form" onsubmit="saveProfile(event)"><label>Restaurant name<input name="name" value="${esc(r.name)}" required></label><label>Legal name<input name="legal_name" value="${esc(r.legal_name)}" required></label><label>SIRET / SIREN<input name="siret" value="${esc(r.siret)}" required></label><label>Cuisine<input name="cuisine" value="${esc(r.cuisine)}" required></label><label>Business email<input name="email" type="email" value="${esc(r.email)}" required></label><label>Phone<input name="phone" type="tel" value="${esc(r.phone)}" required></label><label class="full">Restaurant address<input name="address" value="${esc(r.address)}" required></label><label>Postal code<input name="postal_code" value="${esc(r.postal_code)}" required></label><label>City<input name="city" value="${esc(r.city)}" required></label><label>Delivery service<select name="delivery_mode"><option value="vasi" ${r.delivery_mode!=='own'?'selected':''}>VASI courier · 10%</option><option value="own" ${r.delivery_mode==='own'?'selected':''}>Own delivery team · 10%</option></select></label><button class="btn primary full" type="submit">Save changes</button></form></section>`}
function render(){const r=data.restaurant,orders=data.orders||[],done=orders.filter(o=>o.status==='delivered'),sales=done.reduce((s,o)=>s+Number(o.total||0),0),payout=done.reduce((s,o)=>s+Number(o.restaurant_net??Number(o.subtotal||0)*.9)+(o.delivery_mode==='own'?Number(o.delivery_fee||0):0),0),rate=(Number(r.commission_rate||.1)*100).toFixed(0);const menu=(data.menu||[]).map(i=>`<div class="menu-item">${i.photo_url?`<img class="photo" src="${esc(i.photo_url)}" alt="">`:''}<b>${esc(i.name)}</b><div class="muted">${money(i.price)} · ${esc(i.category||'Menu')} · ${i.active?'Visible':'Hidden'}</div><div style="margin-top:8px"><button class="btn" onclick="toggleItem('${esc(i.id)}',${!i.active})">${i.active?'Hide':'Show'}</button></div></div>`).join('')||'<p class="muted">No menu items yet.</p>';const ord=orders.map(o=>`<div class="order"><div class="row"><b>#${esc(o.id.slice(0,8).toUpperCase())}</b><span class="badge">${esc(o.status)}</span></div><p class="muted">${money(o.total)} · ${esc(o.delivery_address||'')}</p>${o.status==='pending'?`<button class="btn primary" onclick="orderStatus('${o.id}','accepted')">Accept order</button>`:o.status==='accepted'?`<button class="btn primary" onclick="orderStatus('${o.id}','preparing')">Start preparing</button>`:o.status==='preparing'?`<button class="btn primary" onclick="orderStatus('${o.id}','ready_for_pickup')">Ready for pickup</button>`:''}</div>`).join('')||'<p class="muted">No orders yet.</p>';app.innerHTML=`<section class="card"><div class="row"><div><h1>${esc(r.name)}</h1><span class="badge">${esc(r.status)}</span></div><button class="btn" ${r.status!=='approved'?'disabled':''} onclick="toggleOpen(${!r.is_open})">${r.is_open?'Online':'Offline'}</button></div><p class="muted">${esc(r.cuisine)} · ${r.delivery_mode==='own'?'Own delivery':'VASI courier'} · ${rate}% restaurant commission</p>${r.status==='pending'?'<p>Your application is being reviewed. You can prepare your menu now.</p>':''}<div class="payout"><b>Payments & RIB</b><p class="muted">${r.status==='approved'?'Connect/verify your RIB to receive payouts.':'RIB setup becomes available after restaurant approval.'}</p></div><div class="stats"><div class="stat"><span class="muted">Active orders</span><b>${orders.filter(o=>active.has(o.status)).length}</b></div><div class="stat"><span class="muted">Delivered</span><b>${done.length}</b></div><div class="stat"><span class="muted">Order sales</span><b>${money(sales)}</b></div><div class="stat"><span class="muted">Your payout</span><b>${money(payout)}</b></div></div></section>${profileForm(r)}<div class="grid"><section class="card"><h2>Menu</h2><form class="form" onsubmit="addItem(event)"><label>Item name<input name="name" required></label><label>Category<input name="category"></label><label>Price<input name="price" type="number" min="0.5" step="0.01" required></label><label>Description<input name="description"></label><label class="full">Allergens<input name="allergens"></label><button class="btn primary full">Add item</button></form><div>${menu}</div></section><section class="card"><h2>Orders</h2>${ord}</section></div>`}
async function load(){try{data=await api();if(!data.restaurant){location.replace('restaurant-register.html');return}render()}catch(e){msg.textContent=e.message}}
function openEdit(){document.getElementById('editCard')?.classList.remove('hidden');document.getElementById('editCard')?.scrollIntoView({behavior:'smooth',block:'start'})}function closeEdit(){document.getElementById('editCard')?.classList.add('hidden')}
async function saveProfile(e){e.preventDefault();msg.textContent='Saving restaurant details…';try{const result=await profile(Object.fromEntries(new FormData(e.target)));data.restaurant=result.restaurant;render();msg.textContent='Restaurant details saved.'}catch(err){msg.textContent=err.message}}
async function act(body,text='Saved.'){msg.textContent='Saving…';try{await api(body);msg.textContent=text;await load()}catch(e){msg.textContent=e.message}}function toggleItem(id,a){act({action:'toggle_item',id,active:a})}function toggleOpen(a){act({action:'toggle_open',is_open:a})}function orderStatus(id,status){act({action:'order_status',id,status})}async function addItem(e){e.preventDefault();await act({action:'add_item',...Object.fromEntries(new FormData(e.target))},'Menu item added.');e.target.reset()}
async function init(){try{const cfg=await fetch('/api/public-client-config').then(r=>r.json());if(!cfg.url||!cfg.key)throw Error('VASI login configuration unavailable');client=supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:localStorage}});const {data:{session}}=await client.auth.getSession();if(!session){localStorage.setItem('vasi_role','restaurant');localStorage.setItem('vasi_return','restaurant-dashboard.html');location.replace('auth.html?role=restaurant');return}token=session.access_token;await load()}catch(e){msg.textContent=e.message}}
document.getElementById('editBtn').addEventListener('click',openEdit);document.getElementById('signOut').addEventListener('click',async()=>{if(client)await client.auth.signOut();location.replace('index.html')});init();
</script><script src="./vasi-languages.js?v=4"></script><script src="./vasi-navigation.js?v=4"></script></body></html>
