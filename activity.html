<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>VASI Activity</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#fff;background:#050505}*{box-sizing:border-box}body{margin:0;background:#050505}.app{max-width:720px;margin:auto;padding:20px 18px 42px}.top{display:flex;justify-content:space-between;align-items:center}.top-actions{display:flex;gap:8px}.brand{font-size:30px;font-weight:900}.back,.tab{border:1px solid #303030;background:#151515;color:#ddd;border-radius:12px;padding:9px 13px}.hero{padding:30px 0 16px}.hero h1{font-size:40px;margin:6px 0}.muted{color:#999}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.tab.active{background:#fff;color:#050505}.list{display:grid;gap:11px;margin-top:16px}.card{border:1px solid #292929;border-radius:19px;background:#111;padding:15px}.row{display:flex;justify-content:space-between;gap:15px}.badge{font-size:11px;background:#222;border-radius:999px;padding:5px 9px;text-transform:uppercase}.price{font-size:20px;font-weight:900}.route{margin-top:12px;display:grid;gap:7px;font-size:13px}.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:11px 0 4px}.step{height:5px;border-radius:99px;background:#333}.step.done{background:#7dff9b}.progress-label{color:#b9ffc9;font-weight:800}.empty{text-align:center;color:#999;padding:45px 10px}.error{color:#ffb4b4}.link{color:#fff}</style>  <link rel="stylesheet" href="./vasi-mobile-fit.css" />
  </head><body><main class="app"><header class="top"><div class="brand"><img class="vasi-wordmark" src="./assets/vasi-logo.png" alt="VASI" style="display:block;width:112px;max-width:28vw;height:auto;max-height:46px;object-fit:contain" /></div><div class="top-actions"><button class="back" onclick="location.href='account.html'">Account</button><button class="back" onclick="location.href='index.html'">Home</button></div></header><section class="hero"><div class="muted">Your account</div><h1>Activity</h1><p class="muted">Rides, food and deliveries in one place.</p></section><nav class="tabs"><button class="tab active" data-filter="all" onclick="filterTo('all',this)">All</button><button class="tab" data-filter="ride" onclick="filterTo('ride',this)">Rides</button><button class="tab" data-filter="eats" onclick="filterTo('eats',this)">Eats</button><button class="tab" data-filter="delivery" onclick="filterTo('delivery',this)">Delivery</button></nav><section id="list" class="list"><div class="empty">Loading your activity…</div></section><p id="notice" class="muted"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"></script><script src="./vasi-notifications.js"></script><script>
const sb=supabase.createClient('https://vhfyvkrvysrooaqzcxsp.supabase.co','sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT');const el=id=>document.getElementById(id);let rows=[],active=['ride','eats','delivery'].includes(new URLSearchParams(location.search).get('filter'))?new URLSearchParams(location.search).get('filter'):'all';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=(n,c='EUR')=>new Intl.NumberFormat('en-GB',{style:'currency',currency:c||'EUR'}).format(Number(n||0));const when=v=>v?new Date(v).toLocaleString():'—';
function rideRow(r){return{type:'ride',icon:'🚗',title:r.service||'VASI Ride',status:r.status,date:r.completed_at||r.cancelled_at||r.requested_at,price:r.final_fare??r.estimated_fare,currency:r.currency,details:`<div>📍 ${esc(r.pickup_address)}</div><div>🏁 ${esc(r.destination_address)}</div>`,id:r.id}}
function eatsProgress(status){const levels={awaiting_payment:0,pending:1,accepted:1,preparing:2,ready_for_pickup:2,picked_up:3,delivered:4},labels={awaiting_payment:'Waiting for payment',pending:'Order received',accepted:'Restaurant accepted',preparing:'Preparing your food',ready_for_pickup:'Ready for courier',picked_up:'Courier is on the way',delivered:'Delivered'};const level=levels[status]??1;return `<div class="progress" aria-label="Order progress">${[1,2,3,4].map(i=>`<span class="step ${i<=level?'done':''}"></span>`).join('')}</div><div class="progress-label">${esc(labels[status]||String(status||'Order received').replaceAll('_',' '))}</div>`}
function eatsRow(r){const qty=(r.items||[]).reduce((n,i)=>n+Number(i.quantity||0),0),pin=r.delivery_pin&&r.status!=='delivered'?`<div style="margin-top:8px"><b>Delivery PIN: ${esc(r.delivery_pin)}</b><br><span class="muted">Give it to the courier only at handover.</span></div>`:'';return{type:'eats',icon:'🍔',title:r.restaurant_name||'VASI Eats',status:r.status,date:r.created_at,price:r.total,currency:r.currency,details:`${eatsProgress(r.status)}<div>${qty} item${qty===1?'':'s'}</div><div>📍 ${esc(r.delivery_address)}</div>${pin}`,id:r.id}}
function deliveryRow(r){return{type:'delivery',icon:'📦',title:r.item_type==='document'?'Document delivery':'Parcel delivery',status:r.status,date:r.created_at,price:r.quote,currency:r.currency,details:`<div>📍 ${esc(r.pickup_address)}</div><div>🏁 ${esc(r.dropoff_address)}</div>`,id:r.id}}
function render(){const shown=active==='all'?rows:rows.filter(r=>r.type===active);if(!shown.length){el('list').innerHTML='<div class="empty">No '+(active==='all'?'activity yet.':active+' activity yet.')+'</div>';return}el('list').innerHTML=shown.map(r=>`<article class="card"><div class="row"><div><span class="badge">${r.icon} ${esc(r.type)}</span><h3>${esc(r.title)}</h3><div class="muted">${esc(when(r.date))} · ${esc(String(r.status||'pending').replaceAll('_',' '))}</div></div><div class="price">${money(r.price,r.currency)}</div></div><div class="route">${r.details}</div><div class="muted" style="margin-top:10px">ID: ${esc(String(r.id||'').slice(0,8).toUpperCase())}</div></article>`).join('')}
function filterTo(next,button){active=next;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));button.classList.add('active');render()}
async function load(){const{data:{session}}=await sb.auth.getSession();if(!session){localStorage.setItem('vasi_role','customer');localStorage.setItem('vasi_return','activity.html');location.href='auth.html?role=customer';return}const [rides,eats,deliveries,pins]=await Promise.all([sb.rpc('get_customer_ride_history_v2',{p_limit:50}),sb.from('eats_orders').select('id,restaurant_name,items,delivery_address,total,currency,status,created_at').eq('customer_id',session.user.id).order('created_at',{ascending:false}).limit(50),sb.from('delivery_orders').select('id,pickup_address,dropoff_address,item_type,quote,currency,status,created_at').eq('customer_id',session.user.id).order('created_at',{ascending:false}).limit(50),sb.from('eats_order_safety').select('order_id,delivery_pin,pin_verified_at').eq('customer_id',session.user.id)]);const errors=[rides.error,eats.error,deliveries.error,pins.error].filter(Boolean),pinByOrder=new Map((pins.data||[]).map(x=>[x.order_id,x]));const eatsWithPins=(eats.data||[]).map(order=>({...order,...(pinByOrder.get(order.id)||{})}));rows=[...(rides.data||[]).map(rideRow),...eatsWithPins.map(eatsRow),...(deliveries.data||[]).map(deliveryRow)].sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));if(errors.length)el('notice').textContent='Some activity could not be loaded. Please refresh.';render()}
document.querySelectorAll('.tab').forEach(button=>button.classList.toggle('active',button.dataset.filter===active));load();
;VasiNotifications.start(sb,{role:"customer"});</script><script src="./vasi-languages.js"></script></body></html>
