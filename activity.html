<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>VASI Activity</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#fff;background:#050505}*{box-sizing:border-box}body{margin:0;background:#050505}.app{max-width:720px;margin:auto;padding:20px 18px 42px}.top{display:flex;justify-content:space-between;align-items:center}.top-actions{display:flex;gap:8px}.brand{font-size:30px;font-weight:900}.back,.tab{border:1px solid #303030;background:#151515;color:#ddd;border-radius:12px;padding:9px 13px}.hero{padding:30px 0 16px}.hero h1{font-size:40px;margin:6px 0}.muted{color:#999}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.tab.active{background:#fff;color:#050505}.list{display:grid;gap:11px;margin-top:16px}.card{border:1px solid #292929;border-radius:19px;background:#111;padding:15px}.row{display:flex;justify-content:space-between;gap:15px}.badge{font-size:11px;background:#222;border-radius:999px;padding:5px 9px;text-transform:uppercase}.price{font-size:20px;font-weight:900}.route{margin-top:12px;display:grid;gap:7px;font-size:13px}.empty{text-align:center;color:#999;padding:45px 10px}.error{color:#ffb4b4}.link{color:#fff}</style></head><body><main class="app"><header class="top"><div class="brand">VASI</div><div class="top-actions"><button class="back" onclick="location.href='account.html'">Account</button><button class="back" onclick="location.href='index.html'">Home</button></div></header><section class="hero"><div class="muted">Your account</div><h1>Activity</h1><p class="muted">Rides, food and deliveries in one place.</p></section><nav class="tabs"><button class="tab active" data-filter="all" onclick="filterTo('all',this)">All</button><button class="tab" data-filter="ride" onclick="filterTo('ride',this)">Rides</button><button class="tab" data-filter="eats" onclick="filterTo('eats',this)">Eats</button><button class="tab" data-filter="delivery" onclick="filterTo('delivery',this)">Delivery</button></nav><section id="list" class="list"><div class="empty">Loading your activity…</div></section><p id="notice" class="muted"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://vhfyvkrvysrooaqzcxsp.supabase.co','sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT');const el=id=>document.getElementById(id);let rows=[],active='all';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=(n,c='EUR')=>new Intl.NumberFormat('en-GB',{style:'currency',currency:c||'EUR'}).format(Number(n||0));const when=v=>v?new Date(v).toLocaleString():'—';
function rideRow(r){return{type:'ride',icon:'🚗',title:r.service||'VASI Ride',status:r.status,date:r.completed_at||r.cancelled_at||r.requested_at,price:r.final_fare??r.estimated_fare,currency:r.currency,details:`<div>📍 ${esc(r.pickup_address)}</div><div>🏁 ${esc(r.destination_address)}</div>`,id:r.id}}
function eatsRow(r){const qty=(r.items||[]).reduce((n,i)=>n+Number(i.quantity||0),0);return{type:'eats',icon:'🍔',title:r.restaurant_name||'VASI Eats',status:r.status,date:r.created_at,price:r.total,currency:r.currency,details:`<div>${qty} item${qty===1?'':'s'}</div><div>📍 ${esc(r.delivery_address)}</div>`,id:r.id}}
function deliveryRow(r){return{type:'delivery',icon:'📦',title:r.item_type==='document'?'Document delivery':'Parcel delivery',status:r.status,date:r.created_at,price:r.quote,currency:r.currency,details:`<div>📍 ${esc(r.pickup_address)}</div><div>🏁 ${esc(r.dropoff_address)}</div>`,id:r.id}}
function render(){const shown=active==='all'?rows:rows.filter(r=>r.type===active);if(!shown.length){el('list').innerHTML='<div class="empty">No '+(active==='all'?'activity yet.':active+' activity yet.')+'</div>';return}el('list').innerHTML=shown.map(r=>`<article class="card"><div class="row"><div><span class="badge">${r.icon} ${esc(r.type)}</span><h3>${esc(r.title)}</h3><div class="muted">${esc(when(r.date))} · ${esc(String(r.status||'pending').replaceAll('_',' '))}</div></div><div class="price">${money(r.price,r.currency)}</div></div><div class="route">${r.details}</div><div class="muted" style="margin-top:10px">ID: ${esc(String(r.id||'').slice(0,8).toUpperCase())}</div></article>`).join('')}
function filterTo(next,button){active=next;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));button.classList.add('active');render()}
async function load(){const{data:{session}}=await sb.auth.getSession();if(!session){localStorage.setItem('vasi_role','customer');localStorage.setItem('vasi_return','activity.html');location.href='auth.html?role=customer';return}const [rides,eats,deliveries]=await Promise.all([sb.rpc('get_customer_ride_history_v2',{p_limit:50}),sb.from('eats_orders').select('id,restaurant_name,items,delivery_address,total,currency,status,created_at').eq('customer_id',session.user.id).order('created_at',{ascending:false}).limit(50),sb.from('delivery_orders').select('id,pickup_address,dropoff_address,item_type,quote,currency,status,created_at').eq('customer_id',session.user.id).order('created_at',{ascending:false}).limit(50)]);const errors=[rides.error,eats.error,deliveries.error].filter(Boolean);rows=[...(rides.data||[]).map(rideRow),...(eats.data||[]).map(eatsRow),...(deliveries.data||[]).map(deliveryRow)].sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));if(errors.length)el('notice').textContent='Some activity could not be loaded. Please refresh.';render()}
load();
</script></body></html>
