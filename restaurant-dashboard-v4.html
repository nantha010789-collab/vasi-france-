<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>Espace restaurant · VASI</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#fff;background:#050505;--panel:#101010;--line:#2b2b2b;--muted:#9b9b9b;--green:#76e695}*{box-sizing:border-box}body{margin:0;background:#050505}.wrap{width:min(100%,1000px);margin:auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(70px + env(safe-area-inset-bottom))}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:9px}.brand img{width:108px;max-width:30vw}.actions{display:flex;gap:8px}.btn,input,select,textarea{font:inherit;border:1px solid #363636;background:#181818;color:#fff;border-radius:14px;padding:12px 14px}.btn{min-height:46px;font-weight:800;cursor:pointer}.primary{background:#fff;color:#050505;border-color:#fff}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:14px}.muted{color:var(--muted);line-height:1.45}.badge{display:inline-flex;padding:7px 10px;border-radius:999px;background:#292929;font-size:12px;font-weight:850}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.stat{padding:14px;border:1px solid var(--line);border-radius:16px;background:#171717}.stat b{display:block;font-size:22px;margin-top:5px}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.payout{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#171717}.payout .btn{width:100%;margin-top:10px}.rib-ok{color:var(--green);font-weight:800}.menu-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.menu-tools{display:flex;gap:8px;margin-top:12px}.menu-tools input{flex:1;min-width:0}.menu-list{margin-top:12px}.menu-row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}.menu-row:first-child{border-top:0}.menu-photo,.menu-placeholder{width:64px;height:58px;border-radius:12px;object-fit:cover;background:#1c1c1c;border:1px solid #303030}.menu-placeholder{display:grid;place-items:center;font-size:24px}.menu-name{font-size:16px;font-weight:850}.menu-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.empty{padding:26px 8px;text-align:center;color:var(--muted)}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;z-index:50}.modal-backdrop.open{display:flex}.sheet{width:min(100%,720px);max-height:92dvh;overflow:auto;background:#101010;border:1px solid #343434;border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom))}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-18px;background:#101010;padding:18px 0 12px;z-index:2}.editor{display:grid;grid-template-columns:1fr 1fr;gap:12px}.editor label{font-size:13px;font-weight:750;color:#bbb}.editor input,.editor textarea,.editor select{display:block;width:100%;margin-top:7px}.editor textarea{min-height:90px;resize:vertical}.full{grid-column:1/-1}.photo-box{display:flex;align-items:center;gap:12px;padding:12px;border:1px dashed #3a3a3a;border-radius:14px;background:#151515}.orders .order{padding:13px 0;border-top:1px solid var(--line)}.orders .order:first-child{border-top:0}.hidden{display:none!important}.message{text-align:center;color:#bbb;min-height:22px}
@media(max-width:760px){.top{align-items:flex-start}.actions{flex-wrap:wrap;justify-content:flex-end}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.menu-head{align-items:flex-start}.menu-tools{flex-direction:column}.menu-row{grid-template-columns:58px minmax(0,1fr)}.menu-actions{grid-column:1/-1;justify-content:stretch}.menu-actions .btn{flex:1}.editor{grid-template-columns:1fr}.full{grid-column:auto}.sheet{border-radius:22px 22px 0 0}.brand span{display:none}}
</style></head><body><main class="wrap"><header class="top"><button class="btn" onclick="history.length>1?history.back():location.href='index.html'">← Retour</button><div class="brand"><img src="./assets/vasi-logo.png" alt="VASI"><span>Restaurant</span></div><div class="actions"><button class="btn" id="editRestaurant">Modifier</button><button class="btn" id="signOut">Déconnexion</button></div></header><div id="app"><section class="card"><p class="muted">Chargement…</p></section></div><p id="msg" class="message"></p></main>
<div id="menuModal" class="modal-backdrop" role="dialog" aria-modal="true"><section class="sheet"><div class="sheet-head"><div><b id="editorTitle">Ajouter un article</b><div class="muted">Créez ou modifiez un produit du menu.</div></div><button class="btn" onclick="closeMenuEditor()">Fermer</button></div><form id="itemForm" class="editor" onsubmit="saveItem(event)"><input type="hidden" name="id"><label class="full">Photo<div class="photo-box"><div id="photoPreview" class="menu-placeholder">🍽️</div><div><input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp"><div class="muted">JPG, PNG ou WebP. Facultatif.</div></div></div></label><label>Nom de l’article<input name="name" required></label><label>Catégorie<input name="category" placeholder="Burgers, boissons…"></label><label>Prix<input name="price" type="number" min="0.5" step="0.01" required></label><label>Disponibilité<select name="active"><option value="true">Disponible</option><option value="false">Masqué</option></select></label><label class="full">Description<textarea name="description" placeholder="Décrivez l’article…"></textarea></label><label class="full">Allergènes<input name="allergens" placeholder="Gluten, lait, noix…"></label><button class="btn primary full" type="submit">Enregistrer l’article</button></form></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"></script><script src="./vasi-region.js"></script><script>
const U='https://vhfyvkrvysrooaqzcxsp.supabase.co',K='sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKT';const client=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:localStorage}});let token='',data={},rib={payouts_enabled:false,details_submitted:false},editing=null;const app=document.getElementById('app'),msg=document.getElementById('msg'),money=v=>VasiRegion.money(Number(v||0),VasiRegion.getRegion().code),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));
async function api(body){const r=await fetch('/api/restaurant-partner',{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Service restaurant indisponible');return j}async function refreshRib(){if(data.restaurant?.status!=='approved')return;try{const r=await fetch('/api/restaurant-stripe-onboarding',{headers:{Authorization:'Bearer '+token},cache:'no-store'});const j=await r.json().catch(()=>({}));if(r.ok)rib=j}catch(_e){}}
function ribBox(r){if(r.status!=='approved')return '<div class="payout"><b>Paiements & RIB</b><p class="muted">Disponible après validation.</p></div>';if(rib.payouts_enabled)return '<div class="payout"><b>Paiements & RIB</b><p class="rib-ok">✓ RIB vérifié et paiements activés.</p></div>';return `<div class="payout"><b>Paiements & RIB</b><p class="muted">Connectez votre compte bancaire pour recevoir vos versements.</p><button class="btn primary" onclick="connectRib()">${rib.details_submitted?'Continuer la vérification':'Connecter mon RIB'}</button></div>`}
function menuRows(){const q=(document.getElementById('menuSearch')?.value||'').toLowerCase();const rows=(data.menu||[]).filter(i=>[i.name,i.category,i.description].join(' ').toLowerCase().includes(q));if(!rows.length)return '<div class="empty">Aucun article dans ce menu.</div>';return rows.map(i=>`<div class="menu-row">${i.photo_url?`<img class="menu-photo" src="${esc(i.photo_url)}" alt="">`:'<div class="menu-placeholder">🍽️</div>'}<div><div class="menu-name">${esc(i.name)}</div><div class="muted">${esc(i.category||'Menu')} · ${money(i.price)} · ${i.active?'Disponible':'Masqué'}</div></div><div class="menu-actions"><button class="btn" onclick="openMenuEditor('${i.id}')">Modifier</button><button class="btn" onclick="toggleItem('${i.id}',${!i.active})">${i.active?'Masquer':'Afficher'}</button></div></div>`).join('')}
function render(){const r=data.restaurant,orders=data.orders||[],done=orders.filter(o=>o.status==='delivered'),sales=done.reduce((s,o)=>s+Number(o.total||0),0);app.innerHTML=`<section class="card"><div class="row"><div><h1>${esc(r.name)}</h1><span class="badge">${esc(r.status==='approved'?'Approuvé':r.status)}</span></div><button class="btn" ${!rib.payouts_enabled?'disabled':''}>${r.is_open?'Ouvert':'Fermé'}</button></div><p class="muted">${esc(r.cuisine)} · ${r.delivery_mode==='own'?'Livraison par votre équipe':'Coursier VASI'} · 10 % de commission</p>${ribBox(r)}<div class="stats"><div class="stat"><span class="muted">Commandes actives</span><b>${orders.filter(o=>['pending','accepted','preparing','ready_for_pickup','picked_up'].includes(o.status)).length}</b></div><div class="stat"><span class="muted">Livrées</span><b>${done.length}</b></div><div class="stat"><span class="muted">Ventes</span><b>${money(sales)}</b></div><div class="stat"><span class="muted">Articles menu</span><b>${(data.menu||[]).length}</b></div></div></section><div class="grid"><section class="card"><div class="menu-head"><div><h2>Menu</h2><p class="muted">Gérez les articles comme dans un vrai gestionnaire de restaurant.</p></div><button class="btn primary" onclick="openMenuEditor()">+ Ajouter un article</button></div><div class="menu-tools"><input id="menuSearch" placeholder="Rechercher un article…" oninput="document.getElementById('menuList').innerHTML=menuRows()"></div><div id="menuList" class="menu-list">${menuRows()}</div></section><section class="card orders"><h2>Commandes</h2>${orders.length?orders.map(o=>`<div class="order"><div class="row"><b>#${o.id.slice(0,8).toUpperCase()}</b><span class="badge">${esc(o.status)}</span></div><p class="muted">${money(o.total)} · ${esc(o.delivery_address||'')}</p></div>`).join(''):'<p class="muted">Aucune commande.</p>'}</section></div>`}
function openMenuEditor(id){editing=(data.menu||[]).find(i=>i.id===id)||null;const f=document.getElementById('itemForm');f.reset();f.elements.id.value=editing?.id||'';f.elements.name.value=editing?.name||'';f.elements.category.value=editing?.category||'';f.elements.price.value=editing?.price||'';f.elements.description.value=editing?.description||'';f.elements.allergens.value=(editing?.allergens||[]).join(', ');f.elements.active.value=String(editing?.active!==false);document.getElementById('editorTitle').textContent=editing?'Modifier l’article':'Ajouter un article';const p=document.getElementById('photoPreview');p.outerHTML=editing?.photo_url?`<img id="photoPreview" class="menu-photo" src="${esc(editing.photo_url)}" alt="">`:'<div id="photoPreview" class="menu-placeholder">🍽️</div>';document.getElementById('menuModal').classList.add('open')}
function closeMenuEditor(){document.getElementById('menuModal').classList.remove('open');editing=null}
async function saveItem(e){e.preventDefault();const form=e.target,body=Object.fromEntries(new FormData(form));msg.textContent='Enregistrement…';try{if(editing){await api({action:'update_item',id:editing.id,name:body.name,category:body.category,price:body.price,description:body.description,allergens:body.allergens,active:body.active==='true'})}else{const res=await api({action:'add_item',name:body.name,category:body.category,price:body.price,description:body.description,allergens:body.allergens});editing=res.item||null}const file=document.getElementById('photoInput').files?.[0];if(file&&editing?.id){const image=await fileToDataUrl(file);await api({action:'submit_photo',id:editing.id,image})}closeMenuEditor();await load();msg.textContent='Article enregistré.'}catch(err){msg.textContent=err.message}}
function fileToDataUrl(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}async function toggleItem(id,active){try{await api({action:'toggle_item',id,active});await load()}catch(e){msg.textContent=e.message}}async function connectRib(){msg.textContent='Ouverture Stripe…';try{const r=await fetch('/api/restaurant-stripe-onboarding',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({country:'FR'})});const j=await r.json();if(!r.ok)throw Error(j.error||'Connexion RIB indisponible');location.href=j.url}catch(e){msg.textContent=e.message}}
async function load(){data=await api();if(!data.restaurant){location.replace('restaurant-register-form.html');return}await refreshRib();render()}document.getElementById('menuModal').addEventListener('click',e=>{if(e.target.id==='menuModal')closeMenuEditor()});document.getElementById('signOut').onclick=async()=>{await client.auth.signOut();location.replace('index.html')};document.getElementById('editRestaurant').onclick=()=>location.href='restaurant-profile.html';client.auth.getSession().then(async({data:{session}})=>{if(!session){localStorage.setItem('vasi_role','restaurant');localStorage.setItem('vasi_return','restaurant-dashboard.html');location.replace('auth.html?role=restaurant');return}token=session.access_token;await load()}).catch(e=>msg.textContent=e.message);
</script></body></html>
