<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>VASI Restaurant</title><style>html,body{margin:0;width:100%;height:100%;background:#050505;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;background:#050505}</style></head><body><iframe id="app" src="restaurant-dashboard-v6.html?ui=v7" title="VASI Restaurant"></iframe><script>(()=>{const f=document.getElementById('app');f.addEventListener('load',()=>{try{const d=f.contentDocument;if(!d||d.getElementById('vasi-v7-polish'))return;const s=d.createElement('style');s.id='vasi-v7-polish';s.textContent=`
:root{--v7-line:#303030;--v7-panel:#111;--v7-soft:#181818;--v7-muted:#a8a8a8;--v7-green:#7be79a}
body{background:#050505!important}
.wrap{max-width:760px!important;padding-left:16px!important;padding-right:16px!important;padding-bottom:calc(92px + env(safe-area-inset-bottom))!important}
.card{border-color:var(--v7-line)!important;border-radius:24px!important;padding:20px!important;box-shadow:0 10px 30px rgba(0,0,0,.14)}
.stats{gap:10px!important}.stat{min-height:116px!important;border-radius:18px!important;padding:16px!important}.stat .muted{font-size:14px}.stat b{font-size:25px!important;margin-top:10px!important}
.menu-head{gap:14px!important}.menu-head h2{font-size:28px!important;margin-bottom:8px!important}.menu-head .btn.primary{min-height:54px!important;border-radius:16px!important;font-size:16px!important}
.search{min-height:54px!important;border-radius:16px!important;background:#171717!important;padding:0 16px!important}
.menu-row{grid-template-columns:74px minmax(0,1fr)!important;gap:14px!important;padding:18px 0!important}.pic,.placeholder{width:74px!important;height:70px!important;border-radius:15px!important}.menu-name{font-size:18px!important}.menu-actions{grid-column:1/-1!important;display:grid!important;grid-template-columns:1fr 1fr!important;gap:10px!important;margin-top:2px!important}.menu-actions .btn{min-height:50px!important;border-radius:16px!important}
.tabs{display:grid!important;grid-template-columns:repeat(4,minmax(120px,1fr))!important;gap:8px!important;overflow-x:auto!important;padding:4px 0 14px!important;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{min-height:44px!important;padding:10px 14px!important;border-radius:999px!important;font-size:13px!important}.tab.active{font-weight:900!important}
.order-card{border-radius:20px!important;padding:16px!important;margin-top:12px!important}.order-card.new{border-color:#3d8150!important;background:#102417!important}.order-id{font-size:18px!important}.order-item{padding:11px 12px!important;border-radius:13px!important}.pill{font-size:12px!important;padding:8px 10px!important}.order-actions .btn{min-height:52px!important;border-radius:16px!important;font-size:16px!important}.empty{padding:34px 12px!important;font-size:15px!important}
button[onclick*="load"],button[onclick*="refresh"]{min-height:44px!important;border-radius:14px!important;padding:10px 14px!important;font-size:14px!important}
@media(max-width:520px){.wrap{padding-left:12px!important;padding-right:12px!important}.card{padding:18px!important}.stats{grid-template-columns:1fr 1fr!important}.tabs{grid-template-columns:repeat(4,minmax(112px,1fr))!important}.menu-head{flex-direction:column!important}.menu-head .btn.primary{width:100%!important}.top{gap:8px!important}.top .btn{padding:10px 12px!important}.order-head{gap:8px!important}}
`;d.head.appendChild(s);const mark=()=>{try{const menu=d.querySelectorAll('.menu-row');menu.forEach(row=>{const text=row.textContent||'';if(text.includes('Disponible'))row.style.setProperty('--itemState','#7be79a');});}catch(_){}};mark();new MutationObserver(mark).observe(d.body,{subtree:true,childList:true});}catch(e){console.warn('VASI v7 polish unavailable',e)}})})();</script></body></html>
