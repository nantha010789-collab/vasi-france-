<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151515">
<title>VASI — France & Europe</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151515}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="app" src="./vasi-rich.html" title="VASI — France & Europe"></iframe>
<script>
(function(){
  const frame=document.getElementById('app');
  function install(){
    const doc=frame.contentDocument;
    if(!doc||!doc.body)return;
    if(doc.getElementById('vasi-nav-fix'))return;
    const style=doc.createElement('style');
    style.id='vasi-nav-fix';
    style.textContent=`
      /* VASI navigation: visible on Home, Account, Services and Activity; hidden only during taxi booking. */
      body:not(.vasi-booking) .bottom{display:grid!important;position:fixed!important;z-index:999999!important}
      body:not(.vasi-booking) .accountScreen{padding-bottom:calc(120px + env(safe-area-inset-bottom))!important}
      body.vasi-booking .bottom{display:none!important}
      body.vasi-booking .sheet{padding-bottom:28px!important}
      @media(max-width:800px){body.vasi-booking .sheet{max-height:82vh!important}}
    `;
    doc.head.appendChild(style);
    function sync(){
      const plan=doc.getElementById('planView');
      const rides=doc.getElementById('ridesView');
      const booking=!!((plan&&plan.classList.contains('active'))||(rides&&rides.classList.contains('active')));
      doc.body.classList.toggle('vasi-booking',booking);
      const nav=doc.querySelector('.bottom');
      if(nav){
        nav.setAttribute('aria-hidden',booking?'true':'false');
        if(!booking){
          nav.style.display='grid';
          nav.style.zIndex='999999';
        }else{
          nav.style.display='none';
        }
      }
    }
    new MutationObserver(sync).observe(doc.body,{subtree:true,attributes:true,attributeFilter:['class','style']});
    sync();
    setInterval(sync,250);
  }
  frame.addEventListener('load',install);
  if(frame.contentDocument)install();
})();
</script>
</body>
</html>
