<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151515">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VASI">
<title>VASI France — Taxi</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151515}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="app" src="./vasi-rich.html?v=2026083003" title="VASI France Taxi"></iframe>
<script>
(function(){
 const frame=document.getElementById('app');
 const removePlaceNames=['Paris','Beauvais','Lille','CDG','Charles de Gaulle','Savigny-le-Temple','2 Rue Raymond Eglin'];
 function install(){
  const doc=frame.contentDocument,win=frame.contentWindow;if(!doc||!doc.body||!win)return;
  if(doc.getElementById('vasi-ui-clean-3003'))return;
  const s=doc.createElement('style');s.id='vasi-ui-clean-3003';s.textContent=`
   .accountBtn{display:none!important}
   #planView .suggestions .suggest{display:none!important}
   #planView .suggestions:before{content:'Enter a destination';display:block;color:#999;padding:18px 4px;font-size:15px}
   #planView .route{width:calc(100% - 72px)!important;margin-right:72px!important}
   #planView{position:relative!important}
   #planView .addStop{position:absolute!important;right:-6px!important;top:170px!important;margin:0!important;width:52px!important;height:52px!important;border-radius:50%!important;background:#292929!important;color:#fff!important;font-size:30px!important;z-index:20!important}
   body.vasi-booking .bottom{display:none!important}
   body:not(.vasi-booking) .bottom{display:grid!important;pointer-events:auto!important;z-index:999999!important}
  `;doc.head.appendChild(s);
  function leaf(el){return el&&el.children.length===0;}
  function removePresetRows(){
   const sheet=doc.getElementById('sheet');if(!sheet)return;
   sheet.querySelectorAll('*').forEach(el=>{
    if(!leaf(el))return;
    const t=el.textContent.trim();
    if(removePlaceNames.includes(t)||/^.+\s—\s(Recent destination|recent destination)$/i.test(t)){
      let p=el.parentElement;
      if(p && (p.classList.contains('suggest')||p.classList.contains('listItem')||p.classList.contains('quickCard')||p.classList.contains('recent'))) p.remove();
      else if(/^(Paris|Beauvais|Lille|CDG|Charles de Gaulle|Savigny-le-Temple|2 Rue Raymond Eglin)$/i.test(t)) el.textContent='';
    }
   });
   sheet.querySelectorAll('input').forEach(i=>{if(removePlaceNames.some(x=>i.value.trim()===x))i.value='';i.placeholder='Where to?';});
  }
  function setAccount(){
   doc.querySelectorAll('.acctName').forEach(e=>e.textContent='Nanthan Siva');
   doc.querySelectorAll('.balanceCard b').forEach(e=>e.textContent='€0.00');
   doc.querySelectorAll('.accountScreen').forEach(e=>{e.innerHTML=e.innerHTML.replace(/Nanthan\s*010789|nath[a-z0-9_-]*|€\s*[0-9]+(?:\.[0-9]{1,2})?/gi,function(m){return /€/.test(m)?'€0.00':'Nanthan Siva'});});
  }
  function sync(){
   const plan=doc.getElementById('planView'),rides=doc.getElementById('ridesView');
   doc.body.classList.toggle('vasi-booking',!!((plan&&plan.classList.contains('active'))||(rides&&rides.classList.contains('active'))));
   removePresetRows();setAccount();
  }
  const input=doc.getElementById('destination');
  if(input){input.value='';input.placeholder='Where to?';}
  const oldShowView=win.showView,oldShowRides=win.showRides,oldGoHome=win.goHome;
  win.showView=function(id){if(oldShowView)oldShowView(id);setTimeout(sync,20)};
  win.showRides=function(){if(oldShowRides)oldShowRides();setTimeout(sync,20)};
  win.goHome=function(){if(oldGoHome)oldGoHome();setTimeout(sync,20)};
  new MutationObserver(sync).observe(doc.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['class','style']});
  sync();
 }
 frame.addEventListener('load',install);if(frame.contentDocument?.readyState==='complete')install();
})();
</script>
</body>
</html>
