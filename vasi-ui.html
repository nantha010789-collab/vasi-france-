<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151515">
<title>VASI — France & Europe</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151515}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="app" src="/vasi-rich.html" title="VASI"></iframe>
<script>
const frame=document.getElementById('app');
function improve(){
  try{
    const d=frame.contentDocument;
    if(!d||!d.head)return;
    if(d.getElementById('vasi-language-system'))return;
    const style=d.createElement('style');
    style.id='vasi-language-system';
    style.textContent=`
      body.vasi-booking .bottom{display:none!important}
      body.vasi-booking .sheet{padding-bottom:28px!important}
      body.vasi-booking .mapControls{bottom:50px!important}
      .accountScreen{z-index:50!important;padding-bottom:calc(110px + env(safe-area-inset-bottom))!important}
      .bottom{z-index:60!important}
      #vasiLangBtn{position:fixed;z-index:120;left:18px;top:18px;height:48px;padding:0 15px;border:1px solid #ffffff22;border-radius:24px;background:#151515ee;color:#fff;font-weight:800;box-shadow:0 6px 22px #0007}
      #vasiLangPanel{position:fixed;z-index:130;left:16px;top:76px;width:245px;background:#242424;border:1px solid #ffffff18;border-radius:20px;padding:10px;box-shadow:0 18px 55px #000b;display:none}
      #vasiLangPanel.show{display:block}
      #vasiLangPanel h3{margin:7px 9px 10px;font-size:17px}
      #vasiLangPanel button{width:100%;height:46px;border:0;border-radius:12px;background:transparent;color:#eee;text-align:left;padding:0 12px;font-weight:700;font-size:15px}
      #vasiLangPanel button:hover,#vasiLangPanel button.active{background:#303030}
      @media(max-width:800px){#vasiLangBtn{top:14px;left:14px}#vasiLangPanel{top:70px;left:14px}}
    `;
    d.head.appendChild(style);

    const langs={
      en:{name:'English',flag:'🇬🇧',map:{'Sign in':'Sign in','Set your destination':'Set your destination','Safe rides, upfront prices':'Safe rides, upfront prices','Where to?':'Where to?','Search destination':'Search destination','Plan your ride':'Plan your ride','Pickup now⌄':'Pickup now⌄','For me⌄':'For me⌄','My current location':'My current location','See prices':'See prices','Choose your ride':'Choose your ride','Everyday rides':'Everyday rides','More comfort':'More comfort','Extra space':'Extra space','Premium vehicle':'Premium vehicle','Luggage space':'Luggage space','BEST PRICE':'BEST PRICE','GOOD DEAL':'GOOD DEAL','NEW · TOP-RATED':'NEW · TOP-RATED','Account':'Account','Home':'Home','Services':'Services','Activity':'Activity','Language':'Language','Safety tools are ready':'Safety tools are ready','Add a stop':'Add a stop'}},
      fr:{name:'Français',flag:'🇫🇷',map:{'Sign in':'Se connecter','Set your destination':'Définissez votre destination','Safe rides, upfront prices':'Trajets sûrs, prix affichés à l’avance','Where to?':'Où allez-vous ?','Search destination':'Rechercher une destination','Plan your ride':'Planifier votre trajet','Pickup now⌄':'Prise en charge maintenant⌄','For me⌄':'Pour moi⌄','My current location':'Ma position actuelle','See prices':'Voir les prix','Choose your ride':'Choisissez votre trajet','Everyday rides':'Trajets du quotidien','More comfort':'Plus de confort','Extra space':'Plus d’espace','Premium vehicle':'Véhicule premium','Luggage space':'Espace bagages','BEST PRICE':'MEILLEUR PRIX','GOOD DEAL':'BONNE AFFAIRE','NEW · TOP-RATED':'NOUVEAU · TRÈS NOTÉ','Account':'Compte','Home':'Accueil','Services':'Services','Activity':'Activité','Language':'Langue','Safety tools are ready':'Les outils de sécurité sont prêts','Add a stop':'Ajouter un arrêt'}},
      ta:{name:'தமிழ்',flag:'🇱🇰',map:{'Sign in':'உள்நுழைய','Set your destination':'உங்கள் இலக்கைத் தேர்வு செய்யுங்கள்','Safe rides, upfront prices':'பாதுகாப்பான பயணம், முன்கூட்டியே விலை','Where to?':'எங்கே செல்ல வேண்டும்?','Search destination':'இலக்கைத் தேடுங்கள்','Plan your ride':'பயணத்தைத் திட்டமிடுங்கள்','Pickup now⌄':'இப்போது அழைத்துச் செல்லுங்கள்⌄','For me⌄':'எனக்காக⌄','My current location':'எனது தற்போதைய இருப்பிடம்','See prices':'விலைகளைப் பார்க்கவும்','Choose your ride':'உங்கள் பயணத்தைத் தேர்வு செய்யுங்கள்','Everyday rides':'தினசரி பயணங்கள்','More comfort':'மேலும் வசதி','Extra space':'கூடுதல் இடம்','Premium vehicle':'பிரீமியம் வாகனம்','Luggage space':'சாமான்களுக்கு இடம்','BEST PRICE':'சிறந்த விலை','GOOD DEAL':'சிறந்த சலுகை','NEW · TOP-RATED':'புதியது · சிறந்த மதிப்பீடு','Account':'கணக்கு','Home':'முகப்பு','Services':'சேவைகள்','Activity':'செயல்பாடு','Language':'மொழி','Safety tools are ready':'பாதுகாப்பு கருவிகள் தயாராக உள்ளன','Add a stop':'ஒரு நிறுத்தத்தைச் சேர்க்கவும்'}},
      de:{name:'Deutsch',flag:'🇩🇪',map:{'Sign in':'Anmelden','Set your destination':'Ziel festlegen','Safe rides, upfront prices':'Sichere Fahrten, transparente Preise','Where to?':'Wohin?','Search destination':'Ziel suchen','Plan your ride':'Fahrt planen','Pickup now⌄':'Jetzt abholen⌄','For me⌄':'Für mich⌄','My current location':'Mein aktueller Standort','See prices':'Preise anzeigen','Choose your ride':'Fahrt auswählen','Everyday rides':'Alltagsfahrten','More comfort':'Mehr Komfort','Extra space':'Mehr Platz','Premium vehicle':'Premium-Fahrzeug','Luggage space':'Gepäckraum','BEST PRICE':'BESTER PREIS','GOOD DEAL':'GUTES ANGEBOT','NEW · TOP-RATED':'NEU · TOP-BEWERTET','Account':'Konto','Home':'Startseite','Services':'Dienste','Activity':'Aktivität','Language':'Sprache','Safety tools are ready':'Sicherheitsfunktionen sind bereit','Add a stop':'Zwischenstopp hinzufügen'}},
      nl:{name:'Nederlands',flag:'🇳🇱',map:{'Sign in':'Inloggen','Set your destination':'Kies je bestemming','Safe rides, upfront prices':'Veilige ritten, vooraf duidelijke prijzen','Where to?':'Waarheen?','Search destination':'Bestemming zoeken','Plan your ride':'Plan je rit','Pickup now⌄':'Nu ophalen⌄','For me⌄':'Voor mij⌄','My current location':'Mijn huidige locatie','See prices':'Bekijk prijzen','Choose your ride':'Kies je rit','Everyday rides':'Dagelijkse ritten','More comfort':'Meer comfort','Extra space':'Extra ruimte','Premium vehicle':'Premium voertuig','Luggage space':'Bagageruimte','BEST PRICE':'BESTE PRIJS','GOOD DEAL':'GOEDE DEAL','NEW · TOP-RATED':'NIEUW · TOP BEOORDEELD','Account':'Account','Home':'Home','Services':'Diensten','Activity':'Activiteit','Language':'Taal','Safety tools are ready':'Veiligheidstools zijn klaar','Add a stop':'Stop toevoegen'}}
    };

    const originals=new WeakMap();
    function translateText(root,lang){
      const map=langs[lang].map;
      const walker=d.createTreeWalker(root,NodeFilter.SHOW_TEXT);
      const nodes=[];let n;
      while(n=walker.nextNode())nodes.push(n);
      nodes.forEach(node=>{
        if(!node.nodeValue.trim())return;
        if(!originals.has(node))originals.set(node,node.nodeValue);
        let text=originals.get(node);
        Object.keys(map).forEach(k=>{text=text.split(k).join(map[k])});
        node.nodeValue=text;
      });
      d.querySelectorAll('input[placeholder]').forEach(el=>{if(!el.dataset.vasiPlaceholder)el.dataset.vasiPlaceholder=el.placeholder; const p=el.dataset.vasiPlaceholder; el.placeholder=map[p]||p});
      d.querySelectorAll('input[aria-label]').forEach(el=>{if(!el.dataset.vasiAria)el.dataset.vasiAria=el.getAttribute('aria-label'); const p=el.dataset.vasiAria; el.setAttribute('aria-label',map[p]||p)});
      d.documentElement.lang=lang==='ta'?'ta':lang;
    }
    function applyLanguage(lang){
      localStorage.setItem('vasi-language',lang);
      translateText(d.body,lang);
      const btn=d.getElementById('vasiLangBtn'); if(btn)btn.textContent=langs[lang].flag+' '+langs[lang].name;
      d.querySelectorAll('#vasiLangPanel button[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
      const panel=d.getElementById('vasiLangPanel'); if(panel)panel.classList.remove('show');
    }
    const btn=d.createElement('button');
    btn.id='vasiLangBtn';
    btn.type='button';
    btn.textContent='🌐 Language';
    btn.onclick=()=>d.getElementById('vasiLangPanel').classList.toggle('show');
    d.body.appendChild(btn);
    const panel=d.createElement('div');
    panel.id='vasiLangPanel';
    panel.innerHTML='<h3>🌐 Language / மொழி</h3>';
    Object.entries(langs).forEach(([code,item])=>{const b=d.createElement('button');b.type='button';b.dataset.lang=code;b.textContent=item.flag+'  '+item.name;b.onclick=()=>applyLanguage(code);panel.appendChild(b)});
    d.body.appendChild(panel);
    d.addEventListener('click',e=>{if(!panel.contains(e.target)&&e.target!==btn)panel.classList.remove('show')});

    const update=()=>{
      const active=d.querySelector('.view.active');
      const account=d.getElementById('accountScreen');
      const booking=!!active && active.id!=='homeView' && !(account&&account.classList.contains('show'));
      d.body.classList.toggle('vasi-booking',booking);
      const lang=localStorage.getItem('vasi-language')||'en';
      translateText(d.body,lang);
    };
    new MutationObserver(update).observe(d.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class','style']});
    d.addEventListener('click',()=>setTimeout(update,0),true);
    applyLanguage(localStorage.getItem('vasi-language')||'en');
    update();
  }catch(e){console.warn('VASI UI fix',e)}
}
frame.addEventListener('load',improve);
</script>
</body>
</html>
