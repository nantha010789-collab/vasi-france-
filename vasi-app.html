<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>VASI App</title><link rel="manifest" href="data:application/manifest+json,{&quot;name&quot;:&quot;VASI&quot;,&quot;short_name&quot;:&quot;VASI&quot;,&quot;start_url&quot;:&quot;.&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;#050505&quot;,&quot;theme_color&quot;:&quot;#19c463&quot;}"/><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:520px;min-height:100vh;margin:auto;background:#fff;color:#111;position:relative;overflow:hidden}.map{height:43vh;background:linear-gradient(135deg,#dbe7d8,#edf1e9);position:relative}.road{position:absolute;width:150%;height:44px;background:#fff;transform:rotate(-18deg);top:48%;left:-20%;box-shadow:0 0 0 2px #d7ddd4}.road2{top:63%;transform:rotate(16deg)}.top{position:absolute;z-index:3;top:0;left:0;right:0;padding:16px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:28px;font-weight:950;letter-spacing:-2px}.logo i{color:#19c463;font-style:normal}.circle{border:0;background:#fff;width:42px;height:42px;border-radius:50%;box-shadow:0 5px 18px #0002;font-size:18px}.pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:34px}.sheet{background:#fff;border-radius:28px 28px 0 0;margin-top:-28px;position:relative;z-index:4;padding:18px 16px 28px;box-shadow:0 -8px 28px #0002}.grab{width:40px;height:4px;background:#ddd;border-radius:4px;margin:-7px auto 14px}.switch{display:flex;background:#f1f3f2;border-radius:12px;padding:3px;margin-bottom:12px}.switch button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px;font-weight:850}.switch .on{background:#111;color:#fff}.field{height:46px;border:1px solid #ddd;border-radius:12px;display:flex;align-items:center;padding:0 11px;margin:6px 0;gap:9px}.field input{border:0;outline:0;width:100%;font-size:14px}.dot{width:8px;height:8px;border-radius:50%;background:#111}.green{background:#19c463}.chips{display:flex;gap:6px;overflow:auto;padding:4px 0}.chips button,.pay,.option{border:1px solid #ddd;background:#fff;border-radius:12px;padding:8px 10px;font-weight:800;white-space:nowrap}.rides{display:flex;gap:7px;overflow:auto;padding:9px 0}.ride{min-width:112px;border:1px solid #ddd;border-radius:14px;padding:9px;background:#fff}.ride.selected{border:2px solid #111}.car{height:52px;display:grid;place-items:center;font-size:32px}.ride b{font-size:12px}.ride small{display:block;color:#777;font-size:10px;margin-top:2px}.price{font-weight:950;font-size:12px;margin-top:5px}.payrow{display:flex;gap:6px;overflow:auto}.pay.active{border:2px solid #19c463;background:#f3fff7}.options{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.option{text-align:left;font-size:11px}.option small{display:block;color:#777;margin-top:2px}.cta{width:100%;border:0;border-radius:13px;background:#19c463;color:#fff;padding:14px;margin-top:10px;font-weight:950;font-size:16px}.nav{position:sticky;bottom:0;z-index:8;background:#fff;border-top:1px solid #eee;display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom));justify-content:space-around}.nav button{border:0;background:none;font-size:11px;font-weight:800}.nav .active{color:#19a958}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:20;align-items:flex-end}.modal.show{display:flex}.box{background:#fff;color:#111;width:100%;max-width:520px;margin:auto;border-radius:24px 24px 0 0;padding:22px}.box input{width:100%;height:46px;border:1px solid #ddd;border-radius:11px;padding:0 11px;margin:6px 0}.close{float:right;border:0;border-radius:50%;width:32px;height:32px}.primary{width:100%;background:#111;color:#fff;border:0;border-radius:11px;padding:13px;font-weight:900;margin-top:8px}.role{display:grid;grid-template-columns:1fr 1fr;gap:8px}.role button{padding:16px;border:1px solid #ddd;background:#fff;border-radius:14px;font-weight:900}.role .selected{border:2px solid #19c463}.hide{display:none}@media(min-width:521px){body{background:#e9ece7}.app{box-shadow:0 0 60px #0002}}
</style></head><body><div class="app"><div class="map"><div class="road"></div><div class="road road2"></div><div class="top"><div class="logo">VASI<i>.</i></div><button class="circle" onclick="account()">👤</button></div><div class="pin">📍</div></div><section class="sheet"><div class="grab"></div><div class="switch"><button id="rider" class="on" onclick="setRole('rider')">👤 Rider</button><button id="driver" onclick="setRole('driver')">🚗 Driver</button></div><div id="riderView"><div class="field"><span class="dot green"></span><input id="from" value="My location"></div><div class="field"><span class="dot"></span><input id="to" placeholder="Where to?"></div><div class="chips"><button onclick="dest('Paris')">Paris</button><button onclick="dest('CDG Airport')">CDG Airport</button><button onclick="dest('Creil')">Creil</button><button onclick="dest('Lille')">Lille</button></div><div class="rides"><div class="ride selected" onclick="ride(this,'VASI Go','€8.50')"><div class="car">🚗</div><b>Go · 4</b><small>11 min</small><div class="price">€8.50</div></div><div class="ride" onclick="ride(this,'Comfort','€11.90')"><div class="car">🚘</div><b>Comfort · 4</b><small>13 min</small><div class="price">€11.90</div></div><div class="ride" onclick="ride(this,'XL','€16.90')"><div class="car">🚙</div><b>XL · 6</b><small>16 min</small><div class="price">€16.90</div></div><div class="ride" onclick="ride(this,'Van','€22.40')"><div class="car">🚐</div><b>Van · 6</b><small>Luggage</small><div class="price">€22.40</div></div><div class="ride" onclick="ride(this,'Premium','€25.90')"><div class="car">🖤</div><b>Premium · 4</b><small>Top quality</small><div class="price">€25.90</div></div></div><div style="font-size:12px;font-weight:900">Payment</div><div class="payrow"><button class="pay active" onclick="payment(this)">💶 Cash</button><button class="pay" onclick="payment(this)">💳 Card</button><button class="pay" onclick="payment(this)"> Apple Pay</button><button class="pay" onclick="payment(this)">G Pay</button></div><div class="options"><button class="option" onclick="toast('Stop added')">➕ Add stop<small>Up to 2</small></button><button class="option" onclick="passenger()">👥 Passenger<small>For someone else</small></button><button class="option" onclick="reserve()">🕐 Reserve<small>Choose time</small></button><button class="option" onclick="toast('Safety sharing ready')">↗ Share trip<small>Live sharing</small></button></div><button class="cta" onclick="book()" id="cta">Choose VASI Go · €8.50</button></div><div id="driverView" class="hide"><h2>Ready to drive?</h2><p style="color:#667085">Go online to receive nearby VASI requests.</p><button class="cta" onclick="toast('You are online')">🟢 Go online</button><div class="options"><button class="option">📍 Nearby requests<small>Live rides</small></button><button class="option">💰 Earnings<small>Today €0.00</small></button><button class="option">🧭 Navigation<small>Turn-by-turn</small></button><button class="option">📋 Trips<small>History</small></button></div></div></section><nav class="nav"><button class="active">⌂<br>Home</button><button onclick="toast('Trips')">▣<br>Trips</button><button onclick="account()">●<br>Account</button><button onclick="safety()">🛡<br>Safety</button></nav></div><div class="modal" id="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><div id="content"></div></div></div><script>let current='VASI Go',price='€8.50',pay='Cash';const $=x=>document.getElementById(x);function toast(x){alert(x)}function closeModal(){$('modal').classList.remove('show')}function open(x){$('content').innerHTML=x;$('modal').classList.add('show')}function setRole(r){$('rider').classList.toggle('on',r==='rider');$('driver').classList.toggle('on',r==='driver');$('riderView').classList.toggle('hide',r!=='rider');$('driverView').classList.toggle('hide',r!=='driver')}function ride(e,n,p){document.querySelectorAll('.ride').forEach(x=>x.classList.remove('selected'));e.classList.add('selected');current=n;price=p;$('cta').textContent='Choose '+n+' · '+p}function payment(e){document.querySelectorAll('.pay').forEach(x=>x.classList.remove('active'));e.classList.add('active');pay=e.textContent.trim()}function dest(x){$('to').value=x}function book(){if(!$('to').value.trim())return toast('Enter your destination');open('<h2>Confirm VASI ride</h2><p><b>'+$('from').value+'</b> → <b>'+$('to').value+'</b></p><p>'+current+' · '+price+' · '+pay+'</p><button class="primary" onclick="toast(\'Booking request sent\');closeModal()">Confirm ride</button>')}function passenger(){open('<h2>Ride for someone else</h2><input placeholder="Passenger name"><input placeholder="Passenger phone"><button class="primary" onclick="closeModal()">Save</button>')}function reserve(){open('<h2>Reserve a ride</h2><input type="date"><input type="time"><button class="primary" onclick="closeModal()">Continue</button>')}function account(){open('<h2>VASI Account</h2><div class="role"><button class="selected" onclick="signup(\'phone\')">📱 Mobile number</button><button onclick="signup(\'email\')">✉️ Email address</button></div>')}function signup(type='phone'){open('<h2>Create your VASI account</h2><p style="color:#667085">Sign up securely with '+(type==='phone'?'your mobile number':'your email address')+'.</p>'+(type==='phone'?'<input placeholder="+33 Mobile number" type="tel">':'<input placeholder="Email address" type="email">')+'<button class="primary" onclick="toast(\'Verification code sent\');closeModal()">Continue</button><p style="font-size:10px;color:#777">By continuing, you agree to VASI Terms and Privacy Policy.</p>')}function safety(){open('<h2>VASI Safety</h2><button class="primary" onclick="location.href=\'tel:112\'">🚨 Emergency 112</button><button class="primary" onclick="closeModal()">↗ Share live trip</button>')}</script></body></html>
