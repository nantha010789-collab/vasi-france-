<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>VASI — Ride</title><style>body{margin:0;background:#050505;font-family:system-ui;color:#111}.app{max-width:520px;min-height:100vh;margin:auto;background:#fff}.map{height:38vh;background:#dfe7ef;display:grid;place-items:center;font-size:48px}.panel{padding:20px;border-radius:28px 28px 0 0;margin-top:-25px;background:#fff}.field{height:48px;border:1px solid #ddd;border-radius:12px;margin:8px 0;padding:0 12px;display:flex;align-items:center}.field input{border:0;outline:0;width:100%;font-size:15px}.rides{display:flex;gap:8px;overflow:auto}.ride{min-width:110px;border:1px solid #ddd;border-radius:14px;padding:10px}.ride.sel{border:2px solid #19c463}.cta{width:100%;padding:14px;border:0;border-radius:13px;background:#19c463;color:white;font-weight:900;margin-top:10px}.auth{background:#f6f7f6;border-radius:16px;padding:12px;margin-bottom:14px}.auth input{width:100%;height:42px;border:1px solid #ddd;border-radius:10px;margin:4px 0;padding:0 10px;box-sizing:border-box}.small{font-size:12px;color:#666}.status{display:none;background:#111;color:#fff;border-radius:18px;padding:15px;margin-top:15px}.status.show{display:block}.driver{margin-top:20px;border-top:1px solid #eee;padding-top:16px}.pay{display:none;margin-top:12px;padding:12px;border:1px solid #ddd;border-radius:14px}.pay.show{display:block}.mapdot{font-size:16px}</style></head><body><div class="app"><div class="map" id="map">📍</div><section class="panel"><div class="auth"><b>VASI Customer</b><div class="small" id="authState">Sign in to book a ride</div><input id="email" type="email" placeholder="Email"><button class="cta" onclick="login()">Send sign-in link</button><button class="cta" style="background:#222" onclick="logout()">Sign out</button></div><h2>Where are you going?</h2><div class="field">🟢 <input id="from" value="My location"></div><div class="field">⚪ <input id="to" placeholder="Where to?"></div><div class="rides"><div class="ride sel" onclick="choose(this,'VASI Go',8.5)">🚗<br><b>VASI Go</b><br>€8.50</div><div class="ride" onclick="choose(this,'Comfort',11.9)">🚘<br><b>Comfort</b><br>€11.90</div><div class="ride" onclick="choose(this,'XL',16.9)">🚐<br><b>XL</b><br>€16.90</div></div><select id="payment" style="width:100%;height:46px;margin-top:10px;border:1px solid #ddd;border-radius:12px;padding:0 10px"><option value="cash">Cash</option><option value="card">Card</option></select><button class="cta" id="bookBtn" onclick="book()">Book VASI Go · €8.50</button><div id="paymentBox" class="pay"><b>Card payment</b><div id="card" style="margin-top:10px;padding:12px;border:1px solid #ddd;border-radius:10px"></div><button class="cta" onclick="payNow()">Confirm card</button></div><div id="status" class="status"></div><div class="driver"><h3>🚗 Drive with VASI</h3><p>Become a VASI driver and receive nearby ride requests.</p><button class="cta" onclick="location.href='/driver-app.html'">Open Driver App</button></div></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SB_URL='https://vhfyvkrvysrooaqzcxsp.supabase.co',SB_KEY='sb_publishable_mypiW8lczhmoQb4rECuE8Q_dEhNiCKt';const sb=supabase.createClient(SB_URL,SB_KEY);let selected={name:'VASI Go',price:8.5},ride=null,stripe=null,elements=null,card=null;const $=id=>document.getElementById(id);function choose(el,name,price){document.querySelectorAll('.ride').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');selected={name,price};$('bookBtn').textContent='Book '+name+' · €'+price.toFixed(2)}async function session(){return(await sb.auth.getSession()).data.session}async function login(){const e=$('email').value.trim();if(!e)return alert('Enter your email');const {error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.href}});if(error)return alert(error.message);alert('Check your email and open the VASI sign-in link.')}async function logout(){await sb.auth.signOut();location.reload()}async function book(){const s=await session();if(!s)return alert('Please sign in first.');const to=$('to').value.trim();if(!to)return alert('Enter your destination');$('bookBtn').disabled=true;try{let pos=null;try{pos=await new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(ok,no,{enableHighAccuracy:true,timeout:8000}))}catch(_){}const body={pickup_address:$('from').value||'My location',pickup_lat:pos?.coords.latitude??null,pickup_lng:pos?.coords.longitude??null,destination_address:to,destination_lat:null,destination_lng:null,service:selected.name,payment_method:$('payment').value,estimated_fare:selected.price,currency:'EUR'};const r=await fetch('/api/create-ride',{method:'POST',headers:{Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'Booking failed');ride=d.ride;renderStatus();if($('payment').value==='card'){await setupCard(s)}else alert(ride.driver_id?'Driver assigned.':'Ride requested; waiting for a driver.');poll()}catch(e){alert(e.message)}finally{$('bookBtn').disabled=false}}function renderStatus(){const r=ride;$('status').classList.add('show');$('status').innerHTML='<b>Ride '+r.status.replaceAll('_',' ')+'</b><div style="margin-top:8px">'+(r.driver_id?'🚗 Driver assigned':'🔎 Finding a driver…')+'</div><div id="driverInfo" class="small" style="margin-top:8px"></div>'}async function poll(){const s=await session();if(!s||!ride)return;const r=await fetch('/api/ride-status?id='+encodeURIComponent(ride.id),{headers:{Authorization:'Bearer '+s.access_token}});const d=await r.json();if(r.ok){ride=d.ride;renderStatus();$('driverInfo').innerHTML=d.driver?('Driver: '+(d.driver.full_name||'VASI Driver')+'<br>Vehicle: '+(d.driver.vehicle_make||'')+' '+(d.driver.vehicle_model||'')+' · '+(d.driver.vehicle_plate||'')+(d.location?'<br>📍 GPS: '+Number(d.location.latitude).toFixed(5)+', '+Number(d.location.longitude).toFixed(5):''): 'No driver assigned yet');if(d.location){$('map').innerHTML='<span class="mapdot">📍 Driver location '+Number(d.location.latitude).toFixed(4)+', '+Number(d.location.longitude).toFixed(4)+'</span>'}}if(!['completed','cancelled'].includes(ride.status))setTimeout(poll,3000)}async function setupCard(s){const cfg=await fetch('/api/payment-config').then(x=>x.json());if(!cfg.publishable_key)throw Error(cfg.error||'Stripe is not configured');if(!window.Stripe)await new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://js.stripe.com/v3/';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});stripe=Stripe(cfg.publishable_key);elements=stripe.elements();card=elements.create('card');card.mount('#card');$('paymentBox').classList.add('show');const r=await fetch('/api/create-payment-intent',{method:'POST',headers:{Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify({ride_id:ride.id})});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not start card payment');window.vasiClientSecret=d.client_secret}async function payNow(){if(!stripe||!card||!window.vasiClientSecret)return;const r=await stripe.confirmCardPayment(window.vasiClientSecret,{payment_method:{card}});if(r.error)return alert(r.error.message);alert('Card authorized. Payment will be captured after the ride is completed.');$('paymentBox').classList.remove('show')}sb.auth.onAuthStateChange((_e,s)=>{$('authState').textContent=s?'Signed in':'Sign in to book a ride'});</script></body></html>
