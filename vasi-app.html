<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>VASI — Ride</title><style>body{margin:0;background:#050505;font-family:system-ui;color:#111}.app{max-width:520px;min-height:100vh;margin:auto;background:#fff}.map{height:45vh;background:#dfe7ef;display:grid;place-items:center;font-size:48px}.panel{padding:20px;border-radius:28px 28px 0 0;margin-top:-25px;background:#fff}.field{height:48px;border:1px solid #ddd;border-radius:12px;margin:8px 0;padding:0 12px;display:flex;align-items:center}.field input{border:0;outline:0;width:100%;font-size:15px}.rides{display:flex;gap:8px;overflow:auto}.ride{min-width:110px;border:1px solid #ddd;border-radius:14px;padding:10px}.ride.sel{border:2px solid #19c463}.cta{width:100%;padding:14px;border:0;border-radius:13px;background:#19c463;color:white;font-weight:900;margin-top:10px}.driver{margin-top:20px;border-top:1px solid #eee;padding-top:16px}.modal{display:none;position:fixed;inset:0;background:#0009;align-items:end}.modal.show{display:flex}.box{background:#fff;width:100%;max-width:520px;margin:auto;padding:22px;border-radius:24px 24px 0 0}.close{float:right;border:0;background:#eee;border-radius:50%;width:32px;height:32px}</style></head><body><div class="app"><div class="map">📍</div><section class="panel"><h2>Where are you going?</h2><div class="field">🟢 <input id="from" value="My location"></div><div class="field">⚪ <input id="to" placeholder="Where to?"></div><div class="rides"><div class="ride sel" onclick="choose(this,'VASI Go',8.5)">🚗<br><b>VASI Go</b><br>€8.50</div><div class="ride" onclick="choose(this,'Comfort',11.9)">🚘<br><b>Comfort</b><br>€11.90</div><div class="ride" onclick="choose(this,'XL',16.9)">🚐<br><b>XL</b><br>€16.90</div></div><button class="cta" onclick="book()">Book VASI Go · €8.50</button><div class="driver"><h3>🚗 Drive with VASI</h3><p>Become a VASI driver and receive nearby ride requests.</p><button class="cta" onclick="location.href='/driver-app.html'">Open Driver App</button></div></section></div><script>let selected={name:'VASI Go',price:8.5};function choose(el,name,price){document.querySelectorAll('.ride').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');selected={name,price};document.querySelector('.cta').textContent='Book '+name+' · €'+price.toFixed(2)}function book(){if(!document.getElementById('to').value.trim())return alert('Enter your destination');alert('Booking request ready: '+selected.name+' to '+document.getElementById('to').value)}</script></body></html>
